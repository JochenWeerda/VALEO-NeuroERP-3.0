schema_version: "1.0"
registry_id: MCP-ERP-TOOLS-001
description: "VALEO NeuroERP MCP-Toolkatalog — rollenbasierte, auditierte ERP-Tools fuer Agent-Zugriff"

tools:

  # ── CRM ────────────────────────────────────────────────────────────────────
  - tool_id: crm.customer.search
    domain: crm
    name: "Kunden suchen"
    description: "Sucht Kunden im Authentifizierungs-Mandanten nach Name, Kundennummer oder PLZ (domain_crm.customers, analog UI-Combobox). HTTP-Aufruf mit tool_name=crm.customer.search. Default dryRun; execute ist ebenfalls nur Lesen. Liefert items mit kunden_nr, name, ort, segment, customer_id und route_path. OIDC-Token mit crm:read und tenant_id erforderlich."
    scope: crm:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        query: { type: string, description: "Suchbegriff (Name, Nr., PLZ)" }
        limit: { type: integer, default: 20, minimum: 1, maximum: 50 }
      required: [query]
    output_schema:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              kunden_nr: { type: string }
              name: { type: string }
              ort: { type: string, nullable: true }
              segment: { type: string, nullable: true }
              customer_id: { type: string }
              route_path: { type: string }
        count: { type: integer }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: crm.customer.summary360
    domain: crm
    name: "Kunden-360-Zusammenfassung"
    description: "Liefert 360-Grad-Zusammenfassung im Authentifizierungs-Mandanten: offene Auftraege, OP-Saldo, letzte Kontakte, Segment und route_path. HTTP-Aufruf mit tool_name=crm.customer.summary360, parameters.kunden_nr (Kundennummer oder UUID). Default dryRun; execute ist ebenfalls nur Lesen. OIDC-Token mit crm:read und tenant_id erforderlich. Kein Cross-Tenant-Fallback."
    scope: crm:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        kunden_nr: { type: string, description: "Kundennummer oder CRM-Kunden-UUID" }
      required: [kunden_nr]
    output_schema:
      type: object
      properties:
        kunden_nr: { type: string }
        name: { type: string }
        customer_id: { type: string }
        offene_auftraege: { type: integer }
        op_saldo_eur: { type: number }
        letzte_kontakte: { type: array }
        segment: { type: string, nullable: true }
        route_path: { type: string }
        screen_id: { type: string }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: crm.customer.open
    domain: crm
    name: "Kunde oeffnen"
    description: "Loest einen Kunden im Authentifizierungs-Mandanten auf und liefert die kanonische Masken-Route (/crm/customers/{id}) sowie Screen-ID crm/customer-360. Kein Schreiben. HTTP-Aufruf mit tool_name=crm.customer.open, parameters.kunden_nr (Kundennummer oder UUID). Default dryRun; execute ist ebenfalls nur Lesen. OIDC-Token mit crm:read und tenant_id erforderlich."
    scope: crm:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        kunden_nr: { type: string, description: "Kundennummer oder CRM-Kunden-UUID" }
      required: [kunden_nr]
    output_schema:
      type: object
      properties:
        customer_id: { type: string }
        kunden_nr: { type: string }
        name: { type: string }
        route_path: { type: string }
        screen_id: { type: string }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: crm.contact.log
    domain: crm
    name: "Kontaktprotokoll erfassen"
    description: "Erfasst einen Kundenkontakt mit Ergebnis und Wiedervorlage. HTTP-Aufruf mit tool_name=crm.contact.log, parameters gemaess Eingabe-Schema, mode und idempotency_key. Default dryRun; execute erfordert einen stabilen Schluessel. OIDC-Token mit crm:write und tenant_id erforderlich."
    scope: crm:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        kunden_nr: { type: string }
        kanal: { type: string, enum: [telefon, email, besuch, post] }
        ergebnis: { type: string }
        wiedervorlage_datum: { type: string, format: date, nullable: true }
      required: [kunden_nr, kanal, ergebnis]
    output_schema:
      type: object
      properties:
        kontakt_id: { type: string }
        erfasst_am: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: crm.activity.create
    domain: crm
    name: "CRM-Aktivitaet anlegen"
    description: "Legt eine CRM-Aktivitaet zum Kunden an (gleicher Fachpfad wie ActionRuntime create_activity). HTTP-Aufruf mit tool_name=crm.activity.create. Default dryRun; execute erfordert idempotency_key. OIDC-Token mit crm:write und tenant_id erforderlich."
    scope: crm:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        kunden_nr: { type: string }
        betreff: { type: string }
        typ: { type: string, enum: [Anruf, Besuch, E-Mail, Aufgabe, Meeting, Sonstiges] }
        datum: { type: string, format: date, nullable: true }
        notiz: { type: string, nullable: true }
        verantwortlich: { type: string, nullable: true }
      required: [kunden_nr, betreff, typ]
    output_schema:
      type: object
      properties:
        activity_id: { type: string }
        erfasst_am: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: crm.lead.qualify
    domain: crm
    name: "Lead als Opportunity qualifizieren"
    description: "Qualifiziert einen Lead des Authentifizierungs-Mandanten zu einer Opportunity (gleicher Fachpfad wie Maske crm/lead:qualifizieren). parameters.lead_id und customer_id oder kunden_nr. Default dryRun; execute erfordert idempotency_key. Scope crm:write. Kein tenant_id-Parameter."
    scope: crm:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        lead_id: { type: string, description: "Lead-UUID" }
        customer_id: { type: string, description: "CRM-Kunden-UUID des Mandanten", nullable: true }
        kunden_nr: { type: string, description: "Alternative Kundennummer statt customer_id", nullable: true }
      required: [lead_id]
    output_schema:
      type: object
      properties:
        lead_id: { type: string }
        opportunity_id: { type: string }
        auditEntryId: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  # ── Sales / O2C ────────────────────────────────────────────────────────────
  - tool_id: sales.order.status
    domain: sales
    name: "Auftragsstatus pruefen"
    description: "Gibt Lifecycle-Status, offene Positionen, naechsten Schritt und kanonische Masken-Route (/sales/order-editor/{id}, Screen sales/sales-order) eines Auftrags im Authentifizierungs-Mandanten zurueck. HTTP-Aufruf mit tool_name=sales.order.status, parameters.auftrag_nr (Auftragsnummer oder UUID). Default dryRun; execute ist ebenfalls nur Lesen. OIDC-Token mit sales:read und tenant_id erforderlich."
    scope: sales:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        auftrag_nr: { type: string, description: "Auftragsnummer oder Sales-Order-UUID" }
      required: [auftrag_nr]
    output_schema:
      type: object
      properties:
        auftrag_nr: { type: string }
        order_id: { type: string }
        status: { type: string }
        offene_positionen: { type: integer }
        naechster_schritt: { type: string }
        route_path: { type: string }
        screen_id: { type: string }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: sales.gutschrift.speichern
    domain: sales
    name: "Gutschrift als Entwurf speichern"
    description: "Legt eine Gutschrift (kaufmaennische Rechnungskorrektur) als Entwurf im Authentifizierungs-Mandanten an (Maske sales/gutschrift:speichern; CE /api/v1/sales/credit-notes/actions/speichern). parameters.credit_note_number, customer_id, grund, lines[] mit description, quantity, unit_price und tax_code (Steuerschluessel des Mandanten aus finance/tax-keys; kein Prozentsatz, kein Vorgabewert), optional invoice_reference, reason. Default dryRun liefert Netto/Umsatzsteuer/Brutto oder den Pruefgrund. execute erfordert idempotency_key. Gebucht wird NICHT: Buchen geht nur ueber sales.gutschrift.propose, menschliche Freigabe und sales.gutschrift.buchen. Scope sales:write. Kein tenant_id-Parameter."
    scope: sales:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        credit_note_number: { type: string }
        customer_id: { type: string }
        customer_name: { type: string }
        invoice_reference: { type: string, description: "Rechnungsnummer, deren offener Posten beim Buchen gemindert wird" }
        grund: { type: string, description: "Grund der Gutschrift, z. B. Retoure" }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              description: { type: string }
              quantity: { type: number }
              unit_price: { type: number, description: "Einzelpreis netto" }
              tax_code: { type: string, description: "Steuerschluessel des Mandanten" }
            required: [description, quantity, unit_price]
        reason: { type: string, minLength: 3 }
      required: [credit_note_number, customer_id, grund, lines, reason]
    output_schema:
      type: object
      properties:
        credit_note_id: { type: string }
        credit_note_number: { type: string }
        netto: { type: number }
        steuer: { type: number, nullable: true }
        brutto: { type: number, nullable: true }
        pruefgrund: { type: string, nullable: true }
        auditEntryId: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: sales.gutschrift.propose
    domain: sales
    name: "Buchung einer Gutschrift vorschlagen"
    description: "Legt einen ausstehenden Buchungsvorschlag fuer eine Gutschrift (Entwurf) im Authentifizierungs-Mandanten an. parameters.credit_note_id. Default dryRun liest, was gebucht wuerde (Erloes netto, Umsatzsteuer, Forderung brutto, Buchungszeilen) oder den Pruefgrund (HTTP 409), wenn sich die Gutschrift nicht buchen laesst. propose (mit idempotency_key) speichert agent_proposals (sales_credit_note_buchung) mit approval_status pending und bucht nicht. execute ist nicht angebunden. Ein Mensch prueft und gibt in der Maske sales/gutschrift frei; danach sales.gutschrift.buchen. Ein Freigabe-Boolean im Aufruf wird abgewiesen. Scope sales:write. Kein tenant_id-Parameter."
    scope: sales:write
    idempotent: false
    risk_class: high
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        credit_note_id: { type: string, description: "ID der Gutschrift (Entwurf)" }
      required: [credit_note_id]
    output_schema:
      type: object
      properties:
        entwurf_id: { type: string, description: "proposal_id fuer sales.gutschrift.buchen" }
        credit_note_id: { type: string }
        credit_note_number: { type: string }
        netto: { type: number }
        steuer: { type: number }
        brutto: { type: number }
        buchungszeilen: { type: array }
        route_path: { type: string }
        screen_id: { type: string }
        approval_status: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: true

  - tool_id: sales.gutschrift.buchen
    domain: sales
    name: "Gutschrift aus freigegebenem Vorschlag buchen"
    description: "Bucht eine Gutschrift (Erloes netto, Umsatzsteuer getrennt, Forderung brutto, OP-Minderung der bezogenen Rechnung) nur aus einem agent_proposals-Datensatz (sales_credit_note_buchung), den ein Mensch freigegeben hat. Parameter nur proposal_id. Default dryRun. execute erfordert idempotency_key und approval_status=approved; hat sich die Gutschrift seit der Freigabe geaendert, HTTP 409 und neuer Vorschlag noetig. Kein Freigabe-Boolean im Aufruf. Scope sales:write. Kein tenant_id-Parameter."
    scope: sales:write
    idempotent: true
    risk_class: high
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        proposal_id: { type: string, description: "entwurf_id aus sales.gutschrift.propose" }
      required: [proposal_id]
    output_schema:
      type: object
      properties:
        credit_note_id: { type: string }
        credit_note_number: { type: string }
        netto: { type: number }
        steuer: { type: number }
        brutto: { type: number }
        posted: { type: boolean }
        approved_by: { type: string }
        auditEntryId: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: true

  - tool_id: sales.invoice.propose
    domain: sales
    name: "Rechnungsvorschlag aus Lieferschein"
    description: "Legt einen ausstehenden Rechnungsvorschlag zu einem gebuchten Lieferschein an. HTTP-Aufruf an POST /api/v1/mcp/tools/call mit tool_name=sales.invoice.propose. Default dryRun liest nur Summen. propose speichert agent_proposals mit approval_status pending und bucht keine Rechnung. execute ist nicht angebunden. Ein Freigabe-Boolean im Aufruf wird abgewiesen. OIDC-Token mit sales:write und tenant_id erforderlich."
    scope: sales:write
    idempotent: false
    risk_class: high
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        lieferschein_nr: { type: string }
        rechnungsdatum: { type: string, format: date }
      required: [lieferschein_nr, rechnungsdatum]
    output_schema:
      type: object
      properties:
        entwurf_id: { type: string }
        betrag_netto: { type: number }
        mwst: { type: number }
        positionen: { type: integer }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: true

  - tool_id: sales.invoice.post
    domain: sales
    name: "Rechnung aus freigegebenem Vorschlag anlegen"
    description: "Legt eine Verkaufsrechnung (Status entwurf) aus einem freigegebenen agent_proposals-Datensatz (rechnung_vorschlag) an. Parameter nur proposal_id. Default dryRun. execute erfordert idempotency_key und approval_status=approved. Kein Freigabe-Boolean im Aufruf. FIBU-Journal/OP bleiben im UI-Pfad create-invoice. OIDC-Token mit sales:write und tenant_id erforderlich."
    scope: sales:write
    idempotent: true
    risk_class: high
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        proposal_id: { type: string, description: "entwurf_id aus sales.invoice.propose" }
      required: [proposal_id]
    output_schema:
      type: object
      properties:
        invoice_id: { type: string }
        invoice_number: { type: string }
        status: { type: string }
        posted: { type: boolean }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: true

  # ── FIBU / AP Freigabe (Vier-Augen via agent_proposals) ────────────────────
  - tool_id: finance.ap_invoice.propose
    domain: finance
    name: "AP-Freigabe vorschlagen"
    description: "Legt einen ausstehenden Freigabe-Vorschlag fuer eine Eingangsrechnung im Authentifizierungs-Mandanten an. HTTP-Aufruf mit tool_name=finance.ap_invoice.propose, parameters.invoice_id. Default dryRun liest nur Status/Brutto/route_path. propose speichert agent_proposals (ap_invoice_freigabe) mit approval_status pending und ruft den Freigabe-Endpoint nicht auf. execute ist deaktiviert; die verbindliche Entscheidung trifft eine berechtigte unabhaengige Person in der AP-Maske. Ein freigegebener Vorschlag ist keine Belegfreigabe. Ein Freigabe-Boolean im Aufruf wird abgewiesen. OIDC-Token mit finance:write und tenant_id erforderlich. Kein Journal/FIN-CLOSE."
    scope: finance:write
    idempotent: false
    risk_class: high
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        invoice_id: { type: string, description: "AP-Rechnungs-ID bzw. Belegnummer" }
      required: [invoice_id]
    output_schema:
      type: object
      properties:
        entwurf_id: { type: string }
        invoice_id: { type: string }
        invoice_number: { type: string }
        status: { type: string }
        brutto_eur: { type: number, nullable: true }
        route_path: { type: string }
        screen_id: { type: string }
        approval_status: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: true

  - tool_id: fibu.open_items.list
    domain: finance
    name: "Offene Posten auflisten"
    description: "Listet offene Forderungen oder Verbindlichkeiten im Authentifizierungs-Mandanten nach Faelligkeit (domain_erp.offene_posten). HTTP-Aufruf mit tool_name=fibu.open_items.list. typ=forderung|verbindlichkeit. Default dryRun; execute ist ebenfalls nur Lesen. OIDC-Token mit finance:read und tenant_id erforderlich. Kein Kassenabschluss/Journal."
    scope: finance:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        typ: { type: string, enum: [forderung, verbindlichkeit] }
        faellig_bis: { type: string, format: date, nullable: true }
        limit: { type: integer, default: 50, minimum: 1, maximum: 200 }
      required: [typ]
    output_schema:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              beleg_nr: { type: string }
              kunden_nr: { type: string, nullable: true }
              betrag_eur: { type: number }
              faellig_am: { type: string, nullable: true }
              mahnstatus: { type: string }
        count: { type: integer }
        typ: { type: string }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: fibu.dunning.status
    domain: finance
    name: "Mahnstatus abfragen"
    description: "Gibt Mahnstufe, letzte Mahnung und offenen Debitoren-Saldo fuer einen Kunden im Authentifizierungs-Mandanten zurueck. HTTP-Aufruf mit tool_name=fibu.dunning.status, parameters.kunden_nr (Kundennummer oder UUID). Default dryRun; execute ist ebenfalls nur Lesen. OIDC-Token mit finance:read und tenant_id erforderlich. Kein Mahnlauf, kein FIN-CLOSE."
    scope: finance:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        kunden_nr: { type: string, description: "Kundennummer oder CRM-Kunden-UUID" }
      required: [kunden_nr]
    output_schema:
      type: object
      properties:
        kunden_nr: { type: string }
        customer_id: { type: string }
        mahnstufe: { type: integer }
        letzte_mahnung: { type: string, nullable: true }
        gesamt_offen_eur: { type: number }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  # ── WMS / QS ───────────────────────────────────────────────────────────────
  - tool_id: wms.lot.trace
    domain: inventory
    name: "Lot verfolgen"
    description: "Gibt Artikel, Menge kg, Status, QS-Status, Silozelle, Bewegungshistorie und kanonische Masken-Route (/charge/stamm/{id}, Screen charge/stamm) eines Lots im Authentifizierungs-Mandanten zurueck. HTTP-Aufruf mit tool_name=wms.lot.trace, parameters.lot_id (Lot-UUID oder Virtual-/Lotnummer). Default dryRun; execute ist ebenfalls nur Lesen. OIDC-Token mit inventory:read und tenant_id erforderlich. Keine Buchung, keine QS-Aenderung."
    scope: inventory:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        lot_id: { type: string, description: "Lot-UUID oder Virtual-/Lotnummer" }
      required: [lot_id]
    output_schema:
      type: object
      properties:
        lot_id: { type: string }
        artikel_id: { type: string, nullable: true }
        menge_kg: { type: number }
        status: { type: string }
        qs_status: { type: string }
        silozelle: { type: string, nullable: true }
        bewegungen: { type: array }
        route_path: { type: string }
        screen_id: { type: string }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: wms.cell.status
    domain: inventory
    name: "Silozellen-Status"
    description: "Gibt Fuellstand kg, aktuelles Material, QS-Status, Flush-/Reinigungsbedarf und kanonische Masken-Route (/lager/silo-zellen/{id}, Screen lager/silo-cell) einer Silozelle im Authentifizierungs-Mandanten zurueck. HTTP-Aufruf mit tool_name=wms.cell.status, parameters.cell_code (Zellencode oder UUID). Default dryRun; execute ist ebenfalls nur Lesen. OIDC-Token mit inventory:read und tenant_id erforderlich. Kein Transfer, keine QS-Aenderung."
    scope: inventory:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        cell_code: { type: string, description: "Zellencode oder Silozellen-UUID" }
      required: [cell_code]
    output_schema:
      type: object
      properties:
        cell_id: { type: string }
        cell_code: { type: string }
        current_stock_kg: { type: number }
        qs_status: { type: string }
        current_material: { type: string, nullable: true }
        flush_required: { type: boolean }
        route_path: { type: string }
        screen_id: { type: string }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  # ── DMS / Nachweisraum ─────────────────────────────────────────────────────
  - tool_id: dms.document.search
    domain: nachweisraum
    name: "Dokument suchen"
    description: "Sucht Nachweisraum-Dokumente im Authentifizierungs-Mandanten nach Typ, Zeitraum, Beleg-Referenz oder dokument_id (UUID/Bezeichnung/Referenz). Items tragen kanonische Masken-Route (/docflow/nachweisraum/{id}, Screen docflow/nachweisraum). HTTP tool_name=dms.document.search. Default dryRun; execute nur Lesen. Scope nachweisraum:read."
    scope: nachweisraum:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        dokument_id: { type: string, nullable: true, description: "Dokument-UUID, Bezeichnung oder referenz_id" }
        beleg_ref: { type: string, nullable: true }
        dokument_typ: { type: string, nullable: true }
        von: { type: string, format: date, nullable: true }
        bis: { type: string, format: date, nullable: true }
        limit: { type: integer, default: 20 }
    output_schema:
      type: object
      properties:
        items: { type: array }
        count: { type: integer }
    audit: read
