    description: "Verarbeitet pending Events der Mobile/MDE-Queue des Authentifizierungs-Mandanten (Maske schnittstelle/mde-inbox:process_pending). parameters.limit optional, reason. Default dryRun; execute erfordert idempotency_key. Scope mobile:write."
    scope: mobile:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        limit: { type: integer, default: 50, minimum: 1, maximum: 500 }
        reason: { type: string, default: "MCP MDE-Verarbeitung" }
      required: []
    output_schema:
      type: object
      properties:
        processed: { type: integer, nullable: true }
        failed: { type: integer, nullable: true }
        auditEntryId: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  # ── Agent-Proposal-Verwaltung (MCP-ERP-TOOLS-002 + OPERATOR-AGENT-002) ───
