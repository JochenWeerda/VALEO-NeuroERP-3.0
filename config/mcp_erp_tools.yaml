    description: "Gibt Artikelbestand (Menge/reserviert/verfuegbar) im Authentifizierungs-Mandanten zurueck. parameters.artikel_id; lager_id optional (Hinweis, Bestand ist artikelbezogen). Scope lager:read; nur Lesen."
    scope: lager:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        artikel_id: { type: string }
        lager_id: { type: string, nullable: true }
      required: [artikel_id]
    output_schema:
      type: object
      properties:
        artikel_id: { type: string }
        menge: { type: number }
        einheit: { type: string }
        reserviert: { type: number }
        verfuegbar: { type: number }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

