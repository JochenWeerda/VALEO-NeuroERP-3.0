    name: "Bestellung versenden"
    description: "Versendet eine Bestellung des Authentifizierungs-Mandanten (E-Mail/Fax/EDI/manuell; Maske einkauf/purchase-order:versenden). Kein Obligo-Journal (Freigabe bleibt eigener Pfad). Default dryRun; execute erfordert idempotency_key. Scope einkauf:write."
    scope: einkauf:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        bestellung_id: { type: string, description: "Bestellungs-UUID oder Bestellnummer" }
        versand_art: { type: string, enum: [email, fax, edi, post, manuell], default: email }
        empfaenger: { type: string, nullable: true }
      required: [bestellung_id]
    output_schema:
      type: object
      properties:
        bestellung_id: { type: string }
        bestellnummer: { type: string }
        versand_status: { type: string }
        auditEntryId: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
