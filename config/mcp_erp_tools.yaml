schema_version: "1.0"
registry_id: MCP-ERP-TOOLS-001
description: "VALEO NeuroERP MCP-Toolkatalog — rollenbasierte, auditierte ERP-Tools fuer Agent-Zugriff"

tools:

  # ── CRM ────────────────────────────────────────────────────────────────────
  - tool_id: crm.customer.search
    domain: crm
    name: "Kunden suchen"
    description: "Sucht Kunden im Authentifizierungs-Mandanten nach Name, Kundennummer oder PLZ (domain_crm.customers, analog UI-Combobox). HTTP-Aufruf mit tool_name=crm.customer.search. Default dryRun; execute ist ebenfalls nur Lesen. Liefert items mit kunden_nr, name, ort, segment, customer_id und route_path. OIDC-Token mit crm:read und tenant_id erforderlich."
    scope: crm:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        query: { type: string, description: "Suchbegriff (Name, Nr., PLZ)" }
        limit: { type: integer, default: 20, minimum: 1, maximum: 50 }
      required: [query]
    output_schema:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              kunden_nr: { type: string }
              name: { type: string }
              ort: { type: string, nullable: true }
              segment: { type: string, nullable: true }
              customer_id: { type: string }
              route_path: { type: string }
        count: { type: integer }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: crm.customer.summary360
    domain: crm
    name: "Kunden-360-Zusammenfassung"
    description: "Liefert 360-Grad-Zusammenfassung im Authentifizierungs-Mandanten: offene Auftraege, OP-Saldo, letzte Kontakte, Segment und route_path. HTTP-Aufruf mit tool_name=crm.customer.summary360, parameters.kunden_nr (Kundennummer oder UUID). Default dryRun; execute ist ebenfalls nur Lesen. OIDC-Token mit crm:read und tenant_id erforderlich. Kein Cross-Tenant-Fallback."
    scope: crm:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        kunden_nr: { type: string, description: "Kundennummer oder CRM-Kunden-UUID" }
      required: [kunden_nr]
    output_schema:
      type: object
      properties:
        kunden_nr: { type: string }
        name: { type: string }
        customer_id: { type: string }
        offene_auftraege: { type: integer }
        op_saldo_eur: { type: number }
        letzte_kontakte: { type: array }
        segment: { type: string, nullable: true }
        route_path: { type: string }
        screen_id: { type: string }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: crm.customer.open
    domain: crm
    name: "Kunde oeffnen"
    description: "Loest einen Kunden im Authentifizierungs-Mandanten auf und liefert die kanonische Masken-Route (/crm/customers/{id}) sowie Screen-ID crm/customer-360. Kein Schreiben. HTTP-Aufruf mit tool_name=crm.customer.open, parameters.kunden_nr (Kundennummer oder UUID). Default dryRun; execute ist ebenfalls nur Lesen. OIDC-Token mit crm:read und tenant_id erforderlich."
    scope: crm:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        kunden_nr: { type: string, description: "Kundennummer oder CRM-Kunden-UUID" }
      required: [kunden_nr]
    output_schema:
      type: object
      properties:
        customer_id: { type: string }
        kunden_nr: { type: string }
        name: { type: string }
        route_path: { type: string }
        screen_id: { type: string }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: crm.contact.log
    domain: crm
    name: "Kontaktprotokoll erfassen"
    description: "Erfasst einen Kundenkontakt mit Ergebnis und Wiedervorlage. HTTP-Aufruf mit tool_name=crm.contact.log, parameters gemaess Eingabe-Schema, mode und idempotency_key. Default dryRun; execute erfordert einen stabilen Schluessel. OIDC-Token mit crm:write und tenant_id erforderlich."
    scope: crm:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        kunden_nr: { type: string }
        kanal: { type: string, enum: [telefon, email, besuch, post] }
        ergebnis: { type: string }
        wiedervorlage_datum: { type: string, format: date, nullable: true }
      required: [kunden_nr, kanal, ergebnis]
    output_schema:
      type: object
      properties:
        kontakt_id: { type: string }
        erfasst_am: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: crm.activity.create
    domain: crm
    name: "CRM-Aktivitaet anlegen"
    description: "Legt eine CRM-Aktivitaet zum Kunden an (gleicher Fachpfad wie ActionRuntime create_activity). HTTP-Aufruf mit tool_name=crm.activity.create. Default dryRun; execute erfordert idempotency_key. OIDC-Token mit crm:write und tenant_id erforderlich."
    scope: crm:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        kunden_nr: { type: string }
        betreff: { type: string }
        typ: { type: string, enum: [Anruf, Besuch, E-Mail, Aufgabe, Meeting, Sonstiges] }
        datum: { type: string, format: date, nullable: true }
        notiz: { type: string, nullable: true }
        verantwortlich: { type: string, nullable: true }
      required: [kunden_nr, betreff, typ]
    output_schema:
      type: object
      properties:
        activity_id: { type: string }
        erfasst_am: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: crm.lead.qualify
    domain: crm
    name: "Lead als Opportunity qualifizieren"
    description: "Qualifiziert einen Lead des Authentifizierungs-Mandanten zu einer Opportunity (gleicher Fachpfad wie Maske crm/lead:qualifizieren). parameters.lead_id und customer_id oder kunden_nr. Default dryRun; execute erfordert idempotency_key. Scope crm:write. Kein tenant_id-Parameter."
    scope: crm:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        lead_id: { type: string, description: "Lead-UUID" }
        customer_id: { type: string, description: "CRM-Kunden-UUID des Mandanten", nullable: true }
        kunden_nr: { type: string, description: "Alternative Kundennummer statt customer_id", nullable: true }
      required: [lead_id]
    output_schema:
      type: object
      properties:
        lead_id: { type: string }
        opportunity_id: { type: string }
        auditEntryId: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  # ── Sales / O2C ────────────────────────────────────────────────────────────
  - tool_id: sales.order.status
    domain: sales
    name: "Auftragsstatus pruefen"
    description: "Gibt Lifecycle-Status, offene Positionen und naechsten Schritt eines Auftrags im Authentifizierungs-Mandanten zurueck. HTTP-Aufruf mit tool_name=sales.order.status, parameters.auftrag_nr (Auftragsnummer oder UUID). Default dryRun; execute ist ebenfalls nur Lesen. OIDC-Token mit sales:read und tenant_id erforderlich."
    scope: sales:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        auftrag_nr: { type: string, description: "Auftragsnummer oder Sales-Order-UUID" }
      required: [auftrag_nr]
    output_schema:
      type: object
      properties:
        auftrag_nr: { type: string }
        order_id: { type: string }
        status: { type: string }
        offene_positionen: { type: integer }
        naechster_schritt: { type: string }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: sales.invoice.propose
    domain: sales
    name: "Rechnungsvorschlag aus Lieferschein"
    description: "Legt einen ausstehenden Rechnungsvorschlag zu einem gebuchten Lieferschein an. HTTP-Aufruf an POST /api/v1/mcp/tools/call mit tool_name=sales.invoice.propose. Default dryRun liest nur Summen. propose speichert agent_proposals mit approval_status pending und bucht keine Rechnung. execute ist nicht angebunden. Ein Freigabe-Boolean im Aufruf wird abgewiesen. OIDC-Token mit sales:write und tenant_id erforderlich."
    scope: sales:write
    idempotent: false
    risk_class: high
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        lieferschein_nr: { type: string }
        rechnungsdatum: { type: string, format: date }
      required: [lieferschein_nr, rechnungsdatum]
    output_schema:
      type: object
      properties:
        entwurf_id: { type: string }
        betrag_netto: { type: number }
        mwst: { type: number }
        positionen: { type: integer }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: true

  - tool_id: sales.invoice.post
    domain: sales
    name: "Rechnung aus freigegebenem Vorschlag anlegen"
    description: "Legt eine Verkaufsrechnung (Status entwurf) aus einem freigegebenen agent_proposals-Datensatz (rechnung_vorschlag) an. Parameter nur proposal_id. Default dryRun. execute erfordert idempotency_key und approval_status=approved. Kein Freigabe-Boolean im Aufruf. FIBU-Journal/OP bleiben im UI-Pfad create-invoice. OIDC-Token mit sales:write und tenant_id erforderlich."
    scope: sales:write
    idempotent: true
    risk_class: high
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        proposal_id: { type: string, description: "entwurf_id aus sales.invoice.propose" }
      required: [proposal_id]
    output_schema:
      type: object
      properties:
        invoice_id: { type: string }
        invoice_number: { type: string }
        status: { type: string }
        posted: { type: boolean }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: true

  # ── FIBU ───────────────────────────────────────────────────────────────────
  - tool_id: fibu.open_items.list
    domain: finance
    name: "Offene Posten auflisten"
    description: "Listet offene Forderungen oder Verbindlichkeiten im Authentifizierungs-Mandanten nach Faelligkeit (domain_erp.offene_posten). HTTP-Aufruf mit tool_name=fibu.open_items.list. typ=forderung|verbindlichkeit. Default dryRun; execute ist ebenfalls nur Lesen. OIDC-Token mit finance:read und tenant_id erforderlich. Kein Kassenabschluss/Journal."
    scope: finance:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        typ: { type: string, enum: [forderung, verbindlichkeit] }
        faellig_bis: { type: string, format: date, nullable: true }
        limit: { type: integer, default: 50, minimum: 1, maximum: 200 }
      required: [typ]
    output_schema:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              beleg_nr: { type: string }
              kunden_nr: { type: string, nullable: true }
              betrag_eur: { type: number }
              faellig_am: { type: string, nullable: true }
              mahnstatus: { type: string }
        count: { type: integer }
        typ: { type: string }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: fibu.dunning.status
    domain: finance
    name: "Mahnstatus abfragen"
    description: "Gibt Mahnstufe, letzte Mahnung und offenen Debitoren-Saldo fuer einen Kunden im Authentifizierungs-Mandanten zurueck. HTTP-Aufruf mit tool_name=fibu.dunning.status, parameters.kunden_nr (Kundennummer oder UUID). Default dryRun; execute ist ebenfalls nur Lesen. OIDC-Token mit finance:read und tenant_id erforderlich. Kein Mahnlauf, kein FIN-CLOSE."
    scope: finance:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        kunden_nr: { type: string, description: "Kundennummer oder CRM-Kunden-UUID" }
      required: [kunden_nr]
    output_schema:
      type: object
      properties:
        kunden_nr: { type: string }
        customer_id: { type: string }
        mahnstufe: { type: integer }
        letzte_mahnung: { type: string, nullable: true }
        gesamt_offen_eur: { type: number }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  # ── WMS / QS ───────────────────────────────────────────────────────────────
  - tool_id: wms.lot.trace
    domain: inventory
    name: "Lot verfolgen"
    description: "Gibt Artikel, Menge kg, Status, QS-Status, Silozelle und Bewegungshistorie eines Lots im Authentifizierungs-Mandanten zurueck. HTTP-Aufruf mit tool_name=wms.lot.trace, parameters.lot_id (Lot-UUID oder Virtual-/Lotnummer). Default dryRun; execute ist ebenfalls nur Lesen. OIDC-Token mit inventory:read und tenant_id erforderlich. Keine Buchung, keine QS-Aenderung."
    scope: inventory:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        lot_id: { type: string, description: "Lot-UUID oder Virtual-/Lotnummer" }
      required: [lot_id]
    output_schema:
      type: object
      properties:
        lot_id: { type: string }
        artikel_id: { type: string, nullable: true }
        menge_kg: { type: number }
        status: { type: string }
        qs_status: { type: string }
        silozelle: { type: string, nullable: true }
        bewegungen: { type: array }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: wms.cell.status
    domain: inventory
    name: "Silozellen-Status"
    description: "Gibt Fuellstand kg, aktuelles Material, QS-Status und Flush-/Reinigungsbedarf einer Silozelle im Authentifizierungs-Mandanten zurueck. HTTP-Aufruf mit tool_name=wms.cell.status, parameters.cell_code (Zellencode oder UUID). Default dryRun; execute ist ebenfalls nur Lesen. OIDC-Token mit inventory:read und tenant_id erforderlich. Kein Transfer, keine QS-Aenderung."
    scope: inventory:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        cell_code: { type: string, description: "Zellencode oder Silozellen-UUID" }
      required: [cell_code]
    output_schema:
      type: object
      properties:
        cell_code: { type: string }
        current_stock_kg: { type: number }
        qs_status: { type: string }
        current_material: { type: string, nullable: true }
        flush_required: { type: boolean }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  # ── DMS / Nachweisraum ─────────────────────────────────────────────────────
  - tool_id: dms.document.search
    domain: nachweisraum
    name: "Dokument suchen"
    description: "Sucht Nachweisraum-Dokumente im Authentifizierungs-Mandanten nach Typ, Zeitraum oder Beleg-Referenz. HTTP tool_name=dms.document.search. Default dryRun; execute nur Lesen. Scope nachweisraum:read."
    scope: nachweisraum:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        beleg_ref: { type: string, nullable: true }
        dokument_typ: { type: string, nullable: true }
        von: { type: string, format: date, nullable: true }
        bis: { type: string, format: date, nullable: true }
        limit: { type: integer, default: 20 }
    output_schema:
      type: object
      properties:
        items: { type: array }
        count: { type: integer }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: dms.gobd.export_status
    domain: nachweisraum
    name: "GoBD-Export-Status"
    description: "Gibt Status und Pruefhinweis eines GoBD-Exports im Authentifizierungs-Mandanten zurueck. HTTP tool_name=dms.gobd.export_status, parameters.export_id. Scope nachweisraum:read; nur Lesen."
    scope: nachweisraum:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        export_id: { type: string }
      required: [export_id]
    output_schema:
      type: object
      properties:
        export_id: { type: string }
        status: { type: string }
        dokument_anzahl: { type: integer }
        pruefprotokoll: { type: string, nullable: true }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  # ── Compliance ─────────────────────────────────────────────────────────────
  - tool_id: compliance.gate.status
    domain: compliance
    name: "Externe Gate-Status abfragen"
    description: "Liest ehrliche Statussignale fuer ELSTER/DATEV/TSE/Auditor aus vorhandenen Domänentabellen des Authentifizierungs-Mandanten (keine Fake-Freigaben). Scope compliance:read; nur Lesen."
    scope: compliance:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        gate_typ: { type: string, nullable: true, enum: [elster, datev, tse, auditor, all] }
      required: []
    output_schema:
      type: object
      properties:
        items: { type: array }
        count: { type: integer }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  # ── Agrar / Ernte (MCP-ERP-TOOLS-002) ────────────────────────────────────
  - tool_id: agrar.contract.get
    domain: agrar
    name: "Agrar-Kontrakt abrufen"
    description: "Gibt Agrar-Kontrakt (Menge, Preis, Status) im Authentifizierungs-Mandanten zurueck. parameters.kontrakt_id (UUID oder Vertragsnummer). Kein tenant_id-Parameter. Scope agrar:read; nur Lesen."
    scope: agrar:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        kontrakt_id: { type: string, description: "Kontrakt-UUID oder Vertragsnummer" }
      required: [kontrakt_id]
    output_schema:
      type: object
      properties:
        kontrakt_id: { type: string }
        ware: { type: string, nullable: true }
        menge_t: { type: number }
        preis_eur: { type: number, nullable: true }
        status: { type: string }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: agrar.weighing_ticket.list
    domain: agrar
    name: "Wiegescheine auflisten"
    description: "Listet Wiegescheine des Authentifizierungs-Mandanten optional nach Kontrakt-/Partie-Referenz und Zeitraum. Scope agrar:read; nur Lesen."
    scope: agrar:read
    idempotent: true
    risk_class: low
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        partie_id: { type: string, nullable: true, description: "Filter auf contract_id oder reference_doc" }
        von: { type: string, format: date, nullable: true }
        bis: { type: string, format: date, nullable: true }
        limit: { type: integer, default: 50 }
      required: []
    output_schema:
      type: object
      properties:
        items: { type: array }
        count: { type: integer }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: agrar.ration.transition
    domain: agrar
    name: "Rations-Lifecycle-Uebergang"
    description: "Fuehrt einen Lifecycle-Schritt der aktuellen Rationsversion aus (submit_review/approve/schedule/activate/retire/archive; Maske agrar/ration:*). Gleicher Fachpfad wie RationLifecycleService.transition. schedule braucht feeding_start; retire/archive brauchen reason. Default dryRun; execute erfordert idempotency_key. Scope agrar:write. Kein FIBU/FIN-CLOSE."
    scope: agrar:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        ration_id: { type: string, description: "Rations-UUID" }
        action_key:
          type: string
          enum: [submit_review, approve, schedule, activate, retire, archive]
          description: "Masken-Aktionschluessel"
        reason: { type: string, nullable: true, description: "Begruendung; Pflicht fuer retire/archive; OVERRIDE: bei Readiness-Blockern" }
        feeding_start: { type: string, format: date-time, nullable: true, description: "Pflicht fuer schedule" }
        expected_status: { type: string, nullable: true, description: "Optionaler Optimistic-Lock-Status" }
      required: [ration_id, action_key]
    output_schema:
      type: object
      properties:
        ration_id: { type: string }
        version_id: { type: string }
        from_status: { type: string }
        to_status: { type: string }
        auditEntryId: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: agrar.feeding.supply_handoff
    domain: agrar
    name: "Futterbedarf an Einkauf uebergeben"
    description: "Erzeugt eine Einkaufs-Uebergabe aus Planbedarf (Maske agrar/feed-readiness:create_handoff). parameters.plan_version_id, feed_id, reason (min. 10 Zeichen). Default dryRun; execute erfordert idempotency_key (wird an den Fachdienst weitergereicht). Scope agrar:write."
    scope: agrar:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        plan_version_id: { type: string }
        feed_id: { type: string }
        reason: { type: string }
        horizon_days: { type: integer, default: 30 }
        safety_pct: { type: number, default: 10 }
      required: [plan_version_id, feed_id, reason]
    output_schema:
      type: object
      properties:
        handoff_id: { type: string }
        plan_version_id: { type: string }
        feed_id: { type: string }
        auditEntryId: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: agrar.feeding.actual_measure
    domain: agrar
    name: "Massnahme aus Futter-Abweichung"
    description: "Legt eine Massnahme zu einem Abweichungsbefund an (Maske agrar/feeding-actuals:create_measure). parameters.actual_component_id, title, reason, due_date. Default dryRun; execute erfordert idempotency_key. Scope agrar:write."
    scope: agrar:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        actual_component_id: { type: string }
        title: { type: string }
        reason: { type: string }
        due_date: { type: string, format: date }
        owner_subject: { type: string, nullable: true }
      required: [actual_component_id, title, reason, due_date]
    output_schema:
      type: object
      properties:
        measure_id: { type: string }
        actual_component_id: { type: string }
        auditEntryId: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: agrar.feeding.configure_threshold
    domain: agrar
    name: "Abweichungsschwellen konfigurieren"
    description: "Legt eine neue Version der Abweichungsregeln an (Maske agrar/feeding-actuals:configure_threshold). parameters.feed_class, warning_pct, critical_pct, valid_from, reason. critical_pct > warning_pct. Default dryRun; execute erfordert idempotency_key. Scope agrar:write."
    scope: agrar:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        feed_class:
          type: string
          enum: [forage, concentrate, mineral, additive, byproduct, liquid, other]
        warning_pct: { type: number }
        critical_pct: { type: number }
        valid_from: { type: string, format: date }
        reason: { type: string }
      required: [feed_class, warning_pct, critical_pct, valid_from, reason]
    output_schema:
      type: object
      properties:
        policy_id: { type: string }
        feed_class: { type: string }
        version: { type: integer }
        auditEntryId: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: agrar.feed_analysis.transition
    domain: agrar
    name: "Futteranalyse freigeben oder zurueckweisen"
    description: "Wechselt den Status einer Grundfutteranalyse (Maske futtermittel/analyse:release|reject). parameters.analysis_id, action_key (release|reject), reason. Default dryRun; execute erfordert idempotency_key. Scope agrar:write."
    scope: agrar:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        analysis_id: { type: string }
        action_key: { type: string, enum: [release, reject] }
        reason: { type: string }
      required: [analysis_id, action_key, reason]
    output_schema:
      type: object
      properties:
        analysis_id: { type: string }
        from_status: { type: string }
        to_status: { type: string }
        revision: { type: integer }
        auditEntryId: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: qualitaet.reklamation.abschliessen
    domain: qualitaet
    name: "Reklamation abschliessen"
    description: "Schliesst eine Reklamation des Authentifizierungs-Mandanten (Maske qualitaet/reklamation:abschliessen). parameters.reklamation_id, optional kommentar. Default dryRun; execute erfordert idempotency_key. Scope quality:write. Kein FIBU."
    scope: quality:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        reklamation_id: { type: string }
        kommentar: { type: string, nullable: true }
      required: [reklamation_id]
    output_schema:
      type: object
      properties:
        reklamation_id: { type: string }
        status: { type: string }
        auditEntryId: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  # ── Inventory / Lager (MCP-ERP-TOOLS-002) ────────────────────────────────
  - tool_id: lager.bestand.get
    domain: lager
