    scope: planung:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        horizon_days: { type: integer, default: 120, minimum: 1, maximum: 366 }
      required: []
    output_schema:
      type: object
      properties:
        projected: { type: integer, nullable: true }
        auditEntryId: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

