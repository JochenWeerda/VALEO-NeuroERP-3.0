      type: object
      properties:
        movement_id: { type: string }
        storno_movement_id: { type: string }
        movement_type: { type: string }
        quantity: { type: number }
        auditEntryId: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

