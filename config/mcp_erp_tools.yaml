      required: []
    output_schema:
      type: object
      properties:
        items: { type: array }
        count: { type: integer }
    audit: read
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

  - tool_id: einkauf.bestellung.versenden
