    scope: einkauf:write
    idempotent: true
    risk_class: medium
    data_classification: LOCAL_ONLY
    input_schema:
      type: object
      properties:
        avis_id: { type: string, description: "Anlieferavis-UUID" }
        lager_id: { type: string, description: "Lager-UUID des Mandanten" }
        lieferschein_nr: { type: string, description: "Lieferscheinnummer" }
      required: [avis_id, lager_id, lieferschein_nr]
    output_schema:
      type: object
      properties:
        avis_id: { type: string }
        bestellung_id: { type: string }
        bestellnummer: { type: string }
        positionen: { type: integer }
        auditEntryId: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

