      type: object
      properties:
        angebot_id: { type: string }
        bestellung_id: { type: string }
        bestellnummer: { type: string }
        auditEntryId: { type: string }
    audit: write
    endpoint: "POST /api/v1/mcp/tools/call"
    human_approval_required: false

