      - kundenangebot
      - verkaufsangebot
      - angebote kunde
      - quote customer
    notes: >
      Lesen der Kundenangebote (Listenmaske). Kundenkontext ueber crm.customer.open.
      Anlegen ist ein separater Write ohne MCP-Adapter.

  - action_id: sales.customer_quote.create
