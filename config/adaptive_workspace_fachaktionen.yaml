apiVersion: valeo.erp/v1
kind: AdaptiveWorkspaceFachaktionen
schema_version: "1.0"
registry_id: AW-FACHAKTIONEN-001
mcp_write_standard: docs/architecture/mcp-write-standard.md
description: >
  Typisierte Fachaktionen fuer Adaptive Workspace (Command Center / Agenten).
  Natuerliche Kurzkommandos werden deterministisch auf Action-IDs abgebildet.
  Agenten schreiben nicht in die Datenbank. Writes laufen ausschliesslich ueber
  vorhandene Domain-Commands bzw. MCP-Tools (MCP-WRITE-001 bis 015).
  Vier-Augen gilt fuer jede WRITE-Klasse R3/R4.

lead_contract:
  catalog_path: config/adaptive_workspace_fachaktionen.yaml
  mcp_tools:
    katalog: workspace.fachaktion.katalog
    resolve: workspace.fachaktion.resolve
  transport: POST /api/v1/mcp/tools/call
  frontend_catalog_id: action_id
  notes: >
    Der Frontend-Lead konsumiert diesen Katalog (YAML) oder das MCP-Lesewerkzeug.
    Frontend catalogId zeigt 1:1 auf YAML action_id. Keine Launcher-UI in diesem Slice.

canonical_events:
  assignment_confirmed:
    soll: assignment_confirmed
    nats_subject: tenant.{tenantId}.workspace.assignment_confirmed
    sse_channel: workspace
    description: Disposition / Freigabe / Zuordnung verbindlich bestaetigt.
  document_proposed:
    soll: document_proposed
    nats_subject: tenant.{tenantId}.workspace.document_proposed
    sse_channel: workspace
    description: Beleg- oder Buchungsvorschlag liegt vor (noch nicht gebucht).
  document_posted:
    soll: document_posted
    nats_subject: tenant.{tenantId}.workspace.document_posted
    sse_channel: workspace
    description: Beleg oder Wareneingang ist festgeschrieben.

# Ist-NATS/Outbox-Topics (nicht umbenannt). Spiegel IST_TO_SOLL in app/workspace/events.py.
# Publisher bleiben bei den Fachmodulen; YAML listet nur die verdrahteten Ist-Typen.
event_gaps:
  - soll: assignment_confirmed
    ist:
      - logistik.tour.created
      - lkw.registered
      - LOADING_STARTED
      - LOADING_FINISHED
      - finance.ap_invoice.approved
      - finance.ap_invoice.approval_granted
    wired_in_workspace: mapping_and_outbox
    notes: >
      Kein Publisher umbenannt. Tour-created bleibt logistik.tour.created.
      LOADING_* Outbox in app/api/v1/endpoints/tours.py (start/finish_loading).
  - soll: document_proposed
    ist:
      - finance.ap_invoice.approval_requested
      - sales.invoice.proposed
      - sales.gutschrift.proposed
    missing:
      - sales.offer.proposed
      - agrar.contract.reminder.proposed
    wired_in_workspace: mapping_only
    notes: Sales-Angebot und Kontraktmahnung haben keine Outbox-Events.
  - soll: document_posted
    ist:
      - goods_receipt.created
      - finance.ap_invoice.posted
      - docflow.document.posted
      - sales.invoice.posted
      - lager.einlagerung.created
      - agrar.weighing_ticket.allocated
      - agrar.quality_protocol.completed
    missing:
      - einkauf.anlieferavis.wareneingang.posted
    wired_in_workspace: mapping_and_outbox
    notes: >
      WE aus Avis bucht Bestand, emittiert goods_receipt.created sofern Compat-Pfad.
      Wiegeschein-Outbox in weighing_tickets.py.

actions:

  # ── 1. Nicht disponierte LKW ─────────────────────────────────────────────
  - action_id: logistik.undispatched_vehicles.list
    example_query: nicht disponierte LKW
    domain: logistics
    access: read
    risk_level: R0
    enabled: true
    enabled_for_agents: true
    forbidden_for_agents: false
    four_eyes: false
    permission:
      scope: logistics:read
      tenant_isolation: required
    idempotency: not_required
    audit: read
    event_out: []
    mcp_tool_id: null
    mask_action_id: null
    command_endpoint: GET /api/v1/logistik/tours?status=GEPLANT
    related_endpoints:
      - GET /api/v1/fuhrpark/fahrzeuge
      - GET /api/v1/logistik/tours
    screen_id: disposition/touren-disposition
    route_path: /disposition/touren-disposition
    follow_up_writes:
      - logistik.tour.anlegen
    aliases:
      - nicht disponierte lkw
      - nicht disponierte lastwagen
      - lkw nicht disponiert
      - undispatched trucks
      - fahrzeuge ohne tour
    notes: >
      Lesende Arbeitliste auf der Dispo-Tafel (Slice Absicht). Kein toter
      status=undispatched-Query. WRITE nur ueber logistik.tour.anlegen.

  - action_id: logistik.tour.anlegen
    example_query: tour anlegen
    domain: logistics
    access: write
    risk_level: R2
    enabled: true
    enabled_for_agents: true
    forbidden_for_agents: false
    four_eyes: false
    permission:
      scope: logistics:write
      tenant_isolation: required
    idempotency: required
    audit: write
    event_out:
      - ist: logistik.tour.created
        soll: assignment_confirmed
    mcp_tool_id: logistik.tour.anlegen
    mask_action_id: mask:logistik/tourenplanung:anlegen
    command_endpoint: POST /api/v1/logistik/tours/actions/anlegen
    screen_id: logistik/tourenplanung
    route_path: /logistik/tourenplanung
    aliases:
      - tour anlegen
      - lkw disponieren
      - fahrzeug einer tour zuordnen
    notes: Vorhandener MCP-Write. Agenten fuehren denselben Command aus wie die Maske.

