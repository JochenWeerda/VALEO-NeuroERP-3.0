    domain: sales
    access: write
    risk_level: R1
    enabled: true
    enabled_for_agents: false
    forbidden_for_agents: true
    four_eyes: false
    permission:
      scope: sales:write
      tenant_isolation: required
    idempotency: required
    audit: write
    event_out:
      - ist: null
        soll: document_proposed
        gap: missing_outbox
    mcp_tool_id: null
    mask_action_id: null
    command_endpoint: POST /api/v1/sales/offers
    screen_id: sales/angebote/neu
    route_path: /sales/angebot/neu
    aliases:
