    screen_id: agrar/kontrakt-erfuellung
    route_path: /agrar/kontrakt-erfuellung
    follow_up_writes:
      - agrar.contract.reminder.create
    aliases:
      - ueberfaellige kontrakte
      - ueberfaellige vertraege
      - kontraktmahnung
      - overdue contracts
    notes: >
      agrar.contract.get liest einen Kontrakt. Die Arbeitliste der Ueberfaelligen
      ist die Kontrakt-Erfuellungsmaske (kein Detail-:id). Kein MCP-List-Adapter.

  - action_id: agrar.contract.reminder.create
    example_query: kontrakt mahnen
    domain: agrar
    access: write
    risk_level: R2
    enabled: true
    enabled_for_agents: false
    forbidden_for_agents: true
    four_eyes: false
    permission:
      scope: agrar:write
      tenant_isolation: required
    idempotency: required
    audit: write
    event_out:
      - ist: null
        soll: document_proposed
        gap: missing_outbox
    mcp_tool_id: null
    mask_action_id: null
    command_endpoint: POST /api/v1/contracts/dunning
    screen_id: agrar/kontrakte
    route_path: /agrar/kontrakte
    aliases:
      - kontrakt mahnen
      - mahnung kontrakt
    notes: >
      Append-only Kontraktmahnung. Kein MCP-Write, keine Outbox. Agenten gesperrt
      bis ein versionierter Domain-Command existiert (MCP-WRITE-002/014).

