***REMOVED*** VALEO-NeuroERP Redis Configuration
***REMOVED*** Optimized for development and caching

***REMOVED*** Network
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

***REMOVED*** General
daemonize no
supervised no
loglevel notice
logfile ""

***REMOVED*** Snapshotting
save 900 1
save 300 10
save 60 10000

***REMOVED*** Security
***REMOVED*** requirepass yourpasswordhere  ***REMOVED*** Uncomment for production

***REMOVED*** Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

***REMOVED*** Append only file
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

***REMOVED*** Disable dangerous commands in development
***REMOVED*** rename-command FLUSHDB ""
***REMOVED*** rename-command FLUSHALL ""

***REMOVED*** Performance
tcp-backlog 511
databases 16

***REMOVED*** Disable protected mode for development
protected-mode no

***REMOVED*** Allow remote connections
***REMOVED*** bind 127.0.0.1 ::1  ***REMOVED*** Commented out to allow remote connections