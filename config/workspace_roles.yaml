# Rollen-Workspaces (UIX-061) — Zuordnung OIDC-Rolle → cockpit-Startseite.
#
# Beim Login liest die AppShell die Rolle aus den OIDC-Claims und leitet auf die
# hier gemappte Workspace-Route (Fallback: bisherige Startseite). Tenants koennen
# die Zuordnung ueberschreiben (Muster analog TENANT_MODULE_FLAGS).
#
# Werte sind ScreenDefinition-IDs; die reale Route wird serverseitig ueber die
# Omnibox-Routen-Bruecke (_SCREEN_LIST_ROUTE) aufgeloest.

default:
  einkauf: workspace/einkauf
  einkaeufer: workspace/einkauf
  beschaffung: workspace/einkauf
  verkauf: workspace/verkauf
  vertrieb: workspace/verkauf
  sales: workspace/verkauf
  lager: workspace/lager
  lagerist: workspace/lager
  annahme: workspace/lager
  fibu: workspace/fibu
  buchhaltung: workspace/fibu
  finance: workspace/fibu
  leitung: workspace/leitung
  geschaeftsleitung: workspace/leitung
  management: workspace/leitung

# tenant_overrides:
#   "<tenant-uuid>":
#     leitung: workspace/fibu
tenant_overrides: {}
