# scripts/postgres.conf  (DEV / Docker)

# --- Core paths (wichtig, weil config_file außerhalb PGDATA liegt)
data_directory = '/var/lib/postgresql/data/pgdata'
hba_file       = '/var/lib/postgresql/data/pgdata/pg_hba.conf'
ident_file     = '/var/lib/postgresql/data/pgdata/pg_ident.conf'

# --- Network
listen_addresses = '*'
port = 5432

# --- Locale / Timezone
timezone = 'Europe/Berlin'

# --- Connections
max_connections = 400

# --- Memory (moderate DEV defaults)
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB

# --- WAL / Checkpoints (DEV)
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_timeout = 10min

# --- Logging (hilft beim Debuggen)
log_min_duration_statement = 500ms
log_line_prefix = '%m [%p] %u@%d '
logging_collector = off

# --- Extensions / future-proofing (optional)
# Für CDC/Streaming später: wal_level = logical
# wal_level = replica
