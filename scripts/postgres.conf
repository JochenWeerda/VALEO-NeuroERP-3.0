***REMOVED*** VALEO-NeuroERP PostgreSQL Configuration
***REMOVED*** Optimized for development and testing

***REMOVED*** Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 100
shared_preload_libraries = 'pg_stat_statements'

***REMOVED*** Memory Settings
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB

***REMOVED*** Checkpoint Settings
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100

***REMOVED*** Logging
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement = 'ddl'
log_duration = on
log_lock_waits = on
log_min_duration_statement = 1000

***REMOVED*** Autovacuum
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 20s

***REMOVED*** Extensions
pg_stat_statements.max = 10000
pg_stat_statements.track = all

***REMOVED*** Performance Monitoring
track_activities = on
track_counts = on
track_functions = all

***REMOVED*** Security
password_encryption = scram-sha-256
ssl = off  ***REMOVED*** Disabled for development

***REMOVED*** Development Optimizations
fsync = off
synchronous_commit = off
full_page_writes = off