slice_id: FIN-ABSCHLUSS-STUBS-001
title: "Finanz-Abschluss calculate/lock/run - echte Fachlogik"
owner: Claude Code
status: completed
updated: 2026-06-26
coordination: >-
  Aus FIN-001 / FIN-001-finance-to-reporting Card (P1). Endpoints in
  finance_actions.py delegieren jetzt an FinanceClosingService.
goal: >-
  POST /api/v1/finance/closing/{calculate,lock,run} mit echter Periodenbuchungs-
  und Sperrlogik (accounting_periods, journal_entries); Frontend abschluss.tsx
  zeigt berechnete Salden und Fehler transparent.
file_ownership:
  - app/api/v1/endpoints/finance_actions.py
  - app/services/finance_closing_service.py
  - packages/frontend-web/src/pages/finance/abschluss.tsx
  - docs/cards/finance/FIN-001-finance-to-reporting.md
  - docs/workflows/fin-001-finance-to-reporting.md
  - docs/project-context/open-gaps-and-known-issues.md
  - docs/agent-ops/slices/FIN-ABSCHLUSS-STUBS-001.yaml
acceptance:
  - calculate liefert echte Summen aus posted journal_entries.
  - lock setzt accounting_periods.status atomar und lehnt Doppel-Sperre ab.
  - run fuehrt Abschlussbuchungen oder dokumentierten Teilschritt aus.
  - Unit-Tests fuer Closing-Service gruen.
  - FIN-001 Reporting-Gap Abschluss-Stubs geschlossen.
tests:
  - pytest -q -o addopts= -k "closing or finance_actions" --maxfail=5
  - pnpm --dir packages/frontend-web exec tsc --noEmit --pretty false
risks:
  - Steuerberater-/FiBu-Freigabe bleibt externes Gate fuer reale Periodenabschluesse.
external_gates:
  - Steuerberater-/FiBu-Abnahme Periodenabschluss.
completion_evidence:
  - app/services/finance_closing_service.py implementiert calculate/lock/run Fachlogik.
  - app/api/v1/endpoints/finance_actions.py delegiert Closing-Aktionen an FinanceClosingService.
  - tests/test_finance_closing_service.py deckt calculate, lock und run ab.
  - docs/workflows/fin-001-finance-to-reporting.md markiert FIN-004 bis FIN-006 als geschlossen.
ai_harness:
  fachlicher_vertrag: >-
    Periodenabschluss-Aktionen liefern belastbare Summen, sperren Perioden
    kontrolliert und dokumentieren externe FiBu-/Steuerberater-Abnahme als Gate.
  architektur_vertrag: >-
    Thin-Router in finance_actions.py delegieren an FinanceClosingService; keine
    neue Inline-Fachlogik in der API-Schicht.
  daten_vertrag: >-
    Nutzt journal_entries/accounting_periods und schreibt keine Doku-Statusaussage
    ohne Code- oder Testquelle.
  test_vertrag: >-
    tests/test_finance_closing_service.py ist Primaerquelle fuer calculate,
    lock und run; weitere UI-/E2E-Tests koennen ergaenzen.
  security_vertrag: >-
    Keine Secrets oder externen Steuerberater-/DATEV-Zugangsdaten; externe
    Abnahmen bleiben dokumentierte Gates.
  betriebs_vertrag: >-
    Periodensperren muessen auditierbar und rollback-bewusst betrieben werden;
    reale Cutover erst nach Fachfreigabe.
  dokumentations_vertrag: >-
    FIN-001 Card, Open-Gaps, Workflow und Slice-YAML muessen gemeinsam gepflegt
    werden.
