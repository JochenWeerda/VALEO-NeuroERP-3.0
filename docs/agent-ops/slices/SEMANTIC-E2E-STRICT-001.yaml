slice_id: SEMANTIC-E2E-STRICT-001
title: "Playwright @critical Tags für Kern-Pfade"
priority: P2
owner: Claude Code
status: abgeschlossen
created: "2026-06-26"

goal: >
  @critical Describe-Blöcke in allen 6 semantischen E2E-Ketten (O2C, WMS, P2P, FIBU, POS, QS).
  Separater CI-Job e2e-critical.yml läuft @critical-Tests bei jedem PR.
  Stricter als @smoke: kein 503-Fallback als Erfolg.

ai_harness:
  fachlicher_vertrag:
    - Alle 6 e2e-matrix Specs haben je einen @critical Block (je 2 Health-Tests).
    - @critical prüft Health der kritischen Endpunkte (200/404/422 erwartet, 503 = fail).
    - e2e-critical.yml blockiert bei @critical-Fehlern.
    - @smoke bleibt fail-safe (503 als Erfolg weiterhin akzeptiert).
  architekturvertrag:
    - @critical und @smoke als getrennte describe-Blöcke — kein Umbau bestehender Tests.
    - Playwright grep: --grep "@critical" für den separaten CI-Job (Repo-Root).
  akzeptanzkriterien:
    - .github/workflows/e2e-critical.yml referenziert alle 6 Ketten-Specs.
    - 12 @critical Health-Tests gesamt (6 Ketten × 2 Endpunkte).

dateibesitz:
  - playwright-tests/specs/e2e-matrix/o2c-semantic-chain.spec.ts
  - playwright-tests/specs/e2e-matrix/wms-silo-semantic-chain.spec.ts
  - playwright-tests/specs/e2e-matrix/p2p-semantic-chain.spec.ts
  - playwright-tests/specs/e2e-matrix/fibu-semantic-chain.spec.ts
  - playwright-tests/specs/e2e-matrix/pos-tse-semantic-chain.spec.ts
  - playwright-tests/specs/e2e-matrix/qs-reklamation-semantic-chain.spec.ts
  - playwright.config.critical.ts
  - .github/workflows/e2e-critical.yml
  - docs/agent-ops/slices/SEMANTIC-E2E-STRICT-001.yaml
