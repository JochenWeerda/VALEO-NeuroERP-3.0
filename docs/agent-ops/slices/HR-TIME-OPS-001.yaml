id: HR-TIME-OPS-001
status: abgeschlossen
owner: Codex
goal: >
  HR-Time-Verdrahtung fuer Navigation vor/zurueck, Bearbeiten/Nachbearbeiten,
  Drucken, Arbeitsplanabruf und praferenzbasierte Planung mit Nachttouren,
  Urlaub, Schulferien, Brueckentagen und Feiertagsdruck operationalisieren.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/HR-TIME-OPS-001.yaml
  - app/api/v1/endpoints/personal.py
  - tests/test_personal_work_plan_api.py
  - packages/frontend-web/src/lib/api/personal.ts
  - packages/frontend-web/src/pages/personal/zeiterfassung.tsx
acceptance_criteria: >
  Backend liefert einen Arbeitsplanvertrag mit Planungsbefunden und
  Mitarbeiterpraeferenzen; Zeitbuchungen koennen aus der UI nachbearbeitet und
  neu eingereicht werden; Frontend bietet vor/zurueck-Navigation, Druckpfade
  und Arbeitsplanabruf; Tests sichern Arbeitsplan- und Praeferenzlogik.
checks:
  - pytest tests/test_personal_work_plan_api.py tests/test_personal_shift_planning_api.py tests/test_personal_time_booking_api.py -q --no-cov
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - git diff --check
risks: >
  Produktive Ferienkalender-Provider, Betriebsvereinbarungen und echte
  Optimierungsengine bleiben Folgeslices.
done:
  - /api/v1/personal/work-plan mit Praeferenz-, Ferien-, Brueckentags-, Feiertags- und Abwesenheitsbefunden umgesetzt.
  - Frontend-Hooks fuer Arbeitsplan, Einreichen und Korrektur ergaenzt.
  - Zeiterfassungsseite bietet Tagesnavigation, Arbeitsplan-Druck, Arbeitsplan-Tab und Nachbearbeitungsmaske.
