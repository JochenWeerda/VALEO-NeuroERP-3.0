acceptance:
  - Jede Ist-Erfassung referenziert eine sichtbare, aktuelle FeedingPlanVersion und deren Instructions.
  - Ist-Komponenten koennen nur bekannte Planfeeds enthalten; fehlende und doppelte Komponenten werden erklaerbar behandelt.
  - Soll, Ist, absolute und prozentuale Abweichung bleiben je Komponente sichtbar; unbekannte Basis erzeugt keinen Nullwert.
  - Naehrstoff- und Kostenfolge verwenden versionierte Feedwerte und kennzeichnen fehlende Abdeckung statt sie als null Euro oder null Naehrstoff auszugeben.
  - Ursache ist eine kontrollierte Klassifikation mit optionalem Pflichtkommentar statt Freitext als einzige Semantik.
  - Command ist tenant-/grant-/rollen-sicher, idempotent und append-only; Event und Erfassung entstehen atomar.
  - CSV-Export enthaelt Tenant-sicher Plan-/Erfassungs-ID, Zeit, Feed, Soll/Ist/Delta, Ursache und Wertfolgen.
  - Mobile Journey sendet Planversions-ID statt eines Rations-String-Adapters und kann nach Retry ohne Doppelwirkung fortsetzen.
tdd:
