risks:
  - Legacy-FeedingControl darf nicht parallel dieselbe mobile Aktion als zweite Wahrheit persistieren.
  - Fehlende Naehrstoff-/Preisdaten duerfen keine scheinbar guenstige Nullfolge erzeugen.
  - Korrektur darf Historie nicht ueberschreiben; neuer Command referenziert den Vorgaenger.
evidence:
