    - Acht Decimal-/Boundary-Vertraege fuer Soll/Ist/Prozent, negativen Input, Kosten-/Naehrstofffolge, Einheiten und Komponentensatz.
    - API-/DB-/CSV-Journey fuer Planbindung, Wertprovenienz, Idempotenz, Immutable-Trigger, Outbox, Tenant/Grant und RBAC.
    - Mobile und native Component-Vertraege fuer Planversions-Command und Meridian-CSV-Auswertung.
  green:
    - Fokussiert 18 Backend-/Screen- und 2 Frontend-Tests gruen.
    - Feeding-/Rations-Regression 631 gruen und 1 bewusst uebersprungen.
    - Frontend-Gesamtsuite 102 Dateien, 407 Tests gruen und 1 bewusst uebersprungen.
    - TypeScript, ESLint, Ruff, Python-Compile und Alembic-Head gruen.
    - Markdown 127 und Governance 132 Dateien gruen; Architecture Validate/Strict Drift 903/903 Routen, 210 Services und 406 Endpoints; Handbuch 46 Masken driftfrei.
  refactor:
    - Sollwerte stammen nur aus MixingInstructions; Client sendet keine Soll-Nebenwahrheit.
    - Reine Decimal-Regeln, append-only Command und flache Komponentenprojektion sind getrennt.
    - Desktopauswertung bleibt zentral Meridian; mobile Journey schreibt nur noch ActualFeeding statt Legacy-FeedingControl.
