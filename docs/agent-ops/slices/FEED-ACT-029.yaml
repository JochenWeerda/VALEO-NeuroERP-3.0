    - API-/DB-Journey fuer Planbindung, Tenant/Grant/RBAC, Idempotenz, Audit, Outbox und CSV.
    - Component-Vertrag fuer mobile Erfassung und native Auswertung.
  green: kleinster Plan-to-Actual-to-Variance-Pfad mit CSV ohne zweite Planwahrheit
  refactor: reine Abweichungsberechnung, persistenter Command und Auswertungsprojektion trennen
