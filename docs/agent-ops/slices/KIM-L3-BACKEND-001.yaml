slice_id: KIM-L3-BACKEND-001
title: KIM L3 — Backend-Fundamente (Kontaktlog-Persistenz, TAPI, Benachrichtigung, Belegquellen)
owner: Claude
status: reserved
coordination: >-
  Komplementaer zu KIM-L3-QUICK-001 (Codex/Claude Code, Frontend/Routen).
  Dieser Slice baut ausschliesslich die von KIM-L3-QUICK-001 ausdruecklich
  ausgeklammerten Backend-Teile. KEINE Aenderung an packages/frontend-web/**
  oder playwright-tests/specs/crm/**.
goal: >-
  Backend-Vertraege fuer die L3-Funktionsuebernahme im KIM-Cockpit: Kontakt-
  dokumentation (Art/Betreff/Kommentar/CC), TAPI-Wahl, internes/externes
  Benachrichtigungssystem und kontaktbezogene Belegtabs.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/KIM-L3-BACKEND-001.yaml
  - app/api/v1/endpoints/crm_kim.py
  - app/services/crm_notification_service.py
  - app/services/crm_kontakt_belege_service.py
  - alembic/versions/*kim_l3_backend*
  - tools/tapi-bridge
  - tests/test_crm_kim_kontaktlog.py
  - tests/test_crm_notification.py
not_owned:
  - packages/frontend-web/**
  - playwright-tests/specs/crm/**
acceptance_criteria:
  - create_log persistiert Art/Betreff(kurzinfo)/Kommentar(notiz)/CC(weiterleitung_an); list_logs gibt sie zurueck.
  - TAPI-Wahl-Endpoint loest ausgehenden Call ueber die Bridge aus, mit sauberem Gate/Fallback ohne Bridge.
  - Internes Benachrichtigungsmodell + Endpoints (Mitarbeiter/Abteilung) und externer Fachberater-Mail-Hook.
  - Kontaktbezogene Belegquellen liefern Rechnungen/Mahnungen/Kontrakte/Strecken tolerant aus kanonischen Quellen.
  - pytest der neuen Tests gruen; alembic upgrade head idempotent.
risks:
  - Stabile Endpoint-Benennung als Schnittstelle zur spaeteren Frontend-Verdrahtung.
  - active-workboard.md wird konkurrierend editiert -> nur eigenen Block pflegen.
