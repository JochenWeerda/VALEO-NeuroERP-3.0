abnahmekriterien:
  - 6 API-Clients mit useQuery/useMutation nach Standardmuster
  - 6 Pages mit Loading/Empty/Error-States
  - Mutation Lifecycle Guards (Submit/Delete disabled while pending)
  - Per-entity Pending State fuer row-level mutations
  - Toast-Feedback auf alle nicht-idempotenten Aktionen
  - Navigation in commercial.tsx (Dauerauftraege, Artikel-Stammdaten)
  - Navigation in operations.tsx (Massebilanz, Vermehrungsvertraege, Zinsabrechnung)
  - Route-Builder-Eintraege fuer alle 6 neuen Seiten
  - E2E-Tests: 6/6 gruen (mocked API)
  - pnpm type-check gruen

erledigt:
