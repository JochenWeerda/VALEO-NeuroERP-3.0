slice_id: WM-AGRI-MAP-001
title: "Agrar Silo: Zielzellen-Regelengine (automatischer Vorschlag aus WE/Waage)"
priority: P2
owner: Claude Code
status: abgeschlossen
created: "2026-06-26"

goal: >
  Gap-Verifikation 2026-06-26: Zielzellen-Regelengine bereits vollstaendig implementiert.
  GET /silo/zielzellen-vorschlag (artikel_id, menge_kg, qualitaetsklasse, warehouse_id)
  und GET /silo/zielzellen-vorschlag/lot/{lot_id} liefern priorisierte Silozellen-Vorschlaege
  via SiloRuleEngineService. Auto-Buchung ueber POST /material-flow/lot-link/auto-book.
  Kein weiterer Code-Aufwand erforderlich.

ai_harness:
  fachlicher_vertrag:
    - GET /api/v1/silo/zielzellen-vorschlag liefert 200 mit priorisierten Zellvorschlaegen.
    - GET /api/v1/silo/zielzellen-vorschlag/lot/{lot_id} mappt Waage-Lot auf beste Zelle.
    - POST /material-flow/lot-link/auto-book bucht automatisch ohne manuelle Zellauswahl.
  architekturvertrag:
    - SiloRuleEngineService (app/services/silo_rule_engine_service.py) kapselt Regelwerk.
    - silo_target_cell.py als Thin-Router; api.py registriert unter WM-SILO-RULE-ENGINE-001.
  akzeptanzkriterien:
    - Endpoints vorhanden und 200-faehig (Code-Nachweis 2026-06-26).

dateibesitz:
  - app/api/v1/endpoints/silo_target_cell.py
  - app/services/silo_rule_engine_service.py
  - app/api/v1/endpoints/agri_lot_link_booking.py
  - docs/agent-ops/slices/WM-AGRI-MAP-001.yaml
