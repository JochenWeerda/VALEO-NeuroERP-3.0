slice_id: DOC-AGENT-CATALOG-001
title: "Agent-Dokumentation: Capability- + Tool-Katalog + Guardrails"
owner: Cursor
status: abgeschlossen
created_at: 2026-06-25
completed_at: 2026-06-25
goal: >-
  Die maschinenlesbare Agent-Doku-Schicht fuellen: Capability-Katalog (Hermes/
  Operator-/Coding-Agents), Tool-Katalog (MCP, generiert aus der Registry),
  Guardrails (Human-Approval, fail-closed, RBAC) und die ai_harness-Vertragsdoku.
file_ownership:
  - docs/agent-docs/capability-catalog.md
  - docs/agent-docs/tool-catalog.md
  - docs/agent-docs/guardrails.md
  - docs/agent-docs/contracts.md
  - docs/agent-docs/index.md
  - mkdocs.yml
  - docs/agent-ops/slices/DOC-AGENT-CATALOG-001.yaml
  - docs/agent-ops/active-workboard.md
acceptance:
  - Capability-Katalog beschreibt Agent-Rollen, Faehigkeiten und Grenzen.
  - Tool-Katalog listet die MCP-Tools mit Scope, Idempotenz, Risikoklasse und Human-Approval.
  - Guardrails (HIGH-risk Human-Approval, fail-closed, RBAC, Audit) sind dokumentiert.
  - ai_harness-Vertragsmodell (7 Vertraege) ist als Referenz beschrieben.
  - mkdocs build laeuft fehlerfrei.
tests:
  - python -m mkdocs build --site-dir site_check
  - node scripts/docs-governance-check.cjs docs/agent-docs/guardrails.md
  - node scripts/ai-slice-readiness-check.cjs --slice DOC-AGENT-CATALOG-001
risks:
  - "Tool-Katalog teilt die Generierung mit DOC-INTERFACES-001 (mcp-tools.md); hier als Agent-Sicht eingebunden, keine Doppelpflege."
  - "Capability-Beschreibungen werden mit Reifung der Agenten fortgeschrieben."
ai_harness:
  fachlicher_vertrag: >-
    KI-Agents (Hermes & Co.) und ihre Betreuer verstehen Faehigkeiten, erlaubte
    Tools, Risiken und Freigabepflichten.
  architektur_vertrag: >-
    Agent-Doku ist maschinenlesbar (MCP-JSON-Schema, ai_harness-Vertraege) und
    verweist auf die generierte MCP-Referenz aus DOC-INTERFACES-001.
  daten_vertrag: >-
    Keine persistenten Daten. Tool-Metadaten stammen aus config/mcp_erp_tools.yaml.
  test_vertrag: >-
    Markdown-/Governance-Checks und mkdocs build im CI; Slice-Readiness gruen.
  security_vertrag: >-
    Guardrails dokumentieren Human-Approval bei HIGH-risk, fail-closed-Verhalten,
    RBAC-Scopes und Audit-Pflicht je Tool.
  betriebs_vertrag: >-
    Operator-Agent-Proposal-Lifecycle und Eskalationspfade sind beschrieben.
  dokumentations_vertrag: >-
    Agent-Doku ist in die Navigation eingebunden und im Workboard referenziert.
external_gates:
  - Keine externe Abnahme.
verification:
  - python -m mkdocs build --site-dir site_check
  - node scripts/ai-slice-readiness-check.cjs --slice DOC-AGENT-CATALOG-001
