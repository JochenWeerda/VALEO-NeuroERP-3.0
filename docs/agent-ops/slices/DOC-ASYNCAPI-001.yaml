slice_id: DOC-ASYNCAPI-001
title: "AsyncAPI 2.6 Event-Katalog"
priority: P2
owner: Claude Code
status: abgeschlossen
created: "2026-06-26"

goal: >
  Maschinenlesbare AsyncAPI 2.6 Spec + MkDocs-Seite für alle NATS/Outbox-Events generieren.
  51 Events aus app/, modules/, scripts/ extrahiert und als Kanal-Definitionen dokumentiert.

ai_harness:
  fachlicher_vertrag:
    - docs/schnittstellen/asyncapi.yaml enthält alle bekannten NATS/Outbox-Event-Kanäle.
    - docs/schnittstellen/events.md listet Events nach Domäne mit Kanal und Quelldatei.
    - Jedes Event hat ein standardisiertes Payload-Schema (event_id, tenant_id, occurred_at, payload).
    - NATS-Subjects folgen dem Muster tenant.{tenantId}.<domäne>.<aggregat>.<aktion>.
  architekturvertrag:
    - scripts/extract_events.py ist Single Source of Truth für Event-Extraktion.
    - scripts/generate_asyncapi.py liest events_raw.json und generiert Spec + Doku.
    - events_raw.json liegt im Repo-Root (gitignored, Zwischenprodukt).
    - Bei neuen Events: extract_events.py → generate_asyncapi.py → asyncapi.yaml committen.
  akzeptanzkriterien:
    - docs/schnittstellen/asyncapi.yaml ist valides AsyncAPI 2.6 YAML mit 51 Channels.
    - docs/schnittstellen/events.md zeigt Events gruppenweise nach Domäne.
    - scripts/extract_events.py und scripts/generate_asyncapi.py sind portable (kein Hardcoded-Pfad).

dateibesitz:
  - docs/schnittstellen/asyncapi.yaml
  - docs/schnittstellen/events.md
  - scripts/extract_events.py
  - scripts/generate_asyncapi.py
  - docs/agent-ops/slices/DOC-ASYNCAPI-001.yaml
