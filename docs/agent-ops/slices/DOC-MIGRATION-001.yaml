slice_id: DOC-MIGRATION-001
title: "Doku-Migration: Altbestaende archivieren und einordnen"
owner: Cursor
status: abgeschlossen
created_at: 2026-06-25
completed_at: 2026-06-25
goal: >-
  Die organisch gewachsenen Altbestaende ordnen: einen internen, nicht
  veroeffentlichten Bereich (docs/_internal/) etablieren, klar historische
  Artefakte (Completion-Reports, Debugging-Notizen, Summaries) revisionssicher
  nach docs/_internal/archive/ verschieben und einen Migrations-Inventar mit
  Zielbuckets festschreiben. Aktive Fachdoku bleibt unangetastet.
file_ownership:
  - docs/_internal/README.md
  - docs/_internal/archive/README.md
  - docs/_internal/archive/**
  - docs/dokumentation/migrationsplan.md
  - scripts/docs-markdown-check.cjs
  - scripts/docs-governance-check.cjs
  - mkdocs.yml
  - docs/agent-ops/slices/DOC-MIGRATION-001.yaml
  - docs/agent-ops/active-workboard.md
acceptance:
  - docs/_internal/ ist als nicht veroeffentlichter Bereich etabliert und vom Build ausgeschlossen.
  - Klar historische Root-Artefakte (*-COMPLETE, *-debugging, PHASE-*-COMPLETION, *-summary) sind nach docs/_internal/archive/ verschoben.
  - Ein Migrations-Inventar (Kategorien -> Zielbucket) ist dokumentiert.
  - Verschiebungen erfolgen per git mv (Historie erhalten); keine aktive Fachdoku wird geloescht.
  - mkdocs build laeuft fehlerfrei.
tests:
  - python -m mkdocs build --site-dir site_check
  - node scripts/docs-governance-check.cjs docs/dokumentation/migrationsplan.md
  - node scripts/ai-slice-readiness-check.cjs --slice DOC-MIGRATION-001
risks:
  - "Verschobene Dateien koennten anderweitig verlinkt sein; da ausgeschlossen, nur Build-Warnungen moeglich. Konservativer Scope (nur eindeutig historische Artefakte)."
  - "Parallelarbeit anderer Agents: vor dem Verschieben Working-Tree-Status pruefen."
ai_harness:
  fachlicher_vertrag: >-
    Leser finden aktuelle, kuratierte Doku ohne Rauschen; historische Artefakte
    bleiben auffindbar archiviert.
  architektur_vertrag: >-
    Trennung kuratierte Site vs. internes Archiv (docs/_internal/), konsistent
    mit der exclude_docs-Strategie des Fundaments.
  daten_vertrag: >-
    Keine persistenten Daten. git-Historie der verschobenen Dateien bleibt erhalten.
  test_vertrag: >-
    mkdocs build und Governance-Check im CI; Slice-Readiness gruen.
  security_vertrag: >-
    Keine Loeschung von Nachweisen; Archiv bleibt im Repo revisionssicher erhalten.
  betriebs_vertrag: >-
    Migrations-Inventar steuert weitere Einordnung schrittweise und nachvollziehbar.
  dokumentations_vertrag: >-
    Migrationsplan und Archiv-READMEs sind festgeschrieben und im Workboard referenziert.
external_gates:
  - Keine externe Abnahme.
verification:
  - python -m mkdocs build --site-dir site_check
  - node scripts/ai-slice-readiness-check.cjs --slice DOC-MIGRATION-001
