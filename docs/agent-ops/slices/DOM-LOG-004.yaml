slice_id: DOM-LOG-004
title: "LOG Domäne — Vollständige fachliche Vertiefung (Disposition .2 / ePOD .3 / Frachtabrechnung .4 / E2E .5)"
owner: Claude Code
status: completed
coordination: >-
  Ergänzt die bestehenden LOG-Foundation-Slices (LOG-PROD-001, LOG-SPINE-001,
  LOG-LIFE-001, LOG-CHAIN-001, LOG-TF-WS-001). Kein Überlapp mit Cursor
  COMPAT-GOV-001. Besitzt nur LOG-Domain-Dateien und Testfixtures.
goal: >-
  Die Logistik-Domäne auf das gleiche Tiefe-Niveau wie CON/SALES/FIN/DOC/PROC
  heben: Kapazitäts-/Zeitfenster-Disposition (.2), ePOD-Lifecycle mit
  Ablieferungsbeleg-Settlement (.3), Frachtkostenabrechnung mit
  Rechnungs-Lifecycle (.4) und End-to-End-UAT (.5).
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/DOM-LOG-004.yaml
  - docs/workflows/dom-log-004-logistik-deepening-2026-06-23.md
  - app/services/logistics_disposition_service.py
  - app/services/logistics_epod_service.py
  - app/services/logistics_freight_invoice_service.py
  - alembic/versions/log_disposition_20260623.py
  - alembic/versions/log_epod_settlement_20260623.py
  - app/api/v1/endpoints/logistics_tours.py
  - playwright-tests/specs/logistik/log-lifecycle-smoke.spec.ts
  - scripts/uat/log_lifecycle_uat.py
not_owned:
  - app/api/v1/endpoints/logistics_freight.py
  - alembic/versions/log_carrier_invoices_20260618.py
  - tests/test_logistics_integration.py
  - tools
  - packages/frontend-web/src/pages/logistik/frachttabellen.tsx
  - packages/frontend-web/src/pages/logistik/frachtbriefe.tsx
acceptance_criteria:
  - POST /logistik/tours/{id}/disposition-check berechnet Kapazitätsauslastung korrekt
  - POST /logistik/tours/{id}/stops/{sid}/settle schreibt ePOD-Settlement in DB
  - Disposition-Service blockiert Überbuchung (Kapazität > 100%) mit 422
  - ePOD-Settlement erfordert SIGNED-Status (Fail-Closed)
  - Playwright @smoke-Test läuft grün (3 kritische Pfade)
  - UAT-Script gibt strukturierten JSON-Report aus
  - TypeScript + ESLint für neue Frontend-Erweiterung grün
  - Workboard auf abgeschlossen gesetzt
ai_harness:
  fachlicher_vertrag: >-
    Tour-Disposition: Fahrzeug (vehicle_id) hat maximale Kapazität in kg.
    Stopps mit delivery_note_ref aggregieren das Lieferscheingewicht.
    Überbuchung (>100%) wird blockiert. Zeitfenster: planned_arrival der Stopps
    muss chronologisch sein.
    ePOD-Lifecycle: Stopp-Status GELIEFERT setzt epod_status=SIGNED.
    Settlement: POST /settle schreibt Abrechnungs-Record und setzt Status
    epod_status=SETTLED. Keine Rückabwicklung ohne expliziten Storno.
    Frachtabrechnung: POST /logistik/freight-invoices aggregiert carrier_invoices
    je Tour. Nur ABGESCHLOSSEN-Touren sind fakturierbar. Bereits fakturierte
    Touren (invoice_status=ISSUED) werden blockiert (Idempotenz-Guard).
  architektur_vertrag: >-
    Thin-Router-Muster beibehalten: business logic in Services (app/services/),
    Endpunkte in logistics_tours.py via text() SQL.
    Neue Tabellen in domain_logistics-Schema via Alembic.
    Services sind zustandslos (keine Singleton-Instanzen). Kein ORM.
  daten_vertrag: >-
    tour_disposition_checks: id, tour_id, checked_at, total_weight_kg,
    capacity_kg, utilization_pct, stops_count, result (OK/OVERLOADED).
    epod_settlements: id, tour_id, stop_id, settled_at, recipient_name,
    delivered_at, notes, tenant_id.
    Keine Breaking Changes an bestehenden Tabellen tours/tour_stops/freight_tariffs.
  test_vertrag: >-
    Unit: logistics_disposition_service (Überauslastung, leere Tour, Zeitfenster).
    Unit: logistics_epod_service (SIGNED-Guard, Settlement-Record).
    Playwright @smoke: 3 Pfade — Tour-erstellen, Stopp-Status-Update, Disposition-Check.
    UAT-Script: sequentiell alle Endpunkte gegen dev-DB.
  security_vertrag: >-
    X-Tenant-ID bei allen Mutations verpflichtend (422 ohne).
    Settlement darf nur durch eigenen Tenant abgerufen werden.
    capacity_kg niemals aus user-Input — kommt aus vehicles-Tabelle oder
    Backend-Config (Fail-Closed: default 0 kg wenn nicht konfiguriert).
  betriebs_vertrag: >-
    Alle Service-Fehler loggen mit logger.warning (kein silent swallow).
    disposition-check ist idempotent (GET-semantisch, POST für Protokoll).
    settle-Endpoint ist idempotent via unique constraint auf (stop_id).
  dokumentations_vertrag: >-
    docs/workflows/dom-log-004-logistik-deepening-2026-06-23.md beschreibt
    Soll-Prozesse für alle 3 Subdomänen.
    Playwright-Spec mit @smoke-Tag für CI-Integration vorbereitet.
external_gates: []
risks:
  - vehicle_capacity kann nicht aus domain_logistics gelesen werden wenn
    vehicles-Tabelle nicht existiert — Service fällt auf konfigurierten Default zurück
  - ePOD-Settlement ohne physische Signatur prüfbar — Foto-Upload als optionales Feld
