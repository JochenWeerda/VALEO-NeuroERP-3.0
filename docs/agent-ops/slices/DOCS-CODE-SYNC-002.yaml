slice_id: DOCS-CODE-SYNC-002
title: "Docs-Code-Sync Mapping-Härtung"
priority: P1
owner: Claude Code
status: abgeschlossen
created: "2026-06-26"

goal: >
  docs-code-sync-map.yaml um generierte Inventar-Artefakte erweitern.
  docs-code-sync-check.cjs erkennt .json/.yaml/.ts-Artefakte als valide Doku-Nachweise.
  Endpoints/Migrationen/Services/Seiten können statt klassischer .md-Doku auch
  die generierten Inventar-Dateien als Nachweis vorweisen.

ai_harness:
  fachlicher_vertrag:
    - Endpoint-PR ohne docs/schnittstellen/openapi.json oder endpoint-inventory.md → rot.
    - Migrations-PR ohne docs/admin/migration-inventory.md → rot.
    - Service-PR ohne docs/entwickler/service-inventory.md → rot.
    - Frontend-Seiten-PR ohne route-inventory.gen.json oder docs/benutzerhandbuch/ → rot.
    - Generierte Artefakte (.json, .yaml, .ts) in generated_doc_paths zählen als Doku.
    - Exception: docs_sync_exception im Slice-YAML befreit einzelne PRs.
  architekturvertrag:
    - config/docs-code-sync-map.yaml ist Single Source of Truth für Sync-Regeln.
    - docs-code-sync-check.cjs liest generated_artifacts und generated_doc_paths aus dem Map.
    - Kein zweites Check-Script — nur Map-Erweiterung und Parser-Anpassung.
    - Alle generierten Pfade sind explizit in generated_doc_paths gelistet.
  akzeptanzkriterien:
    - node scripts/docs-code-sync-check.cjs läuft auf aktuellem Stand grün.
    - PR mit Endpoint-Änderung UND openapi.json → grün.
    - PR mit Endpoint-Änderung OHNE jede Doku → rot.
    - generated_artifacts-Feld wird korrekt geparsed.

dateibesitz:
  - config/docs-code-sync-map.yaml
  - scripts/docs-code-sync-check.cjs
  - docs/agent-ops/slices/DOCS-CODE-SYNC-002.yaml
