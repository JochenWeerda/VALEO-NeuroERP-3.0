id: MCP-OIDC-VERIFY-20260925
owner: Codex
status: abgeschlossen
goal: Kryptografischer Token-Nachweis am MCP-Endpunkt ohne Auth-Override.
scope: Gemeinsamer OIDC-Verifier und HTTP-Regression; echter Provider-Login separat.
file_ownership:
  - app/auth/oidc.py
  - tests/test_mcp_oidc_verification.py
  - docs/quality-assurance/mcp-oidc-verification-20260925.md
acceptance:
  - Ablaufdatum, Issuer, Audience und Subject verpflichtend.
  - Ungueltige Tokens und falsche Berechtigungen erreichen keine Datenbank.
tests:
  - 31 Tests mit echten RSA-Signaturen und bestehendem HTTP-Auth-Pfad bestanden.
risks:
