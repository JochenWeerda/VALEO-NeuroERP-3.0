  architektur_vertrag: Bestehender OIDC-Verifier, kein neues Auth-Modell.
  daten_vertrag: Keine Persistenz oder Migration in diesem Slice.
  test_vertrag: Signierte JWTs, HTTP-Vertrag, Negativpfade ohne Auth-Override.
  security_vertrag: Verpflichtende Claims und konfigurierte Issuer/Audience.
  betriebs_vertrag: Anbieter muessen Standardclaims liefern; keine Ausweichauthentifizierung.
  dokumentations_vertrag: Workboard, Slice und QA mit Provider-Abnahme als Restpunkt.
external_gates:
  - Synthetischer RSA-Signaturtest ueber den echten Verifier bestanden.
