acceptance:
  - Alembic-Tabellen fuer silo_systems, silo_cells, material_flow_nodes und material_flow_edges liegen in domain_inventory am Head.
  - API ist unter /api/v1/lager/wms/agri/* fuer Listen, Anlegen, Route-Validierung sowie PATCH fuer Silo Cells, Nodes und Edges verdrahtet.
  - Router agri_silo_material_flow ist in app/api/v1/api.py mit Prefix /lager/wms/agri registriert.
  - Service lehnt offene Kanten zu blocked- oder QS-gesperrten Zielen ab und liefert Verschleppungshinweise.
  - Unit-Tests tests/test_agri_silo_material_flow.py sind fachlich gruen.
  - Frontend-Routen lager/materialfluss und lager/materialfluss-visualisierung verwenden PageToolbar und MERIDIAN-Tokens.
  - Materialfluss-Seite zeigt Live-Graph aus material_flow_nodes/edges bei Lagerwahl; Demo bleibt Fallback ohne Lagerwahl.
  - Mindest-UI erlaubt Stammdatenanlage fuer Siloanlage, Silozelle, Knoten und Kante.
  - Silozellen-UI zeigt Material/Lot-Referenz, current_stock_kg, capacity_kg, Layout, VK-Klasse, Kanten, Spuelcharge und max kg/h.
  - Doku, Benchmark, OSS-/Herstellerliste, UI-Baustein-Paket und Prozessketten-Workflow sind nachgezogen.
  - Materialtransfer wird ueber WMS-FLOW-001 getrennt nachverfolgt.
tests:
  - pytest -q -o addopts= tests/test_agri_silo_material_flow.py
  - pnpm --dir packages/frontend-web exec vitest run src/__tests__/lib/material-flow-display.test.ts
  - pnpm --dir packages/frontend-web exec tsc --noEmit --pretty false
  - node scripts/ai-slice-readiness-check.cjs --slice WM-AGRI-SILO-001
risks:
  - Bird-View WM-AGRI-MAP-001 ist Folgeslice.
  - Lot-Bestand Silozelle automatisch aus WE/Waage bleibt Folgeslice WM-AGRI-LOT-LINK.
  - PLC/OPC-UA-Anbindung bleibt Folgeslice WM-AGRI-PLC-005.
  - Delete-Verhalten in der Mindest-UI ist kein Pflichtstatus dieses Slices.
ai_harness:
  fachlicher_vertrag: >-
    Operatoren muessen sehen und pruefen koennen, welche Silozelle, welcher
    Materialfluss-Knoten und welche Kante fuer einen Lager-/Foerderweg fachlich
    zulaessig sind.
  architektur_vertrag: >-
    Backend-Service, API, ORM/Migration und Frontend-Visualisierung bilden die
    Integrationsschicht. Produktionsnahe PLC-, Bird-View- und Lot-Waage-Syncs
    bleiben getrennte Folgeslices.
  daten_vertrag: >-
    Siloanlage, Silozelle, Materialfluss-Knoten, Materialfluss-Kante,
    current_stock_kg, capacity_kg, QS-Status, Lot-/Materialreferenz,
    layout_x/y, Durchsatz und Spuelcharge sind die zentralen Vertragsdaten.
  test_vertrag: >-
    Route-Validierung, QS-Sperren, Mapper-Logik und Typecheck muessen
    reproduzierbar laufen; Folgeslices brauchen eigene UAT-/E2E-Gates.
  security_vertrag: >-
    Keine direkte Anlagensteuerung ohne gesondertes PLC-/MES-Gate. UI/API
    duerfen Stammdaten und Simulation pruefen, aber keine Hardware-Bewegung
    ausloesen.
  betriebs_vertrag: >-
    Live-Graph faellt bei fehlender Lagerwahl auf Demo/Leerzustand zurueck;
    echte Mengen- und Chargenbuchungen werden in WMS-FLOW/LOT-LINK vertieft.
  dokumentations_vertrag: >-
    Warehouse-Doku, Benchmark, OSS-/Herstellerbewertung, Handbuchbezug und
    Workflow-Doku halten Scope, offene Risiken und Folgeslices fest.
external_gates:
  - Anlagen-/PLC-Abnahme vor produktiver Steuerung.
  - Fachliche QS-/Chargenfreigabe fuer automatische Lot-Bestandskopplung.
  - UAT mit realem Warenfluss Annahme, Waage, Lot, Silozelle, kg-Bestand und Trace.
