slice_id: WM-AGRI-SILO-001
title: "Agrar-Siloanlagen und Materialfluss (Knoten/Kanten, Route-Validierung)"
owner: Cursor
status: completed
updated: 2026-06-19
coordination: >-
  Bestehender Integrationsslice fuer Siloanlagen, Silozellen, Materialfluss-
  Knoten/-Kanten, Route-Validierung und Visualisierung. Folgeslices fuer
  Lot-Bestand, Bird-View und PLC bleiben getrennt.
goal: >-
  Agrar-/WMS-Materialfluss so bereitstellen, dass Silozellen, Knoten, Kanten,
  Route-Validierung, QS-Sperren, Verschleppungshinweise, Live-Graph und
  Stammdaten-Minimum fachlich nachvollziehbar und technisch pruefbar sind.
