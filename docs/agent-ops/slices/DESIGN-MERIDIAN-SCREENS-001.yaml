id: DESIGN-MERIDIAN-SCREENS-001
title: Meridian Screen Rollout fuer Kernmasken
owner: Codex
status: reserviert
claimed_at: 2026-05-21
goal: >
  Die wichtigsten sichtbaren Fach-/Maskenflaechen nach der Shell-Umstellung
  weiter auf Meridian tokenisieren.
scope:
  - Masken-Builder-Basisflaechen ListReport, ObjectPage und OverviewPage auf Meridian-Oberflaechen nachziehen.
  - Dashboard-Charts und Kernfeatures auf tokenbasierte Cards, Header und Zustandsfarben angleichen.
  - Touch-Targets in sichtbaren Filter-/Toolbar-/Kartenaktionen erhalten oder auf 44px anheben.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/DESIGN-MERIDIAN-SCREENS-001.yaml
  - packages/frontend-web/src/components/mask-builder/ListReport.tsx
  - packages/frontend-web/src/components/mask-builder/ObjectPage.tsx
  - packages/frontend-web/src/components/mask-builder/OverviewPage.tsx
  - packages/frontend-web/src/features/dashboard/DashboardCharts.tsx
  - packages/frontend-web/src/features/contracts/Contracts.tsx
  - packages/frontend-web/src/features/inventory/Inventory.tsx
  - packages/frontend-web/src/features/weighing/Weighing.tsx
  - packages/frontend-web/src/features/sales/Sales.tsx
acceptance_criteria:
  - Masken-Builder-Basisflaechen nutzen Meridian-Oberflaechen, Tabellen-/Filter-/Header-Muster und 44px Controls.
  - Dashboard-Charts und Kernfeatures vermeiden generische Slate/Blue/Green-Mischung in den sichtbarsten Cards.
  - Frontend-Typecheck und Workboard-Validierung sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-markdown-check.cjs docs/agent-ops/active-workboard.md docs/agent-ops/slices/DESIGN-MERIDIAN-SCREENS-001.yaml
  - git diff --check
risks:
  - Tiefe Modulunterseiten enthalten weiterhin harte Utility-Farben und brauchen bei Bedarf weitere fachbereichsweise Slices.
next_step: Masken-Builder und sichtbare Kernfeature-Karten auf Tokenklassen umstellen.
