risks:
  - Legacy-Mobile-Daten duerfen nicht parallel als zweite aktuelle Planwahrheit fortbestehen.
  - Browserdruck darf keine unmaskierten oder fremden Betriebsdaten nachladen.
  - Veraltet darf nie allein aus Clientzeit oder Farbe abgeleitet werden.
evidence:
  red:
    - API-/Service-Vertrag fuer serverseitige current/scheduled/stale-Ableitung und grant-sichere aktuelle Plaene.
    - Screen-/Component-Vertraege fuer native ObjectPage, Druckprojektion, Klartextstatus und Planversionscache.
    - Bestehende Playwright-Stalljourney wurde vom Legacy-Rationspayload auf den realen Current-Plan-Vertrag umgestellt.
  green:
    - Vierzehn fokussierte Backend-/Screen-Tests gruen.
    - Drei neue Component-Tests und ein fokussierter Playwright-Test gruen; Visual Tour ohne Probleme.
    - Feeding-/Rations-Regression 606 bestanden und 1 bewusst uebersprungen.
    - Frontend-Gesamtsuite 100 Dateien, 404 Tests gruen und 1 bewusst uebersprungen.
    - TypeScript, fokussiertes ESLint, Ruff und Routing-Integrity gruen.
    - Markdown 127 und Governance 130 Dateien gruen.
    - Architecture Validate/Strict Drift 903/903 Routen, 210 Services und 406 Endpoints; Handbuch 45 Masken driftfrei.
  refactor:
    - Server ist alleinige Quelle fuer current/scheduled/stale; Client zeigt nur den Vertrag.
    - Mobile Stallroute konsumiert Planversion/Instructions und ignoriert Legacy-Cache v1.
    - Interaktive ObjectPage bleibt zentral; die Druckprojektion nutzt dieselben grant-geladenen Daten ohne Raw-HTML-Sink.
