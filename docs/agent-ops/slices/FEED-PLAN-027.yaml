acceptance:
  - Native ObjectPage laeuft ueber ScreenDefinition, RenderPlan, UniversalMaskRuntime und UniversalMaskRenderer.
  - Kopf zeigt Herkunft, Version, Tierzahl, Gueltigkeit, Dosierprofil und aktuellen/veralteten Zustand als Text.
  - Mischanweisungen zeigen Reihenfolge, FM je Tier, rohe Charge, Zielcharge und Rundungsdelta mit Einheiten.
  - Druckansicht enthaelt Plan-ID, Quellversion, Gueltigkeit, Zeitstempel und Mischfolge und ist browserseitig als PDF speicherbar.
  - Mobile Route liest aktuelle Planversionen statt Rations-Snapshot-Mobile-Payload; Cache ist planversionsgebunden.
  - Abgelaufene und durch neuere Versionen ersetzte Plaene sind veraltet und werden mobil nicht als aktuell angeboten.
  - Empty, Loading, Offline-Cache, unbekannte Menge und Fehler bleiben handlungsorientiert.
