  dokumentations_vertrag: >-
    Audit-Doku 7g + Endstand-Abschnitt 8; CLAUDE.md-Designregeln; Workboard;
    dieses YAML.
  test_vertrag: >-
    Build + Bundle-Eindeutigkeitspruefung + axe-E2E 8/8 + tsc + volle
    Vitest-Suite vor Push gruen.
