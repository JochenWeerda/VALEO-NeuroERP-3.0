slice_id: ROUTER-NEXT-002
title: Native TanStack Router Call-Site Migration
owner: Codex
status: completed
goal: >-
  Die nach dem Browser-Router-Cutover verbliebenen produktiven Aufrufe des
  React-Router-Kompatibilitaetsadapters auf native TanStack-Hooks und streng
  typisierte VALEO-Route-Contracts migrieren.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/ROUTER-NEXT-002.yaml
  - docs/architecture/frontend-routing/**
  - packages/frontend-web/src/**
  - packages/frontend-web/scripts/**
  - packages/frontend-web/tests/e2e/**
acceptance_criteria:
  - Produktiver Code importiert nicht mehr aus react-router-compat.tsx.
  - Navigationen, Links, Parameter und Search-Werte verwenden TanStack Router oder den typisierten Route-Contract.
  - react-router-compat.tsx ist auf Unit-Test-Infrastruktur reduziert oder entfernt.
  - Typecheck, Routing-Integritaet, Frontend-Tests, Build und Browser-Smokes sind gruen.
risks:
  - Mehr als 300 produktive Dateien verwenden noch die bisherige ergonomische API.
  - Dynamisch zusammengesetzte Pfade muessen explizit typisiert oder durch Route-Builder ersetzt werden.
result: >-
  Der React-Router-Kompatibilitaetsadapter ist entfernt. 338 produktive
  Aufrufer verwenden die TanStack-basierte typed-router-Fassade; Tests nutzen
  eine getrennte TanStack-Memory-Router-Infrastruktur. Der Generator erzeugt
  851 Routen sowie Parameter-, Search-Key- und Inventory-Contracts. 94
  explizite Navigationsziele und 34 Legacy-Redirects sind registriert.
  Typecheck, Routing-Integritaet, Navigation-Audit, 127 Vitest-Tests,
  Produktions-Build und acht Playwright-Smokes sind gruen.
