acceptance:
  - Naehrstoffe und Einheiten sind persistierte, versionierte Referenzdaten statt Codefelder.
  - Dimension und Bezugsbasis verhindern fachlich unzulaessige Umrechnungen.
  - FM-/TM-Konvertierung ist mit Decimal deterministisch, umkehrbar und property-getestet.
  - Rundungsregeln sind explizit, reproduzierbar und nicht von Float-/Locale-Verhalten abhaengig.
  - Read-API und native Meridian-Referenzansicht sind typisiert, tenant-sicher und zugaenglich.
  - Migration ist additiv, idempotent geseedet und Alembic bleibt Single-Head.
