slice_id: WA-NOTIFY-001
title: WhatsApp Ausgehende Push-Benachrichtigungen
owner: Claude Sonnet 4.6
status: completed
created_at: "2026-06-26"
goal: >-
  Ausgehende WhatsApp-Nachrichten als Push-Kanal zum Kunden: Lieferankuendigung
  wenn der LKW etwa eine Stunde entfernt ist und Dokument-Bereitstellung, wenn
  Lieferschein oder Rechnung erstellt wurde. Simulator mit Outbox-Log;
  Produktions-Anbindung via Meta Cloud API.
file_ownership:
  - app/services/whatsapp_notify_service.py
  - app/api/v1/endpoints/whatsapp_notify.py
  - packages/frontend-web/src/pages/portal/whatsapp-simulator.tsx
  - tests/test_whatsapp_notify.py
  - docs/agent-ops/slices/WA-NOTIFY-001.yaml
acceptance_criteria:
  - POST /api/v1/whatsapp/dev/notify/lieferankuendigung gibt msg_id und status zurueck
  - POST /api/v1/whatsapp/dev/notify/dokument-ready gibt msg_id und text zurueck
  - GET /api/v1/whatsapp/dev/outbox zeigt alle gesendeten Nachrichten
  - Simulator-UI Tab Ausgehend Push und Outbox funktionieren
  - Tenant-Isolation trennt Outbox pro Mandant
  - Mit WHATSAPP_ACCESS_TOKEN ist ein echter Meta-API-Aufruf moeglich
acceptance:
  - POST /api/v1/whatsapp/dev/notify/lieferankuendigung gibt msg_id und status zurueck
  - POST /api/v1/whatsapp/dev/notify/dokument-ready gibt msg_id und text zurueck
  - GET /api/v1/whatsapp/dev/outbox zeigt alle gesendeten Nachrichten
  - Simulator-UI Tab Ausgehend Push und Outbox funktionieren
  - Tenant-Isolation trennt Outbox pro Mandant
  - Mit WHATSAPP_ACCESS_TOKEN ist ein echter Meta-API-Aufruf moeglich
checks:
  - pytest tests/test_whatsapp_notify.py -q --no-cov
tests:
  - pytest tests/test_whatsapp_notify.py -q --no-cov
risks:
  - httpx muss installiert sein.
  - Meta-API-Aufruf ist synchron; in Produktion sollte ein Background-Task verwendet werden.
  - In-Memory-Outbox geht bei Restart verloren; Redis-Persistenz bleibt WA-INFRA-001 Scope.
external_gates:
  - Meta Cloud API Produktivfreigabe und Telefonnummer-Verifikation
ai_harness:
  fachlicher_vertrag: >-
    Lieferankuendigung-Trigger: Logistik/Disposition -> POST
    /notify/lieferankuendigung. Dokument-Trigger: Docflow nach Erstellung ->
    POST /notify/dokument-ready. Text enthaelt Kunden-Name, Artikel, Menge, ETA
    bzw. Dokumentennummer und Portal-Link.
  architektur_vertrag: >-
    Tenant-isolierter In-Memory-Outbox-Fallback. Meta-API-Aufruf ueber httpx,
    wenn WHATSAPP_ACCESS_TOKEN gesetzt ist. Router unter /api/v1/whatsapp.
  daten_vertrag: >-
    Outbox-Eintraege: msg_id, phone, notify_type, text, status, created_at.
    Kein personenbezogener Log in Produktionsmodus.
  test_vertrag: >-
    Unit-Tests ohne echten Meta-Aufruf; kein WHATSAPP_ACCESS_TOKEN bedeutet
    simulated. Tenant-Isolation, eindeutige msg_id und Outbox-Chronologie sind
    zu pruefen.
  security_vertrag: >-
    Produktions-Meta-Aufruf nur mit gesetztem WHATSAPP_ACCESS_TOKEN.
    Dev-Endpoints /dev/* duerfen nicht ungeschuetzt produktiv exponiert werden.
  betriebs_vertrag: >-
    Env-Vars: WHATSAPP_ACCESS_TOKEN, WHATSAPP_PHONE_NUMBER_ID, PORTAL_BASE_URL.
    Persistente Outbox ist Folgescope.
  dokumentations_vertrag: >-
    Slice-YAML und Workboard-Eintrag dokumentieren Status, Tests und externe
    Gates.
integration_points:
  - Logistik-/Dispositions-Service -> POST /api/v1/whatsapp/dev/notify/lieferankuendigung
  - Docflow-Service -> POST /api/v1/whatsapp/dev/notify/dokument-ready
  - WA-AGENT-001 Eingehend, gleicher Router-Prefix
