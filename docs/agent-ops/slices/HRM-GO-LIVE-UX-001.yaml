id: HRM-GO-LIVE-UX-001
title: HRM-Betriebsfreigaben UX-Referenz und domänenweiter Standard
owner: Codex
status: abgeschlossen
created: 2026-05-13
goal: >
  HRM-Betriebsfreigaben von Compliance-Cockpit zu gefuehrter Arbeitsflaeche
  ausbauen und daraus einen repo-weiten UX-Exzellenzstandard fuer alle Domaenen
  ableiten.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/HRM-GO-LIVE-UX-001.yaml
  - packages/frontend-web/src/pages/personal/hrm-operations-gates.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
  - docs/project-context/open-gaps-and-known-issues.md
acceptance_criteria:
  - HRM-Seite bietet Rollenfokus, Gate-Aufgabenplan und Vorlage-Link je Gate.
  - Nachweis-, Test- und Freigabe-Schritte sind als gefuehrter Arbeitsablauf sichtbar.
  - Audit-Zeitleiste und Management-Entscheidungsbild sind sichtbar.
  - Repo-weiter UX-Standard uebertraegt diese Muster auf alle Domaenen.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/project-context/open-gaps-and-known-issues.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/HRM-GO-LIVE-UX-001.yaml
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - git diff --check
done:
  - HRM-Betriebsfreigaben um Rollenfokus, Management-Entscheidungsbild, Vorlage-Link je Gate, Aufgabenplan und Audit-Zeitleiste erweitert.
  - Nachweis- und Testeingaben nutzen gate-spezifische Auswahllisten statt generischer Freitextfelder.
  - UX-Exzellenzstandard fuer alle Domaenen dokumentiert.
  - Open-Gaps-Doku verweist auf den neuen UX-Standard.
risks:
  - Vollstaendige Ueberarbeitung aller Domaenen bleibt ein Rollout-Programm; dieser Slice liefert Referenzumsetzung und verbindlichen Standard.
