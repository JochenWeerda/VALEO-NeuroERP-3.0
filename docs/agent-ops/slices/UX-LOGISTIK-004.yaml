id: UX-LOGISTIK-004
title: Hofliste und Waagenliste mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-15
goal: >
  Hofliste und Waagenliste auf den UX-Exzellenzbaukasten ziehen: Rollenfokus,
  Prioritaetsplan, Stopperentscheidung, Next Action und CRUD-/Nachweis-Abdeckung.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-LOGISTIK-004.yaml
  - packages/frontend-web/src/pages/waage/hofliste.tsx
  - packages/frontend-web/src/pages/waage/liste.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Hofliste und Waagenliste zeigen Rollenfokus fuer Waage, Hof, Disposition, QS und Leitung.
  - Prioritaetsplan fuehrt offene Vorgange, Eichung, Suche und naechste Aktion.
  - Stopperentscheidung zeigt arbeitsfaehig/blockiert.
  - CRUD-/Nachweis-Abdeckung ist sichtbar.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-LOGISTIK-004.yaml
  - git diff --check
done:
  - Hofliste um Rollenfokus, Hof-Prioritaetsplan, Stopperentscheidung, Next Action und CRUD-/Nachweis-Abdeckung ergaenzt.
  - Waagenliste um Rollenfokus, Waagen-Prioritaetsplan, Stopperentscheidung, Next Action und CRUD-/Nachweis-Abdeckung ergaenzt.
  - Bestehende Hotkeys, Tabellen, Anlage, Zweit-Wiegung, Suche, Export, OperationalCaseHeader und Kettenkontext bleiben erhalten.
risks:
  - Waage-Hardware- und Echtzeit-Sensorik bleiben ausserhalb dieses Slice.
