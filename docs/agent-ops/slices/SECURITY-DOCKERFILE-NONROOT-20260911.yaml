slice_id: SECURITY-DOCKERFILE-NONROOT-20260911
id: SECURITY-DOCKERFILE-NONROOT-20260911
title: Dienst-Container auf Nicht-Root-Betrieb umstellen (DS-0002, DS-0029)
owner: Claude Code
status: abgeschlossen
created_at: "2026-09-11"
started_at: "2026-09-11"
completed_at: "2026-09-11"
goal: >-
  Die groessten HIGH-Bloecke der Security-Triage schliessen: 25 Dockerfiles
  liefen als root (DS-0002), 13 installierten Pakete ohne
  --no-install-recommends (DS-0029).
coordination: >-
  Aus dem ungeclaimten HIGH-Bestand uebernommen. Die Dependency-Befunde
  derselben Triage (cryptography 4x2, image-size) bleiben bei Cursor, ebenso
  Dockerfile.backend und Dockerfile.frontend aus SECURITY-REMAINDER. Diese
  Dateien wurden nicht angefasst.
file_ownership:
  - docs/agent-ops/slices/SECURITY-DOCKERFILE-NONROOT-20260911.yaml
  - "25 Dockerfiles unter services/ und rationsoptimierung/"
  - "docs/agent-ops/active-workboard.md: nur der eigene Abschnitt"
befund:
  ds_0002: "25 Dateien, Container liefen als root"
  ds_0029: "13 Dateien, apt-get install ohne --no-install-recommends"
  basis: "einheitlich python:3.11-slim, daher groupadd/useradd ueberall verfuegbar"
umsetzung:
  benutzer: >-
    Systembenutzer appuser mit fester uid/gid 1000, angelegt erst unmittelbar
    vor CMD/ENTRYPOINT. Damit behalten apt, pip und chmod ihre Root-Rechte,
    und /app gehoert anschliessend dem Dienstbenutzer, sodass Schreibpfade
    weiter funktionieren.
  werkzeug: >-
    Transformationsskript mit Selbsttest ueber drei Musterfaelle: beide Regeln
    gemeinsam, bereits sauberer Stand (unveraendert), und die
    ENTRYPOINT-Variante mit vorangehendem HEALTHCHECK. Letzteres war noetig,
    weil eine naive Suche nach CMD sonst in 'HEALTHCHECK CMD' greift.
  ausgenommen:
    - >-
      docs/_internal/archive/swarm/Dockerfile.ui-explorer bleibt unveraendert.
      Das Archiv wird nicht gebaut und nicht ausgeliefert; eine Haertung dort
      waere Kosmetik. Der Befund bleibt sichtbar statt unterdrueckt.
nachweis:
  bau: "services/crm-core (Entrypoint plus Migrationen) baut erfolgreich"
  laufzeit:
    - "id im Container: uid=1000(appuser) gid=1000(appuser) - nicht mehr root"
    - "/app gehoert appuser, Schreibzugriff bestaetigt"
    - "docker-entrypoint.sh weiterhin ausfuehrbar"
    - "python -c 'import app, main' laeuft"
  scanner: >-
    trivy config --severity HIGH,CRITICAL ueber services/: DS-0002 und DS-0029
    je 0 verbleibend, gesamt 0 HIGH/CRITICAL-Fehlkonfigurationen.
fremdbefund_nicht_behoben:
  datei: services/ai/requirements.txt
  befund: >-
    services/ai laesst sich ueberhaupt nicht bauen: starlette==1.3.1 ist gepinnt,
    fastapi 0.121.3 verlangt aber starlette<0.51.0,>=0.40.0 - ResolutionImpossible.
    Der Dienst steht in docker-compose.yml, ist also nominell in Betrieb.
  zuordnung: >-
    Gegen den unveraenderten Stand aus HEAD gegengeprueft: der Fehler besteht
    unabhaengig von diesem Slice. Die Datei gehoert zu Cursors Dependency-Welle
    und wurde nicht angefasst; der Befund ist im Workboard an Cursor gemeldet.
acceptance:
  - DS-0002 und DS-0029 unter services/ auf 0.
  - Mindestens ein repraesentativer Container gebaut und als Nicht-Root laufend belegt.
  - Keine Datei aus fremdem Dateibesitz angefasst.
tests:
  - "docker build -f services/crm-core/Dockerfile"
  - "docker run: id, Schreibzugriff, Entrypoint, Importe"
  - "trivy config --severity HIGH,CRITICAL services/"
risks:
  - >-
    Ein Dienst, der zur Laufzeit ausserhalb von /app schreibt oder einen Port
    unter 1024 bindet, braucht eine eigene Anpassung. Geprueft: alle betroffenen
    Dienste binden Ports ab 5000 und schreiben unterhalb von /app.
  - >-
    Host-Mounts mit abweichender Eigentuemerschaft koennen Schreibzugriffe
    verhindern. Die Compose-Mounts der betroffenen Dienste sind lesend.
external_gates:
  - >-
    Ein Lauf der gesamten Compose-Landschaft gegen echte Abhaengigkeiten ist
    hier nicht vorweggenommen; services/ai ist bis zur Aufloesung des
    starlette-Konflikts ohnehin nicht baubar.
ai_harness:
  fachlicher_vertrag: >-
    Dienst-Container laufen ohne Root-Rechte; ein Ausbruch aus dem Container
    trifft damit nicht unmittelbar auf root.
  architektur_vertrag: >-
    Einheitliches Muster ueber alle Dienste: appuser mit uid/gid 1000, Wechsel
    erst nach allen privilegierten Bauschritten.
  daten_vertrag: "Keine Migration, keine Datenmutation."
  test_vertrag: >-
    Bau und Laufzeitprobe an einem repraesentativen Dienst, Scannerlauf ueber
    den gesamten Ordner.
  security_vertrag: >-
    Keine Ausnahme, keine Unterdrueckung. Die Befunde verschwinden, weil die
    Ursache behoben ist.
  betriebs_vertrag: >-
    Bestehende Container muessen neu gebaut werden, damit die Aenderung wirkt.
  dokumentations_vertrag: >-
    Fremdbefund an services/ai ist benannt und zugeordnet statt stillschweigend
    mitbehoben.
verification:
  - "trivy config --severity HIGH,CRITICAL services/"

nachtrag_kubernetes:
  slice_erweiterung: "KSV-0118 (4x) und KSV-0014 (4x) in fuenf Manifesten unter k8s/"
  relevanz: >-
    Die Manifeste werden von deploy-staging.yml und superglue-deploy.yml
    ausgerollt, sind also echte Infrastruktur und keine Ablage.
  empirische_grundlage: >-
    readOnlyRootFilesystem wurde nicht auf Verdacht gesetzt, sondern je Image
    mit 'docker run --read-only' nachgestellt. Postgres 15 scheitert dabei ohne
    Zusatzpfade mit 'could not create lock file
    /var/run/postgresql/.s.PGSQL.5432.lock: Read-only file system' und startet
    erst mit beschreibbarem /var/run/postgresql und /tmp. MinIO dagegen startet
    schreibgeschuetzt ohne jeden Zusatzpfad. Ein pauschales Setzen haette die
    Datenbank lahmgelegt.
  aenderungen:
    - "postgres-statefulset: Pod-Kontext uid/gid 999, readOnlyRootFilesystem, emptyDir fuer /var/run/postgresql und /tmp"
    - "minio-statefulset: Pod-Kontext uid/gid 1000, readOnlyRootFilesystem ohne Zusatzpfade"
    - "superglue-deployment: Container-Kontext plus emptyDir /tmp; Zustand bleibt im PVC"
    - "base/deployment: Pod-Ebene ergaenzt, der Container war bereits gehaertet"
    - "valeo-neuroerp-deployment: Pod-Ebene, Container-Kontext fuer valeo-domains"
  nebenbefund_behoben:
    datei: k8s/valeo-neuroerp-deployment.yaml
    befund: >-
      Dem Manifest fehlte die volumes-Sektion vollstaendig, obwohl die Container
      shared-config und logs-volume einhaengen. In dieser Form haette der Pod
      nicht starten koennen ('volume not found').
    annahme: >-
      shared-config verweist jetzt auf valeo-neuroerp-config, die einzige
      ConfigMap dieses Manifests. Falls eine andere gemeint war, bitte
      korrigieren - die Annahme ist im Manifest als Kommentar vermerkt.
  nachweis_k8s:
    - "alle fuenf Manifeste als YAML gueltig geparst"
    - "trivy config --severity HIGH,CRITICAL ueber k8s/: 0 Befunde, KSV-0118 und KSV-0014 je 0"
