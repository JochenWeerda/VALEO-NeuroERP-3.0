  - "pytest -m unit tests/test_semantic_e2e_matrix_001.py → alle 41 Tests grün."
  - "O2CChain: 10 Tests (happy path + Negativ-Szenarien)."
  - "P2PChain: 8 Tests inkl. Preisabweichungs-Toleranz (2 %-Grenze)."
  - "FiBuChain: 11 Tests inkl. optionalem Periodenabschluss-Schritt."
  - "WMSAgrChain: 9 Tests inkl. Silo-Überfüllungs-Check und QS-Status-Whitelist."
  - "InvariantViolationsReport: 3 Cross-Chain-Tests."
