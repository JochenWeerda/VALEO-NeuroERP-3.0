completion_evidence:
  - 2026-06-26 app/services/semantic_e2e_chain_service.py erstellt (4 Chain-Klassen)
  - 2026-06-26 tests/test_semantic_e2e_matrix_001.py erstellt (41 Tests in 5 Klassen)
covered_chains:
  - id: o2c-crm360
    steps: [kunde, angebot, auftrag, lieferschein, rechnung, zahlungseingang]
    key_invariants:
      - sales_order_id auf LS muss mit Auftrag-ID übereinstimmen
      - GoBD-Rechnungsnummer darf nicht None sein
      - OP muss auf "ausgeziffert" enden
  - id: p2p-procure-to-pay
    steps: [lieferant, bestellung, wareneingang, drei_wege_match, eingangsrechnung]
    key_invariants:
      - Preisabweichung im 3-Wege-Match max. 2 %
      - Kreditoren-OP muss bei Eingangsrechnung existieren
  - id: fibu-op-to-datev
    steps: [offener_posten, zahlung, auszifferung, (periodenabschluss), datev_export]
    key_invariants:
      - Ausgezifferter OP-Saldo exakt 0
      - DATEV-Export entry_count > 0 und file_path gesetzt
  - id: wms-agr-annahme-trace
    steps: [annahme, waage, lot, silozelle, qs_freigabe, traceability]
    key_invariants:
      - Silozelle darf capacity_kg nicht überschreiten
      - QS-Status muss in [freigegeben, gesperrt, bedingt]
      - Trace-Record verknüpft Lot mit Annahme und Silozelle
external_gates:
  - Fachliche Abnahme der Invarianzen durch Leiter Rechnungswesen (DATEV/GoBD-Teil).
  - WMS-QS-Status-Whitelist mit Qualitätssicherung abstimmen.
