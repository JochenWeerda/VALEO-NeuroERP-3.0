  P0.2 aus YouTube-Gap-Analyse 2026-06-23. Unabhängig von laufenden Cursor/Codex-Arbeiten.
  Keine DB-Session erforderlich; rein unit-basiert.
goal: >-
  Semantische Tests für 4 kritische Prozessketten die Business-Outcomes (Belegketten-
  verknüpfung, Salden-Invarianten, Status-Übergänge, GoBD-Felder) ohne reale DB prüfen.
  Differenz zu bestehenden API-Tests: KORREKTHEIT der Prozesskette (richtiger Beleg
  verknüpft? OP auf 0 ausgeziffert? 3-Wege-Match-Toleranz eingehalten?).
