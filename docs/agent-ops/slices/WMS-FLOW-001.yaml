acceptance:
  - silo_cells.current_stock_kg per Alembic (wms_material_flow_stock_link_20260619)
  - silo_cells.layout_x, layout_y, updated_at per Alembic (agri_silo_cells_layout_20260619)
  - POST /api/v1/lager/wms/agri/material-flow/transfer bucht out+in in inventory_stock_movements, aktualisiert current_stock_kg beider Zellen
  - validate_route (Kontamination/QS) wenn Knoten ref_type=silo_cell verknuepft; sonst ohne Routenpruefung
  - Supply-Chain-Hooks (WM-AGRI-CHAIN-002) vor commit in derselben Transaktion (material_transfer_booked, inventory.material_flow.transfer_booked)
  - Mobile-Sync kann Transfer buchen (mobile_sync_service → book_material_transfer)
  - Frontend lager/materialfluss Transfer-Card (Von/Nach-Zelle, kg, Artikel, Lot, Referenz, Ergebnis-JSON); Silozellen-Tabelle Ist kg / Kap. kg
  - Unit-Test test_transfer_commits_after_trace_hooks gruen
tests:
  - pytest tests/test_agri_silo_material_flow.py
  - pytest tests/test_p0_integration_slices.py
risks:
  - "Buchung und Trace-/Supply-Chain-Hooks muessen in derselben Transaktion committen; Reihenfolge (Hooks vor commit) ist abgesichert durch test_transfer_commits_after_trace_hooks."
  - "Routenpruefung nur bei verknuepftem silo_cell-Knoten aktiv; fehlende Verknuepfung umgeht QS-/Kontaminationspruefung bewusst."
ai_harness:
  fachlicher_vertrag: >-
    Materialtransfers zwischen Silozellen sind bestandswirksam, nachvollziehbar
    und beruecksichtigen QS-/Kontaminationsregeln.
  architektur_vertrag: >-
    Transfer-Service bucht out/in in inventory_stock_movements, aktualisiert
    current_stock_kg und triggert Supply-Chain- sowie Trace-Hooks vor dem Commit
    in einer DB-Transaktion. API, Mobile-Sync und Frontend nutzen denselben
    Service.
  daten_vertrag: >-
    silo_cells.current_stock_kg/layout_x/layout_y/updated_at (Alembic),
    inventory_stock_movements (out/in). Mandantenbezug bleibt erhalten.
  test_vertrag: >-
    pytest test_agri_silo_material_flow + test_p0_integration_slices;
    insbesondere test_transfer_commits_after_trace_hooks.
  security_vertrag: >-
    Buchung nur ueber autorisierte Endpoints/Scopes; Mandantentrennung gewahrt;
    keine Bestandsmanipulation ausserhalb der Service-Transaktion.
  betriebs_vertrag: >-
    Bestandsaenderungen sind ueber inventory_stock_movements auditierbar;
    Events material_transfer_booked / inventory.material_flow.transfer_booked
    fuer nachgelagerte Verarbeitung.
  dokumentations_vertrag: >-
    Workflow-Doku (wm-agri-silo-supply-chain-integration) und warehouse/README
    beschreiben den Transfer; Open-Gaps aktualisiert.
external_gates:
  - Keine externe Abnahme.
open_after_flow:
  - WM-AGRI-LOT-LINK automatischer Lot-/Bestands-Sync silo_lots ↔ silo_cells
  - Leitstand/Simulation Live-Zustaende auf dem Graph (WM-AGRI-FLOW-002)
