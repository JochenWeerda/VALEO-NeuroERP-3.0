title: Silo-Materialtransfer mit Lagerbuchung (Silozelle → inventory_stock_movements)
owner: Cursor
status: erledigt
updated: 2026-06-19
completed_at: 2026-06-19
goal: >-
  Silo-Materialtransfers zwischen Zellen als echte Lagerbuchung abbilden:
  Out-/In-Bewegung in inventory_stock_movements, Aktualisierung von
  current_stock_kg beider Zellen, Routen-/QS-Pruefung sowie Supply-Chain- und
  Mobile-Sync-Anbindung in einer Transaktion.
