    feed_actual_measures_20260716 — bei Umbenennung dort muss down_revision
    nachziehen (bewusst dokumentiert, Single-Head-Regel)."
  - "Strukturierte Bewertung/Empfehlung und Massnahmen-Verknuepfung folgen
    in FEED-CONS-032; Beratungsbericht in FEED-REP-040."
external_gates: not_applicable
ai_harness:
  fachlicher_vertrag: >-
    Beratungsdokumentation ist chronologisch, unveraenderlich und
    nachvollziehbar; mobile Erfassung verliert nichts und dupliziert nichts.
  architektur_vertrag: >-
    Neues Aggregat dockt additiv an Betriebe/Gruppen/Rationen an; Meridian-
    Grundmuster (Worklist+Detail) ohne zweite UI-Welt; Rollen aus authz.
  daten_vertrag: >-
    Additive Migration; Beobachtungen append-only per Trigger; Idempotenz
    ueber UNIQUE-Constraint statt Anwendungslogik allein.
  security_vertrag: >-
    WRITE fuer Mutationen, READ fuer Lesen; Tenant-Scope auf allen Pfaden;
    DMS-Referenzen ohne eigene Dateiannahme.
  betriebs_vertrag: >-
    Rollback = Revert + downgrade(); keine neuen Abhaengigkeiten.
  dokumentations_vertrag: >-
    Traceability FEED-CONS-001/FEED-MOB-001 fortgeschrieben; Workboard;
    dieses YAML.
  test_vertrag: >-
    TDD-Evidenz im YAML; Idempotenz-, Abschluss-, Tenant- und RBAC-Pfade
    getestet; Gates gruen.
