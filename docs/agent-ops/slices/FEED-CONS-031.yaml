slice_id: FEED-CONS-031
id: FEED-CONS-031
title: Beratungsfall und Beobachtungen mit idempotentem Mobil-Vertrag
owner: Claude
status: abgeschlossen
created_at: "2026-07-16"
started_at: "2026-07-16"
completed_at: "2026-07-16"
requirements: [FEED-CONS-001, FEED-MOB-001]
work_packages: [FEED-WP-171, FEED-WP-172]
decision_level: significant
dependencies: [FEED-CORE-015, FEED-CORE-016]
goal: >-
  Start Inkrement 5 gemaess Slice-Spec (FEED-SPEC-CONTINUATION-049): Berater
  dokumentieren Besuche/Remote-Beratungen als Faelle mit chronologischen,
  unveraenderlichen Beobachtungen (Kategorien, Freitext, DMS-Fotoreferenzen,
  fachliche Verknuepfungen) und schliessen sie mit Abschlussbewertung;
  der mobile Erfassungspfad ist gegen Doppel-Submit/Retry idempotent.
scope:
  - "Migration feed_consulting_20260716: consulting_cases (visit|remote,
    Betrieb-/Gruppenbezug, Status open|closed, Abschlussfelder) +
    consulting_observations (append-only per Trigger, photo_document_refs
    JSONB, optionale ration_id/analysis_ref/observation_date,
    UNIQUE tenant+case+client_ref als Idempotenzvertrag). Single-Head auf
    Codex' benannter 030-Revision verkettet."
  - "feeding_consulting_service.py: create/list/get/close; add_observation
    idempotent (gleiche client_ref -> dieselbe Beobachtung mit duplicate=true);
    geschlossene Faelle lehnen neue Beobachtungen ab
    (ConsultingCaseClosedError -> 409); Referenzpruefung Betrieb/Gruppe/Ration
    (404 statt Waisen)."
  - "API /feeding/consulting-cases (WRITE/READ-Rollen, typisierte Vertraege)."
  - "Frontend ConsultingCases (Worklist + Falldetail, Beobachtungserfassung
    mit Guard und crypto.randomUUID-client_ref, Abschluss mit Pflicht-Fazit,
    Lade-/Leer-/Fehlerzustaende) + Route futtermittel/beratung; responsives
    Layout = mobiler Pfad."
