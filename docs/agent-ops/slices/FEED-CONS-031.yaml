acceptance:
  - "Fall buendelt Beobachtungen chronologisch mit Herkunft (Akteur, Zeit)."
  - "Doppelte mobile Einreichung (gleiche client_ref) erzeugt keine Dublette
    und meldet duplicate=true."
  - "Abgeschlossene Faelle sind unveraenderlich fuer neue Beobachtungen (409);
    Abschluss verlangt ein Fazit."
  - "Fotos ausschliesslich als DMS-Referenzen (kein Upload-Bypass)."
tests:
  - "pytest test_feeding_consulting_api.py -> 6/6 (nach Red-Welle)."
  - "Vitest consulting-cases.test.tsx -> 3/3; tsc 0; eslint 0."
  - "Routen 904 + routing-Kette; Architecture Validate/Drift 904/904;
    Alembic Single-Head feed_consulting_20260716."
