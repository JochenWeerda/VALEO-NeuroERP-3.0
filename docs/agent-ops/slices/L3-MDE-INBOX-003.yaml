slice_id: L3-MDE-INBOX-003
id: L3-MDE-INBOX-003
title: MDE-Eingangskorb und Verarbeitung
owner: Codex
status: abgeschlossen
created_at: "2026-08-21"
started_at: "2026-08-21"
completed_at: "2026-08-21"
goal: >-
  Den vorhandenen Mobile-Sync-Kern als produktiven, herstellerneutralen
  MDE-Eingangskorb mit Quarantaene, Retry-Audit und nativer Meridian-Worklist
  bereitstellen.
architecture:
  decision_level: significant
  domains: [platform, inventory, agrar, logistics]
  canonical_ui_chain: ScreenDefinition -> RenderPlan -> useUniversalMaskRuntime -> UniversalMaskRenderer
scope:
  - Bestehende domain_ops.mobile_event_queue additiv haerten.
  - Payloads vor Persistenz fachlich validieren.
  - Serverseitige Pagination, Suche, Sortierung und Filter bereitstellen.
  - Fehler nach begrenzten Versuchen quarantinieren und auditiert wiederholen.
  - Native MDE-Worklist samt Navigation bereitstellen.
file_ownership:
  - app/services/mobile_sync_service.py
  - app/api/v1/endpoints/mobile_sync.py
  - app/core/screen_definitions.py
  - alembic/versions/mde_inbox_hardening_20260821.py
  - packages/frontend-web/src/pages/schnittstelle/mde-inbox.tsx
  - packages/frontend-web/src/app/navigation/domains/operations.tsx
  - packages/frontend-web/src/components/mask-builder/schema.ts
  - packages/frontend-web/src/components/mask-builder/render-plan/*
  - packages/frontend-web/src/components/mask-builder/renderers/FastTableRenderer.tsx
  - packages/frontend-web/src/components/mask-builder/UniversalMaskRenderer.tsx
  - packages/frontend-web/src/components/ui/VirtualDataTable.tsx
  - tests/test_mde_inbox.py
  - docs/architecture/domains/inventory/*
  - docs/adr/adr-057-mde-inbox-on-mobile-sync-core.md
  - docs/agent-ops/handoffs/l3-mde-inbox-003-impact-note.md
  - config/architecture-domain-prefixes.yaml
  - generated architecture and route inventories
  - workboard and open-gaps documentation
acceptance:
  - Tenant-Isolation on every queue read and mutation.
  - Duplicate device/idempotency keys return the existing event.
  - Invalid known payloads are rejected before persistence.
  - Three failed attempts move an event to quarantined.
  - Retry requires reason and appends an immutable audit row.
  - Worklist is native, generator-ready and server-paginated.
  - Backend, frontend, architecture, documentation and generated-handbook checks pass.
risks:
  - Existing devices must remain compatible with the additive response contract.
  - External device/provider field mapping remains a rollout gate.
result:
  - Native MDE-Worklist schnittstelle/mde-inbox is generator-ready and navigable.
  - Queue validation, idempotency, quarantine, retry reason and immutable audit are implemented.
  - 35 backend tests, 10 focused frontend tests and TypeScript passed.
  - Architecture, OpenAPI, ADR navigation and agent handbook drift checks passed.
