slice_id: WM-AGRI-QS-004
title: QS-Leitstand-UI fuer Silo-Lots und Silozellen
owner: Cursor
status: completed
created_at: 2026-06-23
coordination: >-
  Baut auf WM-AGRI-QS-003 (Backend qs-transition). Kein Ueberlapp mit DOM-LOG-004
  (Claude Code). Dateibesitz nur QS-Leitstand und Erweiterungen am QS-Workflow-Service.
goal: >-
  Operative Leitstands-UI fuer QS-Freigaben/Sperren mit Worklist, Vorschlagslogik
  fuer Produktionsfreigabe und Anbindung an Silo-Uebersicht/Materialfluss.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/WM-AGRI-QS-004.yaml
  - app/services/agri_qs_workflow_service.py
  - app/api/v1/endpoints/agri_qs_workflow.py
  - tests/test_agri_qs_workflow.py
  - packages/frontend-web/src/lib/api/agri-qs-workflow.ts
  - packages/frontend-web/src/pages/lager/qs-leitstand.tsx
  - packages/frontend-web/src/app/route-aliases.json
  - packages/frontend-web/src/app/navigation/domains/operations.tsx
  - packages/frontend-web/src/pages/lager/silo-uebersicht.tsx
  - docs/workflows/wm-agri-silo-supply-chain-integration-2026-06-13.md
  - docs/project-context/open-gaps-and-known-issues.md
acceptance:
  - GET /supply-chain/qs-worklist liefert Lots und Zellen mit handlungsbeduerftigem QS-Status.
  - GET /supply-chain/lots/{id}/qs-release-suggest liefert Freigabe-Vorschlag mit Blockern.
  - Leitstand-UI unter lager/qs-leitstand mit Freigabe/Sperre/Pruefung und Mutation-Guards.
  - Navigation und Route-Alias vorhanden; Unit-Tests fuer neue Service-Methoden gruen.
tests:
  - python -m pytest -q -o addopts= tests/test_agri_qs_workflow.py
  - pnpm --filter @valero-neuroerp/frontend-web exec tsc --noEmit
risks:
  - Ohne Labor-Stammdaten bleibt Freigabe manuell mit Ticket-Referenz als Probe.
  - Produktionsfreigabe-Regeln sind deterministischer Vertrag, kein ML.
ai_harness:
  fachlicher_vertrag: >-
    Operator sieht Lots/Zellen in Pruefung oder gesperrt; Freigabe erfordert Grund,
    Bediener und Laborbezug; Sperre fail-closed; Vorschlag aus Ticket/Lot-Daten.
  architektur_vertrag: >-
    Erweiterung WM-AGRI-QS-003 Service; duenner Router; React-Query Hooks;
    keine neue DB-Migration.
  daten_vertrag: >-
    Tenant-Scope; Read-Only Worklist; Mutation nur ueber bestehenden qs-transition.
  test_vertrag: >-
    Unit-Tests Worklist und Release-Suggest; Frontend Typecheck.
  security_vertrag: >-
    X-Tenant-ID Pflicht; QS-Wechsel nur mit Grund und Bediener.
  betriebs_vertrag: >-
    Worklist refetchInterval 30s; Fehler via toast sichtbar.
  dokumentations_vertrag: >-
    Workboard, Slice-YAML, Supply-Chain-Workflow und Open-Gaps aktualisiert.
external_gates:
  - not_applicable
