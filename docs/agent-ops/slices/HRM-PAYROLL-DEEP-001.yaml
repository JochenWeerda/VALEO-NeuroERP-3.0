  Uebergabedaten, FIBU-Buchungssaetze, externe Gates und Regressionstests.
file_ownership:
  - app/services/lohn_service.py
  - app/api/v1/endpoints/personal.py
  - tests/test_personal_payroll_deep.py
  - docs/project-context/hrm-payroll-deepening-2026-06-18.md
  - docs/project-context/open-gaps-and-known-issues.md
  - docs/agent-ops/active-workboard.md
acceptance:
  - Payroll-Berechnung liefert explizites Response-Modell statt falschem PersonalOut.
  - Monats-Closeout erzeugt Arbeitnehmer-/Arbeitgeberanteile und Netto.
  - DATEV-ASCII-Vertrag und FIBU-Uebergabe werden maschinenlesbar bereitgestellt.
  - Externe DATEV-/Steuerberater-/amtliche PAP-Gates bleiben sichtbar fail-closed.
  - Unit-Tests sichern Rechenvertrag, Exportvertrag und Gateway-Status.
risks:
  - Amtliche Lohnsteuer-PAP-Implementierung und DATEV-Zertifizierung bleiben externe Gates.
  - Produktive SV-/Steuerparameter muessen versioniert und fachlich freigegeben werden.
result: >-
  Payroll-Preview und Closeout-Vertrag umgesetzt: explizites API-Response-Modell,
  versionierte Parameter, AN-/AG-Anteile, Netto, Arbeitgeberkosten, DATEV-artige
  Vorlaufzeilen, FIBU-Buchungssaetze und externe Gate-Liste.
verification: >-
  python -m py_compile fuer Service/API/Tests gruen; direkte Python-Vertragschecks
  fuer Payroll-Service und Closeout gruen. Pytest-Harness haengt aktuell im
  bestehenden globalen Test-Setup und wurde nicht als Fachfehler des Slices gewertet.
