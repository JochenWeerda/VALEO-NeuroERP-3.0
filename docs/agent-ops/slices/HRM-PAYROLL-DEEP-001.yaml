slice_id: HRM-PAYROLL-DEEP-001
title: HRM Payroll Deepening - Closeout, DATEV-Vertrag, FIBU-Uebergabe
owner: Codex
status: completed
coordination: >-
  Eigenstaendiger HRM/Payroll-Slice. Kein Besitz an parallel dirty Dateien
  app/api/v1/api.py, app/services/scheduler_service.py, WF/STMD/Waage/XRechnung
  oder WM-AGRI-SILO-001.
goal: >-
  Lohnbuchhaltung von Payroll-Readiness zu einem pruefbaren Closeout-Vertrag
