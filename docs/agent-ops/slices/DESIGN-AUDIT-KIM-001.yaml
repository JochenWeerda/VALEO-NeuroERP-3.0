slice_id: DESIGN-AUDIT-KIM-001
id: DESIGN-AUDIT-KIM-001
title: Frontend-Design-Audit + Referenz-Pilot KIM-Cockpit (Register-Tabs)
owner: Claude
status: abgeschlossen
created_at: "2026-07-14"
started_at: "2026-07-14"
completed_at: "2026-07-14"
goal: >-
  Die Prinzipien des Frontend-Design-Skills auf das ERP-Frontend uebertragen:
  Bestandsaufnahme des Designsystems (Tokens/Themes/Density/Mask-Builder/
  Primitives), verbindliche Design-Regeln ableiten und eine Referenz-
  implementierung im fachlich dichtesten Pilotbereich (KIM-CRM-360-Cockpit)
  liefern - barrierearm (WCAG 2.2 AA), ohne Geschaeftslogik-, API- oder
  Routing-Aenderungen.
scope:
  - Zentrale Register-Variante fuer ui/tabs.tsx (Belegregister-Optik, ARIA-Tabs,
    Pfeiltasten, Fokusring) - rueckwaertskompatibel, Default-Look unveraendert.
  - KIM-Cockpit als Referenz - 12 Register auf echte Tabs, h1-Objektidentitaet,
    text-2xs statt text-[10px]-Arbitraries, Semantikfarbe nur mit Bedeutung.
  - Chef-Anweisungs-Auto-Save nach Mutation-Lifecycle-Invariante (Guard,
    disabled, aria-live, Erfolgs-Toast, finally-Reset, Unveraendert-Kurzschluss).
  - Storybook-Story + Vitest-Test fuer die Register-Variante.
  - Audit-Doku docs/design/frontend-design-skill-audit.md (Ist-Analyse, Regeln,
    A11y-/Performance-/Testergebnisse, Rollout-Plan); kompakter Design-Regeln-
    Bullet in CLAUDE.md.
