slice_id: L3-TANK-ADAPTER-013
id: L3-TANK-ADAPTER-013
title: Tankanlagen-Adapter und Fehlerkorb
owner: Codex
status: reserviert
created_at: "2026-08-21"
started_at: "2026-08-21"
goal: >-
  Tankanlagen-Datensaetze idempotent uebernehmen, pruefen, im Fehlerkorb
  bearbeiten und regelbasiert an Zapfung/Lieferschein uebergeben.
architecture:
  decision_level: significant
  domains: [agrar, inventory, sales]
  canonical_ui_chain: ScreenDefinition -> RenderPlan -> useUniversalMaskRuntime -> UniversalMaskRenderer
scope:
  - Adaptereingang mit Tenant, Quelle, External-ID und Payload-Hash.
  - Validierung und sichtbarer Fehlerkorb mit Retry.
  - Einzelnachweis und idempotente Zapfungsuebernahme.
  - Regelbasierter Lieferschein-Outbox-Handover.
file_ownership:
  - app/services/tank_adapter_service.py
  - app/api/v1/endpoints/tank_adapter.py
  - alembic/versions/tank_adapter_20260821.py
  - app/core/screen_definitions.py
  - packages/frontend-web/src/pages/tankstelle/adapter-inbox.tsx
  - tests/test_tank_adapter.py
  - generated artifacts, ADR, domain packs, gap docs and workboard
acceptance:
  - Idempotenz je Tenant/Adapter/External-ID.
  - Validierung, Fehlerstatus, begruendeter Retry und Payload-Nachweis.
  - Genau eine kanonische Zapfung je Eingang.
  - Regelentscheidung und idempotenter Sales-Outbox-Handover.
  - Native generator-ready Worklist und gruene Gates.
risks:
  - Reale Anlagenprotokolle und produktiver Sales-Outbox-Consumer bleiben externe Gates.
