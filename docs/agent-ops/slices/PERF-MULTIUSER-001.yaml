slice_id: PERF-MULTIUSER-001
title: "Multi-User-Performance: Middleware-Stack auf pure ASGI + Request-Logging entschlacken"
owner: Cursor
status: in arbeit
created_at: 2026-06-25
coordination: >-
  Optimiert ausschliesslich den HTTP-Request-Hotpath (Middleware + Logging) in
  main.py und app/middleware/*. Kein Eingriff in Fachlogik, Auth-Semantik,
  Alembic, Frontend-Routing oder andere Slice-YAMLs. Die Bearer-Token-Middleware
  bleibt als Funktion erhalten (Auth-Korrektheit > Mikro-Optimierung).
goal: >-
  Latenz und CPU-Last pro Request unter Multi-User-Last senken, indem die vier
  reinen Response-/Context-Middleware (Prometheus, Correlation, SecurityHeaders,
  Audit) von Starlette BaseHTTPMiddleware auf reine ASGI-Middleware umgestellt
  werden und das Per-Request-Logging auf Slow-Requests + Fehler reduziert wird.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/PERF-MULTIUSER-001.yaml
  - docs/workflows/perf-multiuser-001-middleware-asgi-2026-06-25.md
  - app/middleware/metrics.py
  - app/middleware/correlation.py
  - app/middleware/security_headers.py
  - app/middleware/audit_middleware.py
  - main.py
  - scripts/benchmark_middleware_stack.py
  - tests/test_middleware_asgi.py
not_owned:
  - app/core/security.py
  - app/middleware/tenant_enforcement.py
  - alembic/**
  - packages/frontend-web/**
acceptance_criteria:
  - Prometheus-, Correlation-, SecurityHeaders- und Audit-Middleware laufen als reine ASGI-Middleware (kein BaseHTTPMiddleware mehr).
  - Response-Header (X-Correlation-ID, Security-Header) und Prometheus-Metriken bleiben identisch zum Vorzustand.
  - Audit-Logging erfasst weiterhin nur mutierende Methoden (POST/PUT/PATCH/DELETE) mit Status, User, Tenant, Dauer.
  - Per-Request-Logging schreibt im Normalfall kein INFO-Doppel-Log mehr; nur Slow-Requests (> Schwelle) und Fehler werden geloggt.
  - Micro-Benchmark belegt geringere Stack-Overhead-Latenz nach dem Umbau (Report im Workflow-Doc).
  - Bestehende Middleware-Tests (Security-Header, Correlation, Tenant-Enforcement, Audit) bleiben gruen.
tests:
  - python -m py_compile main.py app/middleware/metrics.py app/middleware/correlation.py app/middleware/security_headers.py app/middleware/audit_middleware.py
  - pytest -q -o addopts= tests/test_middleware_asgi.py
  - python scripts/benchmark_middleware_stack.py
ai_harness:
  fachlicher_vertrag: >-
    Endnutzer im Multi-User-Betrieb sollen schnellere Antwortzeiten erleben.
    Sicht- und Audit-Verhalten (Security-Header, Correlation-ID, Audit-Trail
    fuer Mutationen) bleibt fachlich unveraendert.
  architektur_vertrag: >-
    Reine ASGI-Middleware (scope/receive/send) ersetzt BaseHTTPMiddleware fuer
    die vier zustandsarmen Response-/Context-Schichten. Reihenfolge und
    Wirkung der Middleware bleiben erhalten. Bearer-Auth bleibt Funktion.
  daten_vertrag: >-
    Keine neuen persistenten Daten. Correlation-ID, Tenant-ID und Audit-Felder
    werden weiterhin aus Headern/Request-State/Scope abgeleitet.
  test_vertrag: >-
    Unit-Tests verifizieren Security-Header, Correlation-ID-Roundtrip,
    Audit-Logging nur bei Mutationen und Status-Capture. Micro-Benchmark als
    reproduzierbares Skript.
  security_vertrag: >-
    Keine Abschwaechung von Auth, Tenant-Isolation, Security-Headern oder
    Audit. PII-Redaction im Logging bleibt aktiv. Bearer-Token-Enforcement
    unveraendert.
  betriebs_vertrag: >-
    Fail-safe: Middleware-Fehler duerfen Requests nicht verschlucken.
    Reduziertes Logging behaelt Fehler- und Slow-Request-Sichtbarkeit.
  dokumentations_vertrag: >-
    Workflow-Doc mit Vorher/Nachher-Benchmark, umgestellten Middleware,
    Begruendung fuer Bearer-Ausnahme und Betriebshinweisen.
external_gates:
  - Keine externe Abnahme erforderlich; rein interne Hotpath-Optimierung.
risks:
  - "BaseHTTPMiddleware→ASGI-Umbau kann Response-Header/Status-Capture subtil aendern; durch Tests abgesichert."
  - "request.state-Zugriff in ASGI-Schicht haengt von scope[state]; Audit liest defensiv mit Header-Fallback."
  - "Reduziertes Logging darf Debugging nicht verschlechtern; Slow-Request-Schwelle konfigurierbar dokumentiert."
verification:
  - python -m py_compile main.py app/middleware/metrics.py app/middleware/correlation.py app/middleware/security_headers.py app/middleware/audit_middleware.py
  - pytest -q -o addopts= tests/test_middleware_asgi.py
  - python scripts/benchmark_middleware_stack.py
