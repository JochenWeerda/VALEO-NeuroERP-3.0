acceptance:
  - Bestehendes futtermittel_einzelfutter ist der Feed-Kopf; keine parallele Stammdatenwelt.
  - Flexible Referenzwerte verweisen auf NutrientDefinition, Einheit, Basis, Herkunft und Gueltigkeit.
  - Produkte bilden Lieferant, Gebinde, Preis, Mindestabnahme und Gueltigkeit ab.
  - Aenderungen sind optimistisch versioniert und append-only auditierbar.
  - Adapter erzeugt aus persistierten Werten einen zum bestehenden Solver-Feed aequivalenten Vertrag.
  - API ist tenant-/rollen-sicher; native ObjectPage nutzt ausschliesslich die Meridian-Runtime.
  - Migration backfillt vorhandene Feed-Zeilen additiv und bleibt Single-Head.
tdd:
  red:
    - Domain-/Migrationsvertrag und Golden-Aequivalenz des Solveradapters.
    - Create/Get/Update/History/Product/ReferenceValue und Tenant-/RBAC-Tests.
    - Native ObjectPage-, Component- und Route-Vertraege.
  green: kleinste additive Feed-Katalogstrecke auf dem vorhandenen Stamm
  refactor: Legacyfelder nur im Adapter kapseln und keine zweite UI-Architektur
tests:
  - tests/test_feeding_feed_catalog.py
  - tests/test_feeding_feed_catalog_api.py
  - packages/frontend-web/src/__tests__/features/feed-advice/feeding-feed-detail.test.tsx
risks:
  - Bestehende CRUD-Konsumenten duerfen durch additive Felder nicht brechen.
  - Legacy-Naehrstofffelder und flexible Werte muessen bis zur Vollmigration deterministisch priorisiert werden.
