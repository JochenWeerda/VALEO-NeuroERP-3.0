  Den bestehenden Einzelfuttermittelstamm ohne Doppelmodell zu einem versionierten,
  solverfaehigen Feed-Aggregat mit Produkten, flexiblen Referenzwerten, Herkunft
  und nativer ObjectPage ausbauen.
