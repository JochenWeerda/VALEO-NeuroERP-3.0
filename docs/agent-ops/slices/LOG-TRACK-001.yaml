slice_id: LOG-TRACK-001
title: "Logistik Track & Trace / ePOD: tour_events, GPS-Live, ePOD-Settlement"
priority: P2
owner: Claude Code
status: abgeschlossen
created: "2026-06-26"

goal: >
  Gap-Verifikation 2026-06-26: Track & Trace und ePOD bereits vollstaendig implementiert.
  domain_logistics.tour_events Tabelle (Alembic log_logistics_core_20260612),
  POST /logistik/tours/{id}/events, GET .../events, GET .../gps-track,
  GET/PATCH .../epod, POST .../stops/{stop_id}/epod-settle (DOM-LOG-004.3).
  logistics_epod_service.py kapselt ePOD-Lifecycle. Kein weiterer Code-Aufwand.

ai_harness:
  fachlicher_vertrag:
    - POST /api/v1/logistik/tours/{id}/events schreibt GPS-/Status-Event.
    - GET /api/v1/logistik/tours/{id}/gps-track liefert Koordinaten-Liste.
    - GET + PATCH /api/v1/logistik/tours/{id}/epod steuert Ablieferungsbeleg.
    - POST /api/v1/logistik/tours/{id}/stops/{stop_id}/epod-settle schliesst Stop ab.
  architekturvertrag:
    - Alembic-Migration log_logistics_core_20260612 legt domain_logistics.tour_events an.
    - logistics_epod_service.py kapselt Lifecycle-Constraints.
  akzeptanzkriterien:
    - Endpoints vorhanden (Code-Nachweis 2026-06-26).

dateibesitz:
  - app/api/v1/endpoints/logistics_tours.py
  - app/services/logistics_epod_service.py
  - alembic/versions/log_logistics_core_20260612.py
  - docs/agent-ops/slices/LOG-TRACK-001.yaml
