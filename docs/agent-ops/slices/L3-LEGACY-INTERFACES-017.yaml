title: Standard- und Unimet-Adapterrahmen
owner: Codex
status: abgeschlossen
created_at: "2026-08-21"
started_at: "2026-08-21"
completed_at: "2026-08-21"
goal: >-
  Die repo-seitigen Format-, Mapping-, Idempotenz-, Fehlerkorb-,
  Reconciliation- und Monitoring-Vertraege fuer L3 Standard und Unimet
  produktionssicher bereitzustellen, ohne unbekannte Kundenformate zu erfinden.
architecture:
  decision_level: significant
  domains: [integration, finance, inventory, agrar]
  canonical_ui_chain: ScreenDefinition -> RenderPlan -> useUniversalMaskRuntime -> UniversalMaskRenderer
scope:
  - Inaktive, versionierte Adapterprofile l3_standard und unimet.
  - Hashgebundener, idempotenter Intake mit Mapping-Version und Quarantaene.
  - Dry-run-Verarbeitung in kanonische Staging-Records ohne Domaenenbuchung.
  - Reconciliation, Freigabe-Gate und Betriebsmonitor als native Worklist.
file_ownership:
  - app/services/legacy_interface_adapter_service.py
  - app/api/v1/endpoints/legacy_interface_adapters.py
  - alembic/versions/l3_legacy_interfaces_20260821.py
  - zentrale ScreenDefinition, Navigation, Route und Tests
  - generated artifacts, ADR, integration domain documentation, gap docs and workboard
acceptance:
  - Keine produktive Aktivierung ohne Kundenformat, Mapping und fachliche Freigabe.
  - Tenant-/Profil-/externe-ID-Idempotenz mit Payload-Konflikterkennung.
  - Fehlerkorb, Retry, Staging und Reconciliation sind auditiert.
  - Monitoring zeigt Profil-, Batch-, Fehler- und Abstimmstatus.
  - Native generator-ready Worklist und gruene Gates.
risks:
  - Reale Feldlayouts und Zielbuchungen bleiben bis zur Kundenentscheidung externe Gates.
