id: KUNDENSTAMM-KONSOLIDIERUNG-001
title: Kundenstamm-Konsolidierung — Business Partner als System of Record
owner: Claude
status: abgeschlossen
claimed_at: 2026-06-01
completed_at: 2026-06-02
goal: >
  Die parallelen Kunden-Wahrheiten auf einen fuehrenden Business Partner (SoR)
  konsolidieren: public.kunden ueber business_partner_id an die BP-Identitaet
  binden, den 83-Spalten-Monolithen in schlanke Domaenensatelliten zerlegen,
  Konsumenten ueber die kanonische Zugriffsschicht lesen lassen und die
  Prod-Ausfuehrung (Bruecke fuellen, FK, Altspalten-Drop) per Runbook vorbereiten.
scope:
