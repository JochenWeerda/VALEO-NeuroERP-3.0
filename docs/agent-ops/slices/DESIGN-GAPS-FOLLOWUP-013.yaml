slice_id: DESIGN-GAPS-FOLLOWUP-013
id: DESIGN-GAPS-FOLLOWUP-013
title: "§8-Nachzug: Toast-Konsolidierung auf sonner, gezielter text-*-400-Sweep, patterns-Teilschritt"
owner: Claude
status: abgeschlossen
created_at: "2026-07-15"
started_at: "2026-07-15"
completed_at: "2026-07-15"
goal: >-
  Die nach DESIGN-CHARTS-TOKEN-006 verbliebenen autonom machbaren Punkte aus
  docs/design/frontend-design-skill-audit.md Abschnitt 8 schliessen:
  (a) drei koexistierende Toast-Systeme auf einen Renderer konsolidieren,
  (b) den bewusst zurueckgestellten text-*-400-Nachzug gezielt (nicht
  mechanisch) durchfuehren, (c) den gefahrlos moeglichen Teil der
  patterns/-Konsolidierung umsetzen und das Rest-Inventar dokumentieren.
scope:
  - "Toast: sonner ist einziger Renderer (ToastBootstrap mountet nur noch
    SonnerToaster). hooks/use-toast (shadcn-API, 255 Aufrufer) und
    ui/toast-provider push() (42 Aufrufer) delegieren intern an sonner —
    API unveraendert, Modul-Mocks in Tests bleiben gueltig. toast.warning ist
    jetzt echte Warnung (war destructive), Toasts stapeln (TOAST_LIMIT 1
    entfiel), action-ReactNode wird durchgereicht (payment-matching).
    Geloescht: ui/toaster.tsx, ui/toast.tsx, ui/ToastHost.tsx (referenzlos),
    doppelter lokaler Toaster-Mount im KIM-Cockpit."
  - "text-*-400: 19 Treffer einzeln bewertet. Fixes: Kontrastbug
    LstKontraktUebersicht GELOESCHT (red-400 auf red-50 ~2,5:1 -> muted +
    line-through); redundante dark:text-*-400-Overrides ueber text-status-*
    entfernt (einstellungen/system, lager/silo-uebersicht,
    FeldblockfinderIntegration); text-[11px] -> text-2xs (FlowSpineWorkspace).
    Bewusst belassen: 400er auf lokal dunklen Spezialflaechen (FlowSpine
    slate-950, Solver), Rating-Sterne (Zustand via fill), theme-korrekte
    Chip-Paare *-700/dark:*-400."
  - "patterns: patterns/OverviewPage + Story entfernt (einziger Referent war
    die eigene Story; Seiten nutzen mask-builder/OverviewPage). Rest-Inventar
    dokumentiert (Wizard 22, PageSurface ~10, ListReport 3, ObjectPage 2
    Seiten) — Migration je Maske bleibt Grossvorhaben der
    Universal-Mask-Promotion."
  - "Token-Quellen-Konsolidierung (Punkt 7) bewusst NICHT angefasst:
    blockiert auf Codex-Koordination (TW4-PILOT-Dateibesitz an
    index.css/src/styles)."
