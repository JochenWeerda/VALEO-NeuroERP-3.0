slice_id: WF-COCKPIT-PERSIST-001
title: "Workflow-Cockpit DB-Persistenz + NATS-Projector"
owner: dev
status: completed
created_at: "2026-06-25"
closed_at: "2026-06-25"
goal: >-
  Persistente DB-Tabellen fuer das Workflow-Cockpit im Schema domain_workflow
  bereitstellen und Live-Projektion aus NATS-Events in Cockpit-Instanzen,
  Events und Blocker abbilden.
file_ownership:
  - alembic/versions/wf_cockpit_persist_20260625.py
  - app/services/wf_cockpit_persist_service.py
  - app/services/wf_cockpit_nats_projector.py
  - app/api/v1/endpoints/wf_cockpit_persist.py
  - tests/test_wf_cockpit_persist.py
  - docs/agent-ops/slices/WF-COCKPIT-PERSIST-001.yaml
acceptance:
  - Alembic-Migration erstellt wf_cockpit_instances, wf_cockpit_events und wf_cockpit_blockers.
  - Cockpit-DB-Endpunkte liefern tenantisolierte Instanzlisten, Detailansicht und Dead-Letter-Sicht.
  - Blocker koennen resolviert werden und NATS-Abwesenheit wird fail-soft geloggt.
tests:
  - python -m py_compile app/services/wf_cockpit_persist_service.py app/services/wf_cockpit_nats_projector.py app/api/v1/endpoints/wf_cockpit_persist.py
  - pytest -q -o addopts= tests/test_wf_cockpit_persist.py
risks:
  - NATS muss fuer Live-Projektion verfuegbar sein; ohne NATS bleibt nur persistierte REST-Sicht.
  - Projector-Kompatibilitaet haengt von stabilen workflow.* und domain.* Event-Payloads ab.
external_gates:
  - not_applicable
ai_harness:
  fachlicher_vertrag: >-
    Operatoren sehen persistente Workflow-Instanzen, Ereignisse und offene
    Blocker auch nach Neustarts und koennen Dead-Letter-Faelle nachvollziehen.
  architektur_vertrag: >-
    SQLAlchemy-Core-Service schreibt in domain_workflow; separater NATS-Projector
    konsumiert workflow.> und domain.>. REST-Endpunkte bleiben tenantisoliert.
  daten_vertrag: >-
    Persistierte Tabellen: wf_cockpit_instances, wf_cockpit_events,
    wf_cockpit_blockers mit Tenant-, Status-, Event- und Blockerfeldern.
  test_vertrag: >-
    Unit-Tests decken Migration-nahe Serviceoperationen, Instanz-/Detail-/Dead-Letter-
    Abfragen, Blocker-Resolve und NATS-fail-soft Verhalten ab.
  security_vertrag: >-
    Tenant-Isolation ist Pflicht; keine Cross-Tenant-Instanzen oder Blocker in
    Listen, Details oder Mutationen.
  betriebs_vertrag: >-
    REST-Sicht funktioniert ohne NATS; Live-Projektion startet nur bei
    verfuegbarer NATS-Verbindung und loggt Ausfaelle ohne Crash.
  dokumentations_vertrag: >-
    Slice-YAML und Workboard referenzieren Dateibesitz, Tests, Risiken und
    Rollback ueber Alembic-Downgrade.
