slice_id: ACKER-W2W5-BEDARF-NMIN-004
id: ACKER-W2W5-BEDARF-NMIN-004
title: Ackerschlagkartei AS-W2 Duengebedarf + AS-W5 Nmin/Bodenuntersuchung
owner: Codex
status: abgeschlossen
created_at: "2026-07-13"
started_at: "2026-07-13"
completed_at: "2026-07-13"
goal: >-
  Wellen AS-W2 (N-Duengebedarfsermittlung nach DueV) und AS-W5 (Nmin +
  Bodenuntersuchung). Schlag-Schema um Sollwert/Ertragsniveau, Nmin (Fruehjahr,
  in Bedarf ja/nein) und Bodenuntersuchung (P2O5/K2O/MgO/pH, Versorgungsstufe)
  erweitert; Portal-Endpoint berechnet den N-Bedarf je Schlag (Sollwert-Nmin) und
  gleicht ihn gegen die ausgebrachte N-Menge ab.
scope:
  - Schlag-Schemas + _schlag_to_dict um DueV-Felder (W2/W5).
  - Portal-Endpoint /portal/feldbuch/duengebedarf (N-Bedarf vs. ausgebracht).
  - Nmin-in-Bedarf-Logik (Fruehjahr einbeziehen; Herbst/Mai nur erfassen).
file_ownership:
  - "docs/agent-ops/active-workboard.md"
  - "docs/agent-ops/slices/ACKER-W2W5-BEDARF-NMIN-004.yaml"
  - "app/api/v1/endpoints/portal_feldbuch.py"
  - "docs/schnittstellen/openapi.json"
  - "docs/schnittstellen/endpoint-inventory.md"
  - "config/architecture-index.yaml"
dateibesitz:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/ACKER-W2W5-BEDARF-NMIN-004.yaml
  - app/api/v1/endpoints/portal_feldbuch.py
  - docs/schnittstellen/openapi.json
  - docs/schnittstellen/endpoint-inventory.md
  - config/architecture-index.yaml
progress: >-
  2026-07-13 umgesetzt: Schlag-Create/Update nehmen n_sollwert_kg_ha,
  ertragsniveau_dt_ha, nmin_fruehjahr_kg_ha, nmin_in_bedarf sowie Boden-P2O5/K2O/
  MgO/pH, boden_datum und Versorgungsstufe entgegen (Spalten aus AS-W1-Migration);
  _schlag_to_dict gibt sie aus. Endpoint /portal/feldbuch/duengebedarf berechnet je
  Schlag N-Bedarf = duengebedarf_n(Sollwert, Nmin) x Flaeche und den Restbedarf
  gegen die ausgebrachte N-Menge; Nmin wird nur bei nmin_in_bedarf beruecksichtigt.
acceptance:
  - "Schlag speichert/liefert Sollwert, Nmin, Bodenuntersuchung, Versorgungsstufe."
  - "Duengebedarf-Endpoint liefert je Schlag Bedarf, Ausgebracht und Restbedarf."
  - "Nmin wird nur bei nmin_in_bedarf einbezogen; kein neuer Migrationsbedarf."
tests:
  - "pytest tests/test_feldbuch_naehrstoff_duev.py::TestDuengebedarf -> passed."
  - "python -m py_compile portal_feldbuch.py -> 0."
risks:
  - "Zu-/Abschlaege (Vorkultur/org. Duengung/Ertragsdifferenz) sind derzeit 0; Feinjustierung ist Folgeausbau."
external_gates:
  - "GitHub Actions nach Push: Docs Governance, Pytest PostgreSQL, CI/CD, Quality Gate."
  - "OpenAPI-/Inventar-/Architektur-Index-Drift-Gate."
ai_harness:
  fachlicher_vertrag: >-
    N-Bedarf folgt der DueV-Systematik Sollwert-Nmin (+/- Zu-/Abschlaege);
    Fruehjahrs-Nmin wird nur bei aktivem Flag einbezogen. Versorgungsstufe A..E.
  architektur_vertrag: >-
    Additive Schemafelder + Endpoint im bestehenden Portal-Feldbuch; keine neue
    Migration (Spalten aus AS-W1), kein neuer Service.
  daten_vertrag: >-
    Keine Datenmigration; nutzt die in AS-W1 ergaenzten Schlag-Spalten.
  security_vertrag: >-
    Tenant-/Kundenfilter unveraendert; serverseitige Berechnung.
  betriebs_vertrag: >-
    Keine Betriebs-/Deploy-Aenderung.
  dokumentations_vertrag: >-
    Workboard, Slice-YAML und OpenAPI/Inventare/Architektur-Index werden aktualisiert.
  test_vertrag: >-
    Duengebedarf-Test, py_compile und Drift-Gates gruen vor Push; GitHub Actions
    bestaetigen den Default-Branch.
