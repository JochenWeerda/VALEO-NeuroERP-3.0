slice_id: SPEC-P1-06-W5-FINANCE-HRM-ADAPTER
id: SPEC-P1-06-W5-FINANCE-HRM-ADAPTER
title: Legacy-Routen response_model typisieren — Welle 5 (Finanzaktionen, Abwesenheit, Legacy-Adapter, Rations-Schnittstellen)
owner: Claude Code
status: abgeschlossen
created_at: "2026-08-23"
started_at: "2026-08-23"
completed_at: "2026-08-23"
goal: >-
  Fuenfte Welle von SPEC-P1-06: der Rest der 7er-Gruppe — finance_actions
  (SEPA/Ratenzahlung/Mahnstufen), hrm_abwesenheit, legacy_interface_adapters
  und rations_integrations.
file_ownership:
  - docs/agent-ops/slices/SPEC-P1-06-W5-FINANCE-HRM-ADAPTER.yaml
  - app/api/v1/schemas/finance_actions_schemas.py
  - app/api/v1/schemas/hrm_abwesenheit_schemas.py
  - app/api/v1/schemas/legacy_interface_adapters_schemas.py
  - app/api/v1/schemas/rations_integrations_schemas.py
  - app/api/v1/endpoints/finance_actions.py
  - app/api/v1/endpoints/hrm_abwesenheit.py
  - app/api/v1/endpoints/legacy_interface_adapters.py
  - app/api/v1/endpoints/rations_integrations.py
  - tests/test_welle5_response_models.py
acceptance:
  - 28 Endpunkte tragen ein echtes response_model
  - Kein Feldverlust gegenueber Service-Rueckgaben bzw. Tabellen-DDL
  - Idempotenzpfade und berechnete Felder bleiben uebertragbar
  - Bestandstests der vier Bereiche bleiben gruen
result: >-
  Schwache response_model-Typen repo-weit 343 -> 315, betroffene Dateien
  103 -> 99. Nach fuenf Wellen: 447 -> 315 (132 Endpunkte, 30 Prozent).
befunde:
  - >-
    Mehrere Finanzaktionen haben einen Idempotenzpfad, der die gespeicherte
    Tabellenzeile spreizt, waehrend der Neuanlagepfad ein konstruiertes Dict
    liefert (z. B. Ratenzahlungsplan mit rate_ids nur bei Neuanlage). Die
    Schemas fuehren die Vereinigung, beide Zweige sind im Test verklammert.
  - >-
    Bei hrm_abwesenheit sind eau_pflicht und abgeschlossen berechnete Felder
    aus to_dict, keine Spalten. Sie waeren bei einer DDL-orientierten
    Typisierung stillschweigend verschwunden.
  - >-
    Jede Antwort der Legacy-Adapter fuehrt execution_enabled: false — der
    Adapter ist repo-seitig fertig, die Ausfuehrung extern gegated. Das Feld
    ist Teil des Vertrags und im Test verklammert.
  - >-
    Herd-Data-Verbindungen geben nur credential_env_key zurueck, nie das
    Geheimnis. Das Schema bildet das ab, ein Test haelt es fest.
open:
  - >-
    Verbleibender Schwanz: 99 Dateien mit 315 schwachen Typen, ab hier
    6 Vorkommen und weniger je Datei.
verification:
  - "python -m pytest tests/test_welle5_response_models.py -q --no-cov"
  - "python -m pytest tests/test_finance_actions.py tests/test_hrm_abwesenheit.py tests/test_legacy_interface_adapters.py tests/test_rations_integrations_f5.py tests/test_rations_herd_data_connectors.py tests/test_feeding_herd_snapshots_api.py -q --no-cov"
  - "python scripts/check_response_models.py --threshold 20"
  - "python scripts/check_weak_response_models.py"
