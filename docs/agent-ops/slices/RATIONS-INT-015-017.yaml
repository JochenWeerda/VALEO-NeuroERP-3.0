goal: >-
  JSON-first Integrationsadapter fuer Mischwagen-Istwerte (agrirouter 2.0,
  EFDI/TaskData), LKV/MLP-Tierdaten (ICAR-ADE) und Futterlaboranalysen
  (LKS/LUFA/Eurofins-normalisiert). Importe muenden in die kanonischen Modelle
  F1-FeedingLog, CowProfile und FeedIngredient statt paralleler Datenwege, mit
  tenantisoliertem Idempotenz-/Auditjournal (Folgewelle F5).
scope:
  - Reine Adapter-Funktionen agrirouter_to_feeding_log/icar_ade_to_cow_profile/laboratory_to_feed_ingredient.
  - Import-Endpoint /agrar/rations-optimization/integrations/{adapter}/import mit Duplikatschutz + Journal.
  - agrirouter-Import persistiert direkt ein F1-Fuetterungsprotokoll (compute_feeding_control).
  - Migration domain_agrar.rations_integration_imports (tenant-FK, Unique, Zeitindex).
