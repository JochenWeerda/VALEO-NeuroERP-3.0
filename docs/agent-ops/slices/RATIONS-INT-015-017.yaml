external_gates:
  - "GitHub Actions nach Push: Docs Governance, Pytest PostgreSQL, CI/CD, Quality Gate, Security Scan."
  - "OpenAPI-/Code-Inventar-/Architektur-Index-Drift-Gate nach den neuen Integrations-Endpunkten."
ai_harness:
  fachlicher_vertrag: >-
    Importe muenden in die kanonischen Rationsmodelle (F1-FeedingLog, CowProfile,
    FeedIngredient); keine parallelen Datenmodelle. agrirouter-Istwerte werden
    ueber die DLG-01|2025-Kontrolllogik (compute_feeding_control) verrechnet.
  architektur_vertrag: >-
    Reine Adapter + ein Import-Endpoint unter dem bestehenden Rationsprefix; der
    Integrations-Router wird in den Rationsrouter eingebunden. Kein neuer Service.
  daten_vertrag: >-
    Neue Tabelle domain_agrar.rations_integration_imports mit Tenant-FK und
    Unique (tenant, adapter, external_id) fuer Idempotenz; Alembic-Migration
    verkettet auf die F1-Feeding-Log-Migration (Single-Head).
  security_vertrag: >-
    Pflicht-Tenant aus zentraler Dependency (get_tenant_id); alle Journal-/
    Persistenzabfragen tenantgefiltert. Payload wird als bereits dekodiertes JSON
    an der Transportgrenze entgegengenommen; payload_hash fuer Audit.
  betriebs_vertrag: >-
    Alembic-Migration vor Nutzung erforderlich; Provider-Transport (agrirouter/
    ICAR/Labor) bleibt betrieblich/konfigurativ anzubinden.
  dokumentations_vertrag: >-
    Workboard, Slice-YAML, OpenAPI, Code-Inventare und Architektur-Index werden
    fuer die neuen Endpunkte aktualisiert.
  test_vertrag: >-
    Adapter-/Endpoint-Tests, Alembic-Single-Head, py_compile und die Doku-Drift-
    Gates muessen vor Push gruen sein; GitHub Actions bestaetigen den Default-Branch.
