slice_id: UIX-091
title: Prozessband (P9) flaechendeckend
owner: Claude
status: in_arbeit
created_at: 2026-07-07
spec: docs/design/specs/uix-m4-spec.md
coordination: >-
  Teil des UIX-Zukunft-Programms (UIX-ZUKUNFT-VISION-001). Vor Umsetzung Owner
  eintragen, Claim sofort committen; Abhaengigkeiten laut Roadmap beachten.
goal: >-
  Deklarative Prozessketten (config/process_chains.yaml) + processChain-Feld je SD; Compiler erzeugt shell.processRibbon; Chips navigieren entlang K1-K4.
file_ownership:
  - "config/process_chains.yaml"
  - "app/core/screen_definitions.py"
  - "packages/frontend-web/src/components/mask-builder/render-plan/**"
  - "packages/frontend-web/src/components/mask-builder/renderers/ProcessRibbonRenderer.tsx"
  - "scripts/check_process_chains.py"
acceptance:
  - "Beleg-SDs (sales/einkauf/finance/agrar detail+transaction) tragen processChain; Readiness-Warnung sonst."
  - "Jede screenId in Ketten existiert in der Registry (CI-Check)."
  - "Aktueller Schritt markiert; Klick navigiert; nav-Semantik mit Tastatur."
  - "Anhebung Warnung->Error nach Voll-Rollout dokumentiert."
tests:
  - "Vitest Compiler+Renderer"
  - "pytest YAML-Validierung + Readiness-Warnfall"
  - "Playwright Band-Navigation ueber 2 Ketten"
risks:
  - Geteilter Working Tree mit Parallel-Agenten — Branch vor Commit pruefen.
  - Scope-Kriechen: ein Slice = ein Push-Zyklus; Folgearbeit als neuer Slice.
ai_harness:
  fachlicher_vertrag: >-
    Jede Maske zeigt Woher/Wo/Wohin — die Doc-Chain wird sichtbar und begehbar.
  architektur_vertrag: >-
    Single Source of Truth bleibt ScreenDefinition -> RenderPlan -> useUniversalMaskRuntime -> UniversalMaskRenderer. Neue Faehigkeiten sind Contract-Felder + Compiler-Ableitungen + Renderer-Primitive + Gates — kein Parallelsystem, keine Seiten-Kopien.
  daten_vertrag: >-
    processChain additiv; Ketten zentral in config, tenant-ueberschreibbar; kein Instanz-Fortschritt in v1 (Feld vorbereitet).
  test_vertrag: >-
    Registry-Konsistenz-Check verhindert tote Ketten-Schritte.
  security_vertrag: >-
    Keine neuen Secrets, Tenant-Isolation in jedem neuen Endpoint (Pflichttest), dangerLevel/Confirmation/AuditReason unveraendert; NL-/Voice-/Agent-Pfade duerfen Gates nie verkuerzen.
  betriebs_vertrag: >-
    quality-gate, universal-mask-ci, runtime-sweep und Performance-Gates bleiben gruen; neue GETs 0x5xx; Rollback ueber Feature-Flags bzw. native Route-Rollback-Matrix.
  dokumentations_vertrag: >-
    Workboard + Slice-YAML + betroffene Statusdoku (universal-mask-runtime-status, Agent-Handbuch-Generatoren) im selben Push synchronisieren.
external_gates:
  - not_applicable
