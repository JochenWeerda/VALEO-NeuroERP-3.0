slice_id: PROD-READINESS-001
title: Production Readiness P0 Hardening
owner: Codex
status: reserved
coordination: >-
  Repo-weiter CI-, Deployment-, Security- und Dokumentations-Slice.
  KIM-DEPRECATE-COCKPIT-001 besitzt parallel nur kunden-cockpit.tsx und den
  zugehoerigen Navigationseintrag; diese Dateien bleiben unberuehrt.
goal: >-
  Alle repo-seitig schliessbaren P0-Gaps der Produktionsreife beseitigen:
  harte Release-CI-Gates, blockierende High/Critical-Security-Scans, SBOM,
  produktionssichere Runtime-/Secret-Preflights, belastbare Staging- und
  Production-Deployments sowie eine aktuelle Go-live-Matrix.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/PROD-READINESS-001.yaml
  - .github/workflows/quality-gate.yml
  - .github/workflows/security-scan.yml
  - .github/workflows/deploy-staging.yml
  - .github/workflows/valeo-erp-deployment.yml
  - .github/workflows/*release*
  - scripts/deployment/**
  - scripts/check_production_readiness.py
  - tests/test_production_readiness_contract.py
  - docs/project-context/open-gaps-and-known-issues.md
  - docs/quality-assurance/*production*readiness*
  - docs/operations/**
  - README.md
acceptance_criteria:
  - Typecheck, Lint und Tests koennen im Release-Pfad nicht toleriert werden.
  - High/Critical Security- und Dependency-Befunde blockieren.
  - Eine CycloneDX-SBOM wird als Release-Artefakt erzeugt.
  - Dev-Tokens, Default-Secrets, Debug, Reload und Wildcard-Hosts blockieren Produktion.
  - Deployments nutzen GitHub Environments, Migration-Preflight, Smoke und Rollback.
  - Externe Fach- und Providerabnahmen bleiben explizite harte Go-live-Gates.
  - YAML, Skriptvertraege, Doku und Governance sind gruen.
risks:
  - Cloudzugang, GitHub Environment Approvals und UAT-Unterschriften sind extern.
  - Bestehende Legacy-Domain-Workflows koennen weiterhin advisory bleiben, duerfen
    aber nicht Teil des kanonischen Release-Gates sein.
