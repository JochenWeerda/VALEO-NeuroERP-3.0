id: UX-LOGISTIK-001
title: Tourenplanung mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-14
goal: >
  Tourenplanung als erste Logistik-Arbeitsflaeche auf den
  UX-Exzellenzbaukasten ziehen: Rollenfokus, Dispo-Plan,
  Managemententscheidung, Next Action und CRUD-/Transport-Abdeckung.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-LOGISTIK-001.yaml
  - packages/frontend-web/src/pages/logistik/tourenplanung.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Tourenplanung zeigt Rollenfokus fuer Disposition, Fahrer, Lager/Waage, QS und Leitung.
  - Aufgabenplan fuehrt Planen, Ressourcen klaeren, unterwegs ueberwachen und abschliessen.
  - Managemententscheidung zeigt disponierbar/blockiert.
  - CRUD-/Transport-Abdeckung ist sichtbar.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-LOGISTIK-001.yaml
  - git diff --check
done:
  - logistik/tourenplanung.tsx nutzt Rollenfokus, Dispo-Aufgabenplan, Managemententscheidung, Next Action und CRUD-/Transport-Abdeckung aus dem UX-Baukasten.
  - Bestehende Tourenlage, Ressourcen-KPIs, Supply-Chain-Kontext und aktive Tourenliste bleiben erhalten.
  - UX-Standard markiert UX-LOGISTIK-001 als abgeschlossen.
risks:
  - Frachtbriefe und Waage folgen in separaten Logistik-UX-Slices.
