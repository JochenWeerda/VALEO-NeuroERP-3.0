slice_id: CRM360-MBT-002
title: CRM360 Revenue Handover Browser Workflow
owner: Codex
status: completed
goal: >-
  Den CRM360-Folgeprozess Kunde -> Angebot -> Auftrag -> Lieferschein ->
  Rechnung -> OP als typisierten Browser-Handover umsetzen und gegen
  Zielmasken, Kunden-/Belegkontext sowie Browserfehler pruefen.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/CRM360-MBT-002.yaml
  - docs/quality-assurance/crm360-model-based-click-test-2026-06-08.md
  - docs/quality-assurance/crm360-revenue-handover-click-test-2026-06-08.md
  - app/api/v1/endpoints/sales_offers.py
  - tests/test_security_sales_offers.py
  - packages/frontend-web/src/lib/workflow/sales-handover.ts
  - packages/frontend-web/src/pages/sales/angebot-erstellen.tsx
  - packages/frontend-web/src/pages/sales/order-editor.tsx
  - packages/frontend-web/src/pages/sales/invoice-editor.tsx
  - packages/frontend-web/src/pages/verkauf/lieferschein-erfassung.tsx
  - packages/frontend-web/src/app/routing/route-inventory.gen.json
  - packages/frontend-web/src/app/routing/route-tree.gen.tsx
  - playwright-tests/specs/crm/crm360-model-based.spec.ts
  - playwright-tests/specs/crm/crm360-revenue-handover.spec.ts
  - playwright-tests/specs/crm/crm360-workflow-model.ts
acceptance_criteria:
  - Jede Belegstufe liest und reicht einen einheitlichen Kunden- und Quellbelegkontext weiter.
  - Folgeprozess-Aktionen oeffnen die fachlich erwartete Maske.
  - Browserfehler, HTTP-Fehler und 404-Seiten werden nach jedem Uebergang erkannt.
  - Playwright fuehrt den gesamten Handover mit deterministischen Fixtures aus.
  - Typechecks, Build, Backendtest, Routing-Gates und Governance sind gruen.
risks:
  - Der Test verwendet deterministische API-Fixtures und ist kein Nachweis einer produktiven Buchung.
  - Ein persistenter Durchstich benoetigt isolierte und aufraeumbare Backend-Testdaten.
result: >-
  Ein gemeinsamer typisierter Sales-Handover-Vertrag verbindet Angebot,
  Auftrag, Lieferschein, Rechnung und OP. Die Angebot-zu-Auftrag-API besitzt
  nun das korrekte Response-Modell. Kunden- und Quellbelegkontext werden
  sichtbar uebernommen, Auftragspositionen in den Lieferschein geladen und
  nach der Lieferscheinkonvertierung die kanonische Rechnungsmaske geoeffnet.
  Die kombinierte CRM360-Suite fuehrt elf Browsertests erfolgreich aus.
