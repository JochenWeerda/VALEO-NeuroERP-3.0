id: UX-SALES-007
title: Moderne Sales-Auftragssicht mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-15
goal: >
  Moderne Sales-Auftragssicht als Ausnahmen- und Eskalationsarbeitsflaeche auf
  den UX-Exzellenzbaukasten ziehen: Rollenfokus, Eskalationsplan,
  Managemententscheidung, Next Action und CRUD-/Nachweis-Abdeckung.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-SALES-007.yaml
  - packages/frontend-web/src/pages/sales/orders-modern.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Moderne Sales-Auftragssicht zeigt Rollenfokus fuer Vertrieb, Auftragsabwicklung, Logistik, Faktura und Leitung.
  - Eskalationsplan fuehrt offene, teilgelieferte, rechnungsfaehige und Archiv-/Storno-Kandidaten.
  - Managemententscheidung zeigt arbeitsfaehig/blockiert.
  - CRUD-/Nachweis-Abdeckung ist sichtbar.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-SALES-007.yaml
  - git diff --check
done:
  - Moderne Sales-Auftragssicht um Rollenfokus fuer Vertrieb, Auftragsabwicklung, Logistik, Faktura und Leitung ergaenzt.
  - Sales-Eskalationsplan fuer offene, teilgelieferte, rechnungsfaehige und Archiv-/Storno-Kandidaten ergaenzt.
  - Managemententscheidung arbeitsfaehig/blockiert, Next Action und CRUD-/Nachweis-Abdeckung sichtbar gemacht.
risks:
  - Rechnungsliste und Lieferliste sind in UX-SALES-006 abgedeckt; dieser Slice fokussiert die moderne Sales-Ausnahmensicht.
