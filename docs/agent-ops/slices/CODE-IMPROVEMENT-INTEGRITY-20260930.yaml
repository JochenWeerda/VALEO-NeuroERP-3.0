risks:
  - Eine genauere Erstinventur klassifiziert Altbestand und ist keine Fachreparatur.
  - Sonar-Konfiguration und Branchschutz sind externe Repository-Einstellungen.
ai_harness:
  fachlicher_vertrag: Fehler und fehlende Nachweise duerfen keinen Erfolg melden.
  architektur_vertrag: Bestehende CI und Ratschen bleiben zentral; kein neuer Service.
  daten_vertrag: Keine Fachdatenmutation; SHA-bezogene JSON-Nachweise und Baselines.
  test_vertrag: Reale Fehlerfaelle fuer Scanner/Runner und strukturelle CI-Vertraege.
  security_vertrag: Kein Secret in Artefakten; CI lesend; Baselines fail-closed.
  betriebs_vertrag: Timeouts, explizite Exitcodes und nachpruefbare Artefakte.
  dokumentations_vertrag: Eigener QA-Bericht, Workboard und Open-Gaps.
external_gates:
  - GitHub required status checks und Sonar-Token durch Repository-Betrieb verifizieren.
