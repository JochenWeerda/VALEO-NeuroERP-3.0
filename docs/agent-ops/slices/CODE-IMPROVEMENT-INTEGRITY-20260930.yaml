acceptance:
  - Pagination wird an die Abfrage statt an Dateinamen oder Parameter gebunden.
  - Baseline-Anhebungen werden gegen den PR-Ausgangsstand blockiert.
  - Frontendtests sind verbindlich und Coverage wird nur einmal erzeugt.
  - Sonar konsumiert Nachweise desselben Runs und Commits.
  - Nightly erzeugt Artefakte ohne Git-Push.
  - Lokaler Verbesserungsrunner ist ohne linkup_mcp lesend ausfuehrbar.
tests:
