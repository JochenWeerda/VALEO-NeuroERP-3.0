id: UX-FINANCE-004
title: Periodenabschluss mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-14
goal: >
  Periodenabschluss als vierte Finance-Arbeitsflaeche auf den
  UX-Exzellenzbaukasten ziehen: Rollenfokus, Close-Aufgabenplan,
  Managemententscheidung, Next Action und CRUD-/Close-Abdeckung.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-FINANCE-004.yaml
  - packages/frontend-web/src/pages/finance/abschluss.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Periodenabschluss zeigt Rollenfokus fuer FIBU, Controlling, Steuerbuero, Leitung und Audit.
  - Close-Aufgabenplan fuehrt Periode, Abstimmung, Freigabe und Sperre/Export.
  - Managemententscheidung zeigt abschliessbar/gestoppt.
  - CRUD-/Close-Abdeckung ist sichtbar.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-FINANCE-004.yaml
  - git diff --check
done:
  - finance/abschluss.tsx nutzt Rollenfokus, Close-Aufgabenplan, Managemententscheidung, Next Action und CRUD-/Close-Abdeckung aus dem UX-Baukasten.
  - Bestehende Abschlusslage, Kontext, FIBU-KPIs, Calculate-/Approve-/Close-/Lock- und Export-Aktionen bleiben erhalten.
  - UX-Standard markiert UX-FINANCE-004 als abgeschlossen und leitet Einkauf/CRM/Logistik als naechste Rollout-Domaenen ein.
risks:
  - Einkauf und weitere Domaenen folgen in separaten UX-Rollout-Slices.
