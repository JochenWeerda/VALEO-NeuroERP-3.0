id: UX-LOGISTIK-003
title: Waagearbeitsflaechen mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-15
goal: >
  Waagearbeitsflaechen auf den UX-Exzellenzbaukasten ziehen: Rollenfokus,
  Waage-Aufgabenplan, Stopper-/Managemententscheidung, Next Action und
  CRUD-/Nachweis-Abdeckung.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-LOGISTIK-003.yaml
  - packages/frontend-web/src/pages/waage/wiegungen.tsx
  - packages/frontend-web/src/pages/waage/wiegeschein-detail.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Wiegungen und Wiegeschein-Detail zeigen Rollenfokus fuer Waage, Annahme, Disposition, QS und Abrechnung.
  - Aufgabenplan fuehrt Ticket, Gewichte, Qualitaet, Kontrakt und Abschluss.
  - Stopper-/Managemententscheidung zeigt buchbar/blockiert.
  - CRUD-/Nachweis-Abdeckung ist sichtbar.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-LOGISTIK-003.yaml
  - git diff --check
done:
  - Wiegungen um Rollenfokus, Waage-Aufgabenplan, Stopperentscheidung, Next Action und CRUD-/Nachweis-Abdeckung ergaenzt.
  - Wiegeschein-Detail um Rollenfokus, Wiegeschein-Aufgabenplan, Abrechnungsentscheidung, Next Action und CRUD-/Nachweis-Abdeckung ergaenzt.
  - Bestehende Ticketanlage, Gewichtserfassung, Kontraktzuordnung, Supply-Chain-Kennzahlen, Timeline und Detail-Tabs bleiben erhalten.
risks:
  - Waage-Hardware-Integration bleibt ausserhalb dieses Slice; dieser Slice fokussiert die Bedien- und Nachweissicht.
