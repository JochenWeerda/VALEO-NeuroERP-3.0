slice_id: RUNTIME-A-JOBS-001
title: Runtime Sweep Kategorie A - domain_shared jobs Tabellen absichern
owner: Codex
status: completed
coordination: >-
  Eng begrenzter Shared-Platform-Slice. Keine Aenderungen an Inventory-,
  Admin-Mobile- oder Frontend-Dateien; dadurch kollisionsarm zu parallelen
  Inventory/Admin-Agenten.
goal: >-
  /api/v1/jobs gegen UndefinedTable absichern: idempotente Repair-Migration fuer
  domain_shared.jobs und domain_shared.job_artifacts am aktuellen Alembic-Head,
  plus Runtime-Degradation/Tests fuer Listenpfade.
file_ownership:
  - alembic/versions/job_runner_tables_repair_20260625.py
  - app/api/v1/endpoints/job_runner.py
  - tests/test_runtime_sweep_category_a_jobs.py
  - docs/project-context/open-gaps-and-known-issues.md
acceptance_criteria:
  - alembic heads bleibt single-head
  - Repair-Migration ist idempotent und legt keine Runtime-DDL in Endpoints an
  - GET /api/v1/jobs degradiert bei fehlender Tabelle auf leere Liste statt 500
  - pytest fuer fokussierte Runtime-/Migrationsvertraege gruen
acceptance:
  - alembic heads bleibt single-head
  - Repair-Migration ist idempotent und legt keine Runtime-DDL in Endpoints an
  - GET /api/v1/jobs degradiert bei fehlender Tabelle auf leere Liste statt 500
  - pytest fuer fokussierte Runtime-/Migrationsvertraege gruen
risks:
  - Produktive Datenbank muss Migration tatsaechlich ausrollen; bis dahin bleiben Schreibpfade fail-closed.
checks:
  - pytest -q -o addopts= tests/test_runtime_sweep_category_a_jobs.py tests/test_runtime_sweep_category_d.py
  - python -m py_compile app/api/v1/endpoints/job_runner.py alembic/versions/job_runner_tables_repair_20260625.py
  - alembic heads
tests:
  - pytest -q -o addopts= tests/test_runtime_sweep_category_a_jobs.py tests/test_runtime_sweep_category_d.py
  - python -m py_compile app/api/v1/endpoints/job_runner.py alembic/versions/job_runner_tables_repair_20260625.py
  - alembic heads
external_gates:
  - produktive Datenbankmigration via Deployment-Pipeline
ai_harness:
  fachlicher_vertrag: >-
    Category-A-Luecke /api/v1/jobs wird geschlossen: vorhandene Jobs bleiben
    persistierbar, Listenpfade liefern ohne Migration keine 500 mehr.
  architektur_vertrag: >-
    Tabellen werden ausschliesslich ueber Alembic abgesichert; der Endpoint
    enthaelt keine Runtime-DDL. Read-Degradation ist eng auf SQLAlchemyError
    im Listenpfad begrenzt.
  daten_vertrag: >-
    Tenant-Scope bleibt ueber tenant_id im SELECT erhalten; Repair-Migration
    loescht keine bestehenden Daten und downgrade ist bewusst non-destructive.
  test_vertrag: >-
    Fokussierte pytest-Vertraege pruefen Missing-Table-Degradation und die
    Migration-Chaining-Konvention.
  security_vertrag: >-
    Keine Secrets, keine neuen externen Abhaengigkeiten, keine Cross-Tenant-
    Lockerung.
  betriebs_vertrag: >-
    Produktiv muss die Migration ausgerollt werden; bis dahin degradiert nur
    GET /api/v1/jobs, Schreibpfade bleiben migrationspflichtig.
  dokumentations_vertrag: >-
    Workboard, Slice-YAML und open-gaps-and-known-issues dokumentieren Status,
    Checks und externe Gates.
