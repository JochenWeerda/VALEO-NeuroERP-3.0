risks:
  - Claude FSX/KIM bleiben ohne Kartenstapel
  - Voice ohne Mic-Permission im Browser-Audit nicht end-to-end beweisbar; Wiegen bleibt Voice-Gate
  - MCP bleibt leselastig; kein form-level Agent in diesem Slice
  - Ablage hat keine Datei-URL und keinen Upload-Endpunkt; Download ist Metadaten-Text
  - Lookup-Typen in ScreenDefinition bleiben Claude (`screen_definitions.py`)
ai_harness:
  fachlicher_vertrag: >
    Finger und Stimme sind Erstklass-Kanäle für Außendienst und Waage.
    Tastatur bleibt Erstkanal für Buchhaltung am Desktop.
  architektur_vertrag: >
    Keine parallele Mobile-App. Dieselbe Web-UI, denselben MCP-Vertrag,
    keine DOM-Steuerung als Produkt-API.
