slice_id: AI-DOC-DRIFT-DASHBOARD-001
title: "Doku-Code-Drift-Report (Nightly)"
owner: Claude Code
status: completed
created_at: "2026-06-23"
goal: >-
  Script scripts/doc_drift_report.py prueft Endpoints ohne API-Doku, Migrationen
  ohne Runbook, Services ohne Fachprozessbeleg, Frontend-Seiten ohne Nav-Eintrag.
  Erzeugt artifacts/doc_drift_report.json + Markdown-Summary auf stdout.
file_ownership:
  - scripts/doc_drift_report.py
  - tests/test_doc_drift_report.py
  - docs/agent-ops/slices/AI-DOC-DRIFT-DASHBOARD-001.yaml
acceptance:
  - Drift-Report erzeugt JSON mit Summary und Issue-Liste fuer Endpoints, Migrationen, Services und Frontend-Seiten.
  - Markdown-Ausgabe ist fuer CI-Logs lesbar und nennt offene Drift-Items mit Dateipfad.
  - Unit-Tests sichern Report-Struktur, JSON-Serialisierung, Markdown-Ausgabe und Artefakt-Schreiben.
tests:
  - python -m py_compile scripts/doc_drift_report.py
  - pytest -q -o addopts= tests/test_doc_drift_report.py
risks:
  - Heuristik-basiert: falsch-positive bei Stems die nicht in Doku erscheinen aber anderweitig dokumentiert sind.
  - artifacts/ ist gitignored; Report nur in CI/lokal, kein persistierter Verlauf ohne externen Store.
external_gates:
  - not_applicable
ai_harness:
  fachlicher_vertrag: >-
    Drift-Report zeigt je Kategorie Anzahl und Dateipfade von Code-Objekten ohne
    Doku-Entsprechung. Ziel: null offene Drift-Items fuer neue Slices.
  architektur_vertrag: >-
    Reines Python-Script ohne DB/API. Liest .py/.tsx/.md-Dateien aus Repo.
    Kein externes Netzwerk. artifacts/ als Ausgabeverzeichnis (gitignored).
  daten_vertrag: >-
    Report-JSON: generated_at, repo_root, summary (total/endpoint/migration/service/page),
    issues (type, file, stem/path_hint).
  test_vertrag: >-
    4 Tests: build_report-Struktur, JSON-Serialisierbarkeit, Markdown-Output,
    Artefakt-Schreiben via monkeypatch.
  security_vertrag: >-
    Liest nur Repo-Dateien. Keine Credentials, keine externen Verbindungen.
  betriebs_vertrag: >-
    Manuell: python scripts/doc_drift_report.py. CI: AI-DOC-DRIFT-CI-001 (woechentlich, informativ).
  dokumentations_vertrag: >-
    Workboard-Abschnitt AI-DOC-DRIFT-DASHBOARD-001; Report-Format in YAML-Doku.
