id: UX-EINKAUF-001
title: Rechnungseingaenge mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-14
goal: >
  Rechnungseingaenge als erste Einkaufs-Arbeitsflaeche auf den
  UX-Exzellenzbaukasten ziehen: Rollenfokus, Freigabeplan,
  Managemententscheidung, Next Action und CRUD-/Workflow-Abdeckung.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-EINKAUF-001.yaml
  - packages/frontend-web/src/pages/einkauf/rechnungseingaenge-liste.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Rechnungseingaenge zeigen Rollenfokus fuer Einkauf, Wareneingang, FIBU, Leitung und Audit.
  - Aufgabenplan fuehrt Erfassen, Pruefen, Freigeben und Verbuchen.
  - Managemententscheidung zeigt buchbar/gestoppt.
  - CRUD-/Workflow-Abdeckung ist sichtbar.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-EINKAUF-001.yaml
  - git diff --check
done:
  - einkauf/rechnungseingaenge-liste.tsx nutzt Rollenfokus, Freigabeplan, Managemententscheidung, Next Action und CRUD-/Workflow-Abdeckung aus dem UX-Baukasten.
  - Bestehende Rechnungseingangs-KPIs, Bulk-Pruefen, Bulk-Freigeben, Bulk-Verbuchen, Export und Importpfad bleiben erhalten.
  - UX-Standard markiert UX-EINKAUF-001 als abgeschlossen.
risks:
  - Bestellung, Wareneingang und Lieferantenstamm folgen in separaten Einkaufs-UX-Slices.
