slice_id: COM-REGISTER-CAMELCASE-001
title: "Compliance-Register UI/API CamelCase-Angleichung"
owner: Claude Code
status: completed
updated: 2026-06-26
coordination: >-
  Aus COM-001 Card (COM-003). Backend liefert fuer die betroffenen Register
  snake_case plus camelCase-Kompatibilitaetsfelder; Frontend nutzt camelCase.
goal: >-
  CamelCase-Mismatch in Compliance-Registern (qs-checkliste, zulassungen-register,
  vvvo-register, sachkunde-register) beheben: API-Pfade und Response-Mapping so,
  dass Listen/CRUD ohne leere Felder laden.
file_ownership:
  - packages/frontend-web/src/pages/compliance/qs-checkliste.tsx
  - packages/frontend-web/src/pages/compliance/zulassungen-register.tsx
  - packages/frontend-web/src/pages/compliance/vvvo-register.tsx
  - packages/frontend-web/src/pages/compliance/sachkunde-register.tsx
  - packages/frontend-web/src/lib/api/betrieb.ts
  - app/api/v1/endpoints/compliance.py
  - docs/cards/compliance/COM-001-compliance-to-audit.md
  - docs/workflows/com-001-compliance-to-audit.md
  - docs/project-context/open-gaps-and-known-issues.md
  - docs/agent-ops/slices/COM-REGISTER-CAMELCASE-001.yaml
acceptance:
  - Alle 4 Register laden Daten ohne Feld-Mapping-Fehler.
  - OpenAPI-Pfade und Frontend-Calls stimmen ueberein.
  - COM-001 CamelCase-Gap in Card als behoben markiert.
tests:
  - pnpm --dir packages/frontend-web exec tsc --noEmit --pretty false
  - pytest -q -o addopts= -k "compliance" --maxfail=5
risks:
  - Fachliche Compliance-Abnahme der Melderegister bleibt externes Gate.
external_gates:
  - Fachliche Compliance-Abnahme Melderegister.
completion_evidence:
  - app/api/v1/endpoints/compliance.py liefert fuer QS, Zulassungen, Sachkunde und VVVO snake_case plus camelCase-Kompatibilitaetsfelder.
  - packages/frontend-web/src/lib/api/betrieb.ts typisiert die Register mit camelCase-Feldern.
  - packages/frontend-web/src/pages/compliance/{qs-checkliste,zulassungen-register,vvvo-register,sachkunde-register}.tsx nutzt die camelCase-Felder.
  - docs/workflows/com-001-compliance-to-audit.md markiert COM-003 bis COM-005 als geschlossen.
ai_harness:
  fachlicher_vertrag: >-
    Compliance-Register muessen fachlich sichtbare Felder konsistent anzeigen;
    externe Meldestrecken bleiben als Fachabnahme-Gate getrennt.
  architektur_vertrag: >-
    Backend-Kompatibilitaetsfelder bleiben explizit im Compliance-Endpoint;
    Frontend-Hooks konsumieren den zentralen Betrieb-API-Contract.
  daten_vertrag: >-
    Backend darf snake_case ausliefern, stellt fuer bestehende Frontend-
    Register aber camelCase-Kompatibilitaetsfelder bereit.
  test_vertrag: >-
    Frontend-Typecheck und gezielte Compliance-Tests sind die Abnahmebasis; bei
    neuen Registern muss das Mapping erneut geprueft werden.
  security_vertrag: >-
    Keine produktiven Behoerdenzugangsdaten; Registerdaten bleiben tenant- und
    rollenbezogen zu pruefen.
  betriebs_vertrag: >-
    Fachliche Registerabnahme und externe Meldestrecken bleiben getrennte
    Betriebs-/Production-Readiness-Gates.
  dokumentations_vertrag: >-
    COM-001 Card, Open-Gaps, Workflow und Slice-YAML muessen gemeinsam gepflegt
    werden.
