id: UI-ARTICLE-NAV-001
title: Artikelstamm in Stammdaten-Navigation sichtbar machen
status: reserviert
owner: Codex
priority: P1
claimed_at: 2026-07-08
goal: >-
  Die vorhandene Artikel-Liste und Artikel-Neuanlage fuer Anwender sichtbar
  machen. Der Artikelstamm existiert bereits unter /artikel und /artikel/neu,
  ist aber im Bereich Artikel-Stammdaten nicht direkt verlinkt.
file_ownership:
  - packages/frontend-web/src/app/navigation/domains/commercial.tsx
  - docs/agent-ops/slices/UI-ARTICLE-NAV-001.yaml
  - docs/agent-ops/active-workboard.md
acceptance:
  - Artikel-Stammdaten enthaelt einen direkten Navigationseintrag fuer den Artikelstamm.
  - Bestehender Verkaufs-Eintrag routet eindeutig auf /artikel.
  - Frontend-Typecheck oder fokussierter Navigationstest ist gruen.
risks:
  - Route ist vorhanden, aber lokale Backend-Daten koennen wegen Docker/Postgres-Blocker leer oder fehlerhaft laden.
