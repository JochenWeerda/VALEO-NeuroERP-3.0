slice_id: HRM-ABWESENHEIT-ANTRAG-001
title: "HRM Abwesenheitsantrag-Workflow (Urlaub, Krank, Sonderurlaub)"
domain: hrm
status: done
claimed_by: claude-sonnet-4-6
owner: claude-sonnet-4-6
claimed_at: "2026-06-25"
closed_at: "2026-06-25"
goal: >-
  Vollstaendigen Abwesenheitsantrag-Lifecycle fuer Urlaub, Krankheit und
  Sonderurlaub mit Statusmaschine, Werktage-Berechnung, eAU-Pflicht,
  Urlaubskonto und Tenant-Isolation bereitstellen.
file_ownership:
  - app/services/hrm_abwesenheit_service.py
  - app/api/v1/endpoints/hrm_abwesenheit.py
  - tests/test_hrm_abwesenheit.py
  - app/api/v1/api.py
  - scripts/check_critical_backend_coverage.py
  - docs/agent-ops/slices/HRM-ABWESENHEIT-ANTRAG-001.yaml
acceptance:
  - Antragserstellung, Liste, Detail und Statusuebergaenge sind tenantisoliert.
  - Statusmaschine erlaubt nur fachlich gueltige Uebergaenge.
  - Urlaubskonto und Ueberschneidungspruefung liefern nachvollziehbare Ergebnisse.
  - eAU-Pflicht fuer Krankheit wird validiert.
tests:
  - pytest -q -o addopts= tests/test_hrm_abwesenheit.py
risks:
  - Produktiver Einsatz braucht externe Freigabe der HR-/Arbeitsrechtsregeln.
  - eAU-Provider und Payroll-Zielsystem bleiben externe Integrationsgates.
external_gates:
  - HR-/Arbeitsrechtsfreigabe
  - eAU-/Payroll-Liveintegration
ai_harness:
  fachlicher_vertrag: >-
    Mitarbeitende koennen Abwesenheiten beantragen; HR/Fuehrung kann diese
    genehmigen, ablehnen oder zurueckziehen und Urlaubskonten pruefen.
  architektur_vertrag: >-
    Thin-Router plus Service-Layer; API-Registrierung in app/api/v1/api.py und
    Coverage-Ratchet fuer Service und Endpoint.
  daten_vertrag: >-
    Abwesenheitsantraege enthalten Mitarbeiterbezug, Zeitraum, Typ, Status,
    Grund, Genehmigungsdaten und Tenant-Kontext.
  test_vertrag: >-
    Unit-/API-Tests decken Lifecycle, Validierungen, Urlaubskonto und
    Tenant-Isolation ab.
  security_vertrag: >-
    Keine Cross-Tenant-Sichtbarkeit; Statusmutationen laufen ueber explizite
    API-Aktionen.
  betriebs_vertrag: >-
    Ohne externe eAU-/Payroll-Anbindung laeuft der interne Workflow; produktive
    Melde- und Abrechnungsketten bleiben extern gegated.
  dokumentations_vertrag: >-
    Slice-YAML und Workboard dokumentieren Dateibesitz, Tests, Risiken und
    externe Gates.

description: |
  Vollständiger Abwesenheitsantrag-Lifecycle für Mitarbeiter:
  BEANTRAGT → GENEHMIGT | ABGELEHNT | ZURUECKGEZOGEN.
  Enthält Werktage-Berechnung (Mo–Fr), Überschneidungs-Prüfung,
  eAU-Pflicht für KRANK-Typ, 30-Tage-Urlaubsanspruch-Default,
  Urlaubskonto-View und vollständige Tenant-Isolation.

contracts:
  backend:
    new_files:
      - app/services/hrm_abwesenheit_service.py
      - app/api/v1/endpoints/hrm_abwesenheit.py
      - tests/test_hrm_abwesenheit.py
    modified_files:
      - app/api/v1/api.py
      - scripts/check_critical_backend_coverage.py
    endpoints:
      - "POST   /personal/abwesenheit/antraege           → 201 AntragCreate"
      - "GET    /personal/abwesenheit/antraege           → {items, count}"
      - "GET    /personal/abwesenheit/antraege/{id}     → AbwesenheitAntrag"
      - "POST   /personal/abwesenheit/antraege/{id}/genehmigen"
      - "POST   /personal/abwesenheit/antraege/{id}/ablehnen"
      - "POST   /personal/abwesenheit/antraege/{id}/zurueckziehen"
      - "GET    /personal/abwesenheit/urlaubskonto/{nr}?jahr="
    status_machine:
      BEANTRAGT:
        - GENEHMIGT
        - ABGELEHNT
        - ZURUECKGEZOGEN
      GENEHMIGT: []
      ABGELEHNT: []
      ZURUECKGEZOGEN: []

test_coverage:
  count: 25
  all_passing: true
  markers: [unit]

coverage_ratchet:
  - path: services/hrm_abwesenheit_service.py
    threshold: 0.78
  - path: api/v1/endpoints/hrm_abwesenheit.py
    threshold: 0.65
