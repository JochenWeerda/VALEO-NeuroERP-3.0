slice_id: AI-HARNESS-GOV-001
title: AI-assisted Development Harness Governance
owner: Codex
status: reserved
created_at: 2026-06-23
coordination: >-
  Info an Claude Code: Codex bearbeitet ausschliesslich AI-/Docs-Governance,
  Agent-Ops-Harness, QA-Templates und zugehoerige CI-/Script-Dateien. Keine
  Aenderung an aktuellen WMS-/Silo-/Materialfluss-Dateien oder generierten
  Frontend-Routen aus parallelem WIP. Bestehende fachliche WIP-Dateien bleiben
  unangetastet und werden nicht gebuendelt.
goal: >-
  Den AI-assisted Enterprise Development Standard operativ einfuehren: Slice-
  Harness, Doku-/Code-Sync, AI-Definition-of-Done, semantische QA-Templates,
  Nightly-Drift-Report, Vendor-Unabhaengigkeit und Security-/Major-Update-
  Prozess.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/AI-HARNESS-GOV-001.yaml
  - docs/agent-ops/task-slice-template.md
  - docs/agent-ops/parallel-work-protocol.md
  - docs/agent-ops/README.md
  - docs/architecture/ai-assisted-enterprise-development-standard.md
  - docs/project-context/ai-assisted-development-implementation-plan-2026-06-23.md
  - docs/quality-assurance/semantic-action-matrix-template.md
  - docs/quality-assurance/external-auditor-simulation-template.md
  - docs/operations/dependency-and-compatibility-maintenance.md
  - docs/architecture/tooling-quality-governance.md
  - config/docs-code-sync-map.yaml
  - artifacts/ai-tool-compatibility-matrix.json
  - scripts/docs-governance-check.cjs
  - scripts/docs-code-sync-check.cjs
  - scripts/ai-slice-readiness-check.cjs
  - scripts/docs-drift-report.cjs
  - .github/workflows/docs-governance.yml
  - .github/workflows/quality-gate.yml
  - .github/workflows/ai-doc-sync.yml
acceptance:
  - AI-Harness-Pflichtfelder sind im Slice-Template dokumentiert.
  - Governance-Check validiert neue oder geaenderte Slice-YAMLs auf Harness-Felder.
  - Doku-/Code-Sync-Check erkennt kritische Codeaenderungen ohne passende Doku oder explizite Ausnahme.
  - AI-Slice-Readiness-Check prueft Workboard, Slice-YAML, Tests, Doku und externe Gates.
  - Semantische QA-Templates fuer Action-Matrix und externe Pruefer-Simulation sind vorhanden.
  - Nightly Drift Workflow erzeugt ein Report-Artefakt ohne automatische Doku-Mutation.
  - AI-Tool-Kompatibilitaetsmatrix und Major-Update-/Security-Regeln sind dokumentiert.
tests:
  - node scripts/docs-governance-check.cjs docs/agent-ops/slices/AI-HARNESS-GOV-001.yaml
  - node scripts/docs-code-sync-check.cjs --base HEAD --head WORKTREE
  - node scripts/ai-slice-readiness-check.cjs --slice AI-HARNESS-GOV-001
  - node scripts/docs-drift-report.cjs --base HEAD --head WORKTREE --output artifacts/docs-drift-report.local.json
  - pnpm run docs:check
risks:
  - Zu harte Gates koennen Legacy-Slices oder parallele fachliche WIP blockieren.
  - Deshalb werden neue Checks zuerst auf neue/geaenderte Slice-Dateien und kritische Pfad-Diffs begrenzt.
  - Bestehende Altlasten werden sichtbar gemacht, aber nicht repo-weit sofort blockierend gemacht.
