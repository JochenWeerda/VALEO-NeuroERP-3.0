slice_id: ROUTER-NEXT-001
title: Typed TanStack Router Migration
owner: Codex
status: reserved
goal: >-
  Die zentrale React-Router-Splat-/Alias-Runtime durch einen automatisch
  generierten, typisierten TanStack-Route-Tree ersetzen, ohne zwei
  Browser-Router auf derselben History zu betreiben.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/ROUTER-NEXT-001.yaml
  - docs/architecture/frontend-routing/**
  - packages/frontend-web/package.json
  - packages/frontend-web/vite.config.ts
  - packages/frontend-web/src/app/**
  - packages/frontend-web/src/routes/**
  - packages/frontend-web/src/routeTree.gen.ts
  - packages/frontend-web/src/layouts/**
  - packages/frontend-web/src/components/navigation/**
  - packages/frontend-web/src/components/auth/ProtectedRoute.tsx
  - packages/frontend-web/src/pages/**
  - packages/frontend-web/scripts/**
  - packages/frontend-web/src/__tests__/**
  - packages/frontend-web/tests/e2e/**
acceptance_criteria:
  - TanStack Router ist der einzige Browser-Router.
  - Der Route Tree wird reproduzierbar generiert und typisiert.
  - Dynamische Parameter und Search-Werte sind compile-time geprueft.
  - Breadcrumbs und Auth verwenden Route-Metadaten und Router-Context.
  - Legacy-Links redirecten auf kanonische URLs.
  - AppRouteRuntime und die zentrale Splat-Route sind entfernt.
  - Typecheck, Build, Routing-Tests und E2E-Smokes sind gruen.
tests:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - pnpm --filter @valero-neuroerp/frontend-web test:run
  - pnpm --filter @valero-neuroerp/frontend-web build
  - pnpm --filter @valero-neuroerp/frontend-web test:e2e:routing-smoke
risks:
  - Hoher Blast Radius durch 569 Aliase und hunderte React-Router-Imports.
  - TypeScript-Inferenz und Bundle-Groesse muessen als Ratchet gemessen werden.
  - Parallele Frontend-Arbeit kann routergekoppelte Dateien beruehren.
