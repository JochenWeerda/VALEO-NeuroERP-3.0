slice_id: DOC-INAPP-HELP-002
title: "In-App-Hilfe Route → Dokumentation Mapping"
priority: P2
owner: Claude Code
status: abgeschlossen
created: "2026-06-26"

goal: >
  Top-50 Frontend-Routen auf MkDocs-Dokumentationsseiten mappen.
  TypeScript-Utility findHelpEntry() generieren, damit die UI kontextsensitive Hilfe anbieten kann.

ai_harness:
  fachlicher_vertrag:
    - src/lib/docs-help.ts enthält ROUTE_HELP_MAP für 50 priorisierte Routen.
    - findHelpEntry(currentPath) gibt den Hilfe-Eintrag mit längster Präfix-Übereinstimmung zurück.
    - Gemappte Domänen: Agrar, Verkauf, Einkauf, Lager, FiBu, CRM, Admin, Compliance, Logistik.
    - docs/benutzerhandbuch/in-app-hilfe.md dokumentiert das Konzept und zeigt alle Mappings.
  architekturvertrag:
    - scripts/generate_inapp_help_map.py ist Single Source of Truth für das Mapping.
    - Basis: route-inventory.gen.json (893 Routen) + HELP_MAP Präfix-Tabelle.
    - Längster-Präfix-Algorithmus: spezifischere Routen gewinnen gegen generische.
    - docs-help.ts darf nicht manuell bearbeitet werden — nur via Script regenerieren.
  akzeptanzkriterien:
    - src/lib/docs-help.ts exportiert HelpEntry, ROUTE_HELP_MAP, findHelpEntry, DOCS_BASE_URL.
    - findHelpEntry('verkauf/auftrag/123') gibt Verkaufsauftrag-Eintrag zurück.
    - findHelpEntry('unbekannt/xyz') gibt null zurück.
    - TypeScript compiliert fehlerfrei.

dateibesitz:
  - packages/frontend-web/src/lib/docs-help.ts
  - docs/benutzerhandbuch/in-app-hilfe.md
  - scripts/generate_inapp_help_map.py
  - docs/agent-ops/slices/DOC-INAPP-HELP-002.yaml
