slice_id: INTEGRATION-EVIDENCE-BOARD-001
title: "Qualitäts-Cockpit: Backend-API + Frontend"
priority: P2
owner: Claude Code
status: abgeschlossen
created: "2026-06-26"

goal: >
  Phase 1: GET /admin/quality-evidence/ aggregiert release_evidence.json + doc_drift_report.json.
  Frontend qualitaets-cockpit.tsx zeigt Status-Dashboard mit PASS/WARN/FAIL pro Dimension.

ai_harness:
  fachlicher_vertrag:
    - GET /admin/quality-evidence/ gibt QualityEvidenceSummary mit 6 Dimensionen zurück.
    - Fallback auf Drift-Report wenn release_evidence.json nicht vorhanden.
    - GET /admin/quality-evidence/drift gibt rohen Drift-Report zurück.
    - Frontend aktualisiert automatisch alle 2 Minuten.
  architekturvertrag:
    - Phase 1 rein statisch (CI-Artefakte lesen) — kein Live-Aggregations-Daemon.
    - Abhängigkeit: release_evidence_report.py muss lokal oder via CI laufen.
    - qualitaets-cockpit.tsx ist separate Seite (nicht Umbau von externe-gates.tsx).
    - get_tenant_id Dependency (Linter-Korrektur) statt get_current_user.
  akzeptanzkriterien:
    - app/api/v1/endpoints/quality_evidence.py importierbar.
    - Router in api.py registriert.
    - Frontend-Komponente zeigt Gesamtstatus + Dimensionen-Tabelle.
    - Bei fehlendem Artefakt: 503 mit Hinweis.

dateibesitz:
  - app/api/v1/endpoints/quality_evidence.py
  - app/api/v1/api.py
  - packages/frontend-web/src/pages/admin/qualitaets-cockpit.tsx
  - docs/agent-ops/slices/INTEGRATION-EVIDENCE-BOARD-001.yaml
