slice_id: LOADTEST-STAGING-GATE-001
title: "Erntepeak-Lasttest als externes Staging-Gate haerten"
status: umgesetzt
wave: 42
date: 2026-06-27
owner: Codex
goal: >-
  Den scheduled Erntepeak-Lasttest so absichern, dass fehlende externe
  Staging-Voraussetzungen nicht als Produkt-Performancefehler erscheinen.
file_ownership:
  - .github/workflows/load-test.yml
  - docs/operations/production-readiness-runbook.md
  - docs/project-context/open-gaps-and-known-issues.md
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/LOADTEST-STAGING-GATE-001.yaml
acceptance:
  - Schedule-Lauf prueft STAGING_URL, API_DEV_TOKEN und DNS-Aufloesung vor k6.
  - Fehlt eine externe Voraussetzung, wird der Schedule-Lauf neutral mit Summary beendet.
  - Manuelle harvest-peak-Laeufe bleiben strikt und schlagen ohne Ziel/Token/DNS fehl.
  - Runbook und Open-Gaps verweisen auf das externe Lasttest-Gate.
tests:
  - gh run view 28281650527 --log-failed
  - gh run list --branch main --limit 20
risks:
  - Der echte 500-VU-/800-VU-Lasttest bleibt bis zur Staging-Konfiguration extern offen.
  - DNS- oder Secret-Fehler muessen durch Ops behoben werden; das Repo kann nur korrekt klassifizieren.
external_gates:
  - Repository Secret STAGING_URL
  - Repository Secret API_DEV_TOKEN
  - DNS-Aufloesung des Staging-Hosts im GitHub-Runner
ai_harness:
  fachlicher_vertrag: >-
    Lasttests duerfen nur dann fachliche Performance bewerten, wenn ein echtes,
    erreichbares und authentifiziertes Zielsystem vorliegt.
  architektur_vertrag: >-
    Der Workflow prueft Ziel, Token und DNS vor k6-Installation/Ausfuehrung und
    trennt Schedule-Skip von manuellem Fail-Fast.
  daten_vertrag: >-
    Keine Datenmodell- oder Migrationsaenderung.
  test_vertrag: >-
    Vorheriger roter Lauf zeigte DNS-Fehler und leeres API_DEV_TOKEN; der
    naechste Schedule muss diese Situation als externes Gate dokumentieren.
  security_vertrag: >-
    Keine Secrets werden ausgegeben; nur Vorhandensein und Host-Aufloesung
    werden geprueft.
  betriebs_vertrag: >-
    Aktiver Lasttest benoetigt Ops-Bereitstellung von STAGING_URL, API_DEV_TOKEN
    und DNS-Erreichbarkeit.
  dokumentations_vertrag: >-
    Workboard, Runbook und Open-Gaps enthalten Ursache, Repo-Fix und externe
    Restvoraussetzungen.
