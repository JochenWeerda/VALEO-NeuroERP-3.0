  Abschluss von FEED-ACT-030: FEED-CONS-031 (oder 034, falls Integrations-
  strang priorisiert wird).
acceptance:
  - "Jede offene Lastenheft-Anforderungsgruppe der Traceability ist genau
    einem Folge-Slice oder einem explizit externen Gate zugeordnet."
  - "Slice-IDs kollisionsfrei zur bestehenden Nummernserie (007-038 belegt;
    039-049 vergeben)."
  - "Codex-WIP (FEED-ACT-030) unangetastet: Commit enthaelt ausschliesslich
    Plan, YAML und Workboard."
tests:
  - "Docs-Governance-/Markdown-Gates im Commit; kein Code geaendert."
risks:
  - "FEED-AI-046 und FEED-PERF-044 haengen fachlich an Datengrundlagen aus
    032/033/035 — Reihenfolge im Graph verbindlich."
external_gates: >-
  DDW-Partnervertrag (FEED-INT-003), Benchmark-Opt-in (FEED-PERF-044),
  IdP-Rollenzuweisung, Pilotabnahme durch Fuetterungsberater (FEED-REL-047).
ai_harness:
  fachlicher_vertrag: >-
    Die Restplanung deckt den kompletten Lastenheft-Prozess bis Bericht,
    Beratung, Integration und Pilot ab; nichts wird als erfuellt geplant,
    was ein externes Gate braucht.
  architektur_vertrag: >-
    Alle Folge-Slices bauen additiv auf den Aggregaten aus Inkrement 1-4 auf;
    keine neuen Parallelwelten; Meridian-Kette und Schichtenregel gelten.
  daten_vertrag: not_applicable
  security_vertrag: not_applicable
  betriebs_vertrag: >-
    Rollout ausschliesslich ueber Inkrement 8 (Flag + Pilot).
  dokumentations_vertrag: >-
    implementation-plan.md ist die kanonische Slice-Spec-Quelle; Traceability
    wird je Umsetzungs-Slice fortgeschrieben.
  test_vertrag: >-
    TDD-Pflicht und DoD (Lastenheft Kap. 15) gelten unveraendert je Slice.
