slice_id: MCP-ERP-TOOLS-001
title: "MCP Tool-Katalog YAML (app/config/mcp_erp_tools.yaml)"
priority: P2
owner: Claude Code
status: abgeschlossen
created: "2026-06-26"

goal: >
  GET /api/v1/mcp/tools lieferte 500 weil app/config/mcp_erp_tools.yaml fehlte.
  McpToolRegistryService wirft FileNotFoundError ohne diese Datei.
  Dieser Slice erstellt die YAML-Datei mit 21 validen ERP-Tool-Definitionen (6 Domains).

ai_harness:
  fachlicher_vertrag:
    - GET /api/v1/mcp/tools liefert 200 mit 21 Tool-Eintraegen.
    - Alle Eintraege valide gemaess McpToolValidationError-Pruefung.
  architekturvertrag:
    - Nur YAML-Datei angelegt, kein Code geaendert.
  akzeptanzkriterien:
    - GET /api/v1/mcp/tools 200 (statt 500 FileNotFoundError).

dateibesitz:
  - app/config/mcp_erp_tools.yaml
  - docs/agent-ops/slices/MCP-ERP-TOOLS-001.yaml
