slice_id: MCP-CUSTOMER-OPEN-20261008
id: MCP-CUSTOMER-OPEN-20261008
title: MCP Kunde oeffnen (Navigation/Aufloesung)
status: abgeschlossen
owner: Cursor
date: 2026-10-08
created_at: 2026-10-08
closed_at: 2026-10-08
goal: >
  crm.customer.open an den authentifizierten MCP-Execution-Service anbinden:
  Kunden im Token-Mandanten aufloesen und kanonische Masken-Route sowie
  Screen-ID liefern. Kein Schreiben, kein FIBU-Journal (kein ADR-076).
file_ownership:
  - app/services/mcp_execution_service.py
  - config/mcp_erp_tools.yaml
  - tests/test_mcp_execution.py
  - tests/test_mcp_tool_registry.py
  - services/ki-usability/app/services/action_registry.py
  - services/ki-usability/tests/test_voice_intent_verkauf_crm.py
  - docs/quality-assurance/mcp-customer-open-20261008.md
  - docs/schnittstellen/mcp-tools.md
  - docs/agent-handbuch/
  - docs/project-context/open-gaps-and-known-issues.md
  - docs/agent-ops/active-workboard.md
acceptance:
  - dryRun und execute schreiben nicht (kein Commit, kein mcp_tool_executions-Insert)
  - Kunde nur aus domain_crm.customers des Token-Mandanten
  - Antwort enthaelt customer_id, kunden_nr, name, route_path, screen_id
  - route_path = /crm/customers/{id}; screen_id = crm/customer-360
  - fehlender/fremder Kunde → 404; Scope crm:read; tenant_id/mandanten_id in Parametern → 422
  - Tool-Count 21; Registry-Validierung gruen
tests:
  - tests/test_mcp_execution.py
  - tests/test_mcp_tool_registry.py
risks:
  - Voice-Phrase-Tuning und Frontend-Navigate-Verdrahtung bleiben Folge-Slices
  - Uebrige Read-Katalog-Tools ohne Adapter bleiben 501
ai_harness:
  fachlicher_vertrag: >
    Agent darf einen Kunden im Mandanten aufloesen und die Masken-URL nennen;
    keine Stammdatenmutation.
  architektur_vertrag: >
    Zentraler Adapter in mcp_execution_service; Katalog allein schreibt nie.
  daten_vertrag: >
    Mandanten-ID aus Token; SELECT FOR SHARE auf domain_crm.customers.
  test_vertrag: >
    HTTP-Vertraege fuer dryRun, execute, 403/404/422 und Scope.
  security_vertrag: >
    Scope crm:read; Header=Claim; keine Client-Mandanten-Parameter.
  betriebs_vertrag: >
    Keine neue DB/Container/Migration.
  dokumentations_vertrag: >
    QA, Open-Gaps, Workboard, Katalog und Handbuch nachgezogen.
external_gates:
  - not_applicable
result: >
  47 MCP-Tests und 24 Voice-CRM-Tests gruen. crm.customer.open verdrahtet
  (read-only Route/Screen); Katalog 21 Tools; Handbuch und mcp-tools.md aktuell.
