slice_id: SERVICE-FASTAPI-STARLETTE-20260914
id: SERVICE-FASTAPI-STARLETTE-20260914
title: Den fastapi- und starlette-Altbestand der Service-Manifeste auf den Stand der Wurzel heben
owner: Cursor Auto
status: in arbeit
created_at: "2026-09-14"
started_at: "2026-09-14"
goal: >-
  Die Service-Manifeste unter services/ standen auf fastapi 0.104.1 und 0.115.4
  mit starlette 0.27, waehrend die Wurzel bereits fastapi 0.136.3 mit starlette
  1.3.1 fuehrte. Diese Spreizung war die Ursache dafuer, dass Advisories gegen
  starlette in den Diensten offen blieben, obwohl die Wurzel sie geschlossen
  hatte. Ziel ist ein einheitlicher Stand ueber alle 23 Manifeste und der
  Nachweis, dass der Sprung keinen Dienst bricht.
coordination: >-
  Fortsetzung von SERVICE-CVE-PINS-20260914 und damit derselbe Zuschnitt: die
  Python-Service-Manifeste. Codex hat die Node-Welle am 2026-09-14
  abgeschlossen und die Python-Service-Pins ausdruecklich als fremden Bereich
  gekennzeichnet. Frontend-Quellcode bleibt bei Claude Code. Der httpx- und
  uvicorn-Altbestand ist in diesem Slice ausdruecklich nicht enthalten, siehe
  bewusst_ausgeklammert - er wuerde den Nachweis dieser Welle nicht mehr
  zuordenbar machen.
file_ownership:
  - docs/agent-ops/slices/SERVICE-FASTAPI-STARLETTE-20260914.yaml
  - "docs/agent-ops/active-workboard.md: nur die eigenen Abschnitte"
  - services/compliance/infrastat/requirements.txt
  - services/compliance/zoll/requirements.txt
  - services/crm-ai/requirements.txt
  - services/crm-analytics/requirements.txt
  - services/crm-communication/requirements.txt
  - services/crm-consent/requirements.txt
  - services/crm-core/requirements.txt
  - services/crm-gdpr/requirements.txt
  - services/crm-marketing/requirements.txt
  - services/crm-multichannel/requirements.txt
  - services/crm-sales/requirements.txt
  - services/crm-security/requirements.txt
  - services/crm-service/requirements.txt
  - services/crm-workflow/requirements.txt
  - services/dms-adapter/requirements.txt
  - services/finance/requirements.txt
  - services/finance/fibu-core/requirements.txt
  - services/finance/fibu-gateway/requirements.txt
