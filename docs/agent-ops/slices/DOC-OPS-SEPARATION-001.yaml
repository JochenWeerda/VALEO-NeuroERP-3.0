slice_id: DOC-OPS-SEPARATION-001
title: "Trennung Entwicklungs-Gap-Track vs. operative Go-Live-Gates"
status: umgesetzt
wave: 35
date: 2026-06-27
owner: Claude Code
goal: >-
  Entwicklungs-Gaps und operative Go-Live-Gates sauber trennen, damit
  produktionsrelevante externe Freigaben im Runbook und nicht als offene
  Entwicklungsarbeit gefuehrt werden.
file_ownership:
  - docs/project-context/open-gaps-and-known-issues.md
  - docs/operations/production-readiness-runbook.md
  - docs/agent-ops/slices/DOC-OPS-SEPARATION-001.yaml
acceptance:
  - open-gaps-and-known-issues.md verweist fuer externe Go-Live-Gates auf das Runbook.
  - production-readiness-runbook.md enthaelt konsolidierte externe Gate-Tabellen.
  - Keine Code- oder Datenbanklogik wird geaendert.
tests:
  - mkdocs build
  - node scripts/docs-governance-check.cjs
risks:
  - Operative Gate-Informationen koennen wieder in Entwicklungs-Gap-Listen driften.
external_gates:
  - Infrastruktur/Deployment
  - Integration/Schnittstellen
  - HRM/Payroll
  - UAT/Abnahmen
  - Externe Behoerden/Compliance
ai_harness:
  fachlicher_vertrag: >-
    Externe Go-Live-Abhaengigkeiten muessen als operative Readiness-Gates
    sichtbar bleiben, ohne den Entwicklungs-Gap-Track zu blockieren.
  architektur_vertrag: >-
    Aenderungen bleiben auf Dokumentationsstruktur und Verweise begrenzt.
  daten_vertrag: >-
    Keine produktiven Daten, Migrationen oder Schemaaenderungen.
  test_vertrag: >-
    MkDocs-Build und Docs-Governance pruefen Renderbarkeit, Navigation und Slice-Struktur.
  security_vertrag: >-
    Keine Secrets oder produktiven Zugangsdaten in den Gate-Tabellen.
  betriebs_vertrag: >-
    Operative Gates werden im Production-Readiness-Runbook gepflegt.
  dokumentations_vertrag: >-
    Open-Gaps-Datei, Runbook und Slice-YAML bleiben gegenseitig referenzierbar.

claim: >
  Operative Abhängigkeiten (externe Live-Gates, UAT-Unterschriften,
  Behördenabnahmen, Steuerberater-Freigaben) werden nicht mehr im
  Entwicklungs-Gap-Track geführt. Sie sind konsolidiert im Production-Readiness-Runbook.

contracts:
  scope: |
    - docs/project-context/open-gaps-and-known-issues.md (P4-Abschnitt umgebaut,
      Querverweise auf externe Gates durch kompakte Runbook-Verweise ersetzt)
    - docs/operations/production-readiness-runbook.md (neuer Abschnitt
      "Externe Go-Live Gates" mit vollstaendigen Gate-Tabellen)
  out_of_scope: |
    - Kein Code geaendert
    - Keine neuen Abhaengigkeiten eingefuehrt
  acceptance: |
    - open-gaps-and-known-issues.md enthaelt keinen P4-Abschnitt mehr
    - production-readiness-runbook.md hat Abschnitt "Externe Go-Live Gates"
      mit Gate-Tabellen fuer Infra, Integration, HRM, UAT und Compliance
    - Alle Querverweise in open-gaps-and-known-issues.md zeigen auf Runbook-Anker

changes:
  - file: docs/project-context/open-gaps-and-known-issues.md
    type: refactor
    description: >
      P4-Abschnitt durch kompakten Verweis auf Runbook ersetzt;
      "Extern offen bleiben"-Texte in PROD-READINESS-001 und HR-TIME-001
      durch einzeilige Runbook-Verweise ersetzt; DOM-004 "extern gegated"-Note
      verschlankt.
  - file: docs/operations/production-readiness-runbook.md
    type: addition
    description: >
      Neuer Abschnitt "Externe Go-Live Gates" mit fuenf Gate-Tabellen:
      Infrastruktur/Deployment, Integration/Schnittstellen, HRM/Payroll,
      UAT/Abnahmen, Externe Behoerden/Compliance.
