slice_id: UIX-072
title: Diktat & Sprach-Eingabe V1/V2 (VoiceBar)
owner: Claude
status: in_arbeit
created_at: 2026-07-07
spec: docs/design/specs/uix-m2-spec.md
coordination: >-
  Teil des UIX-Zukunft-Programms (UIX-ZUKUNFT-VISION-001). Vor Umsetzung Owner
  eintragen, Claim sofort committen; Abhaengigkeiten laut Roadmap beachten.
goal: >-
  VoiceBar-Primitive mit SttProvider-Adapter (webspeech default, Server-Gateway optional): Diktat in Felder/Omnibox, Read-only-Sprachnavigation.
file_ownership:
  - "packages/frontend-web/src/lib/voice/**"
  - "packages/frontend-web/src/components/mask-builder/renderers/**"
  - "app/api/v1/endpoints/voice_transcribe.py"
acceptance:
  - "Transkript immer sichtbar/editierbar vor Uebernahme; keine Action-Ausfuehrung (V3 ist UIX-080)."
  - "Kein Audio-Persist; Telemetrie ohne Transkript-Inhalte."
  - "Fallback-Kette webspeech->server->disabled je Tenant-Config."
  - "Tastatur-Alternative fuer jede Voice-Funktion."
tests:
  - "Vitest FakeSttProvider-Sequenzen"
  - "Playwright Diktat+Navigation mit Stub"
  - "pytest voice/transcribe (falls Server-Provider aktiviert)"
progress: >-
  2026-07-07 Sicherheits-Kern geliefert (Frontend, kollisionsarm): lib/voice/
  stt-provider.ts (SttProvider-Adaptervertrag + FakeSttProvider-Double +
  selectSttProvider Fallback-Kette webspeech→server→disabled; Datenschutz-
  Vertrag dokumentiert, VoiceTelemetry ohne Transkript-Inhalt). lib/voice/
  voice-navigation.ts: compileVoiceNavigation ist der HARTE Voice-Gate —
  Praefix-Grammatik (oeffne/zeige/filtere/suche) + ruft NUR den Navigations-
  Compiler und gibt per Typ ausschliesslich navigate|none zurueck ("Danger nie
  per Stimme"; Command-Sprache waere UIX-080). 12 Vitest inkl. Sicherheits-
  Assertion (Aktions-Verben ueber Voice ergeben nie ein Command). tsc 0, ESLint
  sauber. OFFEN: VoiceBar-Renderer (Push-to-talk, Live-Transkript editierbar,
  prefers-reduced-motion), shell.voice-Capability, WebSpeech-Provider-Impl,
  optional Server-Provider /voice/transcribe, Playwright Provider-Stub.
risks:
  - Geteilter Working Tree mit Parallel-Agenten — Branch vor Commit pruefen.
  - Scope-Kriechen: ein Slice = ein Push-Zyklus; Folgearbeit als neuer Slice.
ai_harness:
  fachlicher_vertrag: >-
    Haende auf der Tastatur oder am Telefon: Diktat und 'zeige offene Posten' funktionieren ueberall.
  architektur_vertrag: >-
    Single Source of Truth bleibt ScreenDefinition -> RenderPlan -> useUniversalMaskRuntime -> UniversalMaskRenderer. Neue Faehigkeiten sind Contract-Felder + Compiler-Ableitungen + Renderer-Primitive + Gates — kein Parallelsystem, keine Seiten-Kopien.
  daten_vertrag: >-
    shell.voice-Capability additiv; Audio wird nie gespeichert; Provider-Konfig je Tenant wie LLM-Gateway.
  test_vertrag: >-
    Provider-Fakes machen die Pipeline deterministisch testbar.
  security_vertrag: >-
    Keine neuen Secrets, Tenant-Isolation in jedem neuen Endpoint (Pflichttest), dangerLevel/Confirmation/AuditReason unveraendert; NL-/Voice-/Agent-Pfade duerfen Gates nie verkuerzen.
  betriebs_vertrag: >-
    quality-gate, universal-mask-ci, runtime-sweep und Performance-Gates bleiben gruen; neue GETs 0x5xx; Rollback ueber Feature-Flags bzw. native Route-Rollback-Matrix.
  dokumentations_vertrag: >-
    Workboard + Slice-YAML + betroffene Statusdoku (universal-mask-runtime-status, Agent-Handbuch-Generatoren) im selben Push synchronisieren.
external_gates:
  - not_applicable
