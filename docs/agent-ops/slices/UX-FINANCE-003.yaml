id: UX-FINANCE-003
title: Mahnwesen mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-14
goal: >
  Mahnwesen als dritte Finance-Arbeitsflaeche auf den UX-Exzellenzbaukasten
  ziehen: Rollenfokus, Mahn-Aufgabenplan, Eskalationsentscheidung, Next Action
  und CRUD-/Kommunikationsabdeckung.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-FINANCE-003.yaml
  - packages/frontend-web/src/pages/finance/mahnwesen.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Mahnwesen zeigt Rollenfokus fuer FIBU, Forderungsmanagement, Vertrieb, Leitung und Steuerbuero.
  - Aufgabenplan fuehrt OP-Auswahl, Parameter, Versand/Eskalation und Zahlungsklaerung.
  - Managemententscheidung zeigt sendbar/gestoppt.
  - CRUD-/Kommunikationsabdeckung ist sichtbar.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - git diff --check
done:
  - finance/mahnwesen.tsx nutzt Rollenfokus, Mahn-Aufgabenplan, Eskalationsentscheidung, Next Action und CRUD-/Kommunikationsabdeckung aus dem UX-Baukasten.
  - Bestehende Mahnlage, Kontext, FIBU-KPIs, Versand-, Paid-, Export- und Inkasso-Aktionen bleiben erhalten.
  - UX-Standard markiert UX-FINANCE-003 als abgeschlossen.
risks:
  - Periodenabschluss folgt in separatem Finance-UX-Slice.
