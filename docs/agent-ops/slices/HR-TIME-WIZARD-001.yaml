slice_id: HR-TIME-WIZARD-001
title: "HR-TIME UX-M3 — Gefuehrter Planungswizard (5 Schritte)"
status: umgesetzt
wave: 41
date: 2026-06-27
owner: Claude Code
goal: >-
  5-Schritt-Inline-Wizard im Planung-Tab: Zeitraum → Bedarf (Rollen/Headcount/Zeiten)
  → Praeferenzen → Vorschau → Abschluss. Mutation via useCreateWorkPlanAssignment
  mit vollem Lifecycle-Guard (isPending + disabled).
file_ownership:
  - packages/frontend-web/src/lib/api/personal.ts
  - packages/frontend-web/src/pages/personal/zeiterfassung.tsx
  - docs/project-context/hr-time-ux-workflow-roadmap-2026-05-12.md
  - docs/agent-ops/slices/HR-TIME-WIZARD-001.yaml
acceptance:
  - Button "Neuen Arbeitsplan erstellen" oeffnet Wizard-Card im Planung-Tab.
  - Fortschrittsbalken zeigt aktuellen Schritt (1–5).
  - Schritt 1: Von/Bis Datumsauswahl.
  - Schritt 2: Rollen-/Headcount-/Zeitgitter mit dynamischen Zeilen.
  - Schritt 3: Checkboxen Nacht/LKW + Freitexthinweis.
  - Schritt 4: Vorschau aller geplanten Eintraege.
  - Schritt 5: Zusammenfassung + "Arbeitsplan anlegen"-Button (isPending-Guard).
  - useCreateWorkPlanAssignment Hook in personal.ts.
  - tsc --noEmit exit 0.
  - UX-M3 in hr-time-ux-workflow-roadmap als umgesetzt markiert.
tests:
  - tsc --noEmit (exit 0 verified)
ai_harness:
  fachlicher_vertrag: >-
    Wizard erstellt WorkPlanAssignment-Eintraege pro Rolle und Headcount-Zahl.
    employeeRef wird als Platzhalter (tbd-{role}-{i}) gesetzt — Dispatcher
    weist konkrete Mitarbeiter im Folgeschritt zu.
  architektur_vertrag: >-
    Mutation-Lifecycle-Invariant (CLAUDE.md) eingehalten: isPending + disabled
    + mutateAsync in try/catch. Wizard-State ist lokal (useState), kein globaler Store.
    Kein neuer API-Endpoint noetig — POST /api/v1/personal/work-plan/assignments
    ist canonically vorgesehen.
  daten_vertrag: >-
    WorkPlanAssignmentInput: datum, employeeRef, label, startTime, endTime,
    roleCode, notes. onSuccess invalidiert workPlan + timeCockpit Queries.
  test_vertrag: >-
    TypeScript 0 Fehler. Mutation-Guard via isPending.
  security_vertrag: >-
    Kein neuer Endpoint. Tenant-Isolation via bestehende Bearer-/Tenant-Middleware.
  betriebs_vertrag: >-
    employeeRef-Platzhalter sind erkennbar (tbd-*). Dispatcher muss konkrete
    Zuweisung vornehmen — folgt in Folge-Slice HR-TIME-ASSIGN-001.
  dokumentations_vertrag: >-
    hr-time-ux-workflow-roadmap UX-M3 als umgesetzt markiert.
