  - tests/test_welle8_schema_drift.py
  - tests/test_dom_inv_004.py
risks:
  - >-
    Die Sanktionspruefung antwortet bei fehlender Liste jetzt mit 503 statt mit
    einer Freigabe. Aufrufer, die bisher stillschweigend weiterliefen, sehen ab
    jetzt einen Fehler. Das ist gewollt: eine nicht geprueft Liste ist kein
    "kein Treffer".
  - >-
    Relative Testdaten koennen eigene Zeitfallen tragen, etwa an Monatsgrenzen.
    Die Fenster sind deshalb bewusst grosszuegig gewaehlt und die
    Konfliktfaelle setzen ihre Daten weiterhin ausdruecklich.
  - >-
    Die Altfelder des Bestandshauptbuchs bleiben bestehen. Wer sie kuenftig
    beschreibt, erzeugt widersprechende Paare; die Aufloesung weist das aus,
    verhindert es aber nicht.
ai_harness:
  fachlicher_vertrag: >-
    Ein Test, der nur zufaellig gruen war, hat nie etwas abgesichert. Wo eine
    Regel gilt, wird sie ausdruecklich geprueft — Planversions-Sperre und
    geschlossener Ausfall der Sanktionspruefung.
  architektur_vertrag: >-
    Testdoubles folgen dem typisierten Vertrag des Endpunkts, nicht einer
    fruehen Vorstellung davon. Die Aufloesung des Belegbezugs liegt zentral in
    app/services/inventory_document_reference.py.
  daten_vertrag: >-
    Keine Spalte entfernt, keine Migration umgeschrieben, keine historische
    Buchung umgedeutet. Widersprechende Belegpaare werden ausgewiesen.
  test_vertrag: >-
    Fixtures beziehen zeitabhaengige Daten auf den Testzeitpunkt; Konfliktfaelle
    setzen ihre Daten ausdruecklich. Generationsabhaengige Spalten werden in der
    Deckungspruefung auf beiden Seiten herausgerechnet.
  security_vertrag: >-
    Compliance-Kontrollen fallen geschlossen aus. Ein Status, auf den Aufrufer
    reagieren, darf keine Freigabe suggerieren, die nie geprueft wurde.
  betriebs_vertrag: >-
    Der Backend-Job bleibt blockierend. Die 503-Antwort der Sanktionspruefung
    ist ein Betriebssignal: sie zeigt eine fehlende Migration oder Datenlage an.
  dokumentations_vertrag: >-
    Workboard und dieses YAML nennen den Abgleich der Fehlerzahl, die vier
    Ursachengruppen und die zwei geschlossenen Pruefluecken.
external_gates:
  - >-
    Der vollstaendige Nachweis ist der Backend-Job in der CI; lokal sind die
    betroffenen Suiten gruen, der Volllauf braucht Postgres.
  - >-
    Ob historische Zeilen widersprechende Belegpaare tragen, zeigt erst die
    Bestandsdatenbank. Die Aufloesung weist solche Faelle aus; ihre Klaerung ist
    eine fachliche Entscheidung mit Beleg.
