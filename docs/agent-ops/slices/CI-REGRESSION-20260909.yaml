ausloeser: >-
  Nach dem Schliessen der Doku- und Architektur-Gates erreichte der Backend-Job
  erstmals seit Wochen den Testlauf und meldete 28 Fehler bei 13.348 bestandenen
  Tests.
befund:
  abgleich: >-
    28 Fehler gesamt. Fuetterung 16, CRM 4, Masken/Compliance 3,
    Bestandshauptbuch 5 (drei in test_dom_inv_004, zwei in
    test_welle8_schema_drift). Eine fruehere Aufteilung mit 11 fuer die
    Fuetterung war zu niedrig.
  fuetterung_zeitbombe: >-
    Elf der 16 Fuetterungsfehler hatten eine gemeinsame Ursache: Fixtures
    publizierten Plaene mit festem Kalenderfenster und buchten Ist-Fuetterungen
    mit "jetzt". Seit dem 1. September war das Fenster verstrichen und die
    Sperre gegen veraltete Planversionen griff — zu Recht. Dabei fiel auf, dass
    die Sperre keinen eigenen Test hatte; sie war nur zufaellig beruehrt worden.
  fuetterung_uebrige: >-
    Zwei Maskentests prueften das Vokabular vor der zentralen Normalisierung aus
    L3-VISUAL-PARITY-AUDIT-031; zwei Grant-Tests liefen gegen Doubles, die den
    RETURNING-Lesepfad und die Master-Data-Audit-Ereignisse nicht kannten; ein
    Abloesetest gab der Nachfolgeversion ein bereits abgelaufenes Fenster.
  crm: >-
    Vier Doubles lieferten {"items": [...]}, wo die Response-Model-Typisierung
    list[...] verlangt. FastAPI quittierte das mit 500 — die Endpunkte waren in
    Ordnung.
  sicherheitsbefund: >-
    Die Sanktionspruefung lieferte bei nicht erreichbarer Sanktionsliste
    status="KEIN_TREFFER" mit erklaerendem Text. Der Text half nur Menschen; ein
    Aufrufer, der auf status reagiert, haette die Geschaeftsbeziehung
    freigegeben, ohne dass je eine Liste geprueft wurde. Der zugehoerige Test
    hielt dieses Verhalten sogar als "graceful" fest.
  auffindbarkeit: >-
    Elf native Fuetterungsmasken hatten keine kuratierten Omnibox-Synonyme; das
    Programm brachte die Masken mit, die Suchbegriffe nicht.
  bestandshauptbuch: >-
    Drei Tests standen auf Spaltennamen, die Welle 8 als nicht existent
    nachgewiesen hatte. Zwei weitere waren ein bewusster Stolperdraht gegen das
    Wiederauftauchen der historischen Belegfelder in einer frisch migrierten
    Datenbank.
  messung_vorher:
    fehler: 28
    bestanden: 13348
  messung_nachher:
    lokal_gruen: "alle 28 in ihren Suiten"
result: >-
  Alle 28 Fehler ursaechlich behoben. Kein Test uebersprungen, keine Schwelle
  gesenkt, keine Erwartung abgeschwaecht ohne dokumentierte fachliche Aenderung.
  Zwei Luecken wurden dabei geschlossen, die vorher niemand geprueft hat: die
  Planversions-Sperre hat jetzt einen eigenen Regressionstest, und die
  Sanktionspruefung faellt geschlossen aus.
acceptance:
  - Die Planversions-Sperre bleibt erhalten und ist ausdruecklich getestet
  - Kein 500er wird durch leere Listen oder pauschale Erfolgsmeldungen verdeckt
  - Freigabe-, Rollen- und Nachweisanforderungen bleiben unveraendert bestehen
  - Historische Belegbezuege bleiben erhalten und aufloesbar
  - Frisch migrierte und gewachsene Datenbank erfuellen denselben Vertrag
tests:
  - tests/test_feeding_actual_api.py
  - tests/test_feeding_supply_api.py
  - tests/test_feeding_measure_lifecycle_api.py
  - tests/test_feeding_plan_api.py
