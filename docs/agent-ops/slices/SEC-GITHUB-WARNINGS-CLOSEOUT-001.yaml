progress: >-
  2026-07-10 reserviert. Erste GitHub-Bestandsaufnahme: Dependabot 0 offen,
  Secret Scanning 0 offen. Rot auf main: Quality Gate (SQL f-string Gate),
  CI/CD Pipeline (pytest/pytest-asyncio Dependency-Konflikte plus Seed-Step),
  Docs Build (Code-Inventar-Drift). Code-Scanning enthaelt viele Trivy/Grype
  Container-/OS-Paketfunde sowie konkrete SonarCloud-Highs.
  2026-07-10 umgesetzt: SQL-f-string-Gate durch statische SQL-Statements/
  Allowlist-Queries geschlossen; Code-Inventare regeneriert; pytest-asyncio
  Service-Pins auf pytest 9 kompatibel gemacht; FIBU-Requirements-Pfade und
  NATS-Package korrigiert; Inventory-Seed schreibt integer-kompatible
  Lagerbestaende; Root-Dockerfile auf python:3.13.14-slim-bookworm plus
  apt/pip upgrade gehaertet; Trivy-SARIF-Uploads auf ignore-unfixed an
  bestehende Gate-Policy angeglichen; Sonar-Highs fuer 0.0.0.0-Direktstarts,
  eingebettete DB-Passwort-Defaults, JWT-Algorithmen, statischen
  Encryption-Master-Key, Path-Injection und Loop-Bounds priorisiert behoben.
