risks:
  - "Container-Scanner melden historische Base-Image-/OS-Funde erst nach erneutem SARIF-Upload/Rescan geschlossen."
  - "Vollstaendiger Root-Runtime-Docker-Build wurde lokal nach 10 Minuten Tool-Timeout abgebrochen; Builder-Stage mit Requirements ist gruen, Runtime-Export muss CI final bestaetigen."
  - "GitHub Actions koennen durch parallel laufende Auto-Commits neue Drift erzeugen."
external_gates:
  - "GitHub Actions nach Push: Docs Build, Docs Governance, Quality Gate, CI/CD Pipeline, Security Scan, SonarCloud, Dependency Graph Rescan."
ai_harness:
  fachlicher_vertrag: >-
    GitHub-Warnungen sind produktionsnahe Governance-Signale. Echte
    Abhaengigkeits-, Seed-, Doku- und Sicherheitsfunde werden im Code behoben;
    nicht fixbare Container-OS-Funde werden nicht als App-Code-Arbeit maskiert,
    sondern ueber die Scan-Policy auf fixbare Vendor-Funde begrenzt.
  architektur_vertrag: >-
    Aenderungen bleiben in CI-/Security-Konfiguration, Backend-Helpern,
    Service-Requirements, CRM-Microservice-Defaults und Doku-Inventaren. Keine
    neuen Domaenen- oder API-Schnittstellen werden eingefuehrt.
  daten_vertrag: >-
    Inventory-Seed bleibt idempotent und veraendert nur Seed-eigene Artikel.
    CRM-DB-Defaults enthalten keine Passwortwerte mehr; echte Credentials
    muessen ueber Umgebung oder Secret-Store kommen.
  security_vertrag: >-
    JWT-OIDC akzeptiert keine Algorithmen aus dem Token-Header ausser einer
    festen asymmetrischen Allowlist. Runtime-/Export-/Report-Pfade werden
    begrenzt. Der Encryption-Master-Key darf nicht aus einem statischen
    Repository-Seed stammen.
  betriebs_vertrag: >-
    Direkte lokale Microservice-Starts binden nur auf Loopback. Container-
    Starts bleiben ueber Dockerfile/Compose gesondert erreichbar. Nicht fixbare
    Container-CVEs werden nicht als blockierende Deploy-Gates behandelt, solange
    kein Vendor-Fix existiert.
  dokumentations_vertrag: >-
    Code-Inventare, Agent-Handbuch und Active Workboard muessen den geaenderten
    API-/Service-/CI-Stand widerspiegeln; Slice-YAML folgt dem AI-Harness-
    Pflichtschema.
  test_vertrag: >-
    Lokale Gates decken die zuvor roten CI-Ursachen ab; GitHub Actions und
    Code-Scanning muessen nach Push die Default-Branch-Schliessung bestaetigen.
