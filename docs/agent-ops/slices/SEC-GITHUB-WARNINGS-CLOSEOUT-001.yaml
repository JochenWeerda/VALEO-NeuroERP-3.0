  Secret Scanning 0 offen. Rot auf main: Quality Gate (SQL f-string Gate),
  CI/CD Pipeline (pytest/pytest-asyncio Dependency-Konflikte plus Seed-Step),
  Docs Build (Code-Inventar-Drift). Code-Scanning enthaelt viele Trivy/Grype
