problem: |
  001_initial_schema.py (Parallel-Branch) legt domain_inventory.warehouses mit
  abgespecktem Schema an: address=JSONB (statt VARCHAR), kein city/postal_code/
  country/contact_person/phone/email/warehouse_type/total_capacity/used_capacity/
  deleted_at. Pydantic Warehouse-Schema erwartet address: Optional[str] —
  model_validate schlug fehl -> ResponseValidationError 500 (Kat-C).

solution: |
  1. app/api/v1/schemas/inventory.py: field_validator("address", mode="before")
     konvertiert JSONB-dict transparent nach str (Rueckwaertskompatibilitaet
     mit 001-Dev-DBs).
  2. warehouse_schema_repair_20260626: CREATE TABLE IF NOT EXISTS fuer frische
     Installs + ALTER TABLE ADD COLUMN IF NOT EXISTS fuer alle fehlenden Spalten
     (idempotent fuer bestehende Dev-DBs).
  3. Mitgenommen: inventory_counts und inventory_stock_movements IF NOT EXISTS
     (gleiche Parallel-Branch-Luecke, ORM-abhaengig).

