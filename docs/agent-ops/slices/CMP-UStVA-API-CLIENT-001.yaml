slice_id: CMP-UStVA-API-CLIENT-001
title: "UStVA-Maske api-client Response-Normalisierung"
owner: —
status: abgeschlossen
wave: 16
updated: 2026-06-26
closed: "2026-06-26"
coordination: >-
  Aus CMP-001 Card (CARD-AUDIT-001). Import ist bereits auf @/lib/api-client;
  Rest-Gap ist inkonsistente .data/.response-Nutzung. Kein Eingriff in
  ELSTER-Produktions-Gate.
goal: >-
  ustva.tsx auf einheitliches apiClient-Response-Pattern umstellen (kein
  doppeltes .data, keine AxiosResponse-Leaks); Ladefehler mit toast() sichtbar.
file_ownership:
  - packages/frontend-web/src/pages/finance/ustva.tsx
  - docs/cards/compliance/CMP-001-compliance-to-report.md
  - docs/project-context/open-gaps-and-known-issues.md
  - docs/agent-ops/slices/CMP-UStVA-API-CLIENT-001.yaml
acceptance:
  - Kein Import von @/lib/axios in ustva.tsx.
  - GET/POST UStVA-Pfade nutzen durchgaengig apiClient ohne response?.data Doppelzugriff.
  - Mutation Lifecycle Invariant (loading/disabled/toast) eingehalten.
  - CMP-001-P1/P2 in Card als behoben markiert.
tests:
  - pnpm --dir packages/frontend-web exec tsc --noEmit --pretty false
risks:
  - Approval/ELSTER-Flow hat viele Action-Handler; Regression nur manuell oder E2E abdeckbar.
external_gates:
  - ELSTER-Testzugang fuer echte Abgabe-Validierung.
ai_harness:
  fachlicher_vertrag: >-
    Die UStVA-Maske darf API-Responses nicht doppelt entpacken und muss
    Lade-/Submitfehler fuer FIBU/Steuerpruefung sichtbar machen.
  architektur_vertrag: >-
    Frontend nutzt den kanonischen apiClient statt Legacy-Axios in der UStVA-
    Maske; ELSTER-Produktionsgate bleibt getrennt.
  daten_vertrag: >-
    Nur UStVA-Response-Payloads und Statusinformationen werden normalisiert;
    keine echten ELSTER-Zertifikate oder Steuerdaten in Tests.
  test_vertrag: >-
    TypeScript-Pruefung und gezielte Code-Suche sichern, dass keine
    AxiosResponse-Leaks verbleiben.
  security_vertrag: >-
    Keine produktiven ELSTER-Zugangsdaten, Zertifikate oder Secrets im Code
    oder in der Dokumentation.
  betriebs_vertrag: >-
    Produktiver ELSTER-Submit bleibt ein externes Betriebs- und
    Steuerberater-Gate.
  dokumentations_vertrag: >-
    Card, Open-Gaps und Slice-YAML halten den geschlossenen CMP-001-P1/P2-Stand
    synchron.
