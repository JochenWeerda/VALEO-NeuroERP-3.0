slice_id: FEED-SPEC-FOUNDATION-014
id: FEED-SPEC-FOUNDATION-014
title: Lastenheft Fuetterungsberatung eingecheckt + IST-Audit + Traceability + Zielarchitektur + Umsetzungsplan
owner: Claude
status: abgeschlossen
created_at: "2026-07-15"
started_at: "2026-07-15"
completed_at: "2026-07-15"
goal: >-
  Der Auftraggeber hat ein verbindliches Lastenheft fuer das integrierte
  Fuetterungsberatungs- und Rationsmanagement-System uebergeben. Gemaess dessen
  Phasen 0-3 werden vor jeder Implementierung die Analyse- und
  Planungsdokumente erstellt und als Single Source of Truth eingecheckt.
scope:
  - "docs/specs/feeding/lastenheft-fuetterungsberatung.md: Lastenheft des
    Auftraggebers inhaltsgetreu eingecheckt (Governance-Frontmatter ergaenzt,
    beim Transport zerbrochene Markdown-Struktur der Kap. 15-18 wiederhergestellt,
    Inhalt unveraendert; MUSS-Anforderungen unangetastet)."
  - "ist-audit.md: datei-evidenzbasierte Landkarte (Fachkern app/agrar/rations
    mit Solver/GfE2023/DLG2025/FAN, 6 Router, 4 Services, 7+ Migrationen,
    ~60 Backend-Testdateien, Frontend-/SD-/Portal-Bestand) + 10 benannte
    technische Schulden/Risiken."
  - "requirements-traceability.md: stabile Requirement-IDs je Lastenheft-
    Kapitel (FEED-RBAC/BUS/HERD/MAT/LAB/REQ/RAT/OPT/EVAL/CMP/PLAN/ACT/PERF/
    CONS/SUP/REP/COLLAB/UI/MOB/INT/AI/NFR), ehrliche Statusverteilung:
    20 VERIFIED / 30 PARTIAL / 9 NOT_IMPLEMENTED / 1 BLOCKED (DDW-Livepfade,
    Partnervertrag) mit Test-/Slice-Nachweisen."
  - "target-architecture.md: Bounded Context Feeding, Aggregat-Zuordnung
    IST->SOLL (additiv, kein Solver-Ersatz), API-Zielbild /api/v1/feeding/*
    mit Alias statt Duplikat, Eventmodell, zweistufiges Rechtekonzept
    (Domaenenrollen + Betriebs-Grants), additive Migrationsstrategie,
    Frontend-Seitenlandkarte, Teststrategie."
  - "implementation-plan.md: Release A/B/C in 6 Inkrementen, 22 geschnittene
    Slices (FEED-CORE-015 ... FEED-INT-036) mit Requirements-Bezug und DoD;
    Feature-Flag feeding_advisory + Pilotabnahme; 3 offene Auftraggeber-Punkte
    benannt (Fodjan-Abgleich, Branch-Strategie, IdP-Rollen)."
  - "README.md: Dokumentlandkarte nach der vorgeschlagenen Fachkonzept-Struktur
    00-17 mit Fuellstand; begruendete Entscheidung fuer inkrementell wachsende
    Spezifikation statt 300-500-Seiten-Vorabwerk (Doku-Drift-Gates des Repos)."
file_ownership:
  - "docs/agent-ops/active-workboard.md"
  - "docs/agent-ops/slices/FEED-SPEC-FOUNDATION-014.yaml"
