progress: >-
  2026-07-15 erstellt. Naechster Schritt laut Plan: Claim FEED-CORE-015
  (FeedingBusiness/Herd-Aggregat + CRM-Bruecke + Grants) als erstes Slice von
  Inkrement 1.
acceptance:
  - "Alle vier vom Lastenheft geforderten Phase-1-3-Dokumente existieren und
    tragen Dateinachweise statt Pauschalaussagen."
  - "Jede Lastenheft-Anforderungsgruppe hat eine stabile ID und einen der
    sieben Statuswerte; kein Status VERIFIED ohne Testnachweis."
  - "Keine MUSS-Anforderung wurde abgeschwaecht oder entfernt."
tests:
  - "Docs-Governance-Check (pre-commit) fuer alle 6 Dokumente gruen."
  - "Kein Code geaendert — Implementierung beginnt erst mit FEED-CORE-015
    (Lastenheft Kap. 14 Punkt 16)."
risks:
  - "Fodjan-Quelle nicht abrufbar — Traceability gegen die Hilfe steht aus
    (Lastenheft Kap. 17); Lastenheft selbst als Referenzrahmen verwendet."
  - "Branch-Strategie des Lastenhefts (Feature-Branch) weicht von der
    etablierten Trunk-Praxis ab — als offener Auftraggeber-Punkt dokumentiert."
external_gates: not_applicable
ai_harness:
  fachlicher_vertrag: >-
    Die Spezifikation bildet den durchgaengigen Prozess Betrieb->Analyse->
    Ration->Freigabe->Fuetterung->Controlling->Beratung->Bericht ab; bestehende
    fachlich korrekte Berechnungen bleiben unangetastet.
  architektur_vertrag: >-
    Kein Big-Bang: neue Aggregate docken additiv an den bestehenden Fachkern;
    /feeding-API als Alias-Schicht statt Duplikat; Schichtenregel
    patterns/mask-builder gilt; kein Solver-Ersatz ohne belegten Bedarf.
  daten_vertrag: >-
    Nur additive Migrationen; freigegebene Versionen unveraenderlich; neue
    Geldwerte Decimal; Einheiten als Daten.
  security_vertrag: >-
    Zweistufiges Rechtemodell (Domaenenrollen serverseitig, Betriebs-Grants
    geplant); Tenant-Isolation unveraendert.
  betriebs_vertrag: >-
    Feature-Flag feeding_advisory + Pilotmandant vor Breitenaktivierung;
    Rollback je Slice = Revert.
  dokumentations_vertrag: >-
    docs/specs/feeding/ ist Single Source of Truth; Traceability wird je Slice
    fortgeschrieben; Paritaetsmatrix bleibt Betriebs-Sicht.
  test_vertrag: >-
    VERIFIED nur mit Code- und Testnachweis; je Inkrement Golden-/Property-/
    RBAC-/axe-/Playwright-Nachweise gemaess Teststrategie.
