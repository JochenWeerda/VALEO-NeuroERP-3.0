  architektur_vertrag: Bestehende Finance-Grenze; gespeicherter Link und zentrale DTOs, keine neue Maske.
  daten_vertrag: Composite-Tenant-FK, keine geratene Rueckfuellung oder stiller Alias-Fallback.
  test_vertrag: Reale PostgreSQL-Migration, Zustandsvergleiche, Widersprueche und Maskenfehlerfaelle.
  security_vertrag: Header-Tenant, kontogebundener Auszug, kein SQL-Leak und kein Abgleich-DML.
  betriebs_vertrag: Gemeinsamer valeo_probe, eigene Schemas, keine neue DB/Dockerinstanz oder gemeinsame Migration.
  dokumentations_vertrag: ADR, Domain-API, QA, Slice, Workboard und Open-Gaps mit Integrationsvorbehalt.
