id: UX-DMS-001
title: Dokumente und DMS mit UX-Exzellenzbaukasten
owner: Codex
status: reserviert
created: 2026-05-15
goal: >
  Dokumente/DMS als gefuehrte Arbeitsflaechen fuer Klassifikation, Retention,
  Version, Vorlage, Freigabe und naechste Aktion in normaler Buero-Sprache
  fuehren.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-DMS-001.yaml
  - packages/frontend-web/src/pages/document.tsx
  - packages/frontend-web/src/pages/admin/setup/dms-integration.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Dokumentenpanel zeigt Rollenfokus, Klassifikations-/Retentionplan, Freigabeentscheidung, Next Action und Nachweislink.
  - DMS-Integration zeigt Einrichtungsplan, Betriebsentscheidung, Next Action und CRUD-/Workflow-Abdeckung.
  - Bestehende Upload-, Suche-, Scan-, Loesch- und Verbindungsfunktionen bleiben erhalten.
  - Sprache vermeidet technische Innenbegriffe, wo normale Buero-Sprache reicht.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-DMS-001.yaml
  - git diff --check
risks:
  - Dokumente/Ablage hat bereits einen operativen Nachweisrahmen; dieser Slice fokussiert zentrale QM-Dokumente und technische DMS-Anbindung.
