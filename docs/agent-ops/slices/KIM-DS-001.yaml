slice_id: KIM-DS-001
title: KIM 360°-Cockpit auf VALEO-Designsystem + Listen-Performance
owner: Claude
status: completed
goal: >-
  Das unter /crm fuehrende KIM-360-Cockpit von der portierten systemERP-L3-
  Terminal-Optik vollstaendig auf das VALEO-Designsystem umbauen (DS-Komponenten,
  Semantik-Farbtokens, Dark-Mode, PageToolbar-/Dialog-Muster) und die wahrgenommene
  Ladeperformance der grossen Debitorenliste reduzieren.
