  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/KIM-DS-001.yaml
  - packages/frontend-web/package.json
  - packages/frontend-web/src/pages/crm/kim/index.tsx
  - packages/frontend-web/src/pages/crm/kim/components/CustomerListSidebar.tsx
  - packages/frontend-web/src/pages/crm/kim/components/CustomerHeader.tsx
  - packages/frontend-web/src/pages/crm/kim/components/CustomerActionBar.tsx
  - packages/frontend-web/src/pages/crm/kim/components/CustomerStatusBanner.tsx
  - packages/frontend-web/src/pages/crm/kim/components/ContactPersonsTable.tsx
  - packages/frontend-web/src/pages/crm/kim/components/ContactHistoryTable.tsx
  - packages/frontend-web/src/pages/crm/kim/components/SalesDocumentsPanel.tsx
  - packages/frontend-web/src/pages/crm/kim/components/ContractsPanel.tsx
  - packages/frontend-web/src/pages/crm/kim/components/FinancialOpenItemsPanel.tsx
  - packages/frontend-web/src/pages/crm/kim/components/DocumentPanel.tsx
