id: WM-SILO-RULE-ENGINE-001
title: "Silo Zielzellen-Regelengine"
domain: agrar-wms
status: closed
owner: dev
created_at: "2026-06-25"
closed_at: "2026-06-25"
description: >
  Regelbasierte API zur automatischen Empfehlung von Zielzellen fuer
  Agrar-Einlagerungsvorgaenge. Liest silo_cells und silo_lots aus domain_inventory.
  Priorisierung: gleicher Artikel + Erntejahr > leere Zelle > gleicher Artikel > generisch.

file_ownership:
  - app/services/silo_rule_engine_service.py
  - app/api/v1/endpoints/silo_target_cell.py
  - tests/test_silo_rule_engine.py

acceptance:
  - GET /silo/zielzellen-vorschlag?artikel_id=WEIZEN&menge_kg=10000 liefert gerankte Liste
  - GET /silo/zielzellen-vorschlag/lot/{lot_id} ableitet Artikel aus Lot
  - Rang 1 = gleicher Artikel + Erntejahr + QS freigegeben
  - Rang 2 = leere Zelle
  - Rang 3 = gleicher Artikel beliebiges Erntejahr
  - Rang 4 = generisch Kapazitaet
  - Gesperrte Zellen werden nicht vorgeschlagen
  - 15/15 Unit-Tests gruen

risks:
  - silo_lots.ernte_jahr Spalte muss existieren (Migration-Check vor Deployment)
  - silo_lots.qualitaetsklasse ebenfalls optional

ai_harness:
  slice_type: backend_service
  test_count: 15
  coverage_target: 0.82
  has_migration: false
  nats_subjects: []
  external_gates: []
  rollback_plan: >
    Endpoint deaktivieren via Router-Auskommentierung; kein Schema-Rollback noetig.
