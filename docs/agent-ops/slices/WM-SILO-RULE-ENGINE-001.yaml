slice_id: WM-SILO-RULE-ENGINE-001
title: "Silo Zielzellen-Regelengine"
owner: dev
status: completed
created_at: "2026-06-25"
closed_at: "2026-06-25"
goal: >-
  Regelbasierte API zur automatischen Empfehlung von Zielzellen fuer
  Agrar-Einlagerungsvorgaenge bereitstellen. Priorisierung: gleicher Artikel
  und Erntejahr, leere Zelle, gleicher Artikel, generische Kapazitaet.
file_ownership:
  - app/services/silo_rule_engine_service.py
  - app/api/v1/endpoints/silo_target_cell.py
  - tests/test_silo_rule_engine.py
  - docs/agent-ops/slices/WM-SILO-RULE-ENGINE-001.yaml
acceptance:
  - Vorschlags-Endpoint liefert gerankte Zielzellen fuer Artikel und Menge.
  - Lot-Endpoint leitet Artikel-/Kontextdaten aus dem Lot ab.
  - Gesperrte oder fachlich unpassende Zellen werden nicht vorgeschlagen.
tests:
  - python -m py_compile app/services/silo_rule_engine_service.py app/api/v1/endpoints/silo_target_cell.py
  - pytest -q -o addopts= tests/test_silo_rule_engine.py
risks:
  - silo_lots.ernte_jahr und optionale QS-Felder muessen vor Deployment schema-seitig verfuegbar sein.
  - Ranking ist fachlich regelbasiert und muss bei neuen Silo-/QS-Policies gepflegt werden.
external_gates:
  - not_applicable
ai_harness:
  fachlicher_vertrag: >-
    Einlagerungsoperatoren erhalten nachvollziehbare Zielzellen-Vorschlaege
    mit Rangfolge, Begruendung und Ausschluss gesperrter Zellen.
  architektur_vertrag: >-
    Read-only Service ueber domain_inventory.silo_cells und silo_lots; keine
    Bestandsbuchung und kein Schema-Rollback erforderlich.
  daten_vertrag: >-
    Eingaben: artikel_id, menge_kg oder lot_id. Ausgabe: gerankte Zellliste
    mit Score, Kapazitaet, Artikel-/Erntejahr-Match und Begruendung.
  test_vertrag: >-
    Unit-Tests decken Artikel-/Lot-Flow, Rangfolge, Kapazitaet, QS-Freigabe
    und Ausschluss gesperrter Zellen ab.
  security_vertrag: >-
    Nur lesender Vorschlagsdienst; keine automatischen Umbuchungen und keine
    Cross-Tenant-Datenfreigabe.
  betriebs_vertrag: >-
    Service ist ohne externe Anlage lauffaehig; fachliche Policies muessen bei
    geaenderten Silo-Regeln versioniert angepasst werden.
  dokumentations_vertrag: >-
    Slice-YAML und Workboard nennen Dateibesitz, Tests, Risiken und fachliche
    Priorisierungslogik.
