id: UX-SALES-004
title: Rechnungs- und Lieferschein-Editor mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-15
goal: >
  Rechnungs- und Lieferschein-Editor als Folgebeleg-Arbeitsflaechen auf den
  UX-Exzellenzbaukasten ziehen: Rollenfokus, Folgebelegplan,
  Managemententscheidung, Next Action und CRUD-/Nachweis-Abdeckung.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-SALES-004.yaml
  - packages/frontend-web/src/pages/sales/invoice-editor.tsx
  - packages/frontend-web/src/pages/sales/delivery-editor.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Rechnungseditor zeigt Rollenfokus fuer Faktura, Vertrieb, Finance und Leitung.
  - Lieferschein-Editor zeigt Rollenfokus fuer Versand, Vertrieb, Lager und Faktura.
  - Beide Editor-Masken zeigen Folgebelegplan, Managemententscheidung, Next Action und CRUD-/Nachweis-Abdeckung.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-SALES-004.yaml
  - git diff --check
done:
  - Rechnungseditor um Rollenfokus fuer Faktura, Vertrieb, Finance und Leitung ergaenzt.
  - Lieferschein-Editor um Rollenfokus fuer Versand, Vertrieb, Lager, Faktura und Leitung ergaenzt.
  - Beide Editor-Masken zeigen Folgebelegplan, Managemententscheidung, Next Action und CRUD-/Nachweis-Abdeckung.
  - Bestehende Docflow-, Approval-, Druck-, Export-, OP-, Kunden-, Artikel- und Lieferscheinbuchungsfunktionen bleiben erhalten.
risks:
  - Tiefe Belegdruck- und Exportprozesse bleiben in bestehenden Funktionen; dieser Slice setzt den Leitbereich oberhalb der bestehenden Editor-Masken.
