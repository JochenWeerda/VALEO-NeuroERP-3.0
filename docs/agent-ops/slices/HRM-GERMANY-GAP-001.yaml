id: HRM-GERMANY-GAP-001
title: Deutsches HRM-Zielsystem und Readiness-Vertrag
owner: Codex
status: abgeschlossen
created: 2026-05-13
goal: >
  Deutsche HRM-Gaps ueber Personalakte, eAU, Payroll/DATEV, ESS/MSS,
  Recruiting/Onboarding, Reporting, Datenschutz, kontrollierte KI und
  Office-Connectoren als pruefbaren Zielvertrag schliessen.
file_ownership:
