  - HRM-Gap-Plan fuer deutsches HRM-Betriebssystem dokumentiert.
  - Frontend-API-Hook useHrmReadiness ergaenzt.
  - Open-Gaps-Doku auf HRM-GERMANY-GAP-001 aktualisiert.
