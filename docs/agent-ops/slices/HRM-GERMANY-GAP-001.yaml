id: HRM-GERMANY-GAP-001
title: Deutsches HRM-Zielsystem und Readiness-Vertrag
owner: Codex
status: reserviert
created: 2026-05-13
goal: >
  Deutsche HRM-Gaps ueber Personalakte, eAU, Payroll/DATEV, ESS/MSS,
  Recruiting/Onboarding, Reporting, Datenschutz, kontrollierte KI und
  Office-Connectoren als pruefbaren Zielvertrag schliessen.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/HRM-GERMANY-GAP-001.yaml
  - docs/project-context/hrm-germany-operating-system-gap-plan-2026-05-13.md
  - docs/project-context/open-gaps-and-known-issues.md
  - app/api/v1/endpoints/personal.py
  - tests/test_personal_hrm_readiness_api.py
acceptance_criteria:
  - Zielbild und Gap-Matrix decken die 15 Mindestpunkte ab.
  - API liefert HRM-Readiness mit Status, Rechts-/Compliance-Referenzen, Integrationen, KI-Kontrollen und naechsten Slices.
  - Tests sichern eAU, Paragraph 26 BDSG, BAG-Arbeitszeitpflicht, EU-AI-Act-Hochrisiko und Office-/DATEV-Connectoren.
checks:
  - pytest tests/test_personal_hrm_readiness_api.py -q --no-cov
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - git diff --check
risks:
  - Rechtsfeinpruefung, Betriebsvereinbarungen, echte eAU-/DATEV-/Microsoft-/Google-Zugangsdaten und produktive AVV/DPA bleiben Folgeslices.
