problem: |
  55 Alembic-Branches ausserhalb der Hauptkette. Die Migrations
  admin_devices_output_profiles_20260215, admin_mobile_routing_connectors_20260215,
  admin_api_keys_20260215 und inventory_charge_lineage_20260215 lagen in
  Parallel-Chains. Dadurch: UndefinedTable-500-Fehler in allen Admin-Mobile-Endpoints
  sowie charge_lineage_links beim Start.

solution: |
  Repair-Migration admin_mobile_repair_20260626 mit CREATE TABLE IF NOT EXISTS
  fuer alle betroffenen Tabellen, angehaengt an den Hauptketten-Head
  log_frachtbriefe_20260626. Kein alembic merge noetig — selbes Muster wie
  job_runner_tables_repair_20260625.

