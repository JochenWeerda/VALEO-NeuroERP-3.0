id: UX-FINANCE-001
title: Finance-Zahlungslauf mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-14
goal: >
  Den UX-Exzellenzbaukasten auf Finance/FIBU anwenden, beginnend mit dem
  Kreditoren-Zahlungslauf als produktkritischer Zahlungsarbeitsflaeche.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-FINANCE-001.yaml
  - packages/frontend-web/src/pages/finance/zahlungslauf-kreditoren.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Kreditoren-Zahlungslauf zeigt Rollenfokus, Aufgabenplan, Managemententscheidung, Audit-/Zahlungspfad und CRUD-Abdeckung.
  - Naechste Aktion bleibt sichtbar.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - git diff --check
done:
  - finance/zahlungslauf-kreditoren.tsx nutzt Rollenfokus, Aufgabenplan, Managemententscheidung, Next Action und CRUD-Abdeckung aus dem UX-Baukasten.
  - Bestehender Zahlungspfad und Zahlungslauf-Kontext bleiben erhalten.
  - UX-Standard dokumentiert Finance-Rollout-Status und naechste Finance-Slices.
risks:
  - Weitere Finance-Seiten wie UStVA, Mahnwesen und Abschluss folgen in separaten Rollout-Slices.
