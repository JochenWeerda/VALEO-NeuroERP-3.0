slice_id: WF-COCKPIT-002
title: "WF-Cockpit NATS-Projektor Startup-Anbindung"
status: abgeschlossen
priority: P2
wave: 13
created: "2026-06-26"
closed: "2026-06-26"

problem: |
  WfCockpitNatsProjector (app/services/wf_cockpit_nats_projector.py) existierte,
  wurde aber nicht in startup_event_consumer() eingebunden.
  Bei aktivem NATS-Bus (EVENT_BUS_ENABLED=true, EVENT_BUS_PROVIDER=nats) blieb
  die Cockpit-DB stumm — keine Projektion von workflow.> und domain.>-Events.

solution: |
  startup_event_consumer() in app/domains/shared/events.py erweitert:
  Nach nats_consumer.start() wird WfCockpitNatsProjector mit SessionLocal +
  WorkflowCockpitPersistService instanziiert und gestartet.
  shutdown_event_consumer() stoppt den Projektor sauber vor dem NATS-Drain.
  Start-Fehler werden geloggt (kein Hard-Crash) — Cockpit laeuft ohne Projektor weiter.
  domain_workflow.wf_cockpit_* Tabellen idempotent in Repair-Migration gesichert.

files_changed:
  - app/domains/shared/events.py  # startup + shutdown erweitert
  - alembic/versions/feed_qs_wf_cockpit_repair_20260626.py  # domain_workflow Tabellen
  - docs/agent-ops/slices/WF-COCKPIT-002.yaml

