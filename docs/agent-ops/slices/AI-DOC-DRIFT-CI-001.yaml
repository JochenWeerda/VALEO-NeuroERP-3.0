slice_id: AI-DOC-DRIFT-CI-001
title: "Doku-Drift-Report — Woechentliche CI + Route-Inventar-Heuristik"
owner: Cursor
status: abgeschlossen
updated: 2026-06-26
completed_at: 2026-06-26
goal: >-
  doc_drift_report.py in GitHub Actions (woechentlich, informativ) ausfuehren;
  Frontend-Drift ueber route-inventory.gen.json statt nur operations.tsx pruefen;
  Artifact doc_drift_report.json speichern.
file_ownership:
  - scripts/doc_drift_report.py
  - tests/test_doc_drift_report.py
  - .github/workflows/doc-drift-report.yml
  - docs/dokumentation/governance.md
  - .gitignore
  - docs/agent-ops/slices/AI-DOC-DRIFT-CI-001.yaml
acceptance:
  - python scripts/doc_drift_report.py Exit 0; Artifact JSON geschrieben.
  - pytest -m unit tests/test_doc_drift_report.py gruen.
  - Workflow doc-drift-report.yml mit schedule + upload-artifact.
  - governance.md dokumentiert informativen Drift-Report.
tests:
  - python scripts/doc_drift_report.py
  - pytest -m unit tests/test_doc_drift_report.py -v -p no:cov -o addopts=
risks:
  - Heuristik erzeugt weiterhin viele Treffer; Hard-Gate erst mit Baseline sinnvoll.
  - route-inventory.gen.json muss aktuell sein, sonst False-Positive bei Seiten.
ai_harness:
  fachlicher_vertrag: >-
    Sichtbarkeit wo Code ohne Doku/Route-Anbindung existiert; kein Blocker bis Baseline steht.
  architektur_vertrag: >-
    Reines Repo-Scan-Script; Artifact in artifacts/ gitignored.
  daten_vertrag: >-
    Report-JSON mit summary + issues-Liste.
  test_vertrag: >-
    Unit-Tests fuer Struktur, page_to_module, fail-over Exit-Code.
  security_vertrag: >-
    Keine Netzwerkzugriffe.
  betriebs_vertrag: >-
    Woechentlicher Cron; manuell workflow_dispatch.
  dokumentations_vertrag: >-
    governance.md und Slice-YAML.
external_gates:
  - Erster erfolgreicher Cron-Lauf auf GitHub Actions (extern).
