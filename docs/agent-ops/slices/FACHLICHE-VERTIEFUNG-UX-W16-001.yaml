  - provisionsgruppe_nr im Vertreter-Anlegen-Formular ist ein Select mit Provisionsgruppen.
  - provisionsgruppe_nr im Edit-Dialog ist ein Select mit Provisionsgruppen.
  - Bei leerer Provisionsgruppen-Liste zeigt der Select "— keine —".
  - Bestehende Wave-12- und Wave-15-Tests ohne Regression.
  - A11y-Labels konsistent.
  - Typecheck gruen.
