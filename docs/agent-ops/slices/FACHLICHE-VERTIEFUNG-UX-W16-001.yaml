goal: >
  Fachlicher Anschluss von Wave-15-Vertreterstamm an Wave-12-Vertreterprovisionen:
  provisionsgruppe_nr in Vertreterstamm-Maske wird von freiem Text-Input auf
  ein Select aus echten Provisionsgruppen umgestellt. Voraussetzung: beide
  Entitaeten existieren im Backend und haben eigene produktive Masken.
scope:
  - vertreterstamm.tsx Vertreter-Create-Formular: provisionsgruppe_nr als Select aus /api/v1/crm/vertreter/provisionen/gruppen
  - vertreterstamm.tsx EditVertreterDialog: provisionsgruppe_nr als Select statt freiem Input
  - E2E-Integrationstest Wave 16
  - Regression Wave-15-Gates (Vertreterstamm + Hausbanken)
  - Regression Wave-12-Gate (Vertreterprovisionen)
  - Kein neues Backend-Endpoint, keine neue Page, kein neuer API-Client
background: >
  Wave 12 lieferte /crm/vertreterprovisionen inkl. E2E-Gate bereits vollstaendig
  (fachliche-vertiefung-vertreterprovisionen.spec.ts). Wave 15 lieferte
  /crm/vertreterstamm. Die provisionsgruppe_nr in vertreterstamm.tsx war in W15
  als freier Text-Input implementiert. W16 schliesst diese Luecke und verbindet
  beide Masken fachlich.
