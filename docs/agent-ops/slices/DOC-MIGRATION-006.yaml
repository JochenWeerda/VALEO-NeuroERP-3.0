slice_id: DOC-MIGRATION-006
title: "Doku-Migration Phase J: Frontmatter Compliance + Operations-Archiv"
owner: Cursor
status: abgeschlossen
updated: 2026-06-25
completed_at: 2026-06-25
goal: >-
  Frontmatter (last_reviewed) auf alle MkDocs-Compliance- und Admin-Seiten ohne
  Metadaten; docs/operations/ nach _internal/archive/ verschieben (Phase-D-Vorbereitung).
file_ownership:
  - docs/compliance/*.md
  - docs/admin/BRANDING.md
  - docs/admin/NUMBERING.md
  - docs/_internal/archive/operations/**
  - scripts/docs-legacy-migrate.py
  - docs/dokumentation/migrationsplan.md
  - docs/agent-ops/slices/DOC-MIGRATION-006.yaml
acceptance:
  - node scripts/docs-staleness-check.cjs meldet 0 fehlende last_reviewed in Compliance/Admin.
  - docs/operations/ ist leer oder entfernt.
  - python -m mkdocs build --site-dir site_check Exit 0.
tests:
  - node scripts/docs-staleness-check.cjs --max-age-days 180
  - python scripts/docs-legacy-migrate.py --apply
  - python -m mkdocs build --site-dir site_check
risks:
  - Aktive Operations-Runbooks duerfen nicht nur archiviert bleiben, wenn CI- oder Pruefer-Gates sie als Evidenz nutzen.
  - Frontmatter-Massenupdates koennen bei parallelen Agents leicht mit MkDocs-Nav- oder Governance-Aenderungen kollidieren.
ai_harness:
  fachlicher_vertrag: >-
    Compliance-/Admin-Dokumente erhalten aktuelle Metadaten; archivierte Operations-Dokumente
    bleiben auffindbar, aktive Gate-Evidenz muss separat in kuratierten Pfaden erhalten bleiben.
  architektur_vertrag: >-
    Keine Codepfade; nur Dokumentationsstruktur, MkDocs-Navigation und Governance-Skripte.
  daten_vertrag: >-
    Keine produktiven Daten. Dokument-Moves muessen Git-Historie und Links nachvollziehbar halten.
  test_vertrag: >-
    Staleness-Check, MkDocs-Build und Docs-Governance muessen gruen laufen.
  security_vertrag: >-
    Keine Secrets oder produktiven Kundendaten in archivierten oder neuen Doku-Dateien.
  betriebs_vertrag: >-
    Betriebsrelevante Runbooks duerfen nicht ohne aktuellen Ersatz aus der kuratierten Doku verschwinden.
  dokumentations_vertrag: >-
    Slice-YAML, Migrationsplan und betroffene Indexseiten bleiben synchron.
external_gates:
  - Keine externen Gates; Doku-Governance-CI ist internes Release-Gate.
