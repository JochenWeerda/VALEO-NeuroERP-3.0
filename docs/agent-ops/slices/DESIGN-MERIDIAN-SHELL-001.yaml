id: DESIGN-MERIDIAN-SHELL-001
title: Meridian Shell und Core UI Rollout
owner: Codex
status: reserviert
claimed_at: 2026-05-21
goal: >
  Meridian sichtbar in Frontend-Shell und Core-UI aktivieren, damit localhost:3000
  die beschlossene Designrichtung mit Navy-Sidebar, Ocean-Blue/Harvest-Akzenten,
  konsistenten Touch-Targets und tokenbasierten Oberflaechen zeigt.
scope:
  - Meridian-Theme am Root aktivieren und Token-Ueberschreibungen bereinigen.
  - AppShell, Navigation, Sidebar und TopBar auf Meridian-Tokens umstellen.
  - Button, Input, Card und Tabellen-Basis auf die Meridian-Komponentenmasse nachziehen.
  - Dashboard/ListReport-nahe Startflaeche sichtbar mit Meridian-Akzenten nachziehen.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/DESIGN-MERIDIAN-SHELL-001.yaml
  - packages/frontend-web/index.html
  - packages/frontend-web/src/index.css
  - packages/frontend-web/src/styles/design-tokens-meridian.css
  - packages/frontend-web/tailwind.config.js
  - packages/frontend-web/src/components/layout/AppShell.tsx
  - packages/frontend-web/src/components/navigation/AppShell.tsx
  - packages/frontend-web/src/components/navigation/Sidebar.tsx
  - packages/frontend-web/src/components/navigation/TopBar.tsx
  - packages/frontend-web/src/components/ui/button.tsx
  - packages/frontend-web/src/components/ui/input.tsx
  - packages/frontend-web/src/components/ui/card.tsx
  - packages/frontend-web/src/components/ui/table.tsx
  - packages/frontend-web/src/components/ui/data-table.tsx
  - packages/frontend-web/src/features/dashboard/Dashboard.tsx
acceptance_criteria:
  - Meridian-Theme ist am Root aktiv.
  - Sichtbare Shell nutzt Navy-Sidebar, tokenbasierte Breiten und kompaktere Topbar.
  - Button- und Input-Defaults erfuellen 44px-Touch-Target.
  - Dashboard/ListReport-Basismuster zeigen Ocean-Blue/Harvest-Akzente statt generischer Slate/Blue-Mischung.
  - Frontend-Typecheck und Workboard-Validierung sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-markdown-check.cjs docs/agent-ops/active-workboard.md docs/agent-ops/slices/DESIGN-MERIDIAN-SHELL-001.yaml
  - git diff --check
risks:
  - Viele Fachseiten enthalten weiterhin harte Tailwind-Farben und brauchen Folgeslices.
  - Dieser Slice fokussiert die sichtbarste Shell/Core-UI-Schicht und ersetzt keinen vollstaendigen Screen-by-Screen-Designrollout.
next_step: Meridian-Root aktivieren und Shell/Core-UI-Dateien auf tokenbasierte Klassen umstellen.
