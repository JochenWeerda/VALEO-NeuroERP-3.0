id: DESIGN-MERIDIAN-SHELL-001
title: Meridian Shell und Core UI Rollout
owner: Codex
status: abgeschlossen
claimed_at: 2026-05-21
completed_at: 2026-05-21
goal: >
  Meridian sichtbar in Frontend-Shell und Core-UI aktivieren, damit localhost:3000
  die beschlossene Designrichtung mit Navy-Sidebar, Ocean-Blue/Harvest-Akzenten,
  konsistenten Touch-Targets und tokenbasierten Oberflaechen zeigt.
scope:
  - Meridian-Theme am Root aktivieren und Token-Ueberschreibungen bereinigen.
  - AppShell, Navigation, Sidebar und TopBar auf Meridian-Tokens umstellen.
  - Button, Input, Card und Tabellen-Basis auf die Meridian-Komponentenmasse nachziehen.
  - Dashboard/ListReport-nahe Startflaeche sichtbar mit Meridian-Akzenten nachziehen.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/DESIGN-MERIDIAN-SHELL-001.yaml
