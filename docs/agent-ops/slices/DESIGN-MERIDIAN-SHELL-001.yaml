acceptance_criteria:
  - Meridian-Theme ist am Root aktiv.
  - Sichtbare Shell nutzt Navy-Sidebar, tokenbasierte Breiten und kompaktere Topbar.
  - Button- und Input-Defaults erfuellen 44px-Touch-Target.
  - Dashboard/ListReport-Basismuster zeigen Ocean-Blue/Harvest-Akzente statt generischer Slate/Blue-Mischung.
  - Frontend-Typecheck und Workboard-Validierung sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-markdown-check.cjs docs/agent-ops/active-workboard.md docs/agent-ops/slices/DESIGN-MERIDIAN-SHELL-001.yaml
  - git diff --check
  - Playwright computed-style check auf http://localhost:3001 und nach Frontend-Container-Rebuild auf http://localhost:3000 mit data-theme=meridian, Sidebar 240px, Topbar 56px, Input 44px und min. Sidebar-Target 44px.
done:
  - Meridian am HTML-Root aktiviert und alte Brand-/Neutral-Aliase auf Ocean-Blue, Harvest und blau getoente Neutrals gezogen.
  - Echte Runtime-Shell startet expanded mit 240px Navy-Sidebar, 56px Topbar und 44px Sidebar-Zielen.
  - Legacy-Shell ebenfalls auf Meridian-Breiten und -Farben nachgezogen.
  - Button, Input, Card und Tabellen-Basis auf Meridian-Masse und Fokusverhalten angepasst.
  - Start-Dashboard und Analytics-Dashboard zeigen tokenbasierte Oberflaechen und Harvest/Ocean-Akzente.
risks:
  - Viele Fachseiten enthalten weiterhin harte Tailwind-Farben und brauchen Folgeslices.
  - Dieser Slice fokussiert die sichtbarste Shell/Core-UI-Schicht und ersetzt keinen vollstaendigen Screen-by-Screen-Designrollout.
next_step: Folgeslice fuer Screen-by-Screen-Tokenisierung der haeufigsten Fachseiten planen.
