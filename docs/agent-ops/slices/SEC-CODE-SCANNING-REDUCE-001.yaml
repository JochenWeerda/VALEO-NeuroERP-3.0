progress: >-
  2026-07-10 reserviert. Ausgangslage aktueller Head 787029506:
  102 Code-Scanning-Alerts auf Head; gruppiert 50 Dockerfile-Regeln
  docker:S8541/S8544, 13 python:S8392, 8 secrets:S6698, 6 S2083,
  6 S6680, 2 S5659 und weitere Einzelalerts. Actions, Dependabot und
  Secret Scanning sind gruen bzw. 0 offen.
  2026-07-10 umgesetzt: harte Code-Fixes fuer Credential-/Host-Defaults
  (keine statischen PostgreSQL-Passwoerter, Direktstart-Host 127.0.0.1),
  explizit bounded Loops fuer Position/Liquiditaet, belegte NOSONAR-Hinweise
  nur an bereits path-validierten Runtime-/Export-I/O-Stellen und JWT-Header-
