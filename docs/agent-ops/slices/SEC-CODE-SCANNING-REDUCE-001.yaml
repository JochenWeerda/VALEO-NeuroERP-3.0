  auf services/**/Dockerfile* begrenzt ignoriert; Trivy/Grype bleiben aktiv.
  2026-07-10 Governance-Nachlauf: Docs-Governance-Workflow fuer Slice-YAML
  getriggert und workflow_dispatch-Diff-Range auf HEAD^..HEAD begrenzt, damit
  manuelle Rescans nicht historische Alt-Slices gegen neue Pflichtfelder
  validieren.
