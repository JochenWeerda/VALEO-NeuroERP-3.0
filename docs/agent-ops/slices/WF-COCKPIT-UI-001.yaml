slice_id: WF-COCKPIT-UI-001
title: "Workflow-Leitstand Frontend-UI"
owner: Claude Code
status: completed
created_at: "2026-06-23"
goal: >-
  Frontend-UI fuer den Workflow-Prozessleitstand: ListReport mit Status-Filter
  und Auto-Refresh alle 30 s, KPI-Kacheln (Gesamt/Laeuft/Ext.Gate/Replay),
  Detaildialog mit chronologischer Event-Kette, Blocker-Liste und Replay-Button
  (role-guarded). Schliesst UI-Luecke zu VALEO-WF-COCKPIT-001 Backend.
file_ownership:
  - packages/frontend-web/src/pages/workflow/leitstand.tsx
  - packages/frontend-web/src/lib/api/workflow-cockpit.ts
  - packages/frontend-web/src/app/navigation/domains/operations.tsx
  - packages/frontend-web/src/app/routing/navigation-routes.json
  - docs/agent-ops/slices/WF-COCKPIT-UI-001.yaml
acceptance:
  - Workflow-Leitstand zeigt KPI-Kacheln, Statusfilter, Prozessliste und Detaildialog.
  - Event-Kette, externe Blocker und Replay-Anforderung sind fachlich sichtbar.
  - Replay bleibt role-guarded und Fehler werden fuer Operatoren sichtbar gemeldet.
tests:
  - npx tsc --noEmit 2>&1 | grep -c leitstand || true
  - node scripts/generate-tanstack-routes.mjs
risks:
  - Replay-Button setzt workflow:replay-Rolle voraus; ohne Rolle liefert Backend 403 — kein Silent-Fail.
  - In-Memory-Backend liefert leere Liste nach Neustart; Demo-Daten via POST /workflow/cockpit/processes testbar.
external_gates:
  - not_applicable
ai_harness:
  fachlicher_vertrag: >-
    Operatoren koennen Prozessinstanzen je Status filtern, Event-Ketten lesen,
    externe Blocker identifizieren und (bei Berechtigung) Replay anfordern.
  architektur_vertrag: >-
    Rein lesendes Frontend; alle Mutationen (Replay) gehen ueber Backend-API.
    Kein lokaler State ausser Filter und Dialog-Selection.
  daten_vertrag: >-
    GET /api/v1/workflow/cockpit/summary, /processes, /processes/{id};
    POST /processes/{id}/replay-requests mit workflow:replay-Header.
  test_vertrag: >-
    TypeScript 0 Fehler in leitstand.tsx und workflow-cockpit.ts;
    routes:generate liefert 883 Routen.
  security_vertrag: >-
    Replay-Anforderung nur mit X-VALEO-Roles: workflow:replay; 403-Fehler
    wird als Toast sichtbar.
  betriebs_vertrag: >-
    Auto-Refresh alle 30 s; manueller Refresh-Button; Dialog schliesst
    sauber ohne State-Leak.
  dokumentations_vertrag: >-
    Nav-Eintrag "Workflow-Prozessleitstand" unter System & Betrieb;
    Workboard-Abschnitt WF-COCKPIT-UI-001 aktualisiert.
