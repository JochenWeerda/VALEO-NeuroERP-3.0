  (Formeln bleiben golden-getesteter Code), Bedarfsprofile reproduzierbar und
  append-only je Fuetterungsgruppe mit explizit gekennzeichneten Schaetzwerten,
  Solverlaeufe als dokumentierte, reproduzierbare Metadaten mit Pflichtbezug
  auf eine Rationsversion.
scope:
  - "Migration feed_core_requirements_20260715: evaluation_systems +
    evaluation_system_versions (UNIQUE system+label, genau eine current-Version
    je System), requirement_profiles (append-only per DB-Trigger, JSONB inputs/
    estimated_inputs/requirements), optimization_runs (Status-CHECK, Pflicht-FKs
    auf rations/ration_versions)."
  - "app/agrar/rations/evaluation_systems.py: Seed-Registry gfe2023/dlg2025 mit
    module_ref auf die tragenden Konstantenmodule."
  - "feeding_requirements_service.py: idempotentes Seeding, list_systems,
    create/list_requirement_profiles (Defaults nur mit Schaetzwert-Kennzeichnung,
    Adapter auf bestehendes _gfe_requirements per Lazy-Import — bewusste
    Bestandsschuld, Extraktion im Editor-Inkrement), record/list_optimization_runs
    (LookupError bei unbekannter Version, kein Waisen-Run)."
  - "feeding_requirements.py-Router unter /feeding/* mit typisierten Out-Modellen
    (extra=ignore-Muster aus FEED-CORE-015), READ/WRITE-Rollen aus authz.py;
    Include im kanonischen Rations-Praefix."
