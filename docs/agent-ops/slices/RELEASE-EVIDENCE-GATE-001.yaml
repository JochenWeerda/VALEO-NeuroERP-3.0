slice_id: RELEASE-EVIDENCE-GATE-001
title: "Release-Evidence Freigabe-Aggregator"
priority: P1
owner: Claude Code
status: abgeschlossen
created: "2026-06-26"

goal: >
  scripts/release_evidence_report.py aggregiert alle Qualitätsdimensionen
  (drift, openapi, inventories, coverage, slice_harness, external) in einem Report.
  --fail-on-red blockiert Staging-Release bei fail-Status.
  Eingebunden in release-gates.yml als letzter Gate-Step.

ai_harness:
  fachlicher_vertrag:
    - artifacts/release_evidence.json enthält alle 6 Dimensionen mit pass/warn/fail.
    - overall_status=fail blockiert Release (--fail-on-red).
    - WARN-Dimensionen erscheinen im Report, blockieren aber nicht.
    - Report wird für 90 Tage als CI-Artefakt aufbewahrt.
  architekturvertrag:
    - Kein separates CI-Gate-Script — nur release_evidence_report.py als Single Source.
    - Dimensionen delegieren an bestehende Scripts (kein Duplizieren von Logik).
    - Phase 1 rein CLI/Artefakt — kein Live-API-Endpoint (Phase 2: INTEGRATION-EVIDENCE-BOARD).
    - release-gates.yml: Evidence-Step nach simulate_external_assessors, nicht parallel zu pytest.
  akzeptanzkriterien:
    - python scripts/release_evidence_report.py läuft durch (6 Dimensionen, kein Absturz).
    - artifacts/release_evidence.json vorhanden mit summary.pass/warn/fail.
    - release-gates.yml enthält Evidence-Step.
    - Runbook-Abschnitt in production-readiness-runbook.md.

dateibesitz:
  - scripts/release_evidence_report.py
  - .github/workflows/release-gates.yml
  - docs/operations/production-readiness-runbook.md
  - docs/agent-ops/slices/RELEASE-EVIDENCE-GATE-001.yaml
