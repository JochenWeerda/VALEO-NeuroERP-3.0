done:
  - Mischfutter-Produktion um Rollenfokus, Materialplan, Managemententscheidung, Next Action und Produktionsnachweis erweitert.
  - Produktionsdokument-Druck um Rollenfokus, Dokumentplan, Druckentscheidung, Next Action und Drucknachweis erweitert.
  - CRUD-/Workflow-Abdeckung fuer Auftrag, Rezeptur, Menge, Material, Druck, Vorschau und Nachweis sichtbar gemacht.
risks:
