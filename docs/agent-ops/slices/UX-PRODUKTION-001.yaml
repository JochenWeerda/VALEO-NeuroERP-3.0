  Aktion fuehren.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-PRODUKTION-001.yaml
  - packages/frontend-web/src/pages/produktion/mischfutter-produktion.tsx
  - packages/frontend-web/src/pages/produktion/produktions-dokumente-drucken.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Mischfutter-Produktion zeigt Rollenfokus, Materialplan, Managemententscheidung, Next Action und Nachweislink.
  - Produktionsdokument-Druck zeigt Rollenfokus, Dokumentplan, Druckentscheidung, Next Action und CRUD-/Nachweis-Abdeckung.
