id: UX-PRODUKTION-001
title: Produktionsauftrag und Dokumentdruck mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-15
goal: >
  Produktionsarbeitsflaechen fuer Mischfutter-Auftrag und Produktionsdokument-
