risks:
  - Vorlagen duerfen historische Snapshots nicht nachtraeglich veraendern.
  - Betriebsakte darf Business-Grant und Tenant-Grenzen nicht durch Aggregation umgehen.
  - Readiness-Kennzahlen duerfen fehlende Daten nicht als Null oder gesund darstellen.
evidence:
  red:
    - Domain-, Migration-, API- und Screen-Vertraege wurden als Slice-Abnahme vor dem Green-Nachweis festgelegt.
    - Der fokussierte UI-Test reproduzierte die noch fehlende asynchrone Quellversionsauswahl und wurde gegen den realen Zustand geschaerft.
  green:
    - Neun neue Domain-, Migration-, Screen- und API-Tests gruen.
    - Breite Feeding-/Rations-Regression 592 bestanden und 1 bewusst uebersprungen.
    - Frontend-Gesamtsuite 98 Dateien, 401 Tests gruen und 1 bewusst uebersprungen.
    - TypeScript, fokussiertes ESLint und Routing-Integrity gruen.
    - Markdown 127 und Governance 129 Dateien gruen.
    - Architecture Validate/Strict Drift 902/902 Routen, 210 Services und 406 Endpoints gruen.
    - Agent-Handbuch driftfrei; Alembic Single-Head/current auf feed_editor_templates_20260716.
  refactor:
    - Vorlagen-Commands und Betriebsaktenprojektion sind getrennt; Lifecycle bleibt einziger Versions-Write-Pfad.
    - ObjectPage laeuft zentral ueber ScreenDefinition, RenderPlan, Runtime und Renderer; nur zwei Domain-Overlays bleiben lokal.
