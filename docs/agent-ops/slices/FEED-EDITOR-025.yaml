acceptance:
  - Vorlage referenziert eine unveraenderliche Rationsversion und dupliziert keinen Feed-/Analyseinhalt.
  - Anwenden erzeugt eine neue Draft-Version mit based_on_version_id, erwarteter Latest-Version und Auditgrund.
  - Tenant, Business-Grant und READ/WRITE-Rollen werden serverseitig erzwungen.
  - Betriebsakte zeigt priorisiert Gruppen, aktive/veraltete Rationen, Analysereife und offene Findings statt Datensilos.
  - Native ObjectPage laeuft ueber ScreenDefinition, RenderPlan, UniversalMaskRuntime und UniversalMaskRenderer.
  - Leere, teilweise und veraltete Betriebsdaten bleiben ehrlich sichtbar und werden nie als Null-KPI erfunden.
tdd:
  red:
    - Domain-/Migrationstest fuer unveraenderliche Vorlagen und Copy-Provenienz.
    - API-Journey fuer Create/List/Apply, Tenant, Grant, RBAC und Versionskonflikt.
    - Screen-/Component-Vertrag fuer Betriebsakte und Vorlagenaktion.
  green: kleinster vertikaler Vorlagen- und Betriebsaktenpfad auf bestehenden Aggregaten
  refactor: read-only Betriebsaktenprojektion und Commands klar trennen; keine zweite Spezialmaskenwelt
tests:
  - tests/test_feeding_ration_templates.py
  - tests/test_feeding_ration_templates_api.py
  - packages/frontend-web/src/__tests__/features/feed-advice/feeding-business-detail.test.tsx
risks:
  - Vorlagen duerfen historische Snapshots nicht nachtraeglich veraendern.
  - Betriebsakte darf Business-Grant und Tenant-Grenzen nicht durch Aggregation umgehen.
  - Readiness-Kennzahlen duerfen fehlende Daten nicht als Null oder gesund darstellen.
