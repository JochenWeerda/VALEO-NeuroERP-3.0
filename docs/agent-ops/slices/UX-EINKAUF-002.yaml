id: UX-EINKAUF-002
title: Bestellungen mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-14
goal: >
  Bestellungen als zweite Einkaufs-Arbeitsflaeche auf den UX-Exzellenzbaukasten
  ziehen: Rollenfokus, Bestell-Follow-up-Plan, Managemententscheidung, Next
  Action und CRUD-/Liefer-Abdeckung.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-EINKAUF-002.yaml
  - packages/frontend-web/src/pages/einkauf/bestellungen-liste.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Bestellungen zeigen Rollenfokus fuer Einkauf, Wareneingang, Finance, Lieferant und Leitung.
  - Aufgabenplan fuehrt Erfassen, Freigeben, Bestellen/Liefern und Nachweis/Export.
  - Managemententscheidung zeigt bestellfaehig/blockiert.
  - CRUD-/Liefer-Abdeckung ist sichtbar.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-EINKAUF-002.yaml
  - git diff --check
done:
  - einkauf/bestellungen-liste.tsx nutzt Rollenfokus, Bestell-Follow-up-Plan, Managemententscheidung, Next Action und CRUD-/Liefer-Abdeckung aus dem UX-Baukasten.
  - Bestehende Listenfunktion, Bulk-Freigabe, Bulk-Storno, Druck, Import, Export und Detailnavigation bleiben erhalten.
  - UX-Standard markiert UX-EINKAUF-002 als abgeschlossen.
risks:
  - Wareneingang und Lieferantenstamm folgen in separaten Einkaufs-UX-Slices.
