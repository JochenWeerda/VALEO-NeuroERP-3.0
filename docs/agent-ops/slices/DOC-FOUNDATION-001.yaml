slice_id: DOC-FOUNDATION-001
title: "Dokumentations-Fundament: MkDocs-Material + Versionierung + Taxonomie"
owner: Cursor
status: abgeschlossen
created_at: 2026-06-25
completed_at: 2026-06-25
coordination: >-
  Legt das Doku-System (Generator, Versionierung, Taxonomie, Frontmatter,
  CI-Build) an, ohne bestehende Inhalte zu verschieben. Inhaltliche Befuellung
  und Migration der Altbestaende erfolgen in Folge-Slices (DOC-INTERFACES-001,
  DOC-USER-MANUAL-001, DOC-ADMIN-OPS-001, DOC-AGENT-CATALOG-001,
  DOC-GOVERNANCE-001, DOC-MIGRATION-001). Kein Eingriff in Code, Alembic,
  Frontend oder andere Slice-YAMLs.
goal: >-
  Ein wartbares, versioniertes, agententaugliches Docs-as-Code-Fundament
  schaffen: MkDocs + Material, mike-Versionierung, Diataxis-Taxonomie mit
  kuratierten Einstiegsseiten, verbindlicher Frontmatter-Standard und ein
  CI-Build-Gate (mkdocs build), das die kuratierte Site fehlerfrei baut.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/DOC-FOUNDATION-001.yaml
  - docs/dokumentation/dokumentationskonzept.md
  - docs/dokumentation/frontmatter-standard.md
  - docs/index.md
  - docs/benutzerhandbuch/index.md
  - docs/admin/index.md
  - docs/entwickler/index.md
  - docs/schnittstellen/index.md
  - docs/agent-docs/index.md
  - docs/compliance/index.md
  - docs/referenz/index.md
  - mkdocs.yml
  - requirements-docs.txt
  - .github/workflows/docs.yml
  - scripts/docs-markdown-check.cjs
  - scripts/docs-governance-check.cjs
  - .gitignore
not_owned:
  - app/**
  - alembic/**
  - packages/frontend-web/**
  - docs/archive/**
  - docs/cards/**
  - docs/agent-ops/slices/WM-AGRI-SILO-001.yaml
acceptance_criteria:
  - mkdocs.yml mit Material-Theme (de), kuratierter Navigation und lenienter Validierung vorhanden.
  - Diataxis-Taxonomie als Verzeichnisse mit Einstiegsseiten (Benutzerhandbuch, Admin, Entwickler, Schnittstellen, Agent-Doku, Compliance, Referenz) angelegt.
  - Verbindlicher Frontmatter-Standard dokumentiert.
  - Legacy-Altbestaende sind per exclude_docs vom Build ausgeschlossen, sodass der Build der kuratierten Site sauber durchlaeuft.
  - requirements-docs.txt pinnt mkdocs-material + mike.
  - CI-Workflow baut die Doku bei PRs (mkdocs build).
  - Lokaler Build (mkdocs build) laeuft ohne Fehler durch.
tests:
  - python -m mkdocs build --site-dir site_check
  - node scripts/docs-governance-check.cjs docs/agent-ops/slices/DOC-FOUNDATION-001.yaml
ai_harness:
  fachlicher_vertrag: >-
    Alle Zielgruppen (Endnutzer, Admin, Entwickler, Integratoren, KI-Agents,
    Compliance) erhalten einen klaren, auffindbaren Einstiegspunkt in eine
    einheitlich strukturierte Dokumentation.
  architektur_vertrag: >-
    Docs-as-Code mit MkDocs-Material als Generator, mike fuer
    Release-Versionierung, Diataxis als Ordnungsrahmen. Single Source of Truth
    bleibt das Repo; generierte Schnittstellen-Doku folgt in DOC-INTERFACES-001.
  daten_vertrag: >-
    Keine persistenten Daten. Frontmatter-Metadaten (title, type, audience,
    owner, status, last_reviewed, version) je kuratierter Seite.
  test_vertrag: >-
    CI baut die kuratierte Site mit mkdocs build. Governance-Check fuer das
    Slice-YAML gruen. Build ohne Fehler bei ausgeschlossenen Altbestaenden.
  security_vertrag: >-
    Keine Secrets in der Doku. Interne Artefakte (Workboard, Slices, Reports)
    werden aus der oeffentlichen Site ausgeschlossen. Kein Deploy mit
    Credentials im Foundation-Slice (nur Build).
  betriebs_vertrag: >-
    CI-Build ist nicht-blockierend strikt: Warnungen erlaubt, Fehler nicht.
    mike-Deploy/Hosting wird in DOC-GOVERNANCE-001 produktiv geschaltet.
  dokumentations_vertrag: >-
    Dokumentationskonzept und Frontmatter-Standard sind festgeschrieben und im
    Workboard referenziert.
external_gates:
  - Keine externe Abnahme; internes Doku-Fundament.
risks:
  - "Grosse Altbestaende (~1300 Dateien) koennten den Build verrauschen; via exclude_docs + lenienter Validierung entschaerft."
  - "mike-Deploy benoetigt spaeter Hosting/Pages-Konfiguration; bewusst in DOC-GOVERNANCE-001 verschoben."
verification:
  - python -m mkdocs build --site-dir site_check
  - node scripts/docs-governance-check.cjs docs/agent-ops/slices/DOC-FOUNDATION-001.yaml
