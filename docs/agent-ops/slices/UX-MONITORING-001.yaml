id: UX-MONITORING-001
title: Monitoring-Alerts und Regeln mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-15
goal: >
  Monitoring-Alerts und Monitoring-Regeln mit Betriebsstatus, Owner, naechster
  Aktion, Eskalationsnachweis und CRUD-Klarheit nach UX-Standard fuehren.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-MONITORING-001.yaml
  - packages/frontend-web/src/pages/admin/monitoring/alerts.tsx
  - packages/frontend-web/src/pages/admin/monitoring/regeln.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Alert-Uebersicht zeigt Rollenfokus, Betriebsplan, Managemententscheidung, Next Action und Eskalationsnachweis.
  - Monitoring-Regelverwaltung zeigt Rollenfokus, Regelplan, Managemententscheidung, Next Action und CRUD-/Workflow-Abdeckung.
  - Bestehende Alert-Liste, Regelanlage, Kanalverwaltung, Scheduler-Jobs und Loeschen bleiben erhalten.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-MONITORING-001.yaml
  - git diff --check
done:
  - Alert-Uebersicht um Rollenfokus, Betriebsplan, Managemententscheidung, Next Action, Eskalationsnachweis und Alert-Zeitleiste erweitert.
  - Alert-Uebersicht zeigt bei leerer Alertlage einen klaren naechsten Schritt zur Regelpruefung.
  - Monitoring-Regeln um Rollenfokus, Regelbetriebsplan, Managemententscheidung, Next Action, Nachweislink und CRUD-/Workflow-Abdeckung erweitert.
  - Level, Vergleich und Kanaltyp werden als gefuehrte Auswahl statt freiem Texteingabefeld gepflegt.
risks:
  - system/live-monitor bleibt technischer Folgeslice; dieser Slice fokussiert Admin-Alerts und Monitoring-Regeln.
