acceptance:
  - Schwellen sind tenant- und Komponentenklasse-spezifisch, versioniert und nie als universeller stiller Default getarnt.
  - Befund nennt Planversion, Feed, Soll/Ist/Delta, ausgeloeste Schwelle, Prioritaet und Abhilfe.
  - Massnahme entsteht nur nach explizitem Command mit Owner, Termin, Grund und Idempotency-Key; keine stille Auto-Aufgabe.
  - Massnahme ist append-only/versioniert und referenziert ActualRecord/Komponente/Befund.
  - Tenant, Business-Grant und READ/WRITE-Rollen werden serverseitig erzwungen.
  - IOFC bleibt unbekannt, wenn Milchmenge, Milchpreis oder Futterkosten fehlen; sonst ist Formel und Herkunft sichtbar.
  - Trendpunkte tragen Planversions-ID/-Nummer; die UI markiert Versionswechsel als Text und nicht nur durch Farbe.
tdd:
  red:
    - Boundary-/Property-Tests fuer klassenspezifische Schwelle und unbekannte IOFC-Basis.
    - API-/DB-Journey fuer Befund, Massnahmen-Command, Idempotenz, Tenant/Grant/RBAC und Audit.
    - Component-Vertraege fuer Massnahme und Planversionsmarker in Trends.
  green: kleinster ActualFinding-to-Measure- und IOFC/Version-Trend-Pfad
  refactor: Schwellenbewertung, Massnahmen-Command und Trendprojektion getrennt halten
tests:
  - tests/test_feeding_actual_measures.py
  - tests/test_feeding_actual_measures_api.py
  - tests/test_rations_controlling.py
  - packages/frontend-web/src/__tests__/features/feed-advice/feeding-actual-measures.test.tsx
  - packages/frontend-web/src/__tests__/features/feed-advice/feed-controlling-trends.test.tsx
risks:
  - Eine 5-Prozent-Regel darf nicht still fuer jede Komponentenklasse gelten.
  - Fehlende IOFC-Eingaben duerfen keinen Nullwert erzeugen.
  - Automatisch erkannter Befund darf keine Aufgabe ohne menschlichen Command erzeugen.
