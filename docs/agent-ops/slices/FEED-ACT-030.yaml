goal: >-
  Konfigurierbare komponentenbezogene Abweichungsschwellen auswerten,
  begruendete Massnahmen minimal und revisionssicher ableiten sowie IOFC und
  Planversionswechsel in den Controlling-Trends sichtbar machen.
