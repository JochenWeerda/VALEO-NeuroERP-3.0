ziel: >
  Claude-Domain-Audit-Fixes qualitaetssichern, Encoding-/i18n-/Routing-Reste
  bereinigen, Git-Historie korrigieren und Gates fuer den Frontend-Domain-Audit
  schliessen.
abnahmekriterien:
  - Keine neue UTF-8-Mojibake in geaenderten Frontend-Dateien.
  - route-aliases verweisen auf ladbare Page-Module.
  - Fehlende i18n-Keys aus dem Audit sind ergaenzt ohne Locale-Korruption.
  - Typecheck und Workboard-Validierung sind gruen.
  - Unpushte Commits haben korrekte Autoren-Metadaten.
risiken:
  - Browser-Massenpruefung bleibt stichprobenartig.
  - Backendabhaengige Datenladefehler werden nur von Frontend-Routing/Rendering getrennt bewertet.
