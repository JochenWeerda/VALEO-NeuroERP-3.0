slice_id: DESIGN-ROLLOUT-REGISTER-003
id: DESIGN-ROLLOUT-REGISTER-003
title: Register-Rollout — KIM-Restumschalter, ObjectPage/Runtime-Standard-Look, Belegketten-Koepfe
owner: Claude
status: abgeschlossen
created_at: "2026-07-14"
started_at: "2026-07-14"
completed_at: "2026-07-14"
goal: >-
  Rollout-Plan aus docs/design/frontend-design-skill-audit.md umsetzen: die
  Register-Variante als Standard-Tab-Look der Belegwelt etablieren (Mask-Builder
  ObjectPage + Universal Mask Runtime), Belegkopf-Register der Verkaufs-/
  Einkaufs-/Agrar-Belegketten vereinheitlichen (Gewohnheits-Prinzip) und die
  restlichen KIM-Umschalter semantisch korrekt auszeichnen.
scope:
  - LazyTabs erhaelt variant-Durchleitung; UniversalMaskRenderer nutzt
    variant="register" -> alle nativen SD-Masken erben den Belegregister-Look.
  - Mask-Builder ObjectPage TabsList auf variant="register" (das starre
    grid-cols-4 brach bei ungleich 4 Tabs).
  - Belegkoepfe auf eine Register-Leiste konsolidiert (statt zwei getrennter
    TabsLists, die die Pfeiltasten-Navigation zerschnitten) in
    verkauf/lieferschein-erfassung, sales/OrderEditorLegacyPage,
    einkauf/lieferschein-erfassung, agrar/ernte-annahme-erfassung.
  - KIM SalesDocumentsPanel-Kategorien als aria-pressed-Toggle-Gruppe (bewusst
    KEIN Register - Filter ueber einer gemeinsamen Tabelle); Forderungsspalte
    tabular-nums.
  - Ansichtsumschalter regulaerer Seiten (compliance, fibu, pos u. a.) bewusst
    im Default-Look belassen (Regel R1: Struktur ist Information).
