progress: >-
  2026-07-14 umgesetzt. Auftrag, Lieferschein (VK+EK) und Annahmebeleg tragen
  jetzt dieselbe Belegkopf-Registerleiste; die Doppel-TabsList-Konstruktion
  (Pfeiltasten nur je 4er-Reihe) ist beseitigt. Alle nativen Universal-Masken
  und alle ObjectPage-Konfigmasken erben den Register-Look ohne
  Konfigurationsaenderung. InformationPanel-Sektionen werden nur programmatisch
  gesetzt (kein Umschalter zu migrieren).
acceptance:
  - "Auftrag -> Lieferschein -> (EK-)Lieferschein -> Annahmebeleg: identisches Belegkopf-Register, eine Tabliste, Pfeiltasten ueber alle Reiter."
  - "ObjectPage-/Universal-Masken zeigen Register-Look ohne Config-Aenderung."
  - "SalesDocumentsPanel-Filter mit aria-pressed + role=group (kein falsches Tablist-Pattern)."
  - "Keine Geschaeftslogik-/Routen-/API-Aenderung."
tests:
  - "vitest run (voll) -> 88/88 Dateien, 371 passed, 1 skipped."
  - "tsc --noEmit -> 0; eslint -> 0 Fehler (8 vorbestehende fremde Warnungen)."
  - "vite build -> gruen (19.0s)."
  - "npm run test:e2e:accessibility -> 8/8 Kernrouten gruen."
risks:
  - "Register-Look aendert die Optik aller ObjectPage-/Universal-Masken (bewusster Rollout); Screenshot-basierte Handbuch-Bilder veralten schrittweise."
  - "Weitere Legacy-Belegmasken (kunden-stamm.tsx u. a.) koennen noch Eigenbau-Reiter enthalten - bei Sichtung nachziehen."
external_gates: not_applicable
ai_harness:
