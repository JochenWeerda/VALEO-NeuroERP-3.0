    Gewohnheits-Prinzip (docs/MASKEN.md): Belege einer Kette teilen Layout und
    Bedienung; Registerwechsel per Pfeiltasten ueber ALLE Reiter eines
    Belegkopfs; Filter sind als Filter erkennbar (aria-pressed), nicht als
    Pseudo-Tabs.
  architektur_vertrag: >-
    Nur zentrale Komponenten (LazyTabs, UniversalMaskRenderer, ObjectPage) und
    vier Belegmasken + zwei KIM-Panels; keine neuen Abhaengigkeiten, keine
    API-/Routing-Aenderung; Default-Tabs-Variante bleibt unveraendert verfuegbar.
  daten_vertrag: >-
