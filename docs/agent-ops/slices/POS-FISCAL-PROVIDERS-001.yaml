slice_id: POS-FISCAL-PROVIDERS-001
title: POS Fiskalisierung mit fiskaly und Swissbit
owner: Codex
status: reserved
coordination: >-
  Konfliktfreier POS-/Compliance-Slice parallel zu Claudes KIM-L3-S3-S5.
  Keine Aenderungen unter packages/frontend-web/src/pages/crm/kim oder an
  CRM-Backenddateien.
goal: >-
  Die vorhandenen Demo- und Pseudo-TSE-/DSFinV-K-Pfade durch eine typisierte
  Provider-Abstraktion fuer fiskaly SIGN DE/DSFINVK DE und Swissbit Cloud-
  beziehungsweise Hardware-TSE-Gateway ersetzen. Tagesabschluss, Export,
  Status und Live-Readiness muessen fail-closed, tenantbezogen und idempotent
  sein.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/POS-FISCAL-PROVIDERS-001.yaml
  - docs/architecture/pos-fiscalization-providers.md
  - docs/quality-assurance/pos-fiscalization-provider-uat.md
  - app/services/fiscalization/**
  - app/services/tse_fiskaly_service.py
  - app/api/v1/endpoints/pos_fiscalization.py
  - app/api/v1/endpoints/admin_pos.py
  - app/api/v1/endpoints/pos_dsfinvk.py
  - app/api/v1/endpoints/kasse_tagesabschluss.py
  - app/api/v1/api.py
  - alembic/versions/*pos_fiscal*
  - tests/test_pos_fiscalization_*.py
  - .env.example
acceptance_criteria:
  - Providerwahl fiskaly oder Swissbit ist tenantbezogen konfigurierbar.
  - fiskaly nutzt Token-Authentifizierung statt proprietaerem HMAC.
  - Swissbit Cloud nutzt einen konfigurierbaren REST-Vertrag; Hardware nutzt
    denselben Vertrag ueber einen lokalen Gateway-Adapter.
  - Transaktionsstart und -abschluss sind idempotent und persistieren Rohbeleg,
    Signatur, Zaehler, Zeiten, QR-Daten und Providerreferenzen.
  - TSE-Export und DSFinV-K-Export sind fachlich getrennt.
  - Tagesabschluss uebertraegt ein Cash Point Closing oder blockiert sichtbar.
  - Simulatoren und fehlende Live-Vertraege koennen keinen produktiven Erfolg
    behaupten.
  - Backendtests, Migration, Governance und Compile sind gruen.
risks:
  - Swissbit Detail-API und SDK sind partner-/loginpflichtig.
  - Produktive Provider-Credentials und externe Pruefwerkzeugabnahme bleiben
    externe Betriebs-Gates.
