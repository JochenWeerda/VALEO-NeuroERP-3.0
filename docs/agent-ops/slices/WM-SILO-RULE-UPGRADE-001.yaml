slice_id: WM-SILO-RULE-UPGRADE-001
title: "WMS Regelengine-Integration in Auto-Einlagerung"
domain: wms
status: done
claimed_by: claude-sonnet-4-6
owner: claude-sonnet-4-6
claimed_at: "2026-06-25"
closed_at: "2026-06-25"
goal: >-
  Auto-Einlagerung fuer Agrar-Lots um die Silo-Zielzellen-Regelengine
  erweitern, wenn Legacy-Mapping keine fachlich passende freie Zelle liefert.
file_ownership:
  - app/services/agri_lot_link_booking_service.py
  - scripts/check_critical_backend_coverage.py
  - docs/agent-ops/slices/WM-SILO-RULE-UPGRADE-001.yaml
acceptance:
  - Leere Legacy-Zelllisten nutzen die Regelengine als Fallback.
  - QS-gesperrte oder fachlich unpassende Legacy-Kandidaten erzwingen den Regelengine-Fallback.
  - Ergebnis macht transparent, ob die Regelengine verwendet wurde.
  - Kein Match in Legacy und Regelengine liefert fachlichen Fehler statt stiller Fehlbuchung.
tests:
  - pytest -q -o addopts= tests/test_agri_lot_link_booking.py tests/test_silo_rule_engine.py
risks:
  - Zielzellen-Regeln muessen bei neuen QS- und Kapazitaetsvorgaben versioniert angepasst werden.
  - Anlagennahe Echtzeitbelegung bleibt bis PLC/MES-Integration simuliert.
external_gates:
  - Anlagen-/PLC-Liveabnahme
  - Fachliche Freigabe der Zielzellen-Regeln
ai_harness:
  fachlicher_vertrag: >-
    Einlagerung nutzt bei fehlendem oder unbrauchbarem Legacy-Mapping eine
    nachvollziehbare Regelentscheidung fuer Zielzellen.
  architektur_vertrag: >-
    Bestehender agri_lot_link_booking_service bleibt Buchungsservice; die
    SiloRuleEngineService-Integration ist ein Fallback ohne eigenen Commitpfad.
  daten_vertrag: >-
    Rueckgabe enthaelt rule_engine_used, rule_engine_grund und fachliche
    Fehlergruende fuer nicht buchbare Lots.
  test_vertrag: >-
    Tests muessen Legacy-Erfolg, leere Legacy-Treffer, QS-Ausschluss und
    vollstaendiges No-Match abdecken.
  security_vertrag: >-
    Keine Cross-Tenant-Zellvorschlaege; Fallback darf keine QS-Sperren umgehen.
  betriebs_vertrag: >-
    Service bleibt ohne PLC/MES lauffaehig; echte Anlagenbelegung ist externes
    Gate.
  dokumentations_vertrag: >-
    Slice-YAML und Workboard nennen Dateibesitz, Tests, Risiken und externe
    Anlagen-Gates.

description: |
  Upgrade des Auto-Buchungsservice (agri_lot_link_booking_service.py):
  SiloRuleEngineService wird als Fallback eingesetzt, wenn das
  legacy_silo_id-Mapping keine Zelle liefert (leere rows) oder
  alle kandidaten QS-gesperrt sind (best_cell=None).
  Ergebnis enthält rule_engine_used=True/False und grund-Feld.

depends_on:
  - WM-SILO-RULE-ENGINE-001   # SiloRuleEngineService

contracts:
  backend:
    modified_files:
      - app/services/agri_lot_link_booking_service.py
      - scripts/check_critical_backend_coverage.py
    behavior:
      - "Wenn rows leer: SiloRuleEngineService.vorschlag() mit artikel_id + menge_kg"
      - "Wenn best_cell None: gleicher Fallback auf Regelengine"
      - "Erfolg-Pfad: result['rule_engine_used'] = False"
      - "Regelengine-Pfad: result['rule_engine_used'] = True, rule_engine_grund=grund"
      - "Kein Match in beiden Systemen: {ok: False, reason: 'Kein ... freie Zelle'}"

coverage_ratchet:
  - path: services/agri_lot_link_booking_service.py
    threshold: 0.50
