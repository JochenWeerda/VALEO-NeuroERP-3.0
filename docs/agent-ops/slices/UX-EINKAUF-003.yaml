id: UX-EINKAUF-003
title: Wareneingang mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-15
goal: >
  Wareneingang als dritte Einkaufs-Arbeitsflaeche auf den UX-Exzellenzbaukasten
  ziehen: Rollenfokus, Eingangspruefplan, Managemententscheidung, Next Action
  und CRUD-/Nachweis-Abdeckung.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-EINKAUF-003.yaml
  - packages/frontend-web/src/pages/einkauf/wareneingang.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Wareneingang zeigt Rollenfokus fuer Wareneingang, Einkauf, QS, Lager und Finance.
  - Aufgabenplan fuehrt Bestellung auswaehlen, Lieferschein erfassen, Mengen/QS pruefen und buchen.
  - Managemententscheidung zeigt buchbar/blockiert.
  - CRUD-/Nachweis-Abdeckung ist sichtbar.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-EINKAUF-003.yaml
  - git diff --check
done:
  - einkauf/wareneingang.tsx nutzt Rollenfokus, Eingangspruefplan, Managemententscheidung, Next Action und CRUD-/Nachweis-Abdeckung aus dem UX-Baukasten.
  - Bestehende Bestellauswahl, Lieferschein-/Kopfdatenerfassung, Mengen-/QS-Tabelle und Buchungsaktion bleiben erhalten.
  - UX-Standard markiert UX-EINKAUF-003 als abgeschlossen.
risks:
  - Lieferantenstamm folgt in separatem Einkaufs-UX-Slice.
