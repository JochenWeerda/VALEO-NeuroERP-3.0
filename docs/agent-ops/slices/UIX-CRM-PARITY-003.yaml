slice_id: UIX-CRM-PARITY-003
title: CRM Customer 360 Lazy Tab Data Parity
owner: Cursor
status: abgeschlossen
completed_at: 2026-06-25
created_at: 2026-06-25
coordination: >-
  Follow-up after UIX-CRM-PILOT-002. Delivers lazy tab list data for the Universal
  Customer Mask pilot, tab_endpoints contract in screen-summary, parity matrix
  documentation and tests. Does not replace legacy mask or change feature-flag routing.
goal: >-
  Move the CRM pilot from renderable shell to near 360 parity: lazy-loaded tab tables
  with real read-only data, documented parity matrix, and stable summary/tab contract.
file_ownership:
  - packages/frontend-web/src/pages/crm/kunden-stamm-modern/UniversalCustomerMaskPilotPage.tsx
  - packages/frontend-web/src/features/crm-masks/**
  - packages/frontend-web/src/components/mask-builder/UniversalMaskRenderer.tsx
  - packages/frontend-web/src/lib/api/crm.ts
  - app/api/v1/endpoints/crm_360.py
  - tests/test_crm_screen_summary.py
  - tests/test_crm_customer_tab_data.py
  - packages/frontend-web/src/__tests__/pages/crm/universal-customer-mask-pilot.test.tsx
  - packages/frontend-web/tests/e2e/crm-universal-customer-mask-pilot.spec.ts
  - docs/architecture/domains/crm/mask-parity-customer-360.md
  - docs/architecture/domains/crm/README.md
  - docs/project-context/open-gaps-and-known-issues.md
  - docs/adr/adr-011-ui-maskenstrategie.md
  - docs/agent-ops/active-workboard.md
acceptance:
  - At least four lazy tabs load read-only table data on tab activation.
  - screen-summary exposes tab_endpoints aligned with backend tab routes.
  - Parity matrix documents legacy vs generator status for core tabs.
  - Unit, backend and Playwright tests cover tab lazy-load.
  - Legacy fallback and feature flag remain unchanged.
tests:
  - "pnpm --dir packages/frontend-web test:run src/__tests__/pages/crm/universal-customer-mask-pilot.test.tsx"
  - "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -o addopts='' tests/test_crm_screen_summary.py tests/test_crm_customer_tab_data.py -q"
  - "VITE_ENABLE_UNIVERSAL_MASK_CUSTOMER=true pnpm --dir packages/frontend-web exec playwright test tests/e2e/crm-universal-customer-mask-pilot.spec.ts --project=chromium"
risks:
  - Legacy mask tab keys (masterdata, contacts) differ from summary available_tabs (stammdaten, kontakte).
  - Some CRM 360 list sources (Angebote, Historie) have no dedicated backend table yet.
remaining_work: []
external_gates:
  - not_applicable
