slice_id: DOM-SALES-004
title: "Sales-Domäne — Vollständige Vertiefung (AB-Lifecycle .2 / Lieferschein-Close .3 / Preisabweichung .4 / E2E .5)"
owner: Claude Code
status: completed
coordination: >-
  Ergänzt bestehende sales_storno_service / sales_match_service / sales_posting_service.
  Keine aktiven Cursor-Sales-Slices. Kein Überlapp.
  Dieser Slice besitzt nur neue sales_ab_*/sales_lieferschein_close_*/sales_preisabweichung_*-Dateien.
goal: >-
  Sales-Kern-Prozesskette Auftragsbestätigung → Lieferschein-Closing → Preisabweichung
  auf volle 004-Tiefe heben. AB-Statusmaschine, Lieferschein-Quittierungs-Flow und
  Preisabweichungs-Freigabe-Workflow einführen.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/DOM-SALES-004.yaml
  - docs/workflows/dom-sales-004-sales-deepening-2026-06-23.md
  - app/services/sales_ab_lifecycle_service.py
  - app/services/sales_lieferschein_close_service.py
  - app/services/sales_preisabweichung_service.py
  - alembic/versions/sales_ab_preisabweichung_20260623.py
  - app/api/v1/endpoints/sales_orders.py
  - playwright-tests/specs/sales/sales-lifecycle-smoke.spec.ts
  - scripts/uat/sales_lifecycle_uat.py
  - tests/test_dom_sales_004.py
not_owned:
  - app/services/sales_storno_service.py
  - app/services/sales_match_service.py
  - app/services/sales_posting_service.py
  - app/services/sales_credit_service.py
  - app/api/v1/endpoints/sales_storno.py
  - app/api/v1/endpoints/sales_delivery_notes.py
acceptance_criteria:
  - AB: DRAFT→VERSANDT→ANGENOMMEN | DRAFT→ABGELEHNT
  - Lieferschein: OFFEN→KOMMISSIONIERT→VERSANDT→QUITTIERT mit Zeitstempel
  - Preisabweichung: Diff berechnen, Freigabe wenn unter Schwelle, Eskalation sonst
  - 10+ Unit-Tests grün
  - Playwright @smoke + UAT-Script lauffähig
ai_harness:
  fachlicher_vertrag: >-
    Auftragsbestätigung (AB): DRAFT→VERSANDT→ANGENOMMEN | DRAFT→ABGELEHNT.
    Jeder Übergang wird in sales_ab_status_log protokolliert.
    Lieferschein-Close: OFFEN→KOMMISSIONIERT→VERSANDT→QUITTIERT.
    Quittierung schreibt quittiert_am + quittiert_von.
    Preisabweichung: |angebots_preis - rechnungs_preis| / angebots_preis.
    Unter Schwelle (default 2%) → auto_freigabe. Über Schwelle → ESKALIERT.
    Freigabe-Entscheidung: FREIGEGEBEN | ABGELEHNT, mit Begründung.
  architektur_vertrag: >-
    Services in app/services/, Endpunkte als Erweiterung von sales_orders.py.
    Neue Tabellen via Alembic. Kein ORM-Modell, nur text()-SQL.
    Bestehende sales_*_service.py werden nicht verändert.
  daten_vertrag: >-
    sales_ab_status_log: id, auftrag_id, tenant_id, old_status, new_status,
    operator, reason, created_at.
    sales_lieferschein_close_log: id, lieferschein_id, tenant_id, aktion,
    operator, zeitstempel, created_at.
    sales_preisabweichungen: id, auftrag_id, tenant_id, artikel_id,
    angebots_preis, rechnungs_preis, abweichung_pct, status, freigabe_operator,
    freigabe_grund, created_at.
  test_vertrag: >-
    Unit: ab_lifecycle (Statusübergänge, Ablehnung, Tenant-Guard).
    Unit: lieferschein_close (Closing-Flow, Quittierung, Idempotenz).
    Unit: preisabweichung (Diff-Berechnung, Auto-Freigabe, Eskalation).
    Playwright @smoke: AB anlegen, Lieferschein quittieren, Preisabweichung.
    UAT: sequentiell alle neuen Endpunkte.
  security_vertrag: >-
    X-Tenant-ID bei allen Mutations verpflichtend.
    AB-Log und Lieferschein-Log append-only.
    Preisabweichungs-Freigabe: nur für Status ESKALIERT möglich.
  betriebs_vertrag: >-
    Alle Service-Fehler mit logger.warning.
    AB-Lifecycle und Lieferschein-Close transaktional.
  dokumentations_vertrag: >-
    docs/workflows/dom-sales-004-sales-deepening-2026-06-23.md
    beschreibt AB-Statusmaschine, LS-Close-Flow, Preisabweichungs-Schema.
external_gates: []
risks:
  - AB-Service setzt sales_orders Tabelle voraus
  - Lieferschein-Close setzt sales_delivery_notes Tabelle voraus
