slice_id: DOM-PROC-004
title: "Procurement-Domäne — Vollständige Vertiefung (Bestellung .2 / Wareneingang .3 / Rechnungsprüfung .4 / E2E .5)"
owner: Claude Code
status: completed
coordination: >-
  Ergänzt bestehende procurement_service / procurement_match_service / einkauf_compat_service.
  Keine aktiven Cursor-Procurement-Slices. Kein Überlapp.
  Dieser Slice besitzt nur neue proc_bestellung_*/proc_wareneingang_*/proc_rechnungspruefung_*-Dateien.
goal: >-
  Procurement-Kern-Prozesskette Bestellung → Wareneingang → Rechnungsprüfung
  auf volle 004-Tiefe heben. Bestellungs-Statusmaschine, WE-Buchung mit QS-Flag
  und ERS-Rechnungsprüfungs-Lifecycle einführen.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/DOM-PROC-004.yaml
  - docs/workflows/dom-proc-004-procurement-deepening-2026-06-23.md
  - app/services/proc_bestellung_lifecycle_service.py
  - app/services/proc_wareneingang_service.py
  - app/services/proc_rechnungspruefung_service.py
  - alembic/versions/proc_bestellung_wareneingang_20260623.py
  - app/api/v1/endpoints/procurement_match.py
  - playwright-tests/specs/procurement/proc-lifecycle-smoke.spec.ts
  - scripts/uat/proc_lifecycle_uat.py
  - tests/test_dom_proc_004.py
not_owned:
  - app/services/procurement_service.py
  - app/services/procurement_match_service.py
  - app/services/einkauf_compat_service.py
  - app/api/v1/endpoints/einkauf_bestellvorschlag.py
  - app/api/v1/endpoints/einkauf_lieferschein.py
  - app/einkauf/router.py
acceptance_criteria:
  - Bestellung DRAFT→FREIGEGEBEN→VERSANDT→WE_ERHALTEN
  - Wareneingang buchen mit QS-Flag (BESTANDEN/GESPERRT)
  - Rechnungsprüfung 3-Way-Match → FREIGEGEBEN | GESPERRT
  - 10+ Unit-Tests grün
  - Playwright @smoke + UAT-Script lauffähig
ai_harness:
  fachlicher_vertrag: >-
    Bestellung: DRAFT→FREIGEGEBEN→VERSANDT→WE_ERHALTEN | DRAFT→STORNIERT.
    Freigabe erfordert Freigabe-Operator. Statusmaschine fail-closed.
    Wareneingang: menge_erhalten, einheit, lager_id, qs_status (BESTANDEN/GESPERRT/AUSSTEHEND).
    Gesperrte WE können nicht verbucht werden (fail-closed).
    Rechnungsprüfung (3-Way): Bestellwert vs. WE-Menge vs. Rechnungsbetrag.
    Abweichung ≤ 3% → FREIGEGEBEN. > 3% → GESPERRT (manuelle Freigabe).
  architektur_vertrag: >-
    Services in app/services/, Endpunkte als Erweiterung von procurement_match.py.
    Neue Tabellen via Alembic. Kein ORM-Modell, nur text()-SQL.
    Bestehende procurement_*_service.py werden nicht verändert.
  daten_vertrag: >-
    proc_bestellung_status_log: id, bestellung_id, tenant_id, old_status, new_status,
    operator, reason, created_at.
    proc_wareneingaenge: id, bestellung_id, tenant_id, menge_erhalten, einheit,
    lager_id, qs_status, gebucht_am, operator, created_at.
    proc_rechnungspruefungen: id, bestellung_id, tenant_id, rechnungs_nr,
    bestell_wert_eur, we_menge, rechnungs_betrag_eur, abweichung_pct,
    status, freigabe_operator, freigabe_grund, created_at.
  test_vertrag: >-
    Unit: bestellung_lifecycle (Statusübergänge, Freigabe-Guard, Storno).
    Unit: wareneingang (WE buchen, QS-Flag, Doppelbuchung-Guard).
    Unit: rechnungspruefung (3-Way, Auto-Freigabe, Sperrung, manuelle Freigabe).
    Playwright @smoke + UAT-Script.
  security_vertrag: >-
    X-Tenant-ID bei allen Mutations verpflichtend.
    Bestellungs-Log append-only.
    WE-Buchung: nur wenn Bestellung im Status VERSANDT.
  betriebs_vertrag: >-
    Alle Service-Fehler mit logger.warning. WE-Buchung transaktional.
    Rechnungsprüfung idempotent via (bestellung_id, rechnungs_nr).
  dokumentations_vertrag: >-
    docs/workflows/dom-proc-004-procurement-deepening-2026-06-23.md
    beschreibt Bestellungs-Statusmaschine, WE-QS-Flow, Rechnungsprüfungs-Schema.
external_gates: []
risks:
  - WE-Buchung setzt proc_purchase_orders Tabelle voraus
  - 3-Way-Match nutzt WE-Menge aus proc_wareneingaenge (nicht bestehende goods_receipts)
