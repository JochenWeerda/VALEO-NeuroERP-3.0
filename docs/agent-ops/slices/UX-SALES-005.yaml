id: UX-SALES-005
title: Gutschriften-Editor mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-15
goal: >
  Gutschriften-Editor als Verkaufsfolge auf den UX-Exzellenzbaukasten ziehen:
  Rollenfokus, Freigabeplan, Managemententscheidung, Next Action und
  CRUD-/Nachweis-Abdeckung.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-SALES-005.yaml
  - packages/frontend-web/src/pages/sales/credit-note-editor.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Gutschriften-Editor zeigt Rollenfokus fuer Vertrieb, Faktura, Finance und Leitung.
  - Freigabeplan fuehrt Kunde, Ausgangsrechnung, Grund, Positionen und Zahlung.
  - Managemententscheidung zeigt freigabefaehig/blockiert.
  - CRUD-/Nachweis-Abdeckung ist sichtbar.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-SALES-005.yaml
  - git diff --check
done:
  - Rollenfokus fuer Vertrieb, Faktura, Finance und Leitung ergaenzt.
  - Gutschriften-Freigabeplan fuer Kunde, Ausgangsrechnung, Grund, Positionen und Zahlung ergaenzt.
  - Managemententscheidung freigabefaehig/blockiert und Next Action sichtbar gemacht.
  - CRUD-/Nachweis-Abdeckung fuer Speichern, Lesen, Bearbeiten, Freigabe/Versand, Nachweis und Pruefspur ergaenzt.
risks:
  - Retourenlogik ausserhalb des Gutschriften-Editors bleibt fuer einen separaten Sales-/Einkauf-Slice offen.
