id: KEYCLOAK-PSQL-DB-001
title: Keycloak PostgreSQL Database Bootstrap
owner: Codex
status: abgeschlossen
claimed_at: 2026-05-21
completed_at: 2026-05-21
goal: Fehlende Keycloak-Datenbank im laufenden PostgreSQL anlegen und Init-Script fuer kuenftige Deployments absichern.
scope:
  - scripts/init.sql gegen erwartete Keycloak-Datenbank/Owner-Konfiguration pruefen
  - keycloak-Datenbank im laufenden Postgres einmalig anlegen
  - Keycloak neu starten und Container-Status pruefen
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/KEYCLOAK-PSQL-DB-001.yaml
  - scripts/init.sql
acceptance_criteria:
  - Datenbank keycloak existiert im laufenden Postgres.
  - Init-Script enthaelt den Bootstrap fuer kuenftige Deployments.
  - Keycloak startet ohne "database keycloak does not exist".
  - Claudes Dirty Files bleiben unberuehrt.
checks:
  - docker exec valeo-neuro-erp-postgres psql -U valeo_dev -tAc "SELECT 1 FROM pg_database WHERE datname='keycloak';"
  - docker compose restart keycloak
  - docker inspect valeo-neuro-erp-keycloak --format "{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}"
  - python scripts/agent_workboard_supervisor.py validate
risks:
  - Keycloak kann nach DB-Anlage noch an separaten Realm-/Credential-/Healthcheck-Themen scheitern.
next_step: Keycloak-Healthcheck nach Startphase erneut pruefen und ggf. Realm-/Credential-Themen separat behandeln.
result: >
  Laufende PostgreSQL-Datenbank keycloak mit Owner keycloak angelegt,
  Verbindung als Keycloak-User verifiziert, Init-Script fuer kuenftige
  Deployments auf psql-gexec-Bootstrap korrigiert und Keycloak neu gestartet.
