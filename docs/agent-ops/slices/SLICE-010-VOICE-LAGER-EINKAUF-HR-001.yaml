id: SLICE-010-VOICE-LAGER-EINKAUF-HR-001
title: Slice-010 — Voice-Intent für Lager / Einkauf / HR ausbauen
owner: Claude Sonnet 4.6
status: reserviert
claimed_at: 2026-05-27
depends_on:
  - SLICE-009-DSGVO-ART33-BREACH-001
goal: >
  Die bestehende Voice-Infrastruktur (useVoiceIntent, IntentResolver, ActionRegistry)
  kennt nur Sales/CRM/Finance-Aktionen. Lager, Einkauf und HR sind nicht belegt.
  Slice-010 erweitert die Action-Registry um domänenspezifische Intents und
  den IntentResolver um Keyword-Fallbacks für alle drei Domains.
  Zusätzlich werden die Frontend-AI-Shortcuts ergänzt.
background: >
  action_registry.py: 210 Zeilen, Lager nur als nav-inventory (Navigation).
  Einkauf und HR völlig fehlend. intent_resolver.py: Keyword-Fallbacks nur für
  Sales/CRM. Keine Tests für den Resolver vorhanden.
scope:
  - services/ki-usability/app/services/action_registry.py (Lager/Einkauf/HR-Aktionen)
  - services/ki-usability/app/services/intent_resolver.py (Keyword-Fallbacks)
  - packages/frontend-web/src/app/navigation/ai-shortcuts.tsx (Voice-Shortcuts UI)
  - tests/test_voice_intent_lager_einkauf_hr.py (neu)
  - packages/frontend-web/src/__tests__/features/ki-usability/ (Vitest)
  - docs/agent-ops/active-workboard.md
file_ownership:
  - docs/agent-ops/slices/SLICE-010-VOICE-LAGER-EINKAUF-HR-001.yaml
  - services/ki-usability/app/services/action_registry.py
  - services/ki-usability/app/services/intent_resolver.py
  - packages/frontend-web/src/app/navigation/ai-shortcuts.tsx
  - tests/test_voice_intent_lager_einkauf_hr.py
new_intents:
  lager:
    - nav-lager (Lagerbestand öffnen)
    - lager-wareneingang (Wareneingang buchen)
    - lager-inventur (Inventur starten)
    - lager-umlagerung (Umlagerung anlegen)
    - lager-artikel-suche (Artikel im Bestand suchen)
  einkauf:
    - nav-einkauf (Einkauf öffnen)
    - einkauf-bestellung-neu (Bestellung anlegen)
    - einkauf-lieferantenrechnung (Lieferantenrechnung erfassen)
    - einkauf-angebot (Angebot anfragen)
    - einkauf-lieferant-suche (Lieferant suchen)
  hr:
    - nav-hr (Personalverwaltung öffnen)
    - hr-abwesenheit (Abwesenheit erfassen)
    - hr-mitarbeiter-neu (Mitarbeiter anlegen)
    - hr-lohnlauf (Lohnlauf starten)
acceptance_criteria:
  - 15 neue Intents in action_registry.py registriert (5 Lager, 5 Einkauf, 5 HR)
  - intent_resolver.py löst Lager/Einkauf/HR-Phrasen korrekt auf
  - pytest-Tests: alle Intent-Matches grün
  - Frontend ai-shortcuts.tsx um 3 Domain-Shortcuts erweitert
  - TypeScript 0 Fehler
fremdfix: noch keine
open_risks:
  - VoiceButton-Einbindung auf Lager/Einkauf/HR-Seiten bleibt Folgeslice (nur Registry-Erweiterung hier)
