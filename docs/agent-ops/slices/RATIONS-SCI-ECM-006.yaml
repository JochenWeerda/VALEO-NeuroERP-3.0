goal: >-
  Energiekorrigierte Milch (ECM) im Rations-Backend auf die exakte DLG-01|2025-
  Definition umstellen: ECM[kg] = kg Milch • (38,5•Fett% + 24,2•Protein% +
  16,5•Laktose%) ÷ 3,15 ÷ 100. Bisher Naeherungen ohne Laktose (Standalone
  0,337+0,116•F+0,06•E; Backend NRC 0,327+0,1295•F+0,072•P). Zusaetzlich ein
  Formel-Audit-Regressionstest gegen DLG-Referenzwerte.
scope:
  - energy_corrected_milk_kg in rationsoptimierung/app/nutrition/gfe2023.py auf DLG-Formel.
  - _ecm_kg_per_kg_milk_factor im Backend-Endpoint auf DLG-Formel.
  - CowProfile um optional milk_lactose_pct (Default 4,8) erweitern.
  - Formel-Audit-Regressionstest (ECM/ME-Erhaltung/sidP) gegen DLG 01|2025.
