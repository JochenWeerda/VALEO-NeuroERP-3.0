id: UX-SERVICE-001
title: Service-Anfragen und Rueckmeldungen mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-15
goal: >
  Service-Anfragen und Rueckmeldung mit Rollenfokus, klarer Aufgabe, Status,
  naechster Aktion und Nachweisfuehrung nach UX-Standard fuehren.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-SERVICE-001.yaml
  - packages/frontend-web/src/pages/service/anfragen.tsx
  - packages/frontend-web/src/pages/service/rueckmeldung.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Service-Anfragen zeigen Rollenfokus, Serviceplan, Managemententscheidung, Next Action und Nachweislink.
  - Rueckmeldung zeigt Rollenfokus, Rueckmeldeplan, Managemententscheidung, Next Action und CRUD-/Workflow-Abdeckung.
  - Bestehende Liste, Suche, Export, Workflow-Handover, Rueckmeldeformular und Navigation bleiben erhalten.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-SERVICE-001.yaml
  - git diff --check
done:
  - Service-Anfragen um Rollenfokus, Service-Arbeitsplan, Managemententscheidung, Next Action und Service-Ticket-Nachweis erweitert.
  - Service-Tabelle um klaren Leerzustand mit direkter Anlageaktion ergaenzt.
  - Rueckmeldung um Rollenfokus, Rueckmeldeplan, Managemententscheidung, Next Action, Einsatznachweis und CRUD-/Workflow-Abdeckung erweitert.
  - Senden der Rueckmeldung an vollstaendige Pflichtangaben und Folgehinweis bei offenem Ergebnis gekoppelt.
risks:
  - Service-Abschluss und Feldservice-Detail bleiben Folgeslices; dieser Slice fokussiert Anfrageuebersicht und Rueckmeldung.
