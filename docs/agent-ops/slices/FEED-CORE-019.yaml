acceptance:
  - FeedAnalysis ist einem kanonischen Feed zugeordnet und historisiert Probe, Labor, Methode, Gueltigkeit und Originalbelegreferenz.
  - Messwerte bewahren Originalwert/-einheit und tragen kanonischen Decimal-Wert, Basis, Qualitaet, Herkunft und Schaetzstatus.
  - Statuswechsel uploaded, mapped, draft, validated, released, superseded oder rejected sind serverseitig validiert.
  - Je Feed und fachlichem Gueltigkeitsscope ist hoechstens eine freigegebene Analyse aktiv; Aktivierung ersetzt keine alte Rationsversion.
  - Plausibilitaetsbefunde unterscheiden Blocker und Warnungen; fehlende Werte werden nie als Null interpretiert.
  - API und Originalbelegzugriff sind tenant-/rollen-sicher; Mutationen sind optimistisch versioniert und auditierbar.
  - Analyse-Worklist und Pruefung laufen durch die zentrale Meridian-Runtime; fachliche Dialoge bleiben schmale Overlays.
  - Bestandsdaten und bestehende Grundfutteranalyse-Konsumenten bleiben additiv kompatibel; Migration bleibt Single-Head.
tdd:
  red:
    - Aggregate-, Status-, Einheiten-, Plausibilitaets- und Aktivierungsvertraege zuerst als fehlschlagende Tests.
    - API-Lifecycle, Konflikt, Tenant, RBAC, Belegreferenz und Legacy-Kompatibilitaet zuerst rot.
    - Native Worklist/ObjectPage, Accessibility und Importvorschau zuerst rot.
  green: kleinste durchgaengige manuelle Analyse- und Freigabestrecke auf dem kanonischen Feed
  refactor: bestehende Grundfutteranalyse-Daten additiv adaptieren und keine zweite UI-Architektur schaffen
tests:
  - tests/test_feeding_feed_analysis.py
  - tests/test_feeding_feed_analysis_api.py
  - tests/test_grundfutteranalysen.py
  - packages/frontend-web/src/__tests__/features/feed-advice/feeding-analysis-detail.test.tsx
risks:
  - Alte Grundfutteranalysefelder und flexible Messwerte brauchen eine eindeutige Prioritaet ohne stille Nullwerte.
  - Freigabe und Aktivierung duerfen ohne atomare Sperre keine zwei aktiven Analysen erzeugen.
  - DMS-Belege werden referenziert; Dateispeicherung und Virenscan duerfen nicht als fertig vorgetaeuscht werden.
