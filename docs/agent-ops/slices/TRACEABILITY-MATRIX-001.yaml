slice_id: TRACEABILITY-MATRIX-001
title: "Slice↔Test↔Doku Traceability-Matrix"
priority: P2
owner: Claude Code
status: abgeschlossen
created: "2026-06-26"

goal: >
  Generator liest alle Slice-YAMLs, sucht Slice-ID-Referenzen in Tests,
  extrahiert Doku-Links aus dateibesitz und erzeugt Coverage-Report.

ai_harness:
  fachlicher_vertrag:
    - docs/quality-assurance/traceability-matrix.md zeigt je Slice: Tests (Anzahl), Doku (Anzahl), Status.
    - Coverage = abgeschlossene Slices mit Test+Doku / alle abgeschlossenen Slices.
    - Phase 1 Coverage 0%: zeigt Lücken auf (Slices referenzieren Slice-ID nicht in Testdateien).
    - --min-coverage als CI-Schwellwert (noch nicht aktiv in Phase 1).
  architekturvertrag:
    - scripts/generate_traceability_matrix.py ist Single Source of Truth.
    - Test-Suche: Regex für Slice-ID in tests/**/*.py + playwright-tests/**/*.spec.ts.
    - Doku-Suche: dateibesitz-Einträge aus YAML mit .md-Extension oder docs/-Präfix.
    - PyYAML-Abhängigkeit; Fallback auf Regex-Parsing wenn nicht installiert.
  akzeptanzkriterien:
    - generate_traceability_matrix.py läuft mit 100+ Slices ohne Fehler.
    - docs/quality-assurance/traceability-matrix.md existiert mit Coverage-Tabelle.

dateibesitz:
  - scripts/generate_traceability_matrix.py
  - docs/quality-assurance/traceability-matrix.md
  - docs/agent-ops/slices/TRACEABILITY-MATRIX-001.yaml
