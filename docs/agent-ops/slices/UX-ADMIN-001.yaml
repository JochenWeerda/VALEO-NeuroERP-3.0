id: UX-ADMIN-001
title: Admin-Benutzer- und Rollenverwaltung mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-15
goal: >
  Admin-Benutzer- und Rollenverwaltung mit klarer Betriebsaufgabe, Status,
  naechster Aktion und sicherer Aenderungsfuehrung nach UX-Standard fuehren.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-ADMIN-001.yaml
  - packages/frontend-web/src/pages/admin/benutzer-liste.tsx
  - packages/frontend-web/src/pages/admin/rollen-verwaltung.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Benutzerverwaltung zeigt Rollenfokus, Sicherheitsplan, Managemententscheidung, Next Action und Export-/Nachweisabdeckung.
  - Rollenverwaltung zeigt Rollenfokus, Berechtigungsplan, Managemententscheidung, Next Action und CRUD-/Nachweisabdeckung.
  - Bestehende Liste, Suche, Export und Neuanlage bleiben erhalten.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-ADMIN-001.yaml
  - git diff --check
done:
  - Benutzerverwaltung um Rollenfokus, Sicherheitsplan, Managemententscheidung, Next Action und Nachweislink erweitert.
  - Rollenverwaltung um Rollenfokus, Berechtigungsplan, Managemententscheidung, Next Action und Nachweislink erweitert.
  - CRUD-/Workflow-Abdeckung fuer Neuanlage, Lesen, Bearbeiten, Export, Nachweis, Rezertifizierung und Audit sichtbar gemacht.
risks:
  - DMS-Setup ist bereits ueber UX-DMS-001 abgedeckt; weitere Admin-Spezialseiten bleiben Folgeslices.
