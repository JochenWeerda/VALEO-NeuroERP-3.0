slice_id: DOC-CARDS-SURFACE-001
title: "Cards-Konzept und interne Inventar-Dokumente in MkDocs einbinden — Wave 29"
owner: Claude Code
status: abgeschlossen
wave: 29
created: 2026-06-27
completed: 2026-06-27
goal: >-
  Cards-Konzept, Card-Template und interne Inventar-Dokumente in der
  kuratierten MkDocs-Site auffindbar machen.
file_ownership:
  - docs/cards/README.md
  - docs/cards/card-template.md
  - docs/_internal/cards-inventory.md
  - docs/_internal/legacy-docs-inventory.md
  - mkdocs.yml
  - docs/agent-ops/slices/DOC-CARDS-SURFACE-001.yaml
acceptance:
  - Alle vier Dokumente sind ueber Entwickler > Prozess-Cards erreichbar.
  - Cards- und Template-Dokumente haben gueltiges Frontmatter.
  - MkDocs-Build laeuft ohne Fehler.
tests:
  - mkdocs build
  - node scripts/docs-governance-check.cjs
risks:
  - Interne Inventare koennen schnell veralten und muessen bei weiterer Docs-Konsolidierung regeneriert werden.
external_gates:
  - Keine externen Gates; reine Dokumentationsauffindbarkeit.
ai_harness:
  fachlicher_vertrag: >-
    Prozess-Cards und Inventare muessen fuer Agenten und Entwickler als
    Einstieg in wiederverwendbare Aufgabenbeschreibungen auffindbar sein.
  architektur_vertrag: >-
    Aenderungen bleiben auf Markdown-Frontmatter und MkDocs-Navigation begrenzt.
  daten_vertrag: >-
    Keine produktiven Daten oder Schemaaenderungen.
  test_vertrag: >-
    MkDocs-Build und Docs-Governance pruefen Renderbarkeit, Navigation und Frontmatter.
  security_vertrag: >-
    Keine Secrets oder personenbezogenen Daten in den eingebundenen Dokumenten.
  betriebs_vertrag: >-
    Bei Regeneration der Inventare muss die Navigation weiterhin konsistent bleiben.
  dokumentations_vertrag: >-
    Slice-YAML, Workboard und MkDocs-Nav referenzieren dieselben Dokumente.

fachlicher_vertrag:
  ziel: >
    Vier interne Referenz- und Konzeptdokumente (cards/README, card-template,
    _internal/cards-inventory, _internal/legacy-docs-inventory) mit Frontmatter
    versehen bzw. per exclude_docs-Ausnahme in den MkDocs-Build einbinden.
  akzeptanzkriterien:
    - Alle vier Dateien erreichbar unter Entwickler > Prozess-Cards
    - Valide Frontmatter auf allen Dateien

architektur_vertrag:
  komponenten:
    - docs/cards/README.md
    - docs/cards/card-template.md
    - docs/_internal/cards-inventory.md
    - docs/_internal/legacy-docs-inventory.md
  aenderungen:
    - Frontmatter hinzugefuegt (cards/README.md, cards/card-template.md)
    - exclude_docs Ausnahmen fuer alle vier Dateien
    - Nav-Unterabschnitt Prozess-Cards unter Entwickler

daten_vertrag:
  migrations: keine
  schema_aenderungen: keine

test_vertrag:
  pruefschritte:
    - mkdocs build muss ohne ERROR abschliessen

security_vertrag:
  datenschutz: keine personenbezogenen Daten betroffen
  zugriff: oeffentliche Dokumentationssite

betriebs_vertrag:
  deployment: mkdocs build / gh-pages deploy
  monitoring: keine

dokumentations_vertrag:
  workboard_eintrag: DOC-CARDS-SURFACE-001
  nav_eintraege:
    - Entwickler > Prozess-Cards > Cards — Konzept
    - Entwickler > Prozess-Cards > Card Template
    - Entwickler > Prozess-Cards > Cards-Inventar (intern)
    - Entwickler > Prozess-Cards > Legacy-Docs-Inventar
