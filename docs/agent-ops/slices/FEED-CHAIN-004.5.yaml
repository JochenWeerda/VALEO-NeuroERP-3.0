slice_id: FEED-CHAIN-004.5
title: Lagerartikel-Verknüpfung UI (Mischfutter-Produktion)
owner: Cursor
status: completed
created_at: 2026-06-23
coordination: >-
  Ergänzt FEED-CHAIN-004 Backend. Kein Überlapp mit DOM-SALES-004 (Claude Code).
goal: >-
  Operatoren sehen auf mischfutter-produktion unverknüpfte Einzelfuttermittel und
  können per Klick ensure auslösen — Voraussetzung für kanonische Lagerbewegungen bei Freigabe.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/FEED-CHAIN-004.5.yaml
  - packages/frontend-web/src/lib/api/produktion.ts
  - packages/frontend-web/src/pages/produktion/mischfutter-produktion.tsx
  - docs/workflows/wave-physical-chain-feed-production-audit-2026-06-12.md
acceptance:
  - useFeedInventoryLinks + useEnsureFeedInventoryLink in produktion.ts
  - Lager-Rolle oder unmapped zeigt Verknüpfungs-Card mit per-row Pending
  - Typecheck grün
tests:
  - pnpm --filter @valero-neuroerp/frontend-web exec tsc --noEmit
risks:
  - Ohne Backend-Migration inventory_article_id bleibt API leer/500
ai_harness:
  fachlicher_vertrag: >-
    Lager sieht Mapping-Status; Verknüpfen legt Artikel an oder matched artikel_nummer.
  architektur_vertrag: >-
    React-Query Hooks; Mutation invalidiert inventory-links Query.
  daten_vertrag: >-
    Tenant via apiClient; keine lokalen Mock-Daten.
  test_vertrag: >-
    Typecheck; manuelle Smoke auf mischfutter-produktion.
  security_vertrag: >-
    Bearer + X-Tenant-ID über apiClient.
  betriebs_vertrag: >-
    Fehler via toast; Button disabled während Pending.
  dokumentations_vertrag: >-
    Workboard + Audit-Workflow aktualisiert.
external_gates:
  - not_applicable
