slice_id: SPEC-P1-06-W8-INVENTORY-SILO
id: SPEC-P1-06-W8-INVENTORY-SILO
title: Legacy-Routen response_model typisieren — Welle 8 (Inventur/Lots + Silo/Materialfluss)
owner: Claude Code
status: in_arbeit
created_at: "2026-08-25"
started_at: "2026-08-25"
goal: >-
  Achte Welle von SPEC-P1-06: die beiden aus Welle 7 bewusst zurueckgestellten
  Dateien inventory_operations und agri_silo_material_flow. Die Spaltenlisten
  werden nicht aus Migrationen rekonstruiert, sondern aus
  information_schema.columns einer auf head migrierten Datenbank gezogen und
  als Test gegen die laufende DB verankert.
file_ownership:
  - docs/agent-ops/slices/SPEC-P1-06-W8-INVENTORY-SILO.yaml
  - app/api/v1/schemas/inventory_lot_bundle_schemas.py
  - app/api/v1/schemas/silo_material_flow_schemas.py
  - app/api/v1/endpoints/inventory_operations.py
  - app/api/v1/endpoints/agri_silo_material_flow.py
  - app/services/inventory_correction_service.py
  - app/services/inventory_count_close_service.py
  - tests/test_welle8_response_models.py
  - tests/test_welle8_schema_drift.py
ausgeschlossen:
  - EXPORT/ und SKILL.md (fremde untracked Arbeitsstaende)
  - alembic-Migrationen fremder Straenge
acceptance:
  - 9 Endpunkte tragen ein echtes response_model
  - >-
    Kein Feldverlust: jedes Feld der 35-/21-/15-/15-/11-/8-Spalten-DDL der
    gelesenen Tabellen ist im Schema abgedeckt
  - Schema-Drift-Test vergleicht Modellfelder gegen information_schema.columns
  - Bestandstests von Inventur, Lots und Materialfluss bleiben gruen
  - Schwache response_model-Typen sinken von 255 auf 246
befunde_vorab:
  - >-
    `domain_inventory.inventory_stock_movements` hat in der auf head migrierten
    DB 35 Spalten, aber weder `reference_type` noch `reference_id`. Kanonisch
    sind `source_document_type` und `source_document_id`
    (siehe create_lagerbewegung). inventory_correction_service.storno_korrektur
    und inventory_count_close_service.differenz_buchen schreiben und filtern
    trotzdem auf `reference_type`/`reference_id` — beide Endpunkte laufen
    produktiv in UndefinedColumn und damit in ihren 503-Zweig.
  - >-
    Zusaetzlich sind `auto_created`, `ownership_type`, `storage_fee_relevant`,
    `previous_stock` und `new_stock` NOT NULL ohne Default. Beide INSERTs
    liefern sie nicht mit und wuerden auch nach reiner Spaltenumbenennung an
    NotNullViolation scheitern.
  - >-
    Genau das ist der Grund, warum Welle 7 diese Dateien zurueckgestellt hat:
    aus den Migrationen rekonstruiert waere der Fehler nicht sichtbar geworden.
    Die Typisierung deckt ihn auf, also wird er in dieser Welle mitgefixt.
verification:
  - "python -m pytest tests/test_welle8_response_models.py -q --no-cov"
  - "python -m pytest tests/test_welle8_schema_drift.py -q --no-cov"
  - "python scripts/check_weak_response_models.py --threshold 246"
