done:
  - harvest_acceptance.py ist bereits ueber HarvestAcceptanceService entkoppelt.
  - agrar_settlements.py delegiert Preview-, Drying-, Backfill-, PDF-, Freigabe- und Completion-Logik an AgrarSettlementService.
  - docflow.py delegiert Sales-Invoice-Kundenfreigaben an DocflowService.
  - README, UAT-Protokoll und Open-Gaps-Doku fuehren die drei grossen Legacy-Endpunkte nicht mehr als offene Service-Layer-Auflage.
risks:
