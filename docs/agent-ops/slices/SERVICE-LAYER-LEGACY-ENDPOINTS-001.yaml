  - Dieser Slice schliesst die Endpoint-Tech-Debt-Aussage, nicht jede interne Service-Feinstruktur.
  - Drei lokale HTTP-Smokes in tests/test_agrar_settlements_api.py bleiben gegen die aktuelle Entwickler-DB durch fehlende Spalte domain_inventory.agrar_settlements.campaign_id blockiert und benoetigen die passende lokale Migration.
