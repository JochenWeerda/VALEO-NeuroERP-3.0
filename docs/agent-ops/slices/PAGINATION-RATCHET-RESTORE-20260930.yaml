acceptance:
  - Drei CRM-Consent-Listen besitzen begrenzte limit- und skip-Parameter
  - Query-Reihenfolge und Tenant-Filter bleiben erhalten
  - Dokumentzuordnungen sind als beleggebundenes Vollaggregat begruendet ausgenommen
  - check_pagination bleibt mit Schwelle 53 gruen
  - Fokussierte Tests und Dokumentationspruefungen sind gruen
tests:
