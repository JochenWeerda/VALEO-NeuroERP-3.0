id: HR-TIME-UX-ROADMAP-001
status: reserviert
owner: Codex
goal: >
  HR-Time-Workflows als klickarme End-to-End UX-Roadmap mit Milestones,
  Quervernetzungen, User-Fragen, Masken, Such-/Filter-/Sortierfunktionen
  planen und den ersten Filter-/Such-Slice im Cockpit umsetzen.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/HR-TIME-UX-ROADMAP-001.yaml
  - docs/project-context/hr-time-ux-workflow-roadmap-2026-05-12.md
  - packages/frontend-web/src/pages/personal/zeiterfassung.tsx
  - packages/frontend-web/tests/e2e/hr-time-clickthrough.generated.spec.ts
acceptance_criteria: >
  Roadmap beschreibt Milestones mit Quervernetzungen und Abhaengigkeiten;
  User-Fragen sind Masken, Datenquellen und Aktionen zugeordnet; UI bietet
  zentrale Suche, Schnellfilter und Sortierung fuer Arbeitszeit/Arbeitsplan;
  Durchklicktest nutzt Suche/Filter/Sortierung.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web exec playwright test tests/e2e/hr-time-clickthrough.generated.spec.ts --project=chromium
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
risks: >
  Weitere Milestones wie Action Panel, Wizard, Driver-Dispo und Payroll Closeout
  bleiben Folge-Slices.
