slice_id: MERIDIAN-BELEG-RESTPUNKTE
id: MERIDIAN-BELEG-RESTPUNKTE
title: Restpunkte aus MERIDIAN-BELEG-SYSTEMWEIT schliessen
status: reserviert
owner: Cursor
date: 2026-09-30
created_at: 2026-09-30
coordination: >
  Folgt MERIDIAN-BELEG-SYSTEMWEIT. mask_rollout_summary_service.py traegt
  uncommittete fremde Aenderungen; committet wird dort nur der eigene Hunk
  auf Basis von HEAD. coverage_path_check.xml nicht committen.
goal: >
  Die Reklamation bekommt eine fachliche Nummer, die Register der Rollout-Masken
  nehmen Text-IDs an, wo die Tabelle Text-IDs fuehrt, und die drei Pilotseiten
  laufen ueber den gemeinsamen Masken-Runtime statt ueber usePilotRenderPlan.
file_ownership:
  - app/domains/operations/models.py (nur ReklamationDB.reklamation_nr)
  - app/api/v1/endpoints/reklamation_api.py
  - alembic/versions/reklamation_nummer_20260930.py
  - app/services/mask_rollout_summary_service.py (nur UUID-Pruefung)
  - packages/frontend-web/src/features/mask-pilot/
  - packages/frontend-web/src/pages/sales/order-editor.tsx
  - packages/frontend-web/src/pages/sales/UniversalSalesOrderPilotPage.tsx
  - packages/frontend-web/src/pages/kontrakte/KontraktDetailRoute.tsx
  - packages/frontend-web/src/pages/kontrakte/UniversalKontraktPilotPage.tsx
  - packages/frontend-web/src/pages/crm/kunden-stamm-modern.tsx
  - packages/frontend-web/src/pages/crm/kunden-stamm-modern/UniversalCustomerMaskPilotPage.tsx
  - packages/frontend-web/src/pages/workflow/mask-benchmark/MaskBenchmarkRoute.tsx
  - Pilot-Tests unter src/__tests__/pages und tests/e2e
  - tests/test_meridian_beleg_restpunkte.py
acceptance:
  - Neue Reklamation traegt REK-JJJJ-NNNNN je Mandant fortlaufend, Bestand ist nachnummeriert
  - Register einer Ernteabrechnung mit Text-ID liefern 200; Bestellung mit Nicht-UUID bleibt 404
  - Pilot-Schalter und Benchmark-Route rendern die nativen Seiten; usePilotRenderPlan ist entfernt
tests:
  - tests/test_meridian_beleg_restpunkte.py
  - packages/frontend-web/src/__tests__/pages
risks:
  - Nummernvergabe unter Parallelitaet; Advisory-Lock und Unique-Index halten sie fest
ai_harness:
  fachlicher_vertrag: >
    Eine Reklamation hat eine Nummer, die man am Telefon nennen kann.
  architektur_vertrag: >
    Detailmasken laufen ueber useUniversalMaskRuntime; kein zweiter Pfad.
  daten_vertrag: >
    Migration mit Nachnummerierung des Bestands; laeuft auf frischer und
    gewachsener Datenbank.
  test_vertrag: >
    HTTP-Vertraege gegen Postgres; kein MagicMock-DB.
  security_vertrag: >
    Nummernkreis je Mandant; Abfragen immer mit Tenant-Filter.
  betriebs_vertrag: >
    Migration idempotent, kein Downgrade-Datenverlust.
  dokumentations_vertrag: >
    Open-Gaps, Workboard, Slice, Runtime-Status, Meridian-Experience, Inventare.
external_gates:
  - not_applicable
