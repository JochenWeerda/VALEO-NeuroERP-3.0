acceptance:
  - Tagesbedarf stammt aus aktuellen Plan-Instructions und nie aus `snapshot.mobile`.
  - Sicherheitszuschlag ist expliziter Prozentsatz; Netto-/Bruttobedarf und Zuschlagsmenge bleiben sichtbar.
  - Bestand fehlt bleibt unbekannt; Reichweite und Unterdeckung werden dann nicht als Null berechnet.
  - Bestellmenge wird nur bei bekannter Unterdeckung auf positive Handelseinheit aufgerundet; Rundungsdelta bleibt sichtbar.
  - Reichweitenwarnung nennt Planversion, Feed, Bedarfshorizont, Bestand, Unterdeckung und Abhilfe.
  - Einkaufsuebergabe ist Vorschlag/Command mit Idempotency-Key, Auditgrund, Tenant, Grant und Rollenpruefung; keine automatische Bestellung.
  - Handoff und `feeding.supply.procurement_handoff.created` entstehen atomar und verweisen auf Planversion.
  - Meridian-Readiness-/Versorgungsansicht zeigt unbekannt, ausreichend, Warnung und kritisch als Text.
tdd:
  red:
    - Property-/Boundary-Tests fuer Zuschlag, unbekannten Bestand, Reichweite und Handelseinheitsrundung.
    - API-/DB-Journey fuer Current-Plan-Bedarf, Tenant/Grant/RBAC, Idempotenz, Audit und Outbox.
    - Screen-/Component-Vertrag fuer handlungsorientierte Versorgungsansicht und kontrollierte Uebergabe.
  green: kleinster Plan-to-Supply-to-Procurement-Handoff-Pfad ohne Bestellautomatik
  refactor: pure Supply-Berechnung, Read-Projektion und Command-Persistenz klar trennen
tests:
  - tests/test_feeding_supply.py
  - tests/test_feeding_supply_api.py
  - tests/test_rations_readiness.py
  - packages/frontend-web/src/__tests__/features/feed-advice/feeding-supply.test.tsx
risks:
  - Bestandseinheiten und Plan-FM duerfen nicht ohne explizite Konvertierung vermischt werden.
  - Unbekannter Bestand darf keinen Null-Bestellvorschlag erzeugen.
  - Einkaufsuebergabe darf eine Bestellung weder erzeugen noch freigeben.
