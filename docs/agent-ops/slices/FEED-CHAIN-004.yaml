slice_id: FEED-CHAIN-004
title: Einzelfutter ↔ inventory.articles + Bewegungsbelege
owner: Cursor
status: completed
created_at: 2026-06-23
coordination: >-
  Schliesst Belegbruch aus wave-physical-chain-feed-production-audit Punkt 4.
  Baut auf FEED-CHAIN-001 (Verbrauchs-Snapshot) auf. Abstimmung INV-STOCK-MOVEMENTS-001
  (kanonische Tabelle inventory_stock_movements).
goal: >-
  Bei Produktionsfreigabe/Storno werden neben futtermittel_einzelfutter.verfuegbar_t
  kanonische Lagerbewegungen in domain_inventory.inventory_stock_movements geschrieben;
  Einzelfuttermittel werden per artikel_nummer mit domain_inventory.articles verknuepft.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/FEED-CHAIN-004.yaml
  - alembic/versions/feed_chain_article_map_20260623.py
  - app/infrastructure/models/futtermittel_models.py
  - app/services/feed_inventory_link_service.py
  - app/api/v1/endpoints/produktion_mischfutter.py
  - tests/test_feed_chain_004.py
  - docs/workflows/wave-physical-chain-feed-production-audit-2026-06-12.md
  - docs/project-context/open-gaps-and-known-issues.md
acceptance:
  - Migration inventory_article_id auf futtermittel_einzelfutter.
  - Freigabe erzeugt out-Bewegungen pro Snapshot-Zeile (feed_production, idempotent).
  - Storno erzeugt in-Bewegungen; erneute Buchung gleicher Referenz idempotent.
  - API inventory-links und ensure fuer manuelles Mapping.
  - Unit/Integration-Tests gruen.
tests:
  - python -m pytest -q -o addopts= tests/test_feed_chain_004.py
risks:
  - Ohne Warehouse im Tenant werden Bewegungen uebersprungen (fail-soft).
  - Artikel-Erstellung nutzt Minimal-Stammdaten (sales_price=0, unit=t).
ai_harness:
  fachlicher_vertrag: >-
    Produktionsverbrauch spiegelt sich in kanonischen Lagerbewegungen; Mapping
    Einzelfutter-Artikelnummer ↔ inventory.articles.
  architektur_vertrag: >-
    FeedInventoryLinkService; Hook nach apply_verbrauch; keine Aenderung an
    FEED-CHAIN-001 Charge-Logik.
  daten_vertrag: >-
    Tenant-Scope; source_document_type feed_production; reference_number PROD-{auftrag}-{ef}-{in|out}.
  test_vertrag: >-
    Integration gegen Live-DB mit Cleanup; Schema-Guard via Alembic-Revision.
  security_vertrag: >-
    Bearer + X-Tenant-ID; keine Cross-Tenant-Artikelverknuepfung.
  betriebs_vertrag: >-
    Fail-soft ohne Warehouse; ensure idempotent.
  dokumentations_vertrag: >-
    Workboard, Audit-Workflow, Open-Gaps aktualisiert.
external_gates:
  - not_applicable
