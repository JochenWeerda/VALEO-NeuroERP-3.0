id: UX-FINANCE-002
title: UStVA mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-14
goal: >
  UStVA als zweite Finance-Arbeitsflaeche auf den UX-Exzellenzbaukasten ziehen:
  Rollenfokus, Melde-Aufgabenplan, Managemententscheidung, Next Action und
  CRUD-/Meldeabdeckung.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-FINANCE-002.yaml
  - packages/frontend-web/src/pages/finance/ustva.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - UStVA zeigt Rollenfokus fuer FIBU, Steuerbuero, Controlling und Leitung.
  - Melde-Aufgabenplan fuehrt Periode, Abweichungen, Freigabe und ELSTER.
  - Managemententscheidung zeigt abgabefaehig/gestoppt.
  - CRUD-/Meldeabdeckung ist sichtbar.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - git diff --check
done:
  - finance/ustva.tsx nutzt Rollenfokus, Melde-Aufgabenplan, Managemententscheidung, Next Action und CRUD-/Meldeabdeckung aus dem UX-Baukasten.
  - Bestehender Meldeverlauf, UStVA-Kontext, FIBU-KPIs und Submit-/Export-Aktionen bleiben erhalten.
  - UX-Standard markiert UX-FINANCE-002 als abgeschlossen.
risks:
  - Mahnwesen und Periodenabschluss folgen in separaten Finance-UX-Slices.
