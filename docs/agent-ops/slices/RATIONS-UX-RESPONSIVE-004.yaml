  architektur_vertrag: >-
    Reine Frontend-Layout-Aenderung in der bestehenden Workbench-Komponente; kein
    neuer Service, keine Route, kein API-Kontrakt.
  daten_vertrag: >-
    Keine Datenmigration; keine Datenpfad-Aenderung.
  security_vertrag: >-
