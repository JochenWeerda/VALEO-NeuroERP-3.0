  betriebs_vertrag: >-
    Keine Betriebs-/Deploy-Aenderung; Frontend-Build-Pfad unveraendert.
  dokumentations_vertrag: >-
    Active Workboard und Slice-YAML dokumentieren das responsive Verhalten.
  test_vertrag: >-
