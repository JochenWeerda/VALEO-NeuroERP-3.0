slice_id: HR-TIME-ACTIONPANEL-001
title: "HR-TIME UX-M2 — Detail-Aktionspanel fuer Zeiten- und Arbeitsplan-Tab"
status: umgesetzt
wave: 37
date: 2026-06-27
owner: Claude Code
goal: >-
  Wenn ein Nutzer eine Zeile im Arbeitszeit- oder Arbeitsplan-Tab fokussiert,
  erscheint rechts ein Detail-Panel mit Mitarbeiter-Kontext, Compliance-Befunden
  und direkten Aktionen (Bearbeiten, Einreichen, Drucken). Kein Tab-Wechsel noetig.
file_ownership:
  - packages/frontend-web/src/pages/personal/zeiterfassung.tsx
  - docs/project-context/hr-time-ux-workflow-roadmap-2026-05-12.md
  - docs/project-context/admin-suite-roadmap-2026-05-30.md
  - docs/agent-ops/slices/HR-TIME-ACTIONPANEL-001.yaml
acceptance:
  - Zeiten-Tab: DataTable mit onRowFocus; rechtes Panel zeigt Name/Datum/Kommen-Gehen/Stunden/Typ/Befunde/Aktionen.
  - Arbeitsplan-Tab: DataTable mit onRowFocus; rechtes Panel zeigt Mitarbeiter/Label/Zeit/Status/Findings/Print.
  - Kein Panel: Platzhalter-Card mit Hinweis.
  - tsc --noEmit exit 0.
  - UX-M2 in hr-time-ux-workflow-roadmap als umgesetzt markiert.
  - admin-suite-roadmap Status auf umgesetzt korrigiert.
tests:
  - tsc --noEmit (exit 0 verified)
risks:
  - Detailpanel kann bei kuenftigen DataTable-Aenderungen erneut entkoppeln.
  - Fachliche Druck-/Einreichungsflows brauchen spaeter zusaetzliche E2E-Abdeckung.
external_gates:
  - Keine externen Gates; Frontend-UX- und Dokumentationsslice.
ai_harness:
  fachlicher_vertrag: >-
    Panel zeigt nur bereits geladene Query-Daten (Performance-Regel aus
    operational-rollout-scope-2026-04-09.md: keine zusaetzlichen API-Requests).
    Compliance-Befunde werden aus dem cockpit.complianceIssues gefiltert.
  architektur_vertrag: >-
    selectedTimeEntry/selectedWorkPlanItem als lokaler useState-Zustand.
    DataTable onRowFocus als Hook. Kein neues File.
  daten_vertrag: >-
    Keine DB-Aenderungen. Alle Daten aus bereits existierenden useZeiterfassung/
    useTimeCockpit/useWorkPlan-Queries.
  test_vertrag: >-
    TypeScript 0 Fehler. Bestehende E2E-Tests nicht gebrochen.
  security_vertrag: >-
    Kein neuer API-Aufruf, keine Credentials. Aktionen (submitTimeEntry) bereits
    mit isPending-Guard abgesichert.
  betriebs_vertrag: >-
    Keine Performance-Regression (nur bereits geladene Daten). Grid-Layout
    kollabiert auf Mobilgeraeten (xl: breakpoint).
  dokumentations_vertrag: >-
    hr-time-ux-workflow-roadmap und admin-suite-roadmap aktualisiert.
