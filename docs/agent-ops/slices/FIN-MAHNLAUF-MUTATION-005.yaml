slice_id: FIN-MAHNLAUF-MUTATION-005
id: FIN-MAHNLAUF-MUTATION-005
title: Mahnlauf-Abschluss mit echter Backend-Mutation + sonner-Toaster global gemountet
owner: Claude
status: abgeschlossen
created_at: "2026-07-14"
started_at: "2026-07-14"
completed_at: "2026-07-14"
goal: >-
  Befund aus DESIGN-ROLLOUT-DENSITY-FIN-004 beheben: der Mahnlauf-Wizard
  suggerierte Versand, sendete aber keine Mutation und fragte einen nicht
  existenten Endpoint (/mahnwesen/faellige-posten) ab. Ziel: Maske auf die
  echten DOM-FIN-004.2-Endpoints verdrahten und den Abschluss als vollwertige
  Mutation nach Lifecycle-Invariante ausfuehren. Zusaetzlicher Fund gleich mit:
  sonner-Toaster war nie gemountet - toast()-Feedback von 44 Seiten unsichtbar.
scope:
  - "Backend additiv: DunningRunIn.rechnungsnrn (Teilmenge, Vorrang vor
    rechnungsnr); Endpoint iteriert je Rechnungsnummer ueber den bestehenden
    Service-Vertrag run_dunning und aggregiert {ok, erzeugt, mahnungen}.
    Bestehende Aufrufformen unveraendert."
  - "Frontend mahnwesen/mahnlauf.tsx: Kandidaten von GET /finance/mahnlauf/candidates
    (statt totem /mahnwesen/faellige-posten); je Posten naechste Stufe + Gebuehr
    sichtbar; Abschluss = POST /finance/mahnlauf/run mit rechnungsnrn-Auswahl,
    Guard/disabled via Wizard-loading, Erfolgs-/Fehler-Toast, Navigation erst
    nach Erfolg. Stufen-Select und funktionsloses Pflichtfeld Bezeichnung
    entfernt (Backend eskaliert Stufe je Posten selbst). Roh-Palette bereinigt
    (border-primary, bg-destructive/10, text-status-*), Zahlen tabular-nums."
  - "ToastBootstrap: sonner-<Toaster richColors closeButton> global gemountet -
    Feedback von 44 sonner-Seiten (Fibu/Stammdaten/Preise/Logistik u. a.) wird
    erstmals sichtbar. Konsolidierung der drei Toast-Systeme bleibt Folgearbeit."
