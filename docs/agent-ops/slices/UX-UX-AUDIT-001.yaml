id: UX-UX-AUDIT-001
title: UX-Baukasten Einsatzlogik und Abschlusskriterien
owner: Codex
status: abgeschlossen
created: 2026-05-16
goal: >
  Pruefen und verbindlich festlegen, wo der UX-Exzellenzbaukasten weiterhin
  fachlich sinnvoll ist, wo eine kompakte oder minimale Variante reicht und wo
  der systemweite Rollout als abgeschlossen gilt.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-UX-AUDIT-001.yaml
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Der UX-Standard unterscheidet volle, kompakte und minimale Baukasten-Nutzung.
  - Der Standard benennt klare Stop-Regeln gegen Ueberladung.
  - Verbleibende sinnvolle Rollout-Slices sind nach Nutzerwert priorisiert.
  - Doku-Checks und Workboard-Validierung sind gruen.
checks:
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-UX-AUDIT-001.yaml
  - git diff --check
done:
  - UX-Standard von pauschaler Pflicht auf Seitentyp-Klassifikation umgestellt.
  - Stop-Regeln gegen Ueberladung fuer Rollenfokus, Management-Bild, Nachweislinks, Audit-Zeitleiste und CRUD-Checkliste ergaenzt.
  - Systemweiter Rollout als abgeschlossen fuer Kernbereiche dokumentiert; weitere Arbeiten erfolgen nur noch nutzerwertbasiert.
  - Verbleibende Abschluss-Slices nach sinnvoller Baukasten-Tiefe priorisiert.
risks:
  - Zu pauschaler Einsatz von Rollenfokus, Managemententscheidung oder CRUD-Checklisten kann einfache Arbeitsflaechen ueberladen.
