goal: >-
  Welle AS-W7 (Anbauplan-Uebersicht/Fruchtfolge) und AS-W8 (ANDI-Schlagdaten-
  Import). Anbauplan-Uebersicht liefert Schlaege je Kultur und Hauptfruechte nach
  Umfang (LWK-Uebersicht) plus Fruchtfolge (Vorkultur -> Kultur). ANDI-Import
  parst dekodiertes Schlag-XML und legt neue Schlaege idempotent an. AS-W9
  (Beregnung/QS) wird ueber das bestehende generische Massnahmenmodell abgedeckt.
