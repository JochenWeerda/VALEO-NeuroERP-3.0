problem: |
  22+ Parallel-Alembic-Branches ausserhalb der Hauptkette verursachen 500er
  fuer Finance-, Agrar- und Sales-Endpoints. Betroffen:
  - domain_erp: dunning_rules, dunning_notices, payment_runs, payment_run_items,
    payment_returns, exchange_rates (aus ensure_finance_api_tables_20260413)
  - domain_agrar: ernte_planung, agrar_maschinen
  - domain_shared: branches (Niederlassungen)
  - domain_sales: delivery_notes
  - domain_crm: sales_order_items + shipping_method ADD COLUMN

solution: |
  Batch-Repair-Migration finance_agrar_sales_repair_20260626 mit
  CREATE TABLE IF NOT EXISTS + ADD COLUMN IF NOT EXISTS (via DO-Block)
  fuer alle betroffenen Tabellen, idempotent an neuen Hauptketten-Head
  warehouse_schema_repair_20260626 angehaengt.
  Neuer Head: finance_agrar_sales_repair_20260626

tables_created:
  domain_erp:
    - dunning_rules
    - dunning_notices
    - payment_runs
    - payment_run_items
    - payment_returns
    - exchange_rates
  domain_agrar:
    - ernte_planung
    - agrar_maschinen
  domain_shared:
    - branches
  domain_sales:
    - delivery_notes
  domain_crm:
    - sales_order_items
    - "sales_orders.shipping_method (ADD COLUMN IF NOT EXISTS)"

