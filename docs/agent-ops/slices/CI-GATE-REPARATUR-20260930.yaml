ai_harness:
  fachlicher_vertrag: >
    Buchen, Versenden, Sammelrechnung und Storno eines Lieferscheins gelingen
    auf einer frischen Installation. Ein Loeschantrag nach Art. 17 DSGVO
    loescht wirklich und sagt je Tabelle, was geschah. Gebuchte Werte werden
    nicht umgeschrieben.
  architektur_vertrag: >
    Jede Spalte und jede Bedingung, die der Code braucht, steht in einer
    Migration — nicht nur in einer gewachsenen Datenbank. Generatorlaeufe
    geschehen in einem sauberen Arbeitsbaum auf origin/main.
  daten_vertrag: >
    Keine UPDATE- oder DELETE-Anweisung auf gebuchten Saetzen. Die
    Statusbedingung laesst den Altbestandswert `geliefert` zu, statt ihn
    wegzuschreiben. Neue Spalten sind nullable, damit Bestandszeilen bleiben.
  test_vertrag: >
    Nachweis gegen eine frisch angelegte und migrierte Datenbank: 79 Tests der
    betroffenen Dateien gruen, Gesamtlauf 14 289 gruen. Die Migrationen
    zusaetzlich gegen den gewachsenen Bestand geprueft.
  security_vertrag: >
    PyJWT auf 2.14.0 (CVE-2026-102274). Der SQL-f-String in
    customer_reference.py setzt nur Bezeichner aus _REFERENCE_TABLES ein, die
    Werte sind gebunden; das nosec steht auf der schliessenden Zeile.
  betriebs_vertrag: >
    Rollback = die beiden Commits reverten. Die Migrationen sind
    rueckbaufaehig: die Statusbedingung wird beim downgrade entfernt, nicht
    verengt; die Spalten bleiben stehen, weil der Code sie schreibt.
  dokumentations_vertrag: >
