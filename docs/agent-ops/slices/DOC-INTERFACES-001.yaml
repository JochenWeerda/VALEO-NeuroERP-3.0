slice_id: DOC-INTERFACES-001
title: "Schnittstellenhandbuch: OpenAPI + MCP-Tools + Event-Katalog"
owner: Cursor
status: abgeschlossen
created_at: 2026-06-25
completed_at: 2026-06-25
goal: >-
  Die technischen Schnittstellen (REST-API, MCP-Tools, Event-Bus) aus der Single
  Source of Truth (Code/Config) generieren bzw. dokumentieren und als
  durchsuchbare, eingebettete Referenz in die Doku-Site bringen. OpenAPI wird
  per Script aus der FastAPI-App erzeugt (vom Docs-Build entkoppelt), der
  MCP-Tool-Katalog deterministisch aus config/mcp_erp_tools.yaml gerendert.
file_ownership:
  - docs/schnittstellen/rest-api.md
  - docs/schnittstellen/mcp-tools.md
  - docs/schnittstellen/events.md
  - docs/schnittstellen/openapi.json
  - scripts/generate_openapi.py
  - scripts/generate_mcp_tool_reference.py
  - mkdocs.yml
  - requirements-docs.txt
  - docs/agent-ops/slices/DOC-INTERFACES-001.yaml
  - docs/agent-ops/active-workboard.md
acceptance:
  - scripts/generate_openapi.py erzeugt docs/schnittstellen/openapi.json aus der FastAPI-App.
  - scripts/generate_mcp_tool_reference.py rendert docs/schnittstellen/mcp-tools.md aus config/mcp_erp_tools.yaml.
  - REST-API wird via Swagger-UI aus der openapi.json in die Site eingebettet.
  - Event-Katalog (NATS/Outbox) ist als Referenz dokumentiert.
  - mkdocs build laeuft fehlerfrei und die neuen Seiten sind navigierbar.
tests:
  - python scripts/generate_mcp_tool_reference.py --check
  - python -m mkdocs build --site-dir site_check
  - node scripts/ai-slice-readiness-check.cjs --slice DOC-INTERFACES-001
risks:
  - "OpenAPI-Generierung importiert die volle App (~2 min) und ist daher bewusst vom Docs-CI entkoppelt; das Artefakt wird committet."
  - "openapi.json kann gross werden; akzeptiert als versioniertes Schnittstellen-Artefakt."
  - "AsyncAPI-Vollautomatik ist Folgearbeit; Event-Katalog zunaechst kuratiert."
ai_harness:
  fachlicher_vertrag: >-
    Integratoren und Entwickler finden alle technischen Vertraege (REST, Events,
    MCP) an einer Stelle, durchsuchbar und versioniert.
  architektur_vertrag: >-
    Single Source = Code/Config. OpenAPI via app.openapi(), MCP-Referenz aus
    der YAML-Registry generiert; Docs-Build bleibt von Backend-Deps entkoppelt.
  daten_vertrag: >-
    Keine persistenten Daten. Artefakte: openapi.json (generiert),
    mcp-tools.md (generiert).
  test_vertrag: >-
    Generator-Check (--check) und mkdocs build im CI; Slice-Readiness gruen.
  security_vertrag: >-
    Keine Secrets in der Spec. MCP-Referenz weist Scope, Idempotenz, Risikoklasse
    und Human-Approval je Tool aus.
  betriebs_vertrag: >-
    OpenAPI-Refresh ist ein separater, manuell/CI-getriggerter Schritt; das
    Ergebnis wird versioniert eingecheckt.
  dokumentations_vertrag: >-
    Schnittstellenhandbuch ist Teil der Site-Navigation und im Workboard
    referenziert.
external_gates:
  - Keine externe Abnahme.
verification:
  - python -m mkdocs build --site-dir site_check
  - node scripts/ai-slice-readiness-check.cjs --slice DOC-INTERFACES-001
