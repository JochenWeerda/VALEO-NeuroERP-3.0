slice_id: CI-WA-PORTAL-GATE-20260626
title: WhatsApp/Portal CI-Gate-Nachzug
owner: Codex
status: completed
created_at: "2026-06-26"
goal: >-
  Die nach WA-AGENT-001, WA-NOTIFY-001 und PORTAL-SHOP-001 roten CI-Gates
  wieder schliessen: Backend-Response-Model-Coverage, Frontend-Typecheck und
  E2E-Smoke-Build.
file_ownership:
  - app/api/v1/endpoints/whatsapp_notify.py
  - app/api/v1/endpoints/whatsapp_webhook.py
  - packages/frontend-web/src/pages/portal/whatsapp-simulator.tsx
  - packages/frontend-web/src/components/ui/use-toast.ts
  - docs/project-context/open-gaps-and-known-issues.md
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/CI-WA-PORTAL-GATE-20260626.yaml
acceptance:
  - python scripts/check_response_models.py --threshold 80 ist gruen.
  - pnpm --dir packages/frontend-web typecheck ist gruen.
  - pnpm --dir packages/frontend-web build ist gruen.
  - Keine fremden Worktree-Aenderungen werden mitgebuendelt.
tests:
  - python scripts/check_response_models.py --threshold 80
  - pnpm --dir packages/frontend-web typecheck
  - pnpm --dir packages/frontend-web build
verification:
  - python -m py_compile app/api/v1/endpoints/whatsapp_notify.py app/api/v1/endpoints/whatsapp_webhook.py
  - python scripts/check_response_models.py --threshold 80 -> 3026/3106 routes, 80 untyped, OK
  - pnpm --dir packages/frontend-web typecheck -> gruen
  - pnpm --dir packages/frontend-web build -> gruen
risks:
  - Parallel-Agenten bearbeiten Doku- und WhatsApp-/Portal-Kontext; Staging muss strikt dateibezogen bleiben.
  - Der Frontend-Build generiert route-tree.gen.tsx; diese Datei wird nur committed, wenn der Routenstand bewusst geaendert wurde.
external_gates:
  - GitHub Actions Quality Gate und E2E Smoke muessen nach Push erneut gruen laufen.
ai_harness:
  fachlicher_vertrag: >-
    Gate-Nachzug ohne neue WhatsApp-Fachlogik. Bestehende Simulator- und
    Benachrichtigungsvertraege bleiben unveraendert.
  architektur_vertrag: >-
    FastAPI-Routen tragen explizite response_model-Metadaten. Frontend nutzt
    den kanonischen Toast-Hook bzw. einen kompatiblen Re-Export.
  daten_vertrag: >-
    Keine neuen persistierten Daten. Outbox-/Simulator-Datenmodell bleibt Scope
    von WA-NOTIFY-001.
  test_vertrag: >-
    Response-Model-Coverage, Frontend-Typecheck und Build muessen lokal
    reproduzierbar gruen sein.
  security_vertrag: >-
    Keine produktive Exponierung neuer Dev-Routen. Bestehende /dev/*-Routen
    bleiben WA-Slice-Scope.
  betriebs_vertrag: >-
    GitHub Actions bleiben das externe Gate; lokaler Fix wird erst nach Push
    anhand der Runs validiert.
  dokumentations_vertrag: >-
    Workboard und Open-Gaps dokumentieren den Gate-Nachzug.
