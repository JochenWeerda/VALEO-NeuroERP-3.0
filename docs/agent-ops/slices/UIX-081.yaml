slice_id: UIX-081
title: Twin-Panel v1 (Hofplan/Silo im Leitstand)
owner: Claude
status: in_arbeit
created_at: 2026-07-07
spec: docs/design/specs/uix-m3-spec.md
coordination: >-
  Teil des UIX-Zukunft-Programms (UIX-ZUKUNFT-VISION-001). Vor Umsetzung Owner
  eintragen, Claim sofort committen; Abhaengigkeiten laut Roadmap beachten.
goal: >-
  SVG-Twin-Primitive aus deklarativer Geometrie (config/twin_plans) mit Metrik-Layern und Klick-Durchstich; Leitstand-SD nach W-04.
file_ownership:
  - "config/twin_plans/**"
  - "app/api/v1/endpoints/silo_cells_readmodel.py"
  - "packages/frontend-web/src/components/mask-builder/renderers/TwinPanelRenderer.tsx"
  - "app/core/screen_definitions.py"
acceptance:
  - "Jede Zelle hat Klick-Durchstich zu Objekt/Maske (Abnahmekriterium: Twin ist Werkzeug, nicht Deko)."
  - "cells-Read-Model 0x5xx, Cache 30s, Stand-Anzeige sichtbar."
  - "<=300 Zellen performant in einem SVG; Keyboard-Navigation."
  - "Visual-Audit 1366/1440/1920 erweitert."
tests:
  - "pytest cells-Read-Model Coverage>=60"
  - "Vitest Geometrie-Parser+Layer"
  - "Playwright Leitstand->Zelle->Maske"
  - "Performance-Gate cockpit"
progress: >-
  2026-07-07 Renderer-Primitive + Geometrie-Kern geliefert (isoliert): renderers/
  twin-geometry.ts (reiner Parser rect/polygon mit Validierung+Fehlerliste,
  shapeToPath SVG, cellStyle Metrik-Farblogik: Fuellstand→Gold-Verlauf,
  warnAbove→danger-Kontur, locked→Schraffur; keyboardOrder) + TwinPanelRenderer
  (EIN SVG, Zellen als Pfade, Klick-Durchstich onCellActivate, Tastatur Tab+Enter,
  Tooltip, "Stand HH:MM:SS", Lock-Schraffur-Pattern; ≤300 Zellen ohne
  Virtualisierung). config/twin_plans/emden-hofplan-v1.yaml (rect+polygon). 12
  Vitest (Parser inkl. fehlerhafte Zellen/Duplikate, Farblogik, Klick+Keyboard-
  Durchstich). tsc 0, ESLint sauber. OFFEN: Read-Model GET /lager/silo/cells
  (Aggregation, 30s-Cache), Leitstand-SD lager/leitstand (screen_definitions
  shared), Einbindung in UniversalMaskRenderer (twin-Block), Playwright, Visual-
  Audit 1366/1440/1920.
  2026-07-08 Codex-Tail UIX-081-PIPELINE: Pipeline-Stufe geliefert. GET
  /api/v1/lager/silo/cells ist tenant-isoliertes Twin-Read-Model mit
  Cache-Control max-age=30, updatedAt, metrics, cellData und route/screen_id-
  Durchstich; lager/leitstand-SD besitzt additiven twin-Block; RenderPlan
  kompiliert RenderTwinPlan; UniversalMaskRenderer bindet TwinReadModelRenderer
  zentral ein. OFFEN danach: Playwright Leitstand->Zelle->Maske und Visual-Audit
  1366/1440/1920; Studio-Export bleibt Folge.
risks:
  - Geteilter Working Tree mit Parallel-Agenten — Branch vor Commit pruefen.
  - Scope-Kriechen: ein Slice = ein Push-Zyklus; Folgearbeit als neuer Slice.
ai_harness:
  fachlicher_vertrag: >-
    Der Leitstand zeigt die physische Lage (Fuellstand/Feuchte/Sperren) und fuehrt in einem Klick zur Aktion.
  architektur_vertrag: >-
    Single Source of Truth bleibt ScreenDefinition -> RenderPlan -> useUniversalMaskRuntime -> UniversalMaskRenderer. Neue Faehigkeiten sind Contract-Felder + Compiler-Ableitungen + Renderer-Primitive + Gates — kein Parallelsystem, keine Seiten-Kopien.
  daten_vertrag: >-
    twin-Block additiv in SD; Geometrie als versioniertes YAML (Studio-Export als Folge); reine Lese-Projektion.
  test_vertrag: >-
    Parser-, Layer- und Durchstich-Tests plus Visual-Audit sichern das Panel.
  security_vertrag: >-
    Keine neuen Secrets, Tenant-Isolation in jedem neuen Endpoint (Pflichttest), dangerLevel/Confirmation/AuditReason unveraendert; NL-/Voice-/Agent-Pfade duerfen Gates nie verkuerzen.
  betriebs_vertrag: >-
    quality-gate, universal-mask-ci, runtime-sweep und Performance-Gates bleiben gruen; neue GETs 0x5xx; Rollback ueber Feature-Flags bzw. native Route-Rollback-Matrix.
  dokumentations_vertrag: >-
    Workboard + Slice-YAML + betroffene Statusdoku (universal-mask-runtime-status, Agent-Handbuch-Generatoren) im selben Push synchronisieren.
external_gates:
  - not_applicable
