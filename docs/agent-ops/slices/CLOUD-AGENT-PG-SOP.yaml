  architektur_vertrag: >
    Kein neues Subsystem. Bestehende Workflows und Pruefstand-Governance bleiben
    Source of Truth; SOP ist Betriebsvertrag fuer Cloud-VMs.
  daten_vertrag: >
    Keine neue DB/Container. CI-Job-DB ephemer. Host-valeo_probe unveraendert.
    Keine Secrets in Doku.
  test_vertrag: >
    Abnahme dokumentarisch + Docs-Governance. Keine neuen pytest-Faelle in diesem Slice.
  security_vertrag: >
    Keine Portoeffnung, keine Zugangsdaten in Chat/Reports/Commits, keine
    eigenmaechtigen Environment-Aenderungen.
  betriebs_vertrag: >
    Rollback = Doku-PR reverten. Kein Betriebs-Impact auf laufende Services.
  dokumentations_vertrag: >
    SOP, AGENTS, Session-Checklist, Runbook-Querverweise, Workboard, Slice-YAML, Handshake.
external_gates:
  - not_applicable
