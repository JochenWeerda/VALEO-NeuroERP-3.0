acceptance:
  - Jeder Statuswechsel erzeugt eine append-only Version mit Akteur Zeit Grund und erwarteter Version.
  - Abschluss ist ohne dokumentierte Wirksamkeitskontrolle und Ergebnis unzulaessig.
  - Owner Termin Wiedervorlage Eskalationsstatus und Ergebnis bleiben historisch nachvollziehbar.
  - Ueberfaelligkeitslauf ist idempotent und emittiert je Massnahme und Faelligkeitsstand genau ein Event.
  - In-App-Hinweise sind tenant grant und empfaengersicher und enthalten einen stabilen Deep Link.
  - Berichtentwurf ist aus Fall Beobachtungen und Massnahmen reproduzierbar und versioniert.
  - Agenten duerfen weder Massnahmen still abschliessen noch Wirksamkeit erfinden.
