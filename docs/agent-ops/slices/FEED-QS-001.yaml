problem: |
  Futtermittel-Domain fehlte QS-/Compliance-Schicht:
  - HACCP-Plaene (Gefahrenanalyse, CCP, Ueberwachung, Korrekturen, Verifizierung)
  - VLOG-Meldungen (GVO-freie Rohstoffe, Zertifikat, Status-Workflow)
  - QS-Leitfaden-Pruefpunkte (Periode, Kategorie, Bestaetigung, Abweichung)
  Tabellen fehlten in domain_shared; keine API-Endpoints vorhanden.

solution: |
  Neuer Router /futtermittel/qs mit 10 Endpoints:
  GET/POST/PATCH haccp-plaene, GET/POST/PATCH vlog-meldungen,
  GET/POST leitfaden-pruefpunkte, POST leitfaden-pruefpunkte/{id}/bestaetigen.
  Repair-Migration feed_qs_wf_cockpit_repair_20260626 legt 3 neue
  domain_shared-Tabellen + domain_workflow.wf_cockpit_* idempotent an.

