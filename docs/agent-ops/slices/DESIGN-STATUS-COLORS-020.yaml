slice_id: DESIGN-STATUS-COLORS-020
id: DESIGN-STATUS-COLORS-020
title: Farbe zurueckbauen - Semantik sparsam, Dekoration neutral (Welle 6, Abschluss)
owner: Claude Code
status: in Arbeit
zurueckgestellt_am: "2026-09-14"
wiederaufgenommen_am: "2026-09-14"
created_at: "2026-09-14"
started_at: "2026-09-14"
vorgaenger: DESIGN-STATUS-COLORS-019
goal: >-
  Den Rest der rohen Palettenfarben schliessen - aber nicht durch Umfaerben,
  sondern durch Zurueckbauen. Leitbild ist die Praxis fuehrender
  Unternehmensanwendungen (SAP Fiori): semantische Farbe ist ein knappes
  Signal, kein Gestaltungsmittel. Wo Farbe nichts bedeutet, wird sie neutral.
leitbild:
  quelle: >-
    SAP Fiori Design Guidelines, Semantic Colors: die semantischen Farben
    (Negative, Critical, Positive, Informative, Neutral) sind fuer Zustand und
    Kritikalitaet reserviert. Ikonen im Inhaltsbereich erben die Textfarbe;
    farbig werden sie nur als Statusanzeige. Farbe darf nie der einzige
    Traeger einer Information sein.
  konsequenz_hier: >-
    Der bisherige Bestand widerspricht dem an der breitesten Stelle: 135 von
    176 farbigen Ikonen sind blau, und es sind Sachikonen - FileText, Euro,
    Users, Truck, Package, Calendar, MapPin. Das Blau bedeutet nichts, es
    dekoriert. Es zu einem Info-Token zu machen haette die Ueberfrachtung
    zementiert statt sie aufzuloesen.
regel:
  - >-
    Farbe, die einen Zustand benennt, bleibt semantisch - und zwar ueber die
    Komponenten Badge, Callout, Alert oder die Statusutilities.
  - >-
    Farbe an Sachikonen, Sparte- und Schmuckelementen wird neutral
    (text-muted-foreground). Weniger Farbe, mehr Signalwert fuer den Rest.
  - >-
    Auswahl und Zeilenhervorhebung sind kein Erfolg. Sie gehoeren auf die
    neutrale Auswahlfarbe (bg-accent), nicht auf Gruen.
  - >-
    Verweise und Aktionen gehoeren auf die Primaerfarbe bzw. die
    Button-Varianten, nicht auf blaue Einzelklassen.
  - >-
    Kategoriale Faerbung bleibt ausgenommen (siehe Welle 4/5) und wird nicht
    in die Statusskala gezwungen.
befund:
  gemessen_am: "2026-09-14"
  palettenklassen_gesamt: 1570
  bloecke:
    ikonfarben: "169 an echten lucide-Ikonen, davon 135 blau"
    textfarben: "189, ueberwiegend blaue Kennzahlen und Beschriftungen"
    button_uebersteuerungen: "54, ueberwiegend das Muster text-blue-600 hover:underline als Verweis"
    auswahlhervorhebung: "36, darunter bg-green-100 fuer die ausgewaehlte Zeile"
    tabellen_helfer: "152"
    flaechen_ab_500: "484 deckende Flaechen, Punkte, Verlaeufe"
file_ownership:
  - docs/agent-ops/slices/DESIGN-STATUS-COLORS-020.yaml
  - "docs/agent-ops/active-workboard.md: nur der eigene Abschnitt"
  - "Dateien unter packages/frontend-web/src mit rohen Palettenklassen"
acceptance:
  - Sachikonen tragen keine Palettenfarbe mehr.
  - Auswahl und Zeilenhervorhebung neutral.
  - Verweise ueber Primaerfarbe bzw. Button-Varianten.
  - Verbleibende Farbe benennt einen Zustand, eine Kategorie oder eine Marke - begruendet.
  - "tsc --noEmit exit 0; vitest identisch zur Baseline (126 Dateien, 495 Tests, 1 Skip)."
risks:
  - >-
    Die Oberflaeche wird sichtbar ruhiger. Das ist der Zweck und keine
    Regression - aber es ist eine sichtbare Aenderung an vielen Masken.
  - >-
    Einzelne Ikonen tragen doch Bedeutung (Trend, Warnung, Erfolg). Sie
    werden an ihrer Farbfamilie erkannt und bleiben unangetastet, wenn die
    Familie zur Bedeutung passt.
verification:
  - "npx tsc --noEmit"
  - "npx vitest run --testTimeout=30000 --maxWorkers=2"
  - "Gegenprobe je Block mit dem Messskript"

wiederaufnahme:
  entscheidung: >-
    User, 2026-09-14: die Zurueckstellung ist aufgehoben, Welle 6 wird
    aufgenommen. Regel und Messung dieses Slices gelten unveraendert -
    Rueckbau statt Umfaerben.

zurueckstellung:
  entscheidung: "User, 2026-09-14: die Farben bleiben vorerst, wie sie sind (aufgehoben, siehe wiederaufnahme)."
  stand: >-
    Nichts umgesetzt. Der Codemod fuer Schritt 1 war angewandt und ist
    vollstaendig zurueckgenommen (git checkout, 119 Dateien, Arbeitsbaum
    wieder sauber). Es liegt kein halber Stand im Repository.
  was_bleibt_nutzbar: >-
    Die Messung und die Regel. Wer die Welle spaeter aufnimmt, findet den
    Befund hier: 135 von 176 farbigen Ikonen sind blaue Sachikonen ohne
    Bedeutung, und der Rueckbau auf text-muted-foreground haette 151 Ikonen
    in 121 Dateien betroffen - bei ausgenommenen Agent-/KI-Bausteinen, deren
    Violett ein Merkmalsakzent fuer maschinell erzeugte Inhalte ist.
  abgeschlossener_vorlauf: >-
    Die Wellen 4 und 5 (DESIGN-STATUS-COLORS-018/019) sind fertig und
    gepusht; getoente Flaechen sind vollstaendig auf Komponenten und
    semantische Tokens umgestellt. Diese Welle betraf nur noch Ikon-, Text-
    und Akzentfarben.

fortschritt:
  schritt_1_sachikonen:
    stand: abgeschlossen
    datum: "2026-09-14"
    ergebnis: >-
      186 Ikonen in 130 Dateien auf text-muted-foreground zurueckgebaut.
      Getrennt nach Farbfamilie: Bedeutungstraeger (red, green, emerald,
      amber, orange, yellow, rose, lime) unangetastet, Akzentfamilien fuer
      Agent/KI (violet, purple, fuchsia, pink) ausgenommen, Dekoration
      (blue, sky, cyan, indigo, slate, gray, zinc, neutral, stone) neutral.
    gegenprobe: >-
      Danach tragen noch 12 Ikonen in 10 Dateien Farbe - 11 davon die
      ausgenommenen Akzentfamilien (Agent/KI), 1 lime. Keine blaue Sachikone
      mehr im Bestand.
    abweichung_zur_vorarbeit: >-
      Die zurueckgenommene Vorarbeit hatte 151 Ikonen in 121 Dateien
      gemessen; dieser Lauf fasst zusaetzlich graue und slate-Sachikonen
      sowie dark-Varianten an und liegt deshalb bei 186 in 130.
    abnahme: >-
      tsc --noEmit exit 0; vitest 126 Dateien, 495 Tests, 1 Skip - identisch
      zur Baseline. Selbsttest des Codemods 7/7 gruen vor dem Lauf.
  offen:
    - "Textfarben (189) - Kennzahlen und Beschriftungen"
    - "Button-Uebersteuerungen (54) - Muster text-blue-600 hover:underline"
    - "Auswahlhervorhebung (36) - bg-green-100 auf bg-accent"
    - "Tabellen- und Helferfarben (152)"
    - "Deckende Flaechen ab Schattierung 500 (484)"

tests:
  - >-
    Codemod-Selbsttest ueber fuenf Musterfaelle (Sachikone in Blau,
    Statusfamilie bleibt, bereits neutrale Statusutility, Nicht-Ikone,
    Klassenreihenfolge) - bestanden.
  - >-
    Nicht ausgefuehrt, weil zurueckgestellt: tsc, eslint und vitest als
    Abnahme. Der einmal angewandte Stand wurde vor jeder Pruefung
    zurueckgenommen.
  - >-
    Gegenprobe der Ruecknahme: git status unter packages/frontend-web/src
    leer, 119 Dateien wiederhergestellt.
external_gates:
  - >-
    Entscheidung des Users ueber den gestalterischen Umfang. Sie ist am
    2026-09-14 gegen die Umsetzung gefallen; der Slice bleibt bis zu einer
    neuen Entscheidung zurueckgestellt.
ai_harness:
  fachlicher_vertrag: >-
    Semantische Farbe ist ein knappes Signal fuer Zustand und Kritikalitaet.
    Wo Farbe nichts bedeutet, ist sie Dekoration und wird neutral - sonst
    verliert das Signal seinen Wert.
  architektur_vertrag: >-
    Ikonen erben die Textfarbe; semantische Farbe kommt ueber Komponenten oder
    Statusutilities. Auswahl laeuft ueber die neutrale Auswahlfarbe, Verweise
    ueber die Primaerfarbe bzw. Button-Varianten.
  daten_vertrag: "Keine Migration, keine Datenmutation, reine Darstellung."
  test_vertrag: >-
    Der Selbsttest des Codemods muss vor jedem Lauf gruen sein; die Abnahme
    haette tsc, eslint und einen Vitest-Lauf gegen die Baseline verlangt.
    Beides ist wegen der Zurueckstellung nicht zur Anwendung gekommen.
  security_vertrag: >-
    Keine Berechtigungen, Endpunkte oder Abhaengigkeiten beruehrt.
  betriebs_vertrag: >-
    Rein clientseitig. Da nichts uebernommen wurde, ist kein Betriebsschritt
    offen.
  dokumentations_vertrag: >-
    Die Zurueckstellung, der Stand der Ruecknahme und die verwertbare
    Vorarbeit sind festgehalten, damit niemand einen halben Stand vermutet.
