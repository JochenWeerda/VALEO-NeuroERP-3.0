acceptance:
  - DraftComponent und Versionssnapshot bewahren optionale nichtnegative min_kg_fm und max_kg_fm.
  - Min groesser Max wird critical mit stabilem Code und verursachender Feed-ID erklaert.
  - Eine Menge ausserhalb ihrer Grenze wird high und positionsbezogen erklaert.
  - Die Summe der TM-Minima gegen das DMI-Maximum nennt alle verursachenden Futtermittel.
  - Entwuerfe ohne Grenzen bleiben golden-kompatibel.
  - Editor zeigt Min/Max in dichten Tabellenspalten und fokussiert vom Befund die verursachende Grenze.
  - API ist typisiert; negative Grenzen werden als 422 abgewiesen.
