id: UX-SALES-006
title: Verkaufsdashboard und Folgebeleglisten mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-15
goal: >
  Verkaufsdashboard, Rechnungs- und Lieferlisten auf den UX-Exzellenzbaukasten
  ziehen: Rollenfokus, Prioritaetsplan, Managemententscheidung, Next Action und
  CRUD-/Nachweis-Abdeckung.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-SALES-006.yaml
  - packages/frontend-web/src/pages/dashboard/sales-dashboard.tsx
  - packages/frontend-web/src/pages/sales/rechnungen-liste.tsx
  - packages/frontend-web/src/pages/sales/lieferungen-liste.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Dashboard, Rechnungs- und Lieferlisten zeigen Rollenfokus fuer Vertrieb, Faktura, Logistik, Finance und Leitung.
  - Prioritaetsplan fuehrt Umsatz, offene Rechnungen, Lieferstatus und Nachweis.
  - Managemententscheidung zeigt arbeitsfaehig/blockiert.
  - CRUD-/Nachweis-Abdeckung ist sichtbar.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-SALES-006.yaml
  - git diff --check
done:
  - Verkaufsdashboard um Rollenfokus, Verkaufs-Prioritaetsplan, Managemententscheidung, Next Action und CRUD-/Nachweis-Abdeckung ergaenzt.
  - Rechnungsliste um Rollenfokus, Rechnungs-Prioritaetsplan, Managemententscheidung, Next Action und CRUD-/Nachweis-Abdeckung ergaenzt.
  - Lieferliste um Rollenfokus, Liefer-Prioritaetsplan, Managemententscheidung, Next Action und CRUD-/Nachweis-Abdeckung ergaenzt.
  - Bestehende KPI-Karten, Top-Kunden, OperationalCaseHeader, Filter, Import, Export, Druck, Tabellen und Editor-Navigation bleiben erhalten.
risks:
  - Auftrags- und Angebotslisten sind bereits in frueheren Sales-Slices abgedeckt; dieser Slice fokussiert Dashboard, Rechnungen und Lieferungen.
