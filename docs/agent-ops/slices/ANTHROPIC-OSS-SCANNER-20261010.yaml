slice_id: ANTHROPIC-OSS-SCANNER-20261010
title: Anthropic OSS Scanner Enrollment vorbereiten
owner: Codex
status: in_progress
created_at: 2026-10-10
goal: Einen reproduzierbaren Build und ein VALEO-spezifisches Threat Model fuer Anthropic OSS Scanner bereitstellen.
file_ownership:
  - .oss-scanner/**
  - .dockerignore
  - .github/workflows/oss-scanner-build.yml
  - docs/quality-assurance/anthropic-oss-scanner-20261010.md
  - docs/agent-ops/slices/ANTHROPIC-OSS-SCANNER-20261010.yaml
  - Eigener Abschnitt in docs/agent-ops/active-workboard.md
acceptance:
  - Der Scanner-Build installiert Python- und pnpm-Abhaengigkeiten vor dem Offline-Scan.
  - Das Threat Model priorisiert Tenant-, Finance-, Audit-, Import- und Agentenrisiken.
  - Keine erfundene oder ungepruefte Kontaktadresse wird als aktives Enrollment publiziert.
  - Repo-interne Doku- und Slice-Gates sind gruen.
validation: Ausstehend; Docker-Build, statische Dockerfile-Pruefung und Doku-Gates.
test_database: Keine Datenbank und kein Container ausser dem expliziten Scanner-Image.
risks:
  - Der vollstaendige Image-Build ist gross und benoetigt Netzwerkzugriff beim Build.
  - Aufnahme durch Anthropic bleibt von einer verifizierten oeffentlichen Kontaktadresse und der CLA abhaengig.
tests:
  - docker build -f .oss-scanner/Dockerfile -t valeo-neuroerp-oss-scanner .
  - GitHub Workflow Anthropic OSS Scanner Build
  - node scripts/docs-markdown-check.cjs
  - node scripts/docs-governance-check.cjs
  - node scripts/ai-slice-readiness-check.cjs
ai_harness:
  fachlicher_vertrag: Security-Funde werden an den verifizierten Projektkontakt geliefert und priorisieren reale ERP-Auswirkungen.
  architektur_vertrag: Scanner bleibt externer Analyseweg ohne Produktivservice oder neue Laufzeitabhaengigkeit.
  daten_vertrag: Keine Secrets oder echten Kunden- und Produktionsdaten im Image oder Threat Model.
  test_vertrag: Build und Offline-Smokes sind aus dem committeten Dockerfile reproduzierbar.
  security_vertrag: Tenant-, Rollen-, GoBD-, Audit-, Import-, SSRF- und Agentengrenzen sind explizit beschrieben.
  betriebs_vertrag: Netzwerk nur waehrend des Image-Builds; Analyse danach offline.
  dokumentations_vertrag: README, Threat Model, QA, Slice und Workboard bleiben gemeinsam nachvollziehbar.
external_gates:
  - Verifizierte oeffentliche Sicherheitsadresse festlegen
  - Aufnahme-PR bei anthropics/oss-scanner
  - Anthropic Contributor License Agreement durch Kernmaintainer bestaetigen
