acceptance:
  - Alle neuen Masken bauen gueltige Request-URLs und verarbeiten reale Response-Shapes
  - Paging und Mehrfachauswahl bleiben bei Fehlern und Seitenwechseln konsistent
  - Neue Datenpfade sind tenant-sicher und zum aktuellen Datenbankschema kompatibel
  - Migration, Backend, Frontend, TypeScript, Architektur und Doku-Gates sind gruen
risks:
  - Echtdaten- und Rollen-UAT bleibt ohne produktive Testmandanten extern
  - Parallele RDP-Capture-Artefakte liegen ausserhalb dieses Dateibesitzes
