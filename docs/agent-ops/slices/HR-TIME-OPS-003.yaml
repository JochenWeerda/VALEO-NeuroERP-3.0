id: HR-TIME-OPS-003
status: abgeschlossen
owner: Codex
goal: >
  Nachbearbeitung ergonomisch aus der Arbeitszeitliste starten statt manuelle
  Zeitbuchungs-ID-Eingabe zu erzwingen.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/HR-TIME-OPS-003.yaml
  - packages/frontend-web/src/pages/personal/zeiterfassung.tsx
  - packages/frontend-web/tests/e2e/hr-time-clickthrough.generated.spec.ts
acceptance_criteria: >
  Arbeitszeitzeilen haben eine Bearbeiten-Aktion; Klick fuellt die
  Nachbearbeitung mit ID, Zeiten, Stunden und Typ; die UI springt zur
  Erfassungs-/Nachbearbeitungsgruppe; E2E-Durchklicktest nutzt diesen Pfad.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web exec playwright test tests/e2e/hr-time-clickthrough.generated.spec.ts --project=chromium
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
risks: >
  Voller Edit/Delete-Workflow fuer alle HR-Time-Objekte bleibt Folgeslice.
done:
  - Arbeitszeitliste erhaelt Bearbeiten-Aktion mit ID-/Zeit-/Typ-Uebernahme.
  - Tabs sind kontrolliert und springen in die Erfassung.
  - Playwright-Durchklicktest nutzt den realen Bearbeiten-Pfad vor Submit/Korrektur.
