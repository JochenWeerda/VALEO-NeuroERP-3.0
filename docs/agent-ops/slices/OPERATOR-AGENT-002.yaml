slice_id: OPERATOR-AGENT-002
title: "Operator-Agent DB-Persistenz für Proposals"
priority: P2
owner: Claude Code
status: abgeschlossen
created: "2026-06-26"

goal: >
  Agent-Proposals persistent in PostgreSQL speichern (agent_proposals Tabelle).
  SQLAlchemy-Modell + Alembic-Migration + Repository-Pattern.
  Proposals überleben Backend-Restart; Idempotenz-Key verhindert Duplikate.

ai_harness:
  fachlicher_vertrag:
    - agent_proposals Tabelle speichert proposal_id, tenant_id, action_type, approval_status, idempotency_key.
    - Proposals überleben Backend-Restart (kein In-Memory-Verlust mehr).
    - Idempotency-Key (unique) verhindert Doppel-Proposals bei Retry.
    - AgentProposalRepository.delete_expired() räumt abgelaufene PENDING-Proposals auf.
  architekturvertrag:
    - Alembic-Revision: agent_proposals_persist_20260626 (down_revision: wf_cockpit_persist_20260625).
    - Repository-Pattern: OperatorAgentService delegiert Persistenz an AgentProposalRepository.
    - API-Endpunkte instanziieren Service pro Request via Depends(get_db).
  akzeptanzkriterien:
    - Alembic-Migration existiert und ist syntaktisch korrekt.
    - AgentProposalRecord-Modell importierbar ohne Fehler.
    - AgentProposalRepository.save() / get() / list() implementiert.
    - OperatorAgentService nutzt Repository; Proposals überleben Service-Neustart.
    - tests/test_operator_agent_persist.py grün mit require_db.

dateibesitz:
  - app/infrastructure/models/agent_proposal_model.py
  - alembic/versions/agent_proposals_persist_20260626.py
  - app/repositories/agent_proposal_repository.py
  - app/services/operator_agent_service.py
  - app/api/v1/endpoints/operator_agent.py
  - tests/test_operator_agent_persist.py
  - docs/agent-ops/slices/OPERATOR-AGENT-002.yaml
