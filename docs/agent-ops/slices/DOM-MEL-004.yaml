slice_id: DOM-MEL-004
title: "Meldewesen-Domäne — Vollständige Vertiefung: Intrastat/ELSTER/ATLAS Lifecycle (.2–.5)"
owner: Claude Sonnet 4.6
status: completed
goal: >-
  Meldewesen auf volle 004-Tiefe: ENTWURF→IN_PRUEFUNG→FREIGEGEBEN→UEBERMITTELT→BESTAETIGT.
  ABGELEHNT→IN_PRUEFUNG (Korrektionsschleife). Simulierte Übermittlung für Tests.
  Echte Behörden-Übermittlung bleibt externes Gate.
file_ownership:
  - docs/agent-ops/slices/DOM-MEL-004.yaml
  - app/services/meldewesen_lifecycle_service.py
  - alembic/versions/meldewesen_lifecycle_20260623.py
  - app/api/v1/endpoints/meldewesen_lifecycle_actions.py
  - tests/test_dom_mel_004.py
not_owned:
