acceptance_criteria:
  - Lifecycle inkl. ABGELEHNT→IN_PRUEFUNG Korrektionsschleife
  - Hinweis bei UEBERMITTELT (externe Bestätigung offen)
  - Simulierte Übermittlung deterministisch
  - 9 Unit-Tests grün
ai_harness:
  fachlicher_vertrag: >-
    UEBERMITTELT bedeutet: Meldung raus, Bestätigung steht aus.
    BESTAETIGT: Behörde hat angenommen. ABGELEHNT: Korrektionsschleife möglich.
    Echte Übermittlung extern gegated.
  architektur_vertrag: Schema domain_meldewesen. text()-SQL only.
  daten_vertrag: meldungen (typ, periode, betrag, status), meldung_log (append-only).
  test_vertrag: Lifecycle + Hinweis + Simulation-Determinismus.
  security_vertrag: X-Tenant-ID; Log append-only.
  betriebs_vertrag: Simulation als eigener Endpunkt, kein Commit in Behörden-System.
  dokumentations_vertrag: Workboard-Eintrag + Slice-YAML
external_gates:
  - ELSTER/ERiC echte Übermittlung
  - ATLAS Zollanmeldung echte Übertragung
  - Intrastat Statistisches Bundesamt
