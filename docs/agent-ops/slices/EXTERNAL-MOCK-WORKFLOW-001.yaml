slice_id: EXTERNAL-MOCK-WORKFLOW-001
title: "Playwright External-Mock-Workflow Verträge"
priority: P3
owner: Claude Code
status: abgeschlossen
created: "2026-06-26"

goal: >
  Mock-Verträge für externe Gates in Playwright-Specs dokumentieren.
  FIBU- und POS/TSE-Specs nutzen bereits /api/v1/dev/external-mocks/* Endpunkte.
  MkDocs-Seite dokumentiert verfügbare Mock-Endpunkte und Vertragsformat.

ai_harness:
  fachlicher_vertrag:
    - Alle /dev/external-mocks/*-Aufrufe in Playwright-Specs sind dokumentiert.
    - Mock-Kontrakt: {simulated: true, ...} in Response.
    - docs/schnittstellen/events.md verweist auf Mock-Endpunkte für Integration-Tests.
  architekturvertrag:
    - Mock-Endpunkte unter /api/v1/dev/ (nur im dev/test-Modus aktiv).
    - Kein Umbau bestehender Specs — nur Dokumentation der bestehenden Muster.
    - Vertrags-Dokument in docs/agent-docs/runbooks/.
  akzeptanzkriterien:
    - fibu-semantic-chain.spec.ts und pos-tse-semantic-chain.spec.ts nutzen Mock-Endpunkte.
    - Mock-Vertrags-Seite in docs/ existiert.
    - Keine simulated=true-Expects in @critical-Blöcken (nur in @smoke).

dateibesitz:
  - docs/agent-docs/runbooks/external-mock-vertraege.md
  - docs/agent-ops/slices/EXTERNAL-MOCK-WORKFLOW-001.yaml
