id: DESIGN-MERIDIAN-HARDCOLORS-011
owner: Codex
status: abgeschlossen
created: 2026-05-27
completed: 2026-05-27
goal: >
  Fachseiten-Hardcolors in einem ersten risikoarmen Folgeslice auf
  Meridian-/semantische Tokens ziehen.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/DESIGN-MERIDIAN-HARDCOLORS-011.yaml
  - packages/frontend-web/src/pages/
  - packages/frontend-web/src/features/
acceptance_criteria:
  - Ein priorisierter Satz sichtbarer Fachseiten/Feature-Komponenten nutzt keine generischen Tailwind-Hardcolors mehr fuer Status-, Surface- und Textsemantik.
  - Frontend-Typecheck bleibt gruen.
  - Workboard-Validierung und Diff-Checks sind gruen.
  - Verbleibende Hardcolors sind als Folgescope dokumentiert.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - git diff --check
done:
  - Workflow-Oversight-Board auf Badge-Varianten und semantische Meridian-Token umgestellt.
  - ApprovalPanel von grauen/gruenen Utility-Hardcolors auf muted/default Tokens gezogen.
  - Copilot Dock und Insights von Emerald/Teal/Gray-Hardcolors auf primary/card/muted Tokens gezogen.
  - CRUD-Audit, Cancel/Delete-Dialoge und AlertBanner auf Badge-Varianten, destructive und semantische Tokens umgestellt.
remaining_scope:
  - Weitere historische Hardcolors in Admin-, Finance-, Agrar- und Monitoring-Fachseiten bleiben Folgeslices.
risks:
  - Der Bestand enthaelt sehr viele historische Hardcolors; dieser Slice schliesst einen priorisierten Batch und keinen kompletten Big-Bang-Refactor.
