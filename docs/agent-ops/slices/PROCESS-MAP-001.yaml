slice_id: PROCESS-MAP-001
title: "P2.1 â€” Workflow-Designer / Prozesskarte fuer ERP-Prozessketten"
owner: ai
status: completed
created_at: "2026-06-25"
goal: >-
  Strukturierte Prozesskarten fuer O2C, WMS/Silo, P2P, FIBU, POS als Service-Artefakt.
  API /process-map/* liefert Steps, externe Gates, Policies, SLA, Verantwortlichkeiten
  und Human-Approval-Punkte.
file_ownership:
  - app/services/process_map_service.py
  - app/api/v1/endpoints/process_map.py
  - tests/test_process_map_service.py
  - docs/agent-ops/slices/PROCESS-MAP-001.yaml
acceptance:
  - Prozesskarten fuer O2C, WMS, P2P, FIBU, POS sind als strukturierte Daten abrufbar.
  - Externe Gates mit Status (offen/abgenommen) sind aufgelistet.
  - Human-Approval-Steps sind gekennzeichnet.
  - Summary liefert domains, total_steps, offene_gates, audit_relevante_steps.
tests:
  - python -m py_compile app/services/process_map_service.py app/api/v1/endpoints/process_map.py
  - pytest -q -o addopts= tests/test_process_map_service.py
risks:
  - Prozesskarten sind statisch definiert und werden nicht automatisch mit implementierten API-Endpunkten abgeglichen.
  - Prozesskarten muessen periodisch gepflegt werden, wenn Fachprozesse oder externe Gates geaendert werden.
external_gates:
  - not_applicable
ai_harness:
  fachlicher_vertrag: >-
    Prozesskarte beschreibt fachliche Schritte, Verantwortlichkeiten, SLA-Ziele,
    externe Gates und Human-Approval-Punkte fuer 5 ERP-Kernprozesse.
  architektur_vertrag: >-
    Rein read-heavy Service ohne DB-Zugriff. Statische Definitionen als Python-Dataclasses.
    Singleton process_map_service.
  daten_vertrag: >-
    ProcessMap enthaelt: domain, name, beschreibung, steps[], externe_gates[], policies[].
    ProcessStep enthaelt: step_id, name, step_type, verantwortlich, sla_stunden,
    externe_systeme, audit_relevant, human_approval, nachfolger.
  test_vertrag: >-
    Tests decken ab: list_domains, get_process_map (O2C/WMS), QS-Gate-Steps,
    Traceability, Audit-Steps, external_gates, summary, to_dict-Struktur.
  security_vertrag: >-
    Kein Schreibzugriff. Kein Personenbezug in Prozesskartendaten.
  betriebs_vertrag: >-
    Kein Datenbankzugriff. Geringe Latenz. Fuer Produktion: Prozesskarten
    koennen aus YAML-Konfig geladen werden (naechste Ausbaustufe).
  dokumentations_vertrag: >-
    Slice-YAML als einzige externe Doku. Inline-Beschreibungen in Service-Kommentaren.
