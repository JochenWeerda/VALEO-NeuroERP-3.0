id: SLICE-008-DSGVO-ART30-ROPA-001
title: Slice-008 — DSGVO Art. 30 Verzeichnis von Verarbeitungstätigkeiten (RoPA)
owner: Claude Sonnet 4.6
status: reserviert
claimed_at: 2026-05-27
depends_on:
  - SLICE-006-EINVOICE-B2B-EXPORT-001
goal: >
  Art. 30 DSGVO verlangt, dass Verantwortliche ein Verzeichnis aller
  Verarbeitungstätigkeiten (Records of Processing Activities, RoPA) führen.
  Pflichtfelder nach Art. 30 Abs. 1: Name/Kontakt Verantwortlicher, Zweck,
  Kategorien betroffener Personen und personenbezogener Daten, Empfänger,
  Drittlandtransfers, Löschfristen, technisch-organisatorische Maßnahmen (TOMs).
  Backend CRUD + Frontend-Verwaltungsmaske.
background: >
  Art. 15/17/20 DSGVO sind implementiert (gdpr.py, gdpr_requests.py,
  compliance_dsgvo.py). Art. 30 fehlt noch vollständig — weder Backend noch Frontend.
  Keine DB-Migration nötig: In-Memory-Store wie gdpr_requests.py oder
  DocumentRepository-Pattern nutzen.
scope:
  - app/api/v1/endpoints/gdpr_art30_ropa.py (neu)
  - app/api/v1/api.py (Router-Registrierung)
  - packages/frontend-web/src/lib/api/gdpr-art30.ts (neu)
  - packages/frontend-web/src/pages/compliance/verarbeitungsverzeichnis.tsx (neu)
  - packages/frontend-web/tests/e2e/slice-008-dsgvo-art30.spec.ts (neu)
  - tests/test_gdpr_art30_ropa.py (neu)
  - docs/agent-ops/active-workboard.md
  - docs/PROJEKT-GESAMTSTAND-2026-05-27.md
file_ownership:
  - docs/agent-ops/slices/SLICE-008-DSGVO-ART30-ROPA-001.yaml
  - app/api/v1/endpoints/gdpr_art30_ropa.py
  - packages/frontend-web/src/lib/api/gdpr-art30.ts
  - packages/frontend-web/src/pages/compliance/verarbeitungsverzeichnis.tsx
  - packages/frontend-web/tests/e2e/slice-008-dsgvo-art30.spec.ts
  - tests/test_gdpr_art30_ropa.py
api_routes:
  - GET /api/v1/gdpr/art30/activities
  - POST /api/v1/gdpr/art30/activities
  - GET /api/v1/gdpr/art30/activities/{activity_id}
  - PUT /api/v1/gdpr/art30/activities/{activity_id}
  - DELETE /api/v1/gdpr/art30/activities/{activity_id}
  - GET /api/v1/gdpr/art30/activities/export/json
acceptance_criteria:
  - Pflichtfelder nach Art. 30 Abs. 1 a-h vorhanden (name, purpose, data_categories, subject_categories, recipients, third_country_transfers, retention_period, toms)
  - CRUD-Roundtrip vollständig (anlegen, lesen, bearbeiten, löschen)
  - JSON-Export (Maschinenlesbarkeit für Datenschutzbehörde)
  - Frontend-Maske mit Tabs oder Sections für alle Pflichtfelder
  - Mutation-Lifecycle-Guards und Toast-Feedback
  - pytest-Tests: CRUD + Export grün
  - E2E: Anlegen + Auflisten grün
  - TypeScript 0 Fehler
  - Workboard-Validierung grün
fremdfix: noch keine
open_risks:
  - Produktive Persistenz in DB-Tabelle bleibt Folgeslice wenn DocumentRepository nicht migriert ist
