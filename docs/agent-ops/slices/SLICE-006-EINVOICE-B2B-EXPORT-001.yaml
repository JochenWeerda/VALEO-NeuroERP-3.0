id: SLICE-006-EINVOICE-B2B-EXPORT-001
title: Slice-006 — E-Rechnung XRechnung/ZUGFeRD Export für B2B-Verkaufsrechnungen
owner: Claude Sonnet 4.6
status: reserviert
claimed_at: 2026-05-27
depends_on:
  - FACHLICHE-VERTIEFUNG-UX-W22-001
goal: >
  Echte gesetzliche Lücke schließen: XRechnung 3.0 (UBL 2.1) und ZUGFeRD 2.x (PDF/A-3 mit
  eingebettetem CII-XML, Profil EN 16931) für reguläre B2B-Verkaufsrechnungen
  (SalesInvoice). Der bestehende Self-Billing-Generator deckt nur Agrar-Gutschriften ab.
  E-Rechnungs-2025-Pflicht ab 01.01.2025 für B2B-Empfang; B2B-Versand ab 01.01.2027 (≤800k EUR)
  bzw. 01.01.2028 (alle).
background: >
  - Import XRechnung/ZUGFeRD bereits implementiert in app/api/v1/endpoints/erechnung_import.py
  - Self-Billing-XRechnung-Generator bereits in modules/agrar/services/self_billing_service.py
  - GoBD-XML-Archiv bereits über app/api/v1/endpoints/gobd_archiv.py POST /gobd/e-invoice-xml
  - factur-x Library bereits im Self-Billing-ZUGFeRD-Pfad eingebunden
  - Reguläre SalesInvoice (app/documents/models.py) hat number, date, customerId, lines, subtotalNet, totalTax, totalGross — aber bisher keinen XRechnung-Export
scope:
  - app/services/einvoice_generator.py (neu — datenmodell-neutraler Generator)
  - app/api/v1/endpoints/sales_invoice_einvoice.py (neu — Endpoints für SalesInvoice)
  - app/api/v1/api.py (Router-Registrierung)
  - tests/test_einvoice_generator.py (neu — Pflichtfeld-Validierung)
  - packages/frontend-web/src/lib/api/einvoice.ts (neu)
  - Frontend-Download-Button in Rechnungsmaske
  - docs/PROJEKT-GESAMTSTAND-2026-05-27.md (Slice-006 als abgeschlossen markieren)
  - docs/FACHLICHE-VERTIEFUNG-ABNAHME.md (Gate-Eintrag)
  - docs/GOBD-COMPLIANCE.md (Status auf implementiert)
  - docs/agent-ops/active-workboard.md
file_ownership:
  - docs/agent-ops/slices/SLICE-006-EINVOICE-B2B-EXPORT-001.yaml
  - app/services/einvoice_generator.py
  - app/api/v1/endpoints/sales_invoice_einvoice.py
  - tests/test_einvoice_generator.py
  - packages/frontend-web/src/lib/api/einvoice.ts
api_routes:
  - POST /api/v1/sales/invoices/{invoice_number}/einvoice/xrechnung
  - POST /api/v1/sales/invoices/{invoice_number}/einvoice/zugferd
  - GET /api/v1/sales/invoices/{invoice_number}/einvoice/xrechnung
acceptance_criteria:
  - Generator akzeptiert reines Dict-Input (datenmodell-neutral, ohne SQL-Abhängigkeit)
  - XRechnung XML enthält Pflichtfelder BT-1, BT-2, BT-3, BT-5, BT-22, BT-31, BT-32, BT-44, BT-48, BT-49 nach EN 16931
  - InvoiceLine-Items mit BT-126, BT-127, BT-129, BT-130, BT-131, BT-146, BT-148, BT-152
  - TaxSubtotal nach VAT-Rate gruppiert (BT-110, BT-116, BT-118, BT-119)
  - ZUGFeRD PDF/A-3 enthält eingebettetes CII-XML im Profil EN 16931 (Comfort)
  - Endpoint persistiert XML im GoBD-Artifact-Archiv
  - pytest-Tests sichern Pflichtfeld-Validierung
  - Backend py_compile + Import-Test grün
  - TypeScript grün
  - Frontend-Download-Button funktioniert
  - Workboard-Validierung grün
fremdfix: noch keine
open_risks:
  - Volle Schematron-Validierung gegen offizielles EN-16931-Regelwerk bleibt optionaler Hook
    (set_xrechnung_generator); produktive externe Lib (z. B. zugpferd-xrechnung-peppol-generator)
    bleibt eine Folgeentscheidung.
  - Peppol-Versand bleibt Folgeslice — Slice-006 deckt nur Generierung + lokale Persistenz.
