id: UX-REMAINDER-001
title: UX-Restarbeiten nach kompakter Einsatzlogik
owner: Codex
status: abgeschlossen
created: 2026-05-16
goal: >
  Verbleibende sinnvolle UX-Abschlussarbeiten fuer Futtermittel, Duengung und
  Portal nach der neuen Baukasten-Einsatzlogik umsetzen: voll nur fuer echte
  Experten-/Pruefflaechen, kompakt fuer Planung und leicht fuer Self-Service.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-REMAINDER-001.yaml
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
  - packages/frontend-web/src/pages/futtermittel/rationsoptimierung.tsx
  - packages/frontend-web/src/pages/futtermittel/futtermittel-qualitaetskontrolle.tsx
  - packages/frontend-web/src/pages/agrar/duengung/planung.tsx
  - packages/frontend-web/src/pages/agrar/duenger/bedarfsrechner.tsx
  - packages/frontend-web/src/pages/portal/feldbuch.tsx
  - packages/frontend-web/src/pages/portal/naehrstoffbilanzen.tsx
acceptance_criteria:
  - Futtermittel-Expertenseiten zeigen Pruefstatus, Risiko, naechste Aktion und Nachweis ohne einfache Pflegebereiche zu ueberladen.
  - Duengungsplanung und Bedarfsrechner fuehren Bedarf, Sperrfrist/Risiko, Nachweis und naechste Planungshandlung kompakt.
  - Portal-Feldbuch und Naehrstoffbilanzen nutzen leichte Self-Service-Sprache mit eigener Aufgabe, Status und naechster Aktion.
  - Keine unpassenden Management-Bilder oder sichtbaren CRUD-Checklisten auf Self-Service-Seiten.
  - Typecheck, Workboard-Validierung und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-REMAINDER-001.yaml
  - git diff --check
done:
  - Futtermittel-Rationsoptimierung um leichte fachliche Schrittfolge fuer Ziel, Rechnen und Freigabe erweitert.
  - Futtermittel-QS um kompakten Pruefablauf, naechste Pruefaktion und QS-Nachweislink erweitert.
  - Duengungsplanung und Bedarfsrechner um kompakte Planungs- und Eingabefuehrung erweitert.
  - Portal-Feldbuch und Naehrstoffbilanzen um leichte Self-Service-Next-Actions und bessere Leerzustaende erweitert.
  - UX-Standard auf abgeschlossenes Abschlussbild ohne weitere Flaechenrollouts aktualisiert.
risks:
  - Einige Futtermittel- oder Agrar-Dateien koennen parallel bearbeitet sein; bestehende fremde Aenderungen duerfen nicht ueberschrieben werden.
