id: QA-FACHLICHE-VERTIEFUNG-GATES-001
title: Restgates fachliche Vertiefung Wave 1-13 schliessen
owner: Codex
status: abgeschlossen
claimed_at: 2026-05-22
completed_at: 2026-05-22
goal: >
  Die nach der QA-Abnahme verbliebenen Gates repo-seitig schliessen:
  PostgreSQL-Integration als opt-in Test, Frontend-E2E fuer Warengruppen,
  UAT-/Traceability-Doku und klare Abgrenzung externer Fachfreigaben.
scope:
  - DB-Integrationstest fuer Alembic-Head und zentrale Wave-10-13-Tabellen ergaenzen.
  - Playwright-E2E fuer die Warengruppen-Seite mit echtem API-Pfad und CRUD-Aktionen ergaenzen.
  - Abnahmedoku von offenen Restgates auf pruefbare Gate-Artefakte umstellen.
  - Workboard und Slice-Doku auf den neuen Gate-Status aktualisieren.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/QA-FACHLICHE-VERTIEFUNG-GATES-001.yaml
  - docs/FACHLICHE-VERTIEFUNG-ABNAHME.md
  - packages/frontend-web/src/lib/api/einkauf.ts
  - tests/test_fachliche_vertiefung_db_integration.py
  - packages/frontend-web/tests/e2e/fachliche-vertiefung-warengruppen.spec.ts
acceptance_criteria:
  - DB-Gate ist als opt-in PostgreSQL-Test vorhanden und skippt ohne RUN_DB_INTEGRATION=1 sauber.
  - Frontend-E2E prueft Warengruppen gegen /api/v1/stammdaten/warengruppen und Create/Update/Delete-Flows.
  - Doku beschreibt geschlossene repo-seitige Gates, verbleibende externe Sign-off-Grenzen und Pruefkommandos.
  - Workboard-, Backend-, Frontend-/E2E- und Doku-Checks sind gruen oder mit Infrastrukturgrund dokumentiert.
checks:
  - python -m py_compile tests/test_fachliche_vertiefung_db_integration.py
  - pytest tests/test_fachliche_vertiefung_db_integration.py -q --no-cov
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - pnpm --filter @valero-neuroerp/frontend-web exec playwright test tests/e2e/fachliche-vertiefung-warengruppen.spec.ts --project=chromium
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-markdown-check.cjs docs/FACHLICHE-VERTIEFUNG-ABNAHME.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/QA-FACHLICHE-VERTIEFUNG-GATES-001.yaml
  - git diff --check
done:
  - Opt-in-PostgreSQL-Gate fuer Alembic-Upgrade, Wave-10-13-Tabellen und Warengruppen-Roundtrip ergaenzt.
  - Playwright-E2E fuer Warengruppen-API-Pfad und sichtbare CRUD-Aktionen ergaenzt.
  - Warengruppen-Query auf placeholderData korrigiert, damit der echte Fetch ausgefuehrt wird.
  - Abnahmedoku und Workboard auf geschlossene repo-seitige Gates aktualisiert.
risks:
  - Externe Fachsignatur und produktive Testdaten koennen nicht im Repo erzeugt werden.
  - Playwright-Global-Teardown kann vorhandene Visual-Tour-Issues melden; der fokussierte Gate-Test ist davon fachlich getrennt.
next_step: abgeschlossen
