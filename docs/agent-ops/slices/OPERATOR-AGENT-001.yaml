slice_id: OPERATOR-AGENT-001
title: "ERP-Operator-Agent Read-Only/Proposal-Modus mit Human-Approval"
owner: ai
status: completed
created_at: "2026-06-25"
coordination: >-
  Entsteht aus valeo_neuroerp_youtube_gap_analyse_2026-06-23.md P1.
  Kein Konflikt mit DOM-CONTROLLING-004 oder COMPAT-GOV-MATRIX-SYNC.
  Agent schreibt nie autonom in Domaenobjekte — nur Proposals mit Audit-Trail.
goal: >-
  Sicheren, RBAC-bewachten Operator-Agent-Modus bereitstellen: Kontext lesen,
  Handlungen vorschlagen (Mahnung, Rechnung, QS-Freigabe, Nachfassung, DMS-Paket),
  Human-Approval-Flow protokollieren und auditieren. Kein autonomes Schreiben.
file_ownership:
  owned:
    - app/services/operator_agent_service.py
    - app/api/v1/endpoints/operator_agent.py
    - tests/test_operator_agent.py
    - docs/agent-ops/slices/OPERATOR-AGENT-001.yaml
  reads:
    - app/api/v1/api.py
    - docs/agent-ops/active-workboard.md
tests:
  - python -m py_compile app/services/operator_agent_service.py app/api/v1/endpoints/operator_agent.py
  - pytest -q -o addopts= tests/test_operator_agent.py
risks: >-
  In-Memory-Store: kein Restart-Persistenz (bewusst fuer MVP — productiv via DB).
  Roles via Header: Muss in Prod durch OIDC-Claims ersetzt werden.
external_gates: []
ai_harness:
  fachlicher_vertrag: >-
    Agent darf Kontext lesen (OP-Liste, Mahnstatus, QS-Gates) und Handlungen
    vorschlagen. Proposal-Status (pending/approved/rejected/expired) ist
    nachvollziehbar. Human-Approval ist Pflicht fuer HIGH-risk-Aktionen
    (Mahnung, Rechnung, QS-Freigabe).
  architektur_vertrag: >-
    Service ist zustandslos (In-Memory MVP). Kein direkter DB-Schreibzugriff.
    Router-Prefix /agent/operator. RBAC: agent:read / agent:propose / agent:approve.
    Singleton-Pattern: operator_agent_service.
  daten_vertrag: >-
    Proposal enthaelt: proposal_id (UUID), tenant_id, action_type, risk_level,
    human_approval_required, context_summary, proposed_action, rationale,
    approval_status, audit_events[]. Tenant-Isolation erzwungen.
  test_vertrag: >-
    Unit-Tests decken ab: Rollenguards (403 bei fehlendem Role), Proposal-Lifecycle
    (create/approve/reject), Double-Approve raises ValueError, Tenant-Isolation,
    Summary-Struktur, List-Filter nach Status.
  security_vertrag: >-
    agent:approve ist Pflicht fuer Freigaben. Kein Cross-Tenant-Zugriff.
    Alle Aktionen werden in audit_events protokolliert.
  betriebs_vertrag: >-
    In-Memory: kein Persistenz-Overhead. Fuer Prod: Tabelle agent_proposals
    mit tenant_id-Index. Coverage-Ratchet: service 0.85, endpoints 0.50.
  dokumentations_vertrag: >-
    Slice-YAML als einzige Doku. Keine separate API-Doku noetig (FastAPI
    generiert OpenAPI aus response_model und docstrings).
