id: UX-AGRIBUSINESS-001
title: Agribusiness-Feldservice mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-15
goal: >
  Feldservice-Aufgaben als Agribusiness-Einsatzliste mit Einsatzstatus, Owner,
  naechster Aktion, Nachweisfuehrung und CRUD-/Workflow-Klarheit nach UX-Standard fuehren.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-AGRIBUSINESS-001.yaml
  - packages/frontend-web/src/pages/agribusiness/field-service-tasks.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Field-Service-Aufgaben zeigen Rollenfokus, Einsatzplan, Managemententscheidung, Next Action und Nachweislink.
  - CRUD-/Workflow-Abdeckung fuer Anlage, Lesen, Bearbeiten, Abbrechen, Loeschen, Druck und Audit ist sichtbar.
  - Bestehende Suche, Copilot, Druck, Neu/Bearbeiten/Abbrechen/Loeschen, Workflow-Hinweis und Audit-Drawer bleiben erhalten.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-AGRIBUSINESS-001.yaml
  - git diff --check
done:
  - Field-Service-Aufgabenliste um Rollenfokus, Einsatzplan, Managemententscheidung, Next Action und Nachweislink erweitert.
  - Einsatz-KPIs fuer offene, dringende und laufende Aufgaben sowie durchschnittlichen Fortschritt ergaenzt.
  - CRUD-/Workflow-Abdeckung fuer Anlage, Lesen, Bearbeiten, Abbrechen, Loeschen, Druck und Audit sichtbar gemacht.
risks:
  - Neue-/Edit-Masken und Farmer-Stamm bleiben Folgeslices; dieser Slice fokussiert die Einsatzliste.
