slice_id: DOC-OPENAPI-CI-001
title: "OpenAPI-Drift-Gate in CI"
priority: P1
owner: Claude Code
status: abgeschlossen
created: "2026-06-26"

goal: >
  generate_openapi.py --check als blockierendes CI-Gate einführen.
  Bei API-Änderungen (app/**) schlägt CI fehl wenn openapi.json veraltet ist,
  oder committet automatisch die aktualisierte Spec.

ai_harness:
  fachlicher_vertrag:
    - Bei jedem Push/PR der app/** ändert wird openapi.json auf Aktualität geprüft.
    - Drift (Code ≠ Spec) blockiert den CI-Build oder wird automatisch behoben.
    - Das committete openapi.json ist immer synchron mit dem App-Code.
  architekturvertrag:
    - generate_openapi.py ist Single Source of Truth (kein zweites Generator-Script).
    - Auto-Commit nur auf main/develop durch github-actions[bot].
    - Backend-Dependencies werden im Workflow installiert (requirements.txt).
  akzeptanzkriterien:
    - .github/workflows/openapi-drift.yml existiert und läuft grün.
    - Bei simuliertem Drift (Dummy-Änderung in App) schlägt Check-Step fehl.
    - Auto-Commit aktualisiert openapi.json ohne manuellen Eingriff.
    - Workflow triggered nur bei app/** Änderungen.

dateibesitz:
  - .github/workflows/openapi-drift.yml
  - docs/agent-ops/slices/DOC-OPENAPI-CI-001.yaml
  - docs/agent-ops/active-workboard.md
