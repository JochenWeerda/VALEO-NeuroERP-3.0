id: HR-TIME-PRO-001
status: reserviert
owner: Codex
goal: >
  Zeiterfassung vom Fahrerzeit-Pilot zu einem professionellen Time-&-Labor-Cockpit
  mit Freigabe-, Compliance- und Payroll-Sicht ausbauen.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/HR-TIME-PRO-001.yaml
  - app/api/v1/endpoints/personal.py
  - tests/test_personal_time_cockpit_api.py
  - packages/frontend-web/src/lib/api/personal.ts
  - packages/frontend-web/src/pages/personal/zeiterfassung.tsx
  - docs/project-context/hr-time-absence-driver-integration-2026-05-07.md
acceptance_criteria: >
  Backend liefert ein Time-Cockpit mit Perioden-KPIs, Freigabequeue, Compliance-Befunden,
  Payroll-Readiness und Driver-Time-Zusammenfassung; Frontend zeigt diese Steuerung
  statt reiner Mock-/Tabellenseite; Tests sichern Kernvertrag und Regelbefunde.
checks:
  - pytest tests/test_personal_time_cockpit_api.py tests/test_personal_driver_time_api.py -q --no-cov
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
risks: >
  Rechtsfeingranulare ArbZG-/Lenkzeitregeln, echte Dienstplanung, Buchungsworkflow und Lohnexport bleiben Folgeslices.
