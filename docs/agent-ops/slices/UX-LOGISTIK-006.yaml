id: UX-LOGISTIK-006
title: Fracht- und Speditions-Ausnahmen mit UX-Exzellenzbaukasten
owner: Codex
status: abgeschlossen
created: 2026-05-15
goal: >
  Fracht-/Speditions-Ausnahmen fuer Frachtdokumentdruck und Frachttarife mit
  Eskalationssicht, naechster Aktion und Kettennachweis fuehren.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-LOGISTIK-006.yaml
  - packages/frontend-web/src/pages/versand/frachtdokumente.tsx
  - packages/frontend-web/src/pages/strecke/speditionen-fracht-preise.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Frachtdokumente zeigen Rollenfokus, Druck-Pruefplan, Eskalationsentscheidung, Next Action und Nachweislink.
  - Speditions-Frachttarife zeigen Rollenfokus, Tarif-Pruefplan, Managemententscheidung, Next Action und CRUD-Abdeckung.
  - Beide Seiten nutzen normale Buero-Sprache fuer Stopper, Nachweis und naechste Aktion.
  - Typecheck und Doku-Checks sind gruen.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-LOGISTIK-006.yaml
  - git diff --check
done:
  - Frachtdokument-Druckfehler als klaren Versandstopper mit Rollenfokus, Pruefplan, Entscheidung und Nachweislink sichtbar gemacht.
  - Speditions-Frachttarife um Rollenfokus, Tarif-Pruefplan, Managemententscheidung, Next Action und Preisnachweis erweitert.
  - CRUD-/Workflow-Abdeckung fuer Lesen, Aendern, Nachweis, Freigabe, Anlegen, Loeschen und Audit sichtbar gemacht.
risks:
  - Frachtbriefe sind bereits ueber UX-LOGISTIK-002 abgedeckt; dieser Slice fokussiert Druck-/Tarifausnahmen.
