slice_id: CRM360-MBT-003
title: CRM360 Persistent Revenue Handover UAT
owner: Codex
status: completed
goal: >-
  Den CRM360-Revenue-Handover gegen reale Backend-Vertraege persistent,
  wiederholbar, tenant-isoliert und vollstaendig aufraeumbar nachweisen.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/CRM360-MBT-003.yaml
  - docs/quality-assurance/crm360-revenue-handover-click-test-2026-06-08.md
  - app/api/v1/endpoints/docflow.py
  - app/api/v1/endpoints/sales_orders.py
  - app/services/docflow_service.py
  - alembic/versions/crm360_o2c_delivery_20260608.py
  - scripts/uat/crm360_revenue_handover_uat.py
  - tests/test_security_sales_orders.py
  - tests/test_docflow_audit_isolation.py
  - tests/test_docflow_conversion_order.py
  - tests/test_docflow_draft_cleanup.py
acceptance_criteria:
  - Der Lauf ist ohne --execute wirkungslos und verweigert Produktion.
  - Markierte Testdaten werden tenant-isoliert erzeugt.
  - Angebot, Auftrag, Lieferschein und Rechnung werden persistent verknuepft validiert.
  - Offene Docflow-Entwuerfe koennen fachlich per API geloescht werden.
  - Ein idempotenter ID-basierter Cleanup entfernt alle erzeugten Artefakte.
  - Migration, Backendtests, Compile, Live-UAT und Governance sind gruen.
risks:
  - Der Lauf benoetigt eine migrationsaktuelle Dev-Datenbank und ein gestartetes Backend.
  - Eine finale Finanzbuchung bleibt bewusst ausserhalb des destruktiven UAT-Cleanups.
result: >-
  Der Live-UAT durchlief die realen APIs erfolgreich und hinterliess keine
  markierten Residuen. Repariert wurden Lieferschein-Schema und -SQL,
  Docflow-FK-Reihenfolge, Draft-Cleanup sowie die Savepoint-Isolation des
  optionalen Audits, dessen Fehler zuvor Fachtransaktionen zurueckrollte.
