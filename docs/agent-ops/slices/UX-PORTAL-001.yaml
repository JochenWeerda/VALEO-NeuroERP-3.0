id: UX-PORTAL-001
title: Portal-Dokumente mit UX-Exzellenzbaukasten
owner: Codex
status: reserviert
created: 2026-05-15
goal: >
  Portal-/Self-Service-Dokumente mit Rollenfokus, klarer Nutzeraufgabe,
  Nachweisstatus, naechster Aktion und CRUD-/Workflow-Abdeckung fuehren.
file_ownership:
  - docs/agent-ops/active-workboard.md
  - docs/agent-ops/slices/UX-PORTAL-001.yaml
  - packages/frontend-web/src/pages/portal/dokumente.tsx
  - docs/project-context/ux-excellence-operating-standard-2026-05-13.md
acceptance_criteria:
  - Portal-Dokumente zeigen Rollenfokus, Nachweisplan, Managemententscheidung, Next Action und Vorlage-/Nachweislink.
  - CRUD-/Workflow-Abdeckung fuer Suche, Filter, Download, Nachweis, Compliance und Rueckfrage ist sichtbar.
  - Bestehende KPI-Karten, Compliance-Spur, Suche, Tabs und Download bleiben erhalten.
checks:
  - pnpm --filter @valero-neuroerp/frontend-web type-check
  - python scripts/agent_workboard_supervisor.py validate
  - node scripts/docs-governance-check.cjs
  - node scripts/docs-markdown-check.cjs docs/project-context/ux-excellence-operating-standard-2026-05-13.md docs/agent-ops/active-workboard.md docs/agent-ops/slices/UX-PORTAL-001.yaml
  - git diff --check
risks:
  - Weitere Portal-Self-Service-Seiten bleiben Folgeslices.
