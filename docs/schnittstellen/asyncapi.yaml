components:
  messages:
  agrar_contract_allocatedEvent:
    name: agrar.contract.allocated
    title: Agrar Contract Allocated
    contentType: application/json
    payload:
      type: object
      required: [event_id, tenant_id, occurred_at, payload]
      properties:
        event_id:
          type: string
          format: uuid
        tenant_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        correlation_id:
          type: string
        payload:
          type: object
          description: Fachliche Nutzdaten je Event-Typ

  agrar_harvest_settlement_print_requestedEvent:
    name: agrar.harvest_settlement.print_requested
    title: Agrar Harvest Settlement Print Requested
    contentType: application/json
