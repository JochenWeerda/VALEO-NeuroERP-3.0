      nur Export, ohne Zeilenroute) statt der Fachmaske fuhrpark/rechnungen. Die Kostenauswertung ist eine reine Aktualisieren-
      Maske ohne eigenen Datenbanktest. Browser: nur Ladetest (fuhrpark-logistics.spec.ts, nicht gezaehlt).
    luecken:
      - text: "Route fuhrpark/fuhrpark-rechnungen zeigt die Platzhalterliste fuhrpark/rechnungen-liste (id/name/status/datum, nur Export) statt der Fachmaske"
        prio: P2
      - text: "Fuhrpark-Kostenauswertung hat keinen Datenbanktest fuer die Summen je Fahrzeug"
        prio: P2
      - text: "Browserkette Rechnung erfassen und Kosten je Fahrzeug einsehen gegen echtes Backend fehlt"
        prio: P2
