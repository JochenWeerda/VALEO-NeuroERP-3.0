    rolle: SCHREIBEN LOGISTIK/GERAET; Mandant aus dem Token
    nachweise:
      - tests/test_fuhrpark_isolation_effects.py::test_invoice_cannot_reference_foreign_vehicle
      - tests/test_fuhrpark_vertiefung.py::test_bussgeld_anlegen
      - tests/test_rls_domain_ops_teil2.py::test_fahrzeug_schaden_im_eigenen_mandanten_urheber_aus_token
    status: teilweise
    befund: >-
      Fuhrpark-Rechnungen, Terminarten und ausgehende Dokumente haben Speichern- und Loeschen-Aktionen mit Mandantenpruefung; die
