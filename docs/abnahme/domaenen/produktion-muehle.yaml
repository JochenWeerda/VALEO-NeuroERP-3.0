# Abnahmeblatt Produktion und Muehle — Quelle fuer scripts/domaenen_abnahme.py (Fahrplan M4).
# Prozessliste nach der L3-Referenz (Skill l3-produktion-referenz: Produktionsliste, Ruestliste, Produktion
# (Artikel-Umbuchung Mischen), Muehle (Mehrfach-Erzeugnisse), Nachbearbeitung Chargenfreigabe) plus VALEO-eigene
# Prozesse (Rezeptur/Stueckliste, Rezepturgruppen, Schnellerfassung, Futtermittel-Deklaration, Chargenrueckverfolgung
# Produktion, Verbrauch/Ausbeute/Bewertung). Status: abgenommen | teilweise | fehlt. "abgenommen" verlangt Nachweis,
# keine offene P0/P1-Luecke und keine Platzhaltermaske; kein Prozess erfuellt das — es gibt weder eine Browserkette noch
# eine Produktionsmaske, die Auftraege anlegt oder bucht.
#
# Bewertung nach .cursor/rules/production-code-quality.mdc. Als Nachweis zaehlen nur HTTP-/Integrationstests gegen echte
# PostgreSQL (feed_context bzw. Pruefstand-Fixtures, require_db) und pure Funktionen ohne I/O (nur Teilbeleg).
# NICHT GEZAEHLT (im Befund genannt, nicht unter "nachweise"):
#   - tests/test_production_control.py: MagicMock-DB und FakeService per monkeypatch (nur valid_status_transition ist rein)
#   - tests/test_dom_feed_prod_004.py: MagicMock-DB (Produktionsauftrag/Rezeptur kg-Welt feed_produktionsauftraege)
#   - tests/test_feed_inventory_link_unit.py: MagicMock-DB (Lagerverknuepfung)
#   - tests/test_futtermittel_complete.py: MagicMock-DB (Naehrstoffanalyse, Deklaration, Etikett)
#   - tests/test_feed_chain_003.py: MagicMock-DB (Freigabeentscheidung -> ops_chargen)
#   - tests/test_produktion_mischfutter.py: Schemata, Uebergangstabelle und reine Ladetests (Liste ist ein Array);
#     einzige Fehlerpfade (404 fuer erfundene Kennung) mit skip_if_table_missing
#   - tests/test_charges_api.py: Schemata und status_code in (200, 201, 422)
#   - tests/test_fachliche_vertiefung_wave2.py, tests/test_fachliche_vertiefung_wave7.py: nur Pydantic-Schemata
#     (Rezepturgruppe, Schnellerfassung, Stueckliste)
#   - tests/test_studio_api_detail_bindings.py: nur Routenbindung der Detailmasken
#   - packages/frontend-web/src/__tests__/pages/produktion/produktionsleitstand.test.tsx: Vitest mit gemockter Runtime
#     (reiner Ladetest)
#   - tests/test_rations_mixing_protocol.py: pure Tests, aber Fuetterungsration (TMR), nicht Produktion
#   - Playwright: es gibt keine Spezifikation fuer Produktion, Muehle, Rezeptur oder Chargenfreigabe.
# Masken ohne Eintrag in packages/frontend-web/src/app/route-aliases.json (produktion/produktionsleitstand,
# produktion/chargen-bearbeiten; beide stehen nur in routing/navigation-routes.json und in der Navigation) tauchen im
# Masken-Inventar nicht als Route auf und koennen in "routen" nicht genannt werden. screen_domains nennt nur die
# Domaenenschluessel produktion, futtermittel und rezepte: der Produktionsleitstand traegt domain agrar und Chargen
# bearbeiten domain inventory (geteilt mit ernte-waage bzw. lager) und werden hier nicht pauschal mitgezaehlt.
# Mandantengrenze: Tabellen domain_shared.futtermittel_* und domain_ops.production_operations sind per RLS abgesichert
# (tests/test_rls_domain_shared.py, alembic/versions/rls_rollout_20261026.py); domain_ops.ops_chargen ist laut
# docs/admin/rls-exceptions.json ausdruecklich ohne RLS ("dienst") und haengt allein an den WHERE-Klauseln der Endpunkte.
id: produktion-muehle
titel: Produktion und Muehle (Rezeptur bis Chargenfreigabe)
reifematrix: D13
l3_referenz: l3-produktion-referenz
erhoben: 2026-11-23
pruefer: Cursor
bereiche: [produktion, futter, futtermittel, rezepte]
screen_domains: [produktion, futtermittel, rezepte]
prozesse:
  - id: PM-01
    name: Rezeptur (Mischfutter-Rezept) erfassen, pruefen und freigeben
    l3: PRODUKTION > Produktion (Artikel-Umbuchung) — Rezeptur-Nr., Reiter REZEPTUR mit Prozentanteilen, Summenzeile "Summen Rezeptur (%)" und Differenz-Menge (zeigt, ob die Anteile 100 % ergeben)
    routen: [futter/misch, futter/misch/:id, futtermittel/mischfuttermittel-liste, futtermittel/mischfuttermittel/:id, rezepte/editor]
    rolle: FUTTERMITTEL (SCHREIBEN["FUTTERMITTEL"]); Mandant aus dem Token
    nachweise:
      - tests/test_stammdaten_bearbeiten.py::test_mischfutter_vollersatz_leert_nichts
      - tests/test_rls_domain_shared.py::test_mandantengrenze_je_tabelle
      - tests/test_rls_domain_shared.py::test_kein_verweis_auf_fremden_eltern
    status: teilweise
    befund: >-
      Die Rezeptur, aus der die Produktion bucht, ist domain_shared.futtermittel_rezepte mit futtermittel_rezept_komponenten
      (Anteil 0..1; POST/PUT /futter/rezepte in futter_stamm.py, create_rezept/update_rezept). Gegen PostgreSQL belegt sind
      die Mandantengrenze aller Futtermitteltabellen samt Verweis Komponente -> Einzelfuttermittel (RLS-Test, fremder Eltern
      abgewiesen) und das Bearbeiten des Mischfutter-Stamms ohne Leeren anderer Felder. Eine Maske, die die Rezeptur-
      komponenten erfasst oder zeigt, gibt es nicht: futtermittel/mischfuttermittel hat einen Reiter "Rezeptur", dessen
      Quelle /masks/futtermittel/mischfuttermittel/entity/{id}/tabs/rezeptur in mask_screen_definition.py ein "leerer Stub"
      ist (_leere_registerseite); die Route rezepte/editor ist eine generische Platzhaltermaske (Spalten id/name/status/
      updated_at, nur Export, domain rezepte) und liest sogar /api/v1/fibu/kreditoren (build_rezepte_editor_screen_definition).
      Die Hooks fuer Rezepte in packages/frontend-web/src/lib/api/produktion.ts werden von keiner Seite benutzt.
      create_rezept/update_rezept pruefen weder die Summe der Anteile (je Komponente nur 0 < Anteil <= 1) noch gibt es einen
      Freigabestatus; update_rezept loescht alle Komponenten und ersetzt sie (nur der Zaehler version steigt). Daneben
      existieren zwei weitere Rezeptmodelle: domain_futtermittel.feed_recipes mit recipe_ingredients (futtermittel_rezepte.py,
      mit 100-%-Pruefung bei activate) und feed_rezepturen (feed_rezeptur_service.py, 100-%-Pruefung bei FREIGEGEBEN, nur
      mit MagicMock getestet). Keines davon speist die Produktion.
    luecken:
      - text: Rezeptur ist ueber keine Maske erfassbar oder sichtbar — rezepte/editor ist Platzhalter mit falscher Quelle (Kreditoren), der Rezeptur-Reiter des Mischfuttermittels ist ein leerer Stub
        prio: P1
      - text: Rezept speichern prueft die Summe der Anteile nicht (L3 zeigt Summen Rezeptur und Differenz-Menge) und kennt keinen Freigabestatus; ein Rezept mit Summe ungleich 1 ist produzierbar (siehe PM-04)
        prio: P1
      - text: Drei konkurrierende Rezeptmodelle (futtermittel_rezepte, feed_recipes, feed_rezepturen) mit eigenen Endpunkten — nur das erste speist Produktion und Lagerbuchung; die anderen haben weder Anbindung noch Datenbanktest
        prio: P2
      - text: Rezeptaenderung ersetzt die Komponenten ohne Versionshistorie (nur Zaehler version); der Rezeptstand zur Produktion ist nur ueber den Verbrauchs-Snapshot des Auftrags nachvollziehbar
        prio: P3
  - id: PM-02
    name: Stueckliste pflegen und Mengenbedarf berechnen
    l3: Artikel-Stueckliste (VALEO-eigen; L3 fuehrt die Rezeptur ueber die Artikel-Umbuchung)
    routen: [artikel/stuecklisten]
    rolle: "PRODUKTION (SCHREIBEN[\"PRODUKTION\"]: LAGER, AGRAR, FUTTERMITTEL); Mandant aus dem Token"
    nachweise: []
    status: teilweise
    befund: >-
      Backend /produktion/stuecklisten (stuecklisten.py): Liste, Abruf, Anlegen mit Positionen, Aendern (ersetzt die
      Positionen), Loeschkennzeichen und Mengenbedarf je Produktionsmenge; alle Abfragen filtern auf tenant_id, die Tabellen
      stehen in der RLS-Ausrollung. Es gibt keinen Test gegen PostgreSQL und keinen HTTP-Test (nur Pydantic-Schemata in
      test_fachliche_vertiefung_wave7.py, nicht gezaehlt). Die Maske artikel/stuecklisten ist eine Objektseite nur mit Kopf
      (Kennung, Bezeichnung, Status; _batch13_stamm), ohne Positionen und ohne Mengenbedarf; die Aktion bearbeiten steht ohne
      Endpunkt im Studio-Ratchet (config/mask_studio_ratchet.json), der Quelle fehlt das Feld status (nur aktiv). Mit der
      Produktion ist die Stueckliste nicht verbunden: der Auftrag nimmt ein FuttermittelRezept, keine Stueckliste.
    luecken:
      - text: Stuecklisten sind ueber die Oberflaeche nicht pflegbar — Kopf-Objektseite ohne Positionen und ohne Mengenbedarf, bearbeiten ohne Endpunkt
        prio: P2
      - text: Anlegen, Aendern, Mengenbedarf und Mandantengrenze der Stuecklisten ohne Integrationstest gegen PostgreSQL
        prio: P2
      - text: Stueckliste ist nicht mit Produktionsauftrag oder Lagerbuchung verbunden (kein Verweis, kein Verbrauch aus Stuecklistenpositionen)
        prio: P2
  - id: PM-03
    name: Rezepturgruppen pflegen
    l3: Rezepturgruppen [REZG] — Tierart, Nutzungsrichtung (VALEO-Menue Produktion)
    routen: [produktion/rezepturgruppen]
    rolle: PRODUKTION (SCHREIBEN["PRODUKTION"]); Mandant aus dem Token
    nachweise: []
    status: teilweise
    befund: >-
      Die Route fuehrt ohne :id auf die handgebaute Seite rezepturgruppen-legacy.tsx (Anlegen mit Gruppen-Nr, Bezeichnung,
      Tierart, Nutzungsrichtung; Liste; Loeschen) gegen /produktion/mischfutter/rezepturgruppen
      (produktion_rezepturgruppen.py, SQL mit tenant_id, Rolle PRODUKTION). Datenbanktest: keiner; die RLS-Ausrollung nennt
      die Tabelle, test_rls_domain_shared.py aber nicht. Fehler im Loeschen: lib/api/rezepturgruppen.ts sendet die Gruppen-Nr
      (z. B. "RIND-MILCH") an DELETE /rezepturgruppen/{gruppe_id}; der Endpunkt setzt aktiv=false nur fuer id = :id, trifft
      also keine Zeile und antwortet trotzdem 204 — die Seite meldet "Rezepturgruppe geloescht", die Zeile bleibt in der Liste.
      Die Studio-Objektmaske (build_produktion_rezepturgruppen_screen_definition) hat die Felder id/name/status/updated_at,
      die der Endpunkt nicht liefert (gruppe_nr, bezeichnung). Rezepturgruppen sind mit keinem Rezept verknuepft.
    luecken:
      - text: Loeschen meldet Erfolg und loescht nichts (UI sendet gruppe_nr, Endpunkt matcht id; 204 auch ohne Treffer)
        prio: P2
      - text: Rezepturgruppen ohne Datenbanktest (Anlegen, Doppelte Nummer 409, Loeschen, Mandant)
        prio: P2
      - text: Rezepturgruppe ist keinem Rezept zugeordnet (kein Feld, keine Auswahl); Studio-Objektmaske zeigt Felder, die der Endpunkt nicht liefert
        prio: P3
  - id: PM-04
    name: Mischfutter-Produktionsauftrag anlegen, freigeben (Rohstoffverbrauch buchen) und stornieren
    l3: PRODUKTION > Buchen > Produktion (Artikel-Umbuchung) — Hergestellter Artikel, Rezeptur-Nr., Menge, Lagerhalle, Chargen-Nr.; Rohstoffe mit Bewertung; Buchen und Stornieren
    routen: [produktion/mischfutter, produktion]
    rolle: PRODUKTION (SCHREIBEN["PRODUKTION"]); Lesen ohne Rollenpruefung; Mandant aus dem Token
    nachweise:
      - tests/test_feed_production_chain.py::TestFeedProductionChainIntegration::test_freigabe_snapshot_fertig_charge_und_trace
      - tests/test_feed_production_chain.py::TestFeedProductionChainIntegration::test_storno_restauriert_snapshot_trotz_rezeptaenderung
      - tests/test_feed_production_chain.py::TestFeedProductionChainIntegration::test_freigabe_fail_closed_bei_unterdeckung
      - tests/test_feed_production_chain.py::TestVerbrauchLogik::test_compute_verbrauch_mengen_und_reihenfolge
      - tests/test_feed_chain_004.py::TestFeedChain004::test_freigabe_schreibt_inventory_stock_movements
      - tests/test_feed_chain_004.py::TestFeedChain004::test_storno_idempotent_inventory_movements
      - tests/test_rls_domain_shared.py::test_mandantengrenze_je_tabelle
    status: teilweise
    befund: >-
      Der Weg POST /produktion/mischfutter/auftrag, PATCH .../auftrag/{id}/status (erstellt -> freigegeben -> in_produktion ->
      fertig, storniert) ist gegen PostgreSQL ueber HTTP belegt: Freigabe zieht den Rohstoffbestand je Komponente ab und
      speichert einen Verbrauchs-Snapshot (6 t / 4 t bei 10 t), Unterdeckung wird mit 409 abgewiesen und aendert nichts, Storno
      gibt exakt den Snapshot zurueck (auch nach Rezeptaenderung), die Freigabe schreibt je Komponente eine Lagerbewegung
      "out" in domain_inventory.inventory_stock_movements und der Storno genau eine "in" (idempotent). Die Tests laufen als
      Rolle admin in einem frischen Mandanten; kein Test mit fehlender Produktionsrolle (403) oder fremdem Mandanten auf den
      Produktionsendpunkten. Die Maske produktion/mischfutter (und produktion) ist eine nur lesende Liste: Aktionen nur
      "export", keine Zeilenaktion, kein Anlegen; ihr Hinweistext verweist fuer Freigabe und Abschluss auf den
      Produktionsleitstand, dessen Statuswechsel aber nur domain_ops.production_operations schreiben (PM-07). Die Hooks
      useCreateProduktionsauftrag/updateProduktionsauftragStatus in lib/api/produktion.ts haben keinen Aufrufer. Im Quelltext:
      create_produktionsauftrag prueft Rezept nur auf Existenz im Mandanten — nicht aktiv, nicht gueltig_ab/gueltig_bis, nicht
      Summe der Anteile — und die Verbrauchsmenge ist menge_t x anteil je Komponente (compute_verbrauch), bei Summe ungleich
      1 also ungleich der Produktionsmenge; Komponenten ohne einzelfutter_id werden bei Pruefung und Abzug uebergangen
      (fehlende_komponenten, apply_verbrauch; Test test_fehlende_komponenten_ohne_ef_referenz_ignoriert haelt das fest).
      Die Lagerbewegung ist fail-soft: book_snapshot_movements gibt ohne aktives Lager {"ok": False} zurueck und der Handler
      wertet das Ergebnis nicht aus, waehrend futtermittel_einzelfutter.verfuegbar_t trotzdem sinkt; gebucht wird in das
      zuerst angelegte aktive Lager (resolve_warehouse_id), previous_stock/new_stock stehen auf 0. Das Auftragsfeld
      freigegeben_von und der Urheber der Lagerbuchung kommen aus dem Request-Body, erstellt_von wird nie gesetzt.
      get_verfuegbarkeit und get_rezepte fangen jede Ausnahme und liefern []. Daneben gibt es einen zweiten
      Auftragsweg /futtermittel/produktion/auftraege (kg, domain_futtermittel.feed_produktionsauftraege, QS-Status bis
      AUSGELAGERT) ohne jede Bestandsbuchung, ohne Maske und nur mit MagicMock getestet.
    luecken:
      - text: Produktionsauftrag ist ueber die Oberflaeche weder anlegbar noch freigebbar oder stornierbar — Maske produktion/mischfutter ist eine nur lesende Liste, die Hooks in lib/api/produktion.ts haben keinen Aufrufer, das Leitstand-Freigeben bucht nichts
        prio: P1
      - text: Auftrag und Freigabe pruefen Rezept nicht auf aktiv, Gueltigkeit und Summe der Anteile — bei Summe ungleich 1 wird weniger oder mehr Rohstoff abgebucht als produziert wird
        prio: P1
      - text: Komponenten ohne einzelfutter_id werden weder geprueft noch abgebucht, und eine Freigabe ohne aktives Lager (ok False) laesst den Einzelfutter-Bestand sinken, ohne dass eine Lagerbewegung entsteht — Bestandsfuehrung und Bewegungsbuch laufen still auseinander
        prio: P1
      - text: Urheber der Freigabe und der Lagerbuchung kommen aus dem Body (freigegeben_von) statt aus dem Token, erstellt_von bleibt leer, kein Grund beim Storno; kein Test auf Rolle (403) und fremden Mandanten der Produktionsendpunkte
        prio: P2
      - text: Maske zeigt die interne Charge-ID statt der Chargen-Nr. (Spalte charge_id, nicht chargen_id) und keine Zeilenaktion zum Oeffnen von Charge oder Trace
        prio: P2
      - text: get_verfuegbarkeit und get_rezepte schlucken jede Ausnahme und liefern eine leere Liste (kein Fehler fuer den Nutzer)
        prio: P2
      - text: Zweiter Auftragsweg /futtermittel/produktion/auftraege (kg, ohne Bestandsbuchung, Status AUSGELAGERT bucht nichts) konkurriert mit dem bestandsfuehrenden Auftrag und hat keinen Datenbanktest
        prio: P2
      - text: Browserkette Auftrag anlegen > freigeben > fertig melden fehlt
        prio: P2
      - text: Docstring "Bestand reservieren" ohne Reservierung (nur Verfuegbarkeitspruefung), Mengen in t statt kg wie in L3
        prio: P3
  - id: PM-05
    name: Fertigmeldung — Fertigwaren-Charge mit Mischprotokoll erzeugen
    l3: Produktion > Buchen — Zugang des hergestellten Artikels mit Chargen-Nr., Lagerhalle, Lagerfach; Etiketten
    routen: [produktion/mischfutter, produktion]
    rolle: PRODUKTION (SCHREIBEN["PRODUKTION"]); Mandant aus dem Token
    nachweise:
      - tests/test_feed_production_chain.py::TestFeedProductionChainIntegration::test_freigabe_snapshot_fertig_charge_und_trace
      - tests/test_feed_production_chain.py::TestFeedProductionChainIntegration::test_fertig_fail_closed_bei_fremder_chargen_id
    status: teilweise
    befund: >-
      Status fertig erzeugt ueber FeedProductionChainService.complete_to_charge idempotent eine Charge in domain_ops.ops_chargen
      (Rohstoffe aus dem Snapshot mit GVO-/QS-/GMP+-/Lieferantendaten der Einzelfuttermittel, produktionsprozess, digitales_mischbuch);
      belegt gegen PostgreSQL: Charge ueber GET /chargen/{id} lesbar, zweites fertig 409, eine fremde Charge mit derselben
      chargen_id blockiert den Abschluss mit 409. Im Quelltext bucht fertig keinen Zugang des Erzeugnisses: weder
      inventory_stock_movements noch articles.current_stock noch Einzel-/Mischfutterbestand werden erhoeht (book_snapshot_movements
      kennt nur die Komponenten); die Charge ist ein Datensatz in ops_chargen. Lagerort ist die feste Zeichenkette
      "Mischanlage", mhd bleibt leer, qualitaetsstatus startet als in-pruefung bei status erfasst; die Kennzahl "In Pruefung" von
      Chargen bearbeiten zaehlt aber status in-pruefung (ChargeRepository.get_stats) und erfasst daher diese Chargen nicht.
      Der Export /export Futtermittel-Chargen beschriftet menge als menge_kg, der Wert ist Tonnen.
    luecken:
      - text: Fertigmeldung bucht keinen Warenzugang des hergestellten Erzeugnisses (kein Lagerzugang, kein Bestand des Mischfutters) — Rohstoffe gehen aus dem Bestand, die Fertigware kommt nicht hinein
        prio: P1
      - text: Lagerort der Produktionscharge fest "Mischanlage", Lagerhalle/Lagerfach aus dem Auftrag fehlen; mhd wird nicht gesetzt
        prio: P2
      - text: Kennzahl In Pruefung und Status der Produktionscharge passen nicht zusammen (status erfasst, qualitaetsstatus in-pruefung; get_stats zaehlt status)
        prio: P3
      - text: Chargenexport beschriftet Tonnen als menge_kg
        prio: P3
  - id: PM-06
    name: Produktions-Schnellerfassung (Vorlage buchen)
    l3: VALEO-eigen (Schnellerfassung SPA 962 laut Modulkommentar); in L3 die Produktion mit gespeicherter Rezeptur
    routen: []
    rolle: PRODUKTION (SCHREIBEN["PRODUKTION"]); Mandant aus dem Token
    nachweise: []
    status: teilweise
    befund: >-
      POST /produktion/mischfutter/schnellerfassung/{vorlage_id}/buchen (produktion_rezepturgruppen.py, buche_schnellerfassung)
      legt direkt einen futtermittel_produktionsauftraege-Satz mit Status freigegeben an, ohne Bestandspruefung, ohne Abzug und
      ohne Verbrauchs-Snapshot (bestands_abzug_erfolgt bleibt false, verbrauch leer). Die Freigabe-Logik (Abzug, Snapshot,
      Lagerbewegung) haengt in update_auftrag_status am Uebergang nach freigegeben; von freigegeben aus ist der Uebergang
      freigegeben -> freigegeben ungueltig (409), in_produktion und fertig sind aber erlaubt. Ein so angelegter Auftrag kann daher
      in_produktion und fertig werden: complete_to_charge erzeugt eine Charge, deren Rohstoffliste aus dem Rezept
      (snapshot_or_recipe) stammt, obwohl nichts abgebucht wurde. Standard-Chargen-Nr. ist "CH-SCHNELL-" plus die ersten sechs
      Zeichen der Vorlagen-ID (uuid7, zeitbasiert; jede Buchung derselben Vorlage ohne eigene Nr. trifft auf dieselbe Nummer).
      Kein Test gegen die Datenbank (nur Pydantic-Schemata, nicht gezaehlt), keine Maske, kein Eintrag in route-aliases.
    luecken:
      - text: Schnellerfassung legt einen freigegebenen Auftrag ohne Bestandsabzug und ohne Snapshot an; Fertigmeldung erzeugt danach eine Charge mit Rohstoffliste, ohne dass Rohstoff abgebucht wurde — falsche Buchung
        prio: P0
      - text: Schnellerfassung ohne Datenbanktest, ohne Maske und ohne Rezeptpruefung (rezept_id ohne FK-Pruefung im Mandanten, keine Menge je Rezept)
        prio: P2
      - text: Standard-Chargen-Nr. aus Vorlagen-ID-Praefix kollidiert bei Folgebuchungen und zwischen zeitnah angelegten Vorlagen
        prio: P3
  - id: PM-07
    name: Produktionsleitstand (Arbeitsvorrat freigeben, starten, abschliessen, Nachbearbeitung)
    l3: PRODUKTION > Produktionsliste / Nachbearbeitung — Arbeitsvorrat; (VALEO-eigener Leitstand mit Audit-Spur)
    routen: []
    rolle: "PRODUKTION (production.control.write; produktion_write: LAGER_BEARBEITEN); Nacharbeit production.control.rework; Mandant aus dem Token"
    nachweise:
      - tests/test_production_control_mask_commands.py::test_lebenslauf_und_urheber
      - tests/test_production_control_mask_commands.py::test_ohne_bearbeitungsrolle_kein_schreiben
      - tests/test_production_control_mask_commands.py::test_unerlaubter_uebergang_trockenlauf_fremder_mandant
      - tests/test_production_control.py::test_status_transition_contract_covers_rework
    status: teilweise
    befund: >-
      /production-control (production_control.py, production_control_service.py): Vorgaenge registrieren, Seite, Kennzahlen,
      Statuswechsel mit Pflichtgrund und Audit-Spur, Maskenaktionen release/start/complete/mark_rework mit Trockenlauf.
      Gegen PostgreSQL belegt (Pruefstand): kompletter Lebenslauf released -> running -> rework -> completed, Urheber im Audit
      ist der Token-Akteur, ohne Bearbeitungsrolle 403 und Status unveraendert, unerlaubter Uebergang scheitert, Trockenlauf
      schreibt nichts, fremder Mandant aendert nichts. Der Rest von test_production_control.py (Liste, Sync, Route) arbeitet mit
      MagicMock/FakeService und zaehlt nicht; der Sync (sync_production_orders mit gen_random_uuid und Statuszuordnung) hat
      keinen Datenbanktest. Der Leitstand ist eine Projektion: transition() schreibt nur production_operations und
      production_operation_audit, nicht den Auftrag in futtermittel_produktionsauftraege; der Sync aktualisiert im ON CONFLICT
      nur Nummer, Artikel, Charge, Menge und Notiz, nicht den Status. Ein Meister kann einen synchronisierten Mischfutterauftrag
      im Leitstand "fertig" melden, ohne dass Auftrag, Bestand oder Charge sich aendern, und ein ueber PATCH fertig gemeldeter
      Auftrag bleibt im Leitstand "queued". Die Vorgangsarten stock_transfer, batch_posting und rework koennen registriert
      werden, haben aber keinen Buchungsweg (L3 Stapelbuchung). Das Registrieren hat keine Maskenaktion (nur sync). Die Maske
      produktion/produktionsleitstand hat die Zeilenaktionen freigeben, starten, fertig, Nachbearbeitung, Ursprung, Drucken
      (Seite produktionsleitstand.tsx), fragt den Grund per window.prompt und bricht bei weniger als fuenf Zeichen ohne Meldung
      ab; sie steht nicht in route-aliases.json. Browserkette fehlt.
    luecken:
      - text: Leitstand-Status und Mischfutterauftrag laufen auseinander — Statuswechsel im Leitstand buchen nichts und schreiben nicht zurueck, der Sync uebernimmt den Status nur beim Einfuegen
        prio: P1
      - text: Sync Mischfutterauftraege -> Leitstand ohne Datenbanktest (nur MagicMock)
        prio: P2
      - text: Vorgangsarten stock_transfer, batch_posting, rework und mill_run haben keinen Buchungsweg und keine Erfassungsmaske (Registrieren nur per API)
        prio: P2
      - text: Maske produktion/produktionsleitstand steht nicht in route-aliases.json und damit nicht im Masken-Inventar
        prio: P2
      - text: Browserkette Leitstand freigeben > starten > fertig durch die Maske mit echtem Backend fehlt
        prio: P2
      - text: Grund per window.prompt, Abbruch bei zu kurzem Grund ohne Rueckmeldung, kein Pending-Schutz gegen Doppelklick (produktionsleitstand.tsx)
        prio: P3
  - id: PM-08
