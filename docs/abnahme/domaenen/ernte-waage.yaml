# Abnahmeblatt Annahme/Waage/Ernte — Quelle fuer scripts/domaenen_abnahme.py (Fahrplan M4).
# Prozessliste nach der L3-Referenz (Skill l3-einkauf-referenz, Abschnitt Ernte-Abrechnung: Annahmeschein, Labor-Werte,
# Freigabe nein/vorlaeufig/endgueltig, NaWaRo; Skill l3-auswertungen-schnittstelle-referenz, Abschnitt Waage: Hofliste,
# Neue Wiegung F1, Zweit-Wiegung F2, Lager-Umbuchung F5). Status: abgenommen | teilweise | fehlt. "abgenommen" verlangt
# Nachweis, keine offene P0/P1-Luecke und keine Platzhaltermaske; die Bedienung im Browser ist Teil der Maskenabnahme.
# Als Nachweis zaehlen nur Tests, die den Prozess pruefen (PostgreSQL, HTTP-Vertrag, echte Browserkette). Reine
# Mock-/Fake-DB-Tests und Import-/Schematests stehen im Befund und nicht unter nachweise.
id: ernte-waage
titel: Annahme, Waage und Ernte (Wiegung bis Gutschrift)
reifematrix: D06
l3_referenz: l3-einkauf-referenz
erhoben: 2026-11-23
pruefer: Cursor
bereiche: [agrar, annahme, waage, weighing, silo]
screen_domains: [agrar, waage]
prozesse:
  - id: EW-01
    name: Anlieferung voranmelden (LKW-Registrierung, Warteschlange, Hofliste)
    l3: Waage > Hofliste (Datum, Uhrzeit, Wiegeschein-Nr., KFZ-Kennzeichen, Erstgewicht, Name, Spediteur); Anmeldung vor der Waage
    routen: [annahme/lkw-registrierung, annahme/warteschlange, annahme/wartezeit, waage/hofliste]
    rolle: ERNTE (Warteschlange schreiben), LAGER (Hofliste schreiben)
    nachweise:
      - tests/test_intake_weighing_screen_contracts.py::test_registration_preserves_upload_and_real_article_identity
    status: teilweise
    befund: >-
      Voranmeldung und Warteschlange haben Endpunkte (annahme.py, hofliste.py mit Statusfolge vorgemeldet bis
      abgefahren). Der genannte Test prueft nur den Maskenvertrag (Felder, Submit-Endpunkt), nicht den Prozess; die
      Registrierung ist nur mit Fake-DB getestet (test_compat_lkw_registrierung.py), die Hofliste nur als Schema
      (test_fachliche_vertiefung_wave1.py). Die Maske waage/hofliste ist eine generische Platzhaltermaske (nur
      Kennung, Name, Status, Datum, nur Export) und zeigt weder Uhrzeit, Wiegeschein-Nr., Erstgewicht noch Spediteur.
    luecken:
      - text: >-
          Hofliste als Arbeitsliste der Waage (offene Fahrzeuge mit Uhrzeit, Wiegeschein-Nr., Kennzeichen, Erstgewicht,
          Name, Spediteur; von dort Zweitwiegung starten) fehlt: waage/hofliste ist eine Platzhaltermaske
        prio: P1
      - text: Kette Anmeldung > Warteschlange > Hofliste > Wiegung gegen PostgreSQL nicht belegt (nur Fake-DB und Schematests)
        prio: P2
  - id: EW-02
    name: Wiegung erfassen (Erst-/Zweitwiegung, Brutto, Tara, Netto, Wiegeschein)
    l3: Waage > Neue Wiegung (F1), Zweit-Wiegung (F2), Wiegeschein-Nr.; Netto = Erst- minus Zweitgewicht; Lager-Umbuchung (F5)
    routen: [waage, waage/wiegungen, weighing, annahme/waage-1, annahme/waage-2, agrar/wiegeschein-detail]
    rolle: LAGER (Schreiben), Mandantenkontext verpflichtend
    nachweise:
      - tests/test_wiegung_kanonisch_vertrag.py::test_netto_ist_brutto_minus_tara
      - tests/test_wiegung_kanonisch_vertrag.py::test_vertauschte_waegungen_sind_ein_fehler_und_kein_netto
      - tests/test_wiegung_kanonisch_vertrag.py::test_fremder_wiegeschein_ist_nicht_lesbar
      - tests/test_weighing_ticket_validation.py::test_derive_billing_weight_from_moisture_engine
    status: teilweise
    befund: >-
      Doppelwiegung gegen PostgreSQL und HTTP geprueft: Netto = Brutto minus Tara (201), vertauschte oder gleiche
      Wiegungen 422 statt abs(), Wiegung ohne Gewicht erzeugt keinen Beleg, Pruefbedingungen der Datenbank, Scheinnummer
      je Mandant, Richtung EL/VL, fremder Wiegeschein 404. Der Test ist nur mit migriertem Pruefstand lauffaehig (sonst
      skip); ein Einzeltest (503 bei Schreibfehler) nutzt Mock-DB und zaehlt nicht. Abrechnungsgewicht aus
      Feuchte/Besatz ist rein getestet. Offen: Erstgewicht speichern und die Zweitwiegung spaeter auf demselben Schein
      nachtragen (PUT /weighing-tickets/{id}) ist nicht gegen die Datenbank belegt; /waage/wiegungen/dual verlangt beide
      Gewichte in einem Schritt. Zuordnung Wiegeschein zu Kontrakt (allocate-contract) ist nur ueber die reine
      Mengenermittlung getestet. Wiegeschein-Druck existiert als Vordruck/Vorschau (beleg_vordrucke, report_print_service),
      nicht als belegter Druck mit echten Scheindaten. Die Waagenhardware wird nur ueber Datei-Import (ASCII) angebunden.
    luecken:
      - text: Zweitwiegung auf offener Erstwiegung (L3 F1/F2 mit Zwischenspeicherung des Erstgewichts) nicht als Integrationstest gegen PostgreSQL belegt
        prio: P2
      - text: Wiegeschein-Druck mit echten Scheindaten (Erst-/Zweitwiegung, Netto, Charge) nicht belegt, nur Vordruck-Vorschau
        prio: P2
      - text: Direkte Waagenanbindung (Live-Gewicht) fehlt, nur Datei-Import ASCII; im L3-Betrieb Hardware-Schnittstelle
        prio: P2
      - text: Zuordnung Wiegeschein zu Kontrakt als Integrationstest gegen PostgreSQL fehlt
        prio: P2
      - text: Browserkette Wiegung erfassen durch die Maske mit echtem Backend fehlt
        prio: P2
      - text: Lager-Umbuchung direkt aus der Wiegung (L3 F5) nicht vorhanden; Lagerzugang entsteht erst mit der Freigabe der Annahme (EW-07)
        prio: P3
  - id: EW-03
    name: Waagenstamm, Eichung und Datei-Import
    l3: Waage-Optionen (Waage-Stammdaten), Datei-Schnittstelle zur Waage
    routen: [waage/neu, waage/vorlagen]
    rolle: LAGER (Schreiben)
    nachweise:
      - tests/test_waage_tenant_postgres.py::test_waage_tenant_http_rls_and_migration_rollback
    status: teilweise
    befund: >-
      Ein Integrationstest gegen PostgreSQL und HTTP deckt Waage anlegen/lesen/aendern/loeschen, Mandantengrenze
      (fremde Waage 404, Fremdschluessel 422, ohne Mandant 403, Rolle LAGER_LESEN 403), Eichdaten mit Plausibilitaet,
      ASCII-Import mit Wiederholung, Fehlerqueue (retry, delete) und Qualitaetszeilen am Wiegeschein sowie die
      Zeilensicherheit (RLS) als valeo_app. Er laeuft nur mit WAAGE_TENANT_SQL_TEST=1 im abgestimmten Wartungsfenster und
      ist in der regulaeren Suite uebersprungen. Die Maske waage/vorlagen ist eine generische Platzhaltermaske, obwohl
      der Endpunkt /waagen-vorlagen (anlegen, aendern, anwenden) besteht; dessen Test nutzt Mocks.
    luecken:
      - text: Maske waage/vorlagen ist eine Platzhaltermaske ohne Vorlagenfelder und ohne Aktion "anwenden"
        prio: P2
      - text: Waagen-Vorlagen (anwenden) gegen PostgreSQL nicht belegt, nur Mock-Test
        prio: P2
      - text: Waage-Integrationstest laeuft nur im Wartungsfenster (WAAGE_TENANT_SQL_TEST=1), nicht in der regulaeren Suite
        prio: P2
  - id: EW-04
    name: Getreideannahme erfassen (Annahmeschein mit Artikel, Kontrakt, Spediteur, Zwischenhaendler, NUTS-2)
    l3: ERFASSUNG > Ernte (Ernte-Abrechnung) — Annahmesch.-Nr., Lagerhalle, Wiegesch.-Nr., Reiter Kunde/Rechnung/Kontrakt/Spediteur/NaWaRo/ZW-Haendler, "wie vorheriger AS" (F11)
    routen: [agrar/ernte, agrar/ernte/neu, agrar/ernte/:id, agrar/ernte-annahme-erfassung, agrar/ernte-annahme-erfassung/:id, annahme/rohwaren-annahme, annahme/rohware]
    rolle: beleg_write (EINKAUF_BEARBEITEN); Lesen EINKAUF_LESEN
    nachweise:
      - tests/test_harvest_rule_store_sql.py::test_real_rule_measurement_calculation_approval_and_repeat
      - tests/test_harvest_service.py::TestCalculateNetWeight
    status: teilweise
    befund: >-
      Die Annahme wird im Nachweistest ueber den echten Dienst gegen PostgreSQL angelegt (Kunde, Artikel, Lager,
      Wiegeschein werden auf den Mandanten geprueft); Nettogewicht und Qualitaetsstufe sind rein getestet. Die
      Annahmen-Endpunkte (Anlegen, Liste, Aendern, Stornieren, derive-nuts2, last, Frachtkosten) haben keinen
      HTTP-Test gegen PostgreSQL: test_harvest_acceptance_service_unit.py und test_harvest_release_safety.py arbeiten
      mit Mock-DB, test_gap_fixes_batch6.py prueft nur 404 auf nicht vorhandene Annahmen. Die Masken agrar/ernte/:id und
      agrar/ernte-annahme-erfassung sind Altmuster-Masken (builder_altmuster), agrar/ernte/neu leitet nur weiter,
      annahme/rohware ist Altmuster. Verteilungszeilen auf Silo/Partie (HarvestAcceptanceLine) legt nur der
      partie_service an; im Annahme-Endpunkt gibt es keinen Weg dafuer (L3 Aufteilungs-Buchung).
    luecken:
      - text: Annahme anlegen, aendern, stornieren und lesen als HTTP-Vertragstest gegen PostgreSQL fehlt (nur Mock-DB und 404-Smoke)
        prio: P2
      - text: Aufteilungs-Buchung (Annahme auf mehrere Silos/Partien/Kontrakte) ueber Endpunkt und Maske nicht vorhanden oder nicht belegt
        prio: P2
      - text: Browserkette Annahme erfassen > Wiegeschein zuordnen > speichern mit echtem Backend fehlt; Erfassungsmasken sind Altmuster
        prio: P2
      - text: Funktion "wie vorheriger Annahmeschein" (L3 F11, Endpunkt /last) nicht belegt
        prio: P3
  - id: EW-05
    name: Qualitaet erfassen (Feuchte, Besatz, hl-Gewicht, Protein) und nachtragen
    l3: Ernte-Abrechnung > Labor-Werte (Bezeichnung, Laborwert, Einheit), Import Analysegeraet; Muster/Proben
    routen: [annahme/qualitaets-check, annahme/muster, agrar/annahmen-qualitaet-nachtrag, agrar/qualitaet/laborwerte, agrar/ernte-qualitaetsfreigabe]
    rolle: AGRAR bzw. QUALITAET (Schreiben); Finalisieren mit Rolle AGRAR_BEARBEITEN
    nachweise:
      - packages/frontend-web/tests/e2e/uat/uat-qualitaet-nachtrag.spec.ts::TC-QNT-001
      - tests/test_workspace_agrar_chain.py::test_finalize_quality_protocol_writes_outbox_on_probe
      - tests/test_quality_protocol_pg_concurrency.py
    status: teilweise
    befund: >-
      Eine echte Browserkette gegen das laufende Backend liegt vor: Annahmen per API anlegen, Laborwerte (Feuchte mit
      Dezimalkomma, hl-Gewicht, Besatz) in der Worklist tippen, Batch speichern, Zeilen verschwinden (Nachtrag-Maske
      agrar/annahmen-qualitaet-nachtrag). Qualitaetsprotokoll finalisieren schreibt Ausgangsereignis und ist danach
      gesperrt (409); zwei konkurrierende Transaktionen koennen ein finalisiertes Protokoll nicht mehr aendern (beide
      gegen PostgreSQL). Nicht als Nachweis gezaehlt: wms-silo-semantic-chain.spec.ts (Status-Listen mit 422/503 als
      Erfolg) und test_harvest_acceptance_service_unit.py (Mock-DB). CSV-/JSON-Import eines Laborberichts besteht
      (/quality-protocols/import/csv, /import/json), eine Geraeteanbindung (L3 "Import Analysegeraet") nicht. Die
      Kette Annahmen-Nachtrag (/quality-batch) hat keinen Backend-Test; der Browsertest setzt feste Stammdaten-ID des
      Kunden voraus.
    luecken:
      - text: Import vom Analysegeraet (NIR/Labor) fehlt; vorhanden ist nur Datei-Import CSV/JSON des Laborberichts
        prio: P2
      - text: Endpunkt quality-batch und Qualitaetsprotokoll anlegen/aendern ueber HTTP gegen PostgreSQL nicht belegt (nur Browsertest mit fester Kunden-ID)
        prio: P2
      - text: Masken annahme/qualitaets-check, annahme/muster und agrar/qualitaet/laborwerte nicht im Browser gegen das Backend durchgespielt
        prio: P2
  - id: EW-06
    name: Trocknungsregeln und Trocknungsabzug
    l3: Trocknungs-/Feuchteabzug nach Tabelle je Fruchtart; Trocknungskosten in der Abrechnung
    routen: [agrar/trocknungsregeln, agrar/silo-trocknung]
    rolle: AGRAR (Regeln pflegen)
    nachweise:
      - tests/test_drying_rule_engine.py::test_wheat_factor_from_base_example
      - tests/test_moisture_engine.py::test_moisture_engine_deducts_weight_for_high_moisture
      - tests/test_process_kernel_wave72_trocknungsengine_contracts.py::test_preview_higher_feuchte_yields_higher_abzug
    status: teilweise
    befund: >-
      Rechenkern fuer Mais-Tabelle, Raps-Trockensubstanz und Weizen-Faktor ist rein getestet (ohne Mock), ebenso die
      Feuchtekorrektur des Abrechnungsgewichts und die zustandslose Trocknungsvorschau (HTTP-Vertrag, Hash
      deterministisch, hoehere Feuchte gibt hoeheren Abzug). Nicht belegt: Pflege der Regelsaetze (anlegen, Lookup-Zeilen,
      Faktorbereiche) ueber HTTP gegen PostgreSQL — test_agrar_settlements_api.py akzeptiert dort 200/403/404 und beweist
      nichts. Der Nachweisfall der kontrollierten Berechnung (EW-07) rechnet mit Feuchte 0 und trifft den Trocknungsabzug
      nicht. annahme/trocknung ist eine Stammdaten-Lesemaske ohne Bearbeiten-Endpunkt.
    luecken:
      - text: Regelsatz-Pflege (Trocknungsregeln, Lookup-Zeilen, Faktorbereiche) als HTTP-Vertragstest gegen PostgreSQL fehlt
        prio: P2
      - text: Trocknungs- und Feuchteabzug in der kontrollierten Ernte-Abrechnung gegen PostgreSQL nicht belegt (Nachweisfall Feuchte 0)
        prio: P2
      - text: Browserkette Trocknungsregel pflegen > Abrechnung zeigt Trocknungsabzug fehlt
        prio: P2
  - id: EW-07
    name: Ernte-Abrechnung berechnen und freigeben (vorlaeufig/endgueltig, Vier-Augen)
    l3: Ernte-Abrechnung > Preis fuer Artikel, Freigabe nein/vorlaeufig/endgueltig, "Berechnung und Freigabe"
    routen: [agrar/ernte-annahme-abrechnung, agrar/harvest-settlement/:id, annahme/abrechnung]
    rolle: Berechnen EINKAUF_BEARBEITEN; Regel und Berechnung freigeben nur EINKAUF_ADMIN/FINANCE_ADMIN, nie der Ersteller selbst und kein Agent
    nachweise:
      - tests/test_harvest_rule_store_sql.py::test_real_rule_measurement_calculation_approval_and_repeat
      - tests/test_harvest_rule_store_sql.py::test_author_cannot_self_approve_and_quality_exception_is_bound
      - tests/test_harvest_control_api.py::test_http_calculation_uses_the_same_persistent_domain_proof
    status: teilweise
    befund: >-
      Gegen PostgreSQL und ueber HTTP geprueft: Regel anlegen, Vier-Augen-Freigabe, Messnachweis bestaetigen, Berechnung
      (Summe 5.417,50 EUR, Besatzabzug 375 kg bei 1,5 %), Wiederholung mit gleichem Schluessel liefert dasselbe Ergebnis,
      Historie unveraenderlich und seitenweise lesbar; geaenderte Quelle (Protokoll, Wiegeschein, Preis, Position,
      Summe) kann nicht freigegeben werden, Selbstfreigabe und abgelaufene Freigabe sind gesperrt, fremder Mandant 404.
      Die Rollenabweisung vor Datenbankzugriff im HTTP-Test nutzt Mock-DB (zaehlt nicht). Die Maske
      agrar/harvest-settlement/:id ist nativ; annahme/abrechnung ist handgebaut. Die Regelpflege und Freigabe der
      Abrechnungssteuerung (HarvestControls) ist nur in die Screen-Studio-Seite eingebettet und hat keine Fachroute.
    luecken:
      - text: >-
          Abrechnungsregel anlegen, Messung bestaetigen und Berechnung freigeben (HarvestControls) ist nur im
          Screen-Studio erreichbar, nicht als Fachmaske der Ernte-Abrechnung; ohne genehmigte Vertragsregel ist die
          endgueltige Abrechnung gesperrt, der Sachbearbeiter hat in der Fachmaske keinen regulaeren Weg dorthin
        prio: P1
      - text: Vorlaeufige Freigabe (provisional) und anschliessende endgueltige Abrechnung nicht als Test belegt, nur der Weg draft > final
        prio: P2
      - text: Browserkette Annahme > Berechnen > Freigeben durch die Abrechnungsmaske mit echtem Backend fehlt
        prio: P2
  - id: EW-08
    name: Gutschrift an den Landwirt (Selbstfakturierung), Wareneingang und Buchung
    l3: Ernte-Abrechnung > Freigabe endgueltig erzeugt Rechnungs-Nr. (Gutschrift) und bucht den Wareneingang
    routen: [agrar/self-billing]
    rolle: AGRAR (Ausstellen, Senden, Stornieren, Buchen); Freigabe nur mit freigegebener Berechnung
    nachweise:
      - tests/test_harvest_rule_store_sql.py::test_real_financial_release_is_atomic_and_replay_has_no_second_effect
      - tests/test_harvest_rule_store_sql.py::test_financial_failure_rolls_back_stock_invoice_and_control_receipt
    status: teilweise
    befund: >-
      Die endgueltige Freigabe ist gegen PostgreSQL belegt: genau eine Lagerbewegung (Wareneingang), eine Gutschrift mit
      Nummer aus dem Nummernkreis und genau ein ausgeglichener Buchungssatz (Aufwand, Vorsteuer, Kreditor); die
      Wiederholung erzeugt nichts Zweites; bei Fehler im Hauptbuch werden Lager, Gutschrift und Kontrollquittung
      zurueckgerollt; abgelaufene Freigaben sperren. Der Steuerschluessel kommt aus der Konfiguration (ohne Zuordnung
      Abbruch ohne Commit — nur mit Mock-DB belegt, test_self_billing_accounting_contract.py). Die Endpunkte Ausstellen,
      E-Rechnung erzeugen, Senden, Stornieren, Dispute und Buchung (self_billing.py) haben keinen HTTP-Test gegen
      PostgreSQL; Gutschrift-PDF oder Versand an den Landwirt ist nicht belegt.
    luecken:
      - text: Gutschrift ausstellen, E-Rechnung erzeugen, senden, stornieren und disputieren als HTTP-Test gegen PostgreSQL fehlt
        prio: P2
      - text: Druck/Versand der Gutschrift an den Landwirt (PDF, XRechnung) mit echten Daten nicht belegt
        prio: P2
      - text: Browserkette Freigabe > Gutschrift sichtbar > Lagerbestand erhoeht fehlt
        prio: P2
  - id: EW-09
    name: Sammelabrechnung mehrerer Annahmen einer Periode
    l3: Abrechnung mehrerer Annahmescheine je Zeitraum, Uebergabe an Offene Posten
    routen: [agrar/sammelabrechnung]
    rolle: AGRAR (Schreiben)
    nachweise:
      - tests/test_rohware_sammelabrechnung_endpoints.py::test_create_calculate_book_and_conflict_on_delete
    status: teilweise
    befund: >-
      HTTP-Vertraege gegen PostgreSQL: mindestens zwei Annahmen (422), Entwurf, Berechnen (Menge und Betrag summiert),
      Buchen legt einen Offenen Posten an, Buchen ohne Berechnen 409, Neuberechnen nach Buchen 409, Loeschen gebuchter
      Sammelabrechnung 409, Entwurf loeschbar. Der Betrag im Test ist Menge mal Preis je Tonne (700 EUR aus 2.000 kg zu
      250 und 1.000 kg zu 200 EUR/t); die Annahmen tragen Feuchte 14 und Besatz 1, ein Abzug wird nicht ausgewiesen —
      die Sammelabrechnung geht damit nicht durch die kontrollierte Berechnung mit Regelbindung und Vier-Augen (EW-07).
      Die Maske agrar/sammelabrechnung ist Altmuster.
    luecken:
      - text: Sammelabrechnung rechnet Menge mal Preis ohne Qualitaets-, Trocknungs- und Besatzabzug und ohne Regelbindung der Einzelabrechnung; Abgleich mit EW-07 fehlt
        prio: P2
      - text: Browserkette Sammelabrechnung anlegen > berechnen > buchen fehlt; Maske ist Altmuster
        prio: P2
  - id: EW-10
    name: Einlagerung in Lager und Silozellen
    l3: Lagerhalle im Annahmekopf; Wareneingang mit Annahme; Silo-/Partieverteilung
    routen: [agrar/silo-belegung, silo, silo/kapazitaeten, annahme/silo-zuweisung, agrar/silo-qualitaet, lager/silo-uebersicht]
    rolle: LAGER (Schreiben)
    nachweise:
      - tests/test_agri_flush_physical_sql.py::test_flush_physically_moves_stock_and_only_clears_traversed_edge
      - tests/test_harvest_rule_store_sql.py::test_real_financial_release_is_atomic_and_replay_has_no_second_effect
    status: teilweise
    befund: >-
      Der Wareneingang in das Lager der Annahme ist mit der Freigabe belegt (eine Bewegung, Vorbestand plus Netto, EW-08).
      Fuer Silozellen ist die Spuel-/Umlagerungsbuchung gegen PostgreSQL geprueft (Bestaende, zwei Bewegungen, keine
      Teilbuchung bei Ueberziehung, Kapazitaet, Mandant, Sperre, Rollback bei Auditfehler); das ist keine Einlagerung aus der
      Annahme. Die Einlagerungs-Endpunkte (silo_operations_api: einlagern, auslagern, Zellen) sind nur als Pydantic- und
      422/404-Smoke getestet; test_agri_silo_material_flow.py und test_silo_leermeldung_partie_pflicht.py nutzen Mocks.
      annahme/silo-zuweisung ist eine Stammdaten-Lesemaske (kein Bearbeiten-Endpunkt). lager/silo-uebersicht
      (Route lager/silo-uebersicht und lager/silo-mobil) ist eine generische Platzhaltermaske. Die Silo-Maske
      agrar/silo-belegung ist nativ.
    luecken:
      - text: Einlagerung aus der Annahme in eine Silozelle (Zielzelle, Partie, Bestand der Zelle) ueber Maske und Endpunkt nicht belegt; Zuweisungsmaske ist nur lesend
        prio: P2
      - text: Silo-Einlagern/Auslagern als HTTP-Test gegen PostgreSQL fehlt (nur Pydantic- und 404/422-Smoke)
        prio: P2
      - text: Maske lager/silo-uebersicht (und lager/silo-mobil) ist eine Platzhaltermaske ohne Silo, Fuellstand, Material
        prio: P2
  - id: EW-11
    name: Laborauftrag, Befund und Chargensperre
    l3: Probenahme, Labor-Auftrag je Charge, Befund mit Freigabe oder Sperre
    routen: [qualitaet/labor, qualitaet/labor-auftrag, qualitaet/labor/:id, labor/proben, charge/probenahme, charge/qualitaets-freigabe]
    rolle: AGRAR bzw. QUALITAET (Schreiben), Mandantenkontext
    nachweise:
      - tests/test_labor_api.py::test_labor_auftrag_befund_creates_qs_followup_und_speichert
    status: teilweise
    befund: >-
      HTTP-Vertraege gegen PostgreSQL: Laborauftrag zu eigener Charge (201), zu unbekannter Charge 404, Detail, Befund
      mit Entscheidung "sperren" ergibt Folgeaktion charge_sperren und Status abgeschlossen, Analysewerte werden
      gespeichert. Nicht gelesen wird, dass die Charge danach tatsaechlich gesperrt ist und ob die Sperre die Abrechnung
