{{- if .Values.superglue.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "valeo-erp.fullname" . }}-superglue-config
  namespace: {{ .Values.superglue.namespace | quote }}
  labels:
    {{- include "valeo-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: superglue
data:
  SUPERGLUE_PORT: "3011"
  SUPERGLUE_PUBLIC_BASE_URL: {{ .Values.superglue.config.publicBaseUrl | quote }}
  SUPERGLUE_REST_URL: {{ .Values.superglue.config.restUrl | quote }}
  SUPERGLUE_GRAPHQL_URL: {{ .Values.superglue.config.graphqlUrl | quote }}
  SUPERGLUE_SYNC_ENABLED: {{ ternary "true" "false" .Values.superglue.config.syncEnabled | quote }}
  SUPERGLUE_EXECUTION_ENABLED: {{ ternary "true" "false" .Values.superglue.config.executionEnabled | quote }}
  SUPERGLUE_MINIO_BUCKET: {{ .Values.superglue.minio.bucket | quote }}
  SUPERGLUE_S3_REGION: {{ .Values.superglue.config.s3Region | quote }}
  DATABASE_HOST: {{ printf "%s-superglue-db" (include "valeo-erp.fullname" .) | quote }}
  DATABASE_PORT: "5432"
  DATABASE_NAME: {{ .Values.superglue.database.name | quote }}
  MINIO_ENDPOINT: {{ printf "http://%s-superglue-minio:9000" (include "valeo-erp.fullname" .) | quote }}
  MINIO_CONSOLE_ENDPOINT: {{ printf "http://%s-superglue-minio:9001" (include "valeo-erp.fullname" .) | quote }}
{{- end }}

