{{- if and .Values.superglue.enabled .Values.superglue.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "valeo-erp.fullname" . }}-superglue
  namespace: {{ .Values.superglue.namespace | quote }}
  labels:
    {{- include "valeo-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: superglue
  {{- with .Values.superglue.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.superglue.ingress.className | quote }}
  tls:
    - secretName: {{ .Values.superglue.ingress.tls.apiSecretName }}
      hosts:
        - {{ .Values.superglue.ingress.hosts.api | quote }}
    - secretName: {{ .Values.superglue.ingress.tls.minioSecretName }}
      hosts:
        - {{ .Values.superglue.ingress.hosts.minio | quote }}
  rules:
    - host: {{ .Values.superglue.ingress.hosts.api | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "valeo-erp.fullname" . }}-superglue
                port:
                  number: {{ .Values.superglue.service.port }}
    - host: {{ .Values.superglue.ingress.hosts.minio | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "valeo-erp.fullname" . }}-superglue-minio
                port:
                  number: 9001
{{- end }}

