{{- if and .Values.superglue.enabled .Values.superglue.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "valeo-erp.fullname" . }}-superglue-app
  namespace: {{ .Values.superglue.namespace | quote }}
  labels:
    {{- include "valeo-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: superglue
spec:
  refreshInterval: {{ .Values.superglue.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.superglue.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.superglue.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.superglue.authTokenSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.superglue.authTokenSecret.key }}
      remoteRef:
        key: {{ .Values.superglue.externalSecrets.keys.app | quote }}
        property: authToken
    - secretKey: databaseUrl
      remoteRef:
        key: {{ .Values.superglue.externalSecrets.keys.app | quote }}
        property: databaseUrl
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "valeo-erp.fullname" . }}-superglue-db
  namespace: {{ .Values.superglue.namespace | quote }}
  labels:
    {{- include "valeo-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: superglue-db
spec:
  refreshInterval: {{ .Values.superglue.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.superglue.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.superglue.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.superglue.database.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.superglue.database.userKey }}
      remoteRef:
        key: {{ .Values.superglue.externalSecrets.keys.db | quote }}
        property: username
    - secretKey: {{ .Values.superglue.database.passwordKey }}
      remoteRef:
        key: {{ .Values.superglue.externalSecrets.keys.db | quote }}
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "valeo-erp.fullname" . }}-superglue-minio
  namespace: {{ .Values.superglue.namespace | quote }}
  labels:
    {{- include "valeo-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: superglue-minio
spec:
  refreshInterval: {{ .Values.superglue.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.superglue.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.superglue.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.superglue.minio.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.superglue.minio.userKey }}
      remoteRef:
        key: {{ .Values.superglue.externalSecrets.keys.minio | quote }}
        property: rootUser
    - secretKey: {{ .Values.superglue.minio.passwordKey }}
      remoteRef:
        key: {{ .Values.superglue.externalSecrets.keys.minio | quote }}
        property: rootPassword
{{- end }}

