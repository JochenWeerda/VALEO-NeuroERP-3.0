{{- if .Values.superglue.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "valeo-erp.fullname" . }}-superglue
  namespace: {{ .Values.superglue.namespace | quote }}
  labels:
    {{- include "valeo-erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: superglue
spec:
  replicas: {{ .Values.superglue.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "valeo-erp.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: superglue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "valeo-erp.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: superglue
    spec:
      serviceAccountName: {{ default (printf "%s-superglue" (include "valeo-erp.fullname" .)) .Values.superglue.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: superglue
          image: "{{ .Values.superglue.image.repository }}:{{ .Values.superglue.image.tag }}"
          imagePullPolicy: {{ .Values.superglue.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - containerPort: 3001
              name: web
            - containerPort: 3002
              name: api
          envFrom:
            - configMapRef:
                name: {{ include "valeo-erp.fullname" . }}-superglue-config
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.superglue.authTokenSecret.name }}
                  key: {{ .Values.superglue.authTokenSecret.key }}
            - name: NEXT_PUBLIC_SUPERGLUE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.superglue.authTokenSecret.name }}
                  key: {{ .Values.superglue.authTokenSecret.key }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.superglue.openaiSecret.name }}
                  key: {{ .Values.superglue.openaiSecret.key }}
            - name: MASTER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.superglue.masterEncryptionSecret.name }}
                  key: {{ .Values.superglue.masterEncryptionSecret.key }}
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.superglue.database.secretName }}
                  key: {{ .Values.superglue.database.userKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.superglue.database.secretName }}
                  key: {{ .Values.superglue.database.passwordKey }}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.superglue.minio.secretName }}
                  key: {{ .Values.superglue.minio.userKey }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.superglue.minio.secretName }}
                  key: {{ .Values.superglue.minio.passwordKey }}
            - name: MINIO_WEBHOOK_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.superglue.authTokenSecret.name }}
                  key: {{ .Values.superglue.authTokenSecret.key }}
            - name: MINIO_BUCKET_NAME
              value: {{ .Values.superglue.minio.bucket | quote }}
            - name: MINIO_BUCKET_PREFIX
              value: "raw"
          volumeMounts:
            - name: runtime
              mountPath: /var/lib/superglue
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: {{ include "valeo-erp.fullname" . }}-superglue-runtime
{{- end }}
