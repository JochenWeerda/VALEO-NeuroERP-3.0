apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valeo-neuroerp-root
  namespace: argocd
spec:
  project: valeo-neuroerp
  source:
    repoURL: https://github.com/jochenweerda/VALEO-NeuroERP-3.0.git
    targetRevision: develop
    path: k8s/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
