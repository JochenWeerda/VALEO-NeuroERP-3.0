apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: valeo-neuroerp
  namespace: argocd
spec:
  description: VALEO NeuroERP GitOps Project
  sourceRepos:
    - '*'
  destinations:
    - namespace: valeo-erp
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
