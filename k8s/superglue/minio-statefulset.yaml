apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: superglue-minio
  labels:
    app.kubernetes.io/name: superglue-minio
    app.kubernetes.io/part-of: valeo-neuroerp
spec:
  serviceName: superglue-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: superglue-minio
      app.kubernetes.io/part-of: valeo-neuroerp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superglue-minio
        app.kubernetes.io/part-of: valeo-neuroerp
    spec:
      serviceAccountName: superglue
      containers:
        - name: minio
          image: minio/minio:RELEASE.2026-03-12T18-04-18Z
          args:
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: superglue-minio-secret
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superglue-minio-secret
                  key: rootPassword
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi

