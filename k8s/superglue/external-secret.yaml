apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: superglue-app-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: valeo-vault
  target:
    name: superglue-app-secret
    creationPolicy: Owner
  data:
    - secretKey: authToken
      remoteRef:
        key: secret/data/valeo/superglue/app
        property: authToken
    - secretKey: openaiApiKey
      remoteRef:
        key: secret/data/valeo/superglue/app
        property: openaiApiKey
    - secretKey: masterEncryptionKey
      remoteRef:
        key: secret/data/valeo/superglue/app
        property: masterEncryptionKey
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: superglue-db-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: valeo-vault
  target:
    name: superglue-db-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/valeo/superglue/db
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/valeo/superglue/db
        property: password
---
