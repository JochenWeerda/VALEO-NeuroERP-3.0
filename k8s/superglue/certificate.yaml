apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: superglue-api
spec:
  secretName: superglue-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - superglue.example.test
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: superglue-minio
spec:
  secretName: superglue-minio-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - superglue-minio.example.test

