apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: superglue-db
  labels:
    app.kubernetes.io/name: superglue-db
    app.kubernetes.io/part-of: valeo-neuroerp
spec:
  serviceName: superglue-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: superglue-db
      app.kubernetes.io/part-of: valeo-neuroerp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superglue-db
        app.kubernetes.io/part-of: valeo-neuroerp
    spec:
      serviceAccountName: superglue
      # KSV-0118: Pod laeuft ohne Root. uid/gid 999 ist der postgres-Benutzer
      # des offiziellen Images; fsGroup sorgt fuer Besitz am Datenvolume.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:15
          # KSV-0014: schreibgeschuetztes Wurzeldateisystem. Postgres braucht
          # dafuer zwei beschreibbare Pfade — ohne sie scheitert der Start mit
          # 'could not create lock file ... Read-only file system' (lokal mit
          # docker --read-only nachgestellt und bestaetigt).
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: superglue
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: superglue-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superglue-db-secret
                  key: password
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi

