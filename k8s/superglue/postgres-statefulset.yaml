apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: superglue-db
  labels:
    app.kubernetes.io/name: superglue-db
    app.kubernetes.io/part-of: valeo-neuroerp
spec:
  serviceName: superglue-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: superglue-db
      app.kubernetes.io/part-of: valeo-neuroerp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superglue-db
        app.kubernetes.io/part-of: valeo-neuroerp
    spec:
      serviceAccountName: superglue
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: superglue
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: superglue-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superglue-db-secret
                  key: password
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi

