apiVersion: apps/v1
kind: Deployment
metadata:
  name: superglue
  labels:
    app.kubernetes.io/name: superglue
    app.kubernetes.io/part-of: valeo-neuroerp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: superglue
      app.kubernetes.io/part-of: valeo-neuroerp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superglue
        app.kubernetes.io/part-of: valeo-neuroerp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: "/v1/health"
    spec:
      serviceAccountName: superglue
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: superglue
          image: superglueai/superglue:latest
          ports:
            - containerPort: 3001
              name: web
            - containerPort: 3002
              name: api
          envFrom:
            - configMapRef:
                name: superglue-config
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: superglue-app-secret
                  key: authToken
            - name: NEXT_PUBLIC_SUPERGLUE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: superglue-app-secret
                  key: authToken
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: superglue-app-secret
                  key: openaiApiKey
            - name: MASTER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: superglue-app-secret
                  key: masterEncryptionKey
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: superglue-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superglue-db-secret
                  key: password
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: superglue-minio-secret
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superglue-minio-secret
                  key: rootPassword
            - name: MINIO_WEBHOOK_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: superglue-app-secret
                  key: authToken
            - name: MINIO_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: superglue-config
                  key: MINIO_BUCKET_NAME
            - name: MINIO_BUCKET_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: superglue-config
                  key: MINIO_BUCKET_PREFIX
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: runtime
              mountPath: /var/lib/superglue
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: superglue-runtime-data
