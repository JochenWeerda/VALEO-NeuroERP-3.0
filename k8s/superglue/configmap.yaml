apiVersion: v1
kind: ConfigMap
metadata:
  name: superglue-config
  labels:
    app.kubernetes.io/name: superglue
    app.kubernetes.io/part-of: valeo-neuroerp
data:
  API_PORT: "3002"
  API_ENDPOINT: "http://superglue:3002"
  WEB_PORT: "3001"
  SUPERGLUE_APP_URL: "https://superglue.example.test"
  START_SCHEDULER_SERVER: "false"
  DATASTORE_TYPE: "postgres"
  SUPERGLUE_SYNC_ENABLED: "true"
  SUPERGLUE_EXECUTION_ENABLED: "false"
  POSTGRES_HOST: "superglue-db"
  POSTGRES_PORT: "5432"
  POSTGRES_SSL: "false"
  POSTGRES_DB: "superglue"
  FILE_STORAGE_PROVIDER: "minio"
  S3_ENDPOINT: "http://superglue-minio:9000"
  S3_PUBLIC_ENDPOINT: "https://superglue-minio.example.test"
  MINIO_BUCKET_NAME: "superglue-artifacts"
  MINIO_BUCKET_PREFIX: "raw"
  MINIO_WEBHOOK_ENDPOINT: "http://superglue:3002/v1/file-references/process"

