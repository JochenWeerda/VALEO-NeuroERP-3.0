site_name: VALEO NeuroERP 3.0 – Dokumentation
site_description: >-
  Dokumentation für VALEO NeuroERP 3.0 – Multi-Mandanten-ERP für Agrar,
  Landhandel und Handel.
site_url: https://jochenweerda.github.io/VALEO-NeuroERP-3.0/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: de
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Helles Design

plugins:
  - search:
      lang: de
  - swagger-ui-tag

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Validierung bewusst lenient: Altbestaende erzeugen Warnungen, keine Build-Fehler.
# Striktes Gate folgt nach der Migration (DOC-MIGRATION-001 / DOC-GOVERNANCE-001).
validation:
  omitted_files: info
  absolute_links: ignore
  unrecognized_links: ignore
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    absolute_links: ignore
    unrecognized_links: ignore

# Nur die kuratierte Struktur bauen; Altbestaende vom Build ausschliessen.
# Sie bleiben im Repo erhalten und werden in DOC-MIGRATION-001 schrittweise
# eingeordnet.
exclude_docs: |
  /*.md
  !/index.md
  /_internal/
  /analysis/
  /api/
  /agent-ops/
  /archive/
  /cards/
  /config/
  /data/
  /db/
  /deployment/
  /design/
  /hrm-go-live-templates/
  /integrations/
  /migration/
  /operations/
  /perf/
  /policies/
  /project-context/
  /quality/
  /quality-assurance/
  /roadmap/
  /runbooks/
  /schemas/
  /screenshots/
  /setup/
  /specs/
  /standards/
  /testing/
  /uat/
  /user/
  /valeo-reference/
  /warehouse/
  /wiki/
  /workflows/
  /architecture/process-kernel/wave-*/
  /architecture/*
  !/architecture/index.md
  !/architecture/fundamental-architecture-principles.md
  !/architecture/process-kernel/STATUS.md
  !/architecture/process-kernel/DELIVERY-MAP.md

nav:
  - Start: index.md
  - Benutzerhandbuch:
      - Überblick: benutzerhandbuch/index.md
      - Einstieg: benutzerhandbuch/einstieg.md
      - Ernteannahme: benutzerhandbuch/annahme.md
      - Verkauf (Auftrag → Rechnung): benutzerhandbuch/verkauf.md
      - Einkauf: benutzerhandbuch/einkauf.md
      - Lager: benutzerhandbuch/lager.md
      - Finanzbuchhaltung: benutzerhandbuch/finanzbuchhaltung.md
      - CRM: benutzerhandbuch/crm.md
      - Glossar: benutzerhandbuch/glossar.md
      - In-App-Hilfe: benutzerhandbuch/in-app-hilfe.md
  - Administration & Betrieb:
      - Überblick: admin/index.md
      - Mandanten-Administration: admin/mandanten-administration.md
      - Module & Feature-Flags: admin/module-und-feature-flags.md
      - RBAC & Rollen: admin/rbac-und-rollen.md
      - Deployment: admin/deployment.md
      - Backup & Restore: admin/backup-restore.md
      - Datenbank-Migrationen: admin/datenbank-migrationen.md
      - Monitoring & SLO: admin/monitoring-und-slo.md
      - Incident-Response: admin/incident-response.md
      - Skalierung & Performance: admin/skalierung-performance.md
  - Entwickler:
      - Überblick: entwickler/index.md
      - Architektur:
          - Index: architecture/index.md
          - Architekturprinzipien: architecture/fundamental-architecture-principles.md
          - Process Kernel (Lieferstand): architecture/process-kernel/STATUS.md
          - Lieferkarte: architecture/process-kernel/DELIVERY-MAP.md
      - ADRs: adr/README.md
  - Schnittstellen:
      - Überblick: schnittstellen/index.md
      - REST-API: schnittstellen/rest-api.md
      - MCP-Tools: schnittstellen/mcp-tools.md
      - Event-Katalog: schnittstellen/events.md
  - Agent-Dokumentation:
      - Überblick: agent-docs/index.md
      - Capability-Katalog: agent-docs/capability-catalog.md
      - Tool-Katalog: agent-docs/tool-catalog.md
      - Guardrails: agent-docs/guardrails.md
      - ai_harness-Verträge: agent-docs/contracts.md
  - Compliance: compliance/index.md
  - Referenz: referenz/index.md
  - Grundlagen:
      - Dokumentationskonzept: dokumentation/dokumentationskonzept.md
      - Frontmatter-Standard: dokumentation/frontmatter-standard.md
      - Doku-Governance: dokumentation/governance.md
      - Migrationsplan: dokumentation/migrationsplan.md
