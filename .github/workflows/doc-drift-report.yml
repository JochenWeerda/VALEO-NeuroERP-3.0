name: Doc Drift Report

on:
  schedule:
    # Montag 05:00 UTC — informativer Woechentlicher Drift-Snapshot
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  drift-report:
    name: Doku-Code-Drift (informativ)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate drift report
        run: python scripts/doc_drift_report.py

      - name: Generate drift dashboard page (DOC-DRIFT-DASHBOARD-002)
        run: python scripts/generate_drift_dashboard_page.py

      # main ist geschuetzt ("Changes must be made through a pull request"), ein
      # direkter Push scheitert hier zuverlaessig. Die Aktualisierung laeuft
      # deshalb ueber einen Zweig und einen Pull Request, der bei jedem Lauf
      # fortgeschrieben wird.
      - name: Dashboard-Aktualisierung als Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/entwickler/drift-dashboard.md
          if git diff --cached --quiet; then
            echo "Kein Dashboard-Update noetig."
            exit 0
          fi
          BRANCH="chore/drift-dashboard"
          git checkout -B "$BRANCH"
          git commit -m "chore(docs): Drift-Dashboard aktualisiert [DOC-DRIFT-DASHBOARD-002]"
          git push --force-with-lease origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH"               --title "chore(docs): Drift-Dashboard aktualisiert"               --body "Automatischer Snapshot aus dem woechentlichen Drift-Report. Rein informativ, keine Code-Aenderung."
          else
            echo "Offener Pull Request vorhanden, Zweig wurde fortgeschrieben."
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: doc-drift-report
          path: artifacts/doc_drift_report.json
          if-no-files-found: error
          retention-days: 90
