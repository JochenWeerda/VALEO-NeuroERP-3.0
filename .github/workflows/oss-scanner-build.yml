name: Anthropic OSS Scanner Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".oss-scanner/**"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "requirements.txt"
      - ".github/workflows/oss-scanner-build.yml"
  push:
    branches: [main]
    paths:
      - ".oss-scanner/**"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "requirements.txt"
      - ".github/workflows/oss-scanner-build.yml"

permissions:
  contents: read

concurrency:
  group: oss-scanner-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Reproduce scanner image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build scanner image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .oss-scanner/Dockerfile
          push: false
          tags: valeo-neuroerp-oss-scanner:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
