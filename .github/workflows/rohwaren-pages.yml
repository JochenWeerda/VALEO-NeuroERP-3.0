name: Rohwaren-Angebotsrechner (GitHub Pages)
on:
  push:
    branches:
      - feat/rohwaren-angebotsrechner-20261030
    paths:
      - 'tools/rohwaren-angebotsrechner/**'
      - '.github/workflows/rohwaren-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rohwaren-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/rohwaren-angebotsrechner
      - id: deployment
        uses: actions/deploy-pages@v4
