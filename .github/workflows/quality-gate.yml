name: Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'packages/erp-domain/**'
      - 'packages/frontend-web/**'
      - 'migrations/sql/erp/**'
      - 'tools/migration/**'
      - 'requirements.txt'
      - 'package.json'
      - '.github/workflows/quality-gate.yml'

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.0"
  PYTHONHASHSEED: "0"
  TZ: "UTC"

jobs:
  path-guard:
    name: Path Guard (forbidden artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine diff range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}...${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            fi
            echo "range=$BEFORE...${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run forbidden path guard
        run: node scripts/guard-forbidden-paths.cjs --range "${{ steps.range.outputs.range }}"

      - name: PII/Lead-Daten-Guard (DSGVO)
        run: python3 scripts/check_no_pii_data.py --tracked

  docs-code-sync:
    name: Docs/code sync for critical paths
    runs-on: ubuntu-latest
    needs: [path-guard]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Determine diff range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            fi
            echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
          fi
          echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Run docs/code sync check
        run: node scripts/docs-code-sync-check.cjs --base "${{ steps.range.outputs.base }}" --head "${{ steps.range.outputs.head }}"

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    needs: [path-guard, docs-code-sync]
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks runs with --no-git, so we don't need history, and we avoid
          # persisting credentials into .git/config (which can trigger false positives).
          fetch-depth: 1
          persist-credentials: false

      - name: Gitleaks (with baseline)
        run: |
          # Use `git archive` to scan a working-tree snapshot without `.git/`.
          # This avoids false positives from temporary auth headers written by actions/checkout.
          rm -rf /tmp/gitleaks-src
          mkdir -p /tmp/gitleaks-src
          git archive --format=tar HEAD | tar -x -C /tmp/gitleaks-src

          set +e
          docker run --rm \
            -v "/tmp/gitleaks-src:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json \
            --no-banner
          ec=$?
          set -e

          if [ "$ec" -ne 0 ]; then
            echo "Gitleaks report (first 200 lines):"
            head -n 200 /tmp/gitleaks-src/gitleaks-report.json || true
          fi
          exit "$ec"

  backend:
    name: Backend (pytest + Postgres)
    runs-on: ubuntu-latest
    needs: [secret-scan]
    env:
      POSTGRES_DB: valeo_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/valeo_test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: valeo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d valeo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check toolchain pins
        run: python scripts/check_toolchain_pins.py

      - name: Check migrations (single head)
        run: python scripts/check_alembic_single_head.py

      - name: SQL injection check (f-string in text())
        run: python scripts/check_sql_fstrings.py

      - name: Tenant isolation audit
        run: python scripts/check_tenant_isolation.py

      - name: Response model coverage (regression check)
        run: python scripts/check_response_models.py --threshold 20

      - name: Pagination regression check
        run: python scripts/check_pagination.py --threshold 53

      - name: Godfile regression check (>1000 LOC)
        run: python scripts/check_file_size.py --threshold 12

      - name: Mask performance contract (UIX-PERF-GATE-006)
        # Gepinnte Toolchain + --transpile-only: Backend-Job hat kein pnpm install;
        # neuere npx-TypeScript-Versionen lehnen die Repo-tsconfig ab (TS5011/5101/5109).
        # Der Gate-Wert liegt in der Contract-Logik, nicht im Typecheck.
        run: npx --yes -p typescript@5.5.4 -p ts-node@10.9.2 ts-node --transpile-only scripts/check_mask_performance_contract.ts

      - name: OpenAPI docs coverage (summary= on all routes)
        run: python scripts/check_openapi_docs.py --threshold 0

      - name: Doc-Drift-Gate (DOC-DRIFT-GATE-002)
        run: |
          python scripts/doc_drift_report.py --fail-over 0 || {
            echo ""
            echo "──────────────────────────────────────────────────────────"
            echo "FEHLER: Doku-Code-Drift erkannt (Schwellwert: 0)."
            echo "Bitte Doku-Inventar aktualisieren oder doc_drift_report.py prüfen."
            echo "──────────────────────────────────────────────────────────"
            exit 1
          }

      - name: OpenAPI spec drift check (DOC-OPENAPI-CI-001)
        run: |
          python scripts/generate_openapi.py --check || {
            echo ""
            echo "──────────────────────────────────────────────────────────"
            echo "FEHLER: docs/schnittstellen/openapi.json ist veraltet."
            echo "Bitte lokal ausführen und committen:"
            echo "  python scripts/generate_openapi.py"
            echo "──────────────────────────────────────────────────────────"
            exit 1
          }

      - name: Doc generator meta-check
        run: bash scripts/check_all_doc_generators.sh --check

      - name: Setup pnpm for Architecture OS
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Architecture OS validate (ARCH-OS-004)
        run: pnpm arch:validate

      - name: Check core contamination guardrail
        run: python scripts/check_no_core_contamination.py

      - name: Migrate DB schema (Alembic)
        run: python scripts/init_db.py

      - name: Check required ERP domain structure
        run: python scripts/check_required_domain_schemas.py

      - name: Check domain table ownership
        run: python scripts/check_domain_table_ownership.py

      - name: Run tests
        run: pytest -q

      - name: Check critical backend coverage
        run: python scripts/check_critical_backend_coverage.py

      - name: Generate release compatibility matrix
        run: python scripts/generate_release_compatibility_matrix.py

      - name: Upload release compatibility matrix
        uses: actions/upload-artifact@v4
        with:
          name: release-compatibility-matrix
          path: |
            artifacts/release-compatibility-matrix.json
            artifacts/release-compatibility-matrix.md
          retention-days: 90

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @valero-neuroerp/frontend-web typecheck

      - name: Lint
        run: pnpm --filter @valero-neuroerp/frontend-web exec eslint "src/**/*.{ts,tsx}" --report-unused-disable-directives --quiet

      - name: Build (smoke)
        run: pnpm --filter @valero-neuroerp/frontend-web build

      - name: Mask bundle budget (UIX-BUNDLE-GATE-013)
        run: npx ts-node scripts/check_mask_bundle_budget.ts

      - name: ERP-Domain tests (packages/erp-domain)
        run: pnpm --filter @valero-neuroerp/erp-domain test
        continue-on-error: false

      - name: Docs lint
        run: pnpm run docs:lint --if-present

  frontend-accessibility:
    name: Frontend WCAG (axe-core)
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @valero-neuroerp/frontend-web exec playwright install --with-deps chromium

      - name: Run axe accessibility tests
        run: pnpm --filter @valero-neuroerp/frontend-web test:e2e:accessibility
        env:
          CI: true

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-accessibility-report
          path: packages/frontend-web/playwright-report
          retention-days: 7

  dependency-scan:
    name: Dependency Scan (blocking high/critical)
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: pnpm audit
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high

  production-contract:
    name: Production contract and assessor simulation
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install production contract dependencies
        run: pip install PyYAML

      - name: Validate production deployment contract
        run: |
          python scripts/check_production_readiness.py \
            --environment production \
            --compose-file docker-compose.production.yml \
            --helm-values k8s/helm/valeo-erp/values-production.yaml \
            --contract-only

      - name: Simulate external assessors
        run: |
          python scripts/simulate_external_assessors.py \
            --output-json artifacts/production-readiness-assessment.json \
            --output-markdown artifacts/production-readiness-assessment.md

      - name: Upload assessor evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-assessment
          path: artifacts/production-readiness-assessment.*
          retention-days: 30

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Generate repository SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: valeo-neuroerp-sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: valeo-neuroerp-sbom
          path: valeo-neuroerp-sbom.cdx.json
          retention-days: 90

  docker-smoke:
    name: Docker Build Smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t valeo-backend:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t valeo-frontend:ci .
