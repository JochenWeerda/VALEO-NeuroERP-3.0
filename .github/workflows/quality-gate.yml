name: Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.0"
  API_DEV_TOKEN: "dev-token"
  PYTHONHASHSEED: "0"
  TZ: "UTC"

jobs:
  path-guard:
    name: Path Guard (forbidden artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine diff range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}...${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            fi
            echo "range=$BEFORE...${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run forbidden path guard
        run: node scripts/guard-forbidden-paths.cjs --range "${{ steps.range.outputs.range }}"

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    needs: [path-guard]
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks runs with --no-git, so we don't need history, and we avoid
          # persisting credentials into .git/config (which can trigger false positives).
          fetch-depth: 1
          persist-credentials: false

      - name: Gitleaks (with baseline)
        run: |
          # Use `git archive` to scan a working-tree snapshot without `.git/`.
          # This avoids false positives from temporary auth headers written by actions/checkout.
          rm -rf /tmp/gitleaks-src
          mkdir -p /tmp/gitleaks-src
          git archive --format=tar HEAD | tar -x -C /tmp/gitleaks-src

          set +e
          docker run --rm \
            -v "/tmp/gitleaks-src:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json \
            --no-banner
          ec=$?
          set -e

          if [ "$ec" -ne 0 ]; then
            echo "Gitleaks report (first 200 lines):"
            head -n 200 /tmp/gitleaks-src/gitleaks-report.json || true
          fi
          exit "$ec"

  backend:
    name: Backend (pytest + Postgres)
    runs-on: ubuntu-latest
    needs: [secret-scan]
    env:
      POSTGRES_DB: valeo_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/valeo_test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: valeo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d valeo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Check migrations (single head)
        run: python scripts/check_alembic_single_head.py

      - name: Check core contamination guardrail
        run: python scripts/check_no_core_contamination.py

      - name: Migrate DB schema (Alembic)
        run: python scripts/init_db.py

      - name: Check required ERP domain structure
        run: python scripts/check_required_domain_schemas.py

      - name: Check domain table ownership
        run: python scripts/check_domain_table_ownership.py

      - name: Run tests
        run: pytest -q

      - name: Check critical backend coverage
        run: python scripts/check_critical_backend_coverage.py

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @valero-neuroerp/frontend-web typecheck

      - name: Lint
        run: pnpm --filter @valero-neuroerp/frontend-web exec eslint "src/**/*.{ts,tsx}" --report-unused-disable-directives --max-warnings 1000

      - name: Build (smoke)
        run: pnpm --filter @valero-neuroerp/frontend-web build

  dependency-scan:
    name: Dependency Scan (advisory)
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: pip-audit (advisory)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: pnpm audit (advisory)
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high

  docker-smoke:
    name: Docker Build Smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t valeo-backend:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t valeo-frontend:ci .
