name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA already validated on staging
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: jochenweerda/valeo-neuroerp-3.0/backend
  FRONTEND_IMAGE_NAME: jochenweerda/valeo-neuroerp-3.0/frontend
  NAMESPACE: valeo-production
  RELEASE_NAME: valeo-production

jobs:
  verify:
    name: Repeat hard release gates
    uses: ./.github/workflows/release-gates.yml
    with:
      release_sha: ${{ inputs.release_sha }}

  deploy:
    name: Production deployment
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4

      - name: Resolve Helm dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build k8s/helm/valeo-erp

      - name: Validate immutable release
        shell: bash
        run: |
          [[ "${{ inputs.release_sha }}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release_sha muss ein voller 40-stelliger Git-SHA sein"
            exit 1
          }
          test "$(git rev-parse HEAD)" = "${{ inputs.release_sha }}"

      - name: Configure cluster
        run: |
          test -n "${{ secrets.KUBE_CONFIG }}" || { echo "KUBE_CONFIG fehlt"; exit 1; }
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Validate production secrets
        run: |
          kubectl get namespace "$NAMESPACE"
          kubectl get secret valeo-erp-runtime -n "$NAMESPACE"
          kubectl get secret valeo-erp-database -n "$NAMESPACE"

      - name: Run database migration
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:sha-${{ inputs.release_sha }}
        run: |
          JOB="valeo-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: ${NAMESPACE}
          spec:
            backoffLimit: 1
            ttlSecondsAfterFinished: 3600
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${IMAGE}
                    command: ["python", "scripts/init_db.py"]
                    envFrom:
                      - secretRef:
                          name: valeo-erp-runtime
          EOF
          kubectl wait --for=condition=complete "job/${JOB}" -n "$NAMESPACE" --timeout=10m

      - name: Atomic Helm deployment
        run: |
          helm upgrade --install "$RELEASE_NAME" k8s/helm/valeo-erp \
            --namespace "$NAMESPACE" \
            --values k8s/helm/valeo-erp/values-production.yaml \
            --set image.tag="sha-${{ inputs.release_sha }}" \
            --set frontend.image.tag="sha-${{ inputs.release_sha }}" \
            --atomic --wait --timeout 15m

      - name: Production smoke
        run: |
          test -n "${{ secrets.PRODUCTION_URL }}" || { echo "PRODUCTION_URL fehlt"; exit 1; }
          curl --fail --show-error --silent --retry 12 --retry-all-errors \
            --retry-delay 5 "${{ secrets.PRODUCTION_URL }}/healthz"
          curl --fail --show-error --silent --retry 12 --retry-all-errors \
            --retry-delay 5 "${{ secrets.PRODUCTION_URL }}/readyz"

      - name: Roll back failed deployment
        if: failure()
        run: helm rollback "$RELEASE_NAME" -n "$NAMESPACE" --wait
