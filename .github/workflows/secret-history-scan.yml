name: Secret History Scan (gitleaks)

on:
  workflow_dispatch:
  schedule:
    # nightly at 03:30 UTC
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: secret-history-scan
  cancel-in-progress: true

jobs:
  history-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (full history)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --max-target-megabytes 10 \
            --timeout 1800 \
            --no-banner

