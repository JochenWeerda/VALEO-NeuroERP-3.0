name: Docs Governance

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.md"
      - "scripts/docs-*.cjs"
      - ".github/workflows/docs-governance.yml"
      - "package.json"
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/docs-*.cjs"
      - ".github/workflows/docs-governance.yml"
      - "package.json"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  docs-governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Markdown hygiene check
        run: node scripts/docs-markdown-check.cjs

      - name: Governance check
        run: node scripts/docs-governance-check.cjs
