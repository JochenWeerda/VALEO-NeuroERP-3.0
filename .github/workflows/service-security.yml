name: Service Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: discover
        name: Discover every service manifest including nested finance services
        run: echo "matrix=$(python scripts/audit_service_dependencies.py --matrix)" >> "$GITHUB_OUTPUT"
      - name: Check service imports
        run: python scripts/check_service_import_pins.py
      - name: Verify audit failure handling
        run: python scripts/test_audit_service_dependencies.py

  audit:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ matrix.manifest }}
      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Audit resolved service dependencies
        env:
          SERVICE_MANIFEST: ${{ matrix.manifest }}
        run: python scripts/audit_service_dependencies.py --manifest "$SERVICE_MANIFEST"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-audit-${{ matrix.service }}
          path: artifacts/service-security/
          if-no-files-found: error

  crm-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build actual CRM AI image
        run: docker build -t crm-ai-security:${{ github.sha }} services/crm-ai
      - name: Verify real startup and migration failure against disposable PostgreSQL
        run: python scripts/verify_crm_ai_container.py crm-ai-security:${{ github.sha }}
      - name: Check health, OpenAPI and all simulated endpoint contracts
        run: >-
          docker run --rm --network none --entrypoint python
          --mount type=bind,src=${{ github.workspace }}/scripts/verify_crm_ai_contracts.py,dst=/verify.py,readonly
          crm-ai-security:${{ github.sha }} /verify.py

  service-security:
    name: Service Security Gate
    if: always()
    needs: [inventory, audit, crm-ai]
    runs-on: ubuntu-latest
    steps:
      - name: Require every service check to succeed
        env:
          INVENTORY: ${{ needs.inventory.result }}
          AUDIT: ${{ needs.audit.result }}
          CRM_AI: ${{ needs.crm-ai.result }}
        run: |
          test "$INVENTORY" = success
          test "$AUDIT" = success
          test "$CRM_AI" = success
