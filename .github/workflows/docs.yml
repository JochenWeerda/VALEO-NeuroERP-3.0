name: Docs Build

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs-staleness-check.cjs"
      - "scripts/generate_adr_nav.py"
      - "scripts/generate_code_inventories.py"
      - "app/api/v1/endpoints/**"
      - "app/services/**"
      - "alembic/versions/**"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs-staleness-check.cjs"
      - "scripts/generate_adr_nav.py"
      - "scripts/generate_code_inventories.py"
      - "app/api/v1/endpoints/**"
      - "app/services/**"
      - "alembic/versions/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build:
    name: mkdocs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install docs toolchain
        run: pip install -r requirements-docs.txt

      - name: ADR navigation drift check
        run: python scripts/generate_adr_nav.py --check

      - name: Code inventory drift check
        run: python scripts/generate_code_inventories.py --check

      - name: Build documentation site
        run: python -m mkdocs build --site-dir site

      - name: Staleness gate (curated MkDocs pages)
        run: node scripts/docs-staleness-check.cjs --max-age-days 365
