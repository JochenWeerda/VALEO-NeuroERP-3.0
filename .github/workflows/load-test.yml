name: Lasttest Erntepeak (Gap 037)

on:
  schedule:
    # Täglich 04:00 UTC gegen Staging
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Lasttest-Szenario'
        required: true
        default: 'health-check'
        type: choice
        options:
          - health-check
          - harvest-peak
      base_url:
        description: 'Backend-URL'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/load/**'

jobs:
  health-check:
    name: Health-Check (pre-deploy Gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'health-check')
    steps:
      - uses: actions/checkout@v4

      - name: Zielsystem aufloesen
        id: target
        env:
          REQUESTED_BASE_URL: ${{ github.event.inputs.base_url }}
          STAGING_BASE_URL: ${{ secrets.STAGING_URL }}
        run: |
          BASE_URL="${REQUESTED_BASE_URL:-$STAGING_BASE_URL}"
          if [ -z "$BASE_URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Health-Check als externes Gate uebersprungen: STAGING_URL fehlt."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: k6 installieren
        if: steps.target.outputs.enabled == 'true'
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Health-Check ausführen
        if: steps.target.outputs.enabled == 'true'
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          API_DEV_TOKEN: ${{ secrets.API_DEV_TOKEN }}
          TENANT_ID: ${{ secrets.TENANT_ID || 'tenant-staging' }}
        run: |
          k6 run \
            --env "BASE_URL=$BASE_URL" \
            --env "API_DEV_TOKEN=$API_DEV_TOKEN" \
            --env "TENANT_ID=$TENANT_ID" \
            tests/load/health-check.js

      - name: Externes Gate dokumentieren
        if: steps.target.outputs.enabled != 'true'
        run: echo "Health-Check nicht ausgefuehrt, weil kein Staging-Ziel konfiguriert ist." >> "$GITHUB_STEP_SUMMARY"

  harvest-peak:
    name: Erntepeak-Lasttest (500 VU)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'harvest-peak')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Zielsystem aufloesen
        id: target
        env:
          REQUESTED_BASE_URL: ${{ github.event.inputs.base_url }}
          STAGING_BASE_URL: ${{ secrets.STAGING_URL }}
        run: |
          BASE_URL="${REQUESTED_BASE_URL:-$STAGING_BASE_URL}"
          BASE_URL="${BASE_URL%/}"
          if [ -z "$BASE_URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Erntepeak als externes Gate uebersprungen: STAGING_URL fehlt."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Zielsystem vorpruefen
        if: steps.target.outputs.enabled == 'true'
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          for path in /readyz /healthz /health; do
            if curl --silent --show-error --fail \
              --connect-timeout 5 --max-time 15 \
              "$BASE_URL$path" > /dev/null; then
              echo "Lasttest-Ziel ist ueber $path erreichbar."
              exit 0
            fi
          done
          echo "::error::Konfiguriertes Lasttest-Ziel ist nicht erreichbar: $BASE_URL"
          exit 1

      - name: k6 installieren
        if: steps.target.outputs.enabled == 'true'
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Erntepeak-Lasttest ausführen
        if: steps.target.outputs.enabled == 'true'
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          API_DEV_TOKEN: ${{ secrets.API_DEV_TOKEN }}
          TENANT_ID: ${{ secrets.TENANT_ID || 'tenant-staging' }}
        run: |
          mkdir -p results
          k6 run \
            --env "BASE_URL=$BASE_URL" \
            --env "API_DEV_TOKEN=$API_DEV_TOKEN" \
            --env "TENANT_ID=$TENANT_ID" \
            --out json=results/harvest-peak-${{ github.run_id }}.json \
            tests/load/harvest-peak.js

      - name: Ergebnisse hochladen
        if: always() && steps.target.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lasttest-ergebnisse-${{ github.run_id }}
          path: results/
          retention-days: 30

      - name: Ergebnis-Zusammenfassung
        if: always()
        run: |
          {
            echo "## Lasttest-Ergebnis"
            if [ "${{ steps.target.outputs.enabled }}" != "true" ]; then
              echo ""
              echo "Nicht ausgefuehrt: Es ist kein Staging-Ziel konfiguriert."
              echo "Das externe Performance-Gate bleibt offen."
              exit 0
            fi
            echo "| Metrik | Ziel |"
            echo "|--------|------|"
            echo "| P95 Antwortzeit | < 800ms |"
            echo "| Fehlerrate | < 2% |"
            echo "| Max. VU | 500 (Erntepeak) / 800 (Spike) |"
            echo "| Kernprozesse | Annahme, Qualitätsprüfung, Einlagerung |"
          } >> "$GITHUB_STEP_SUMMARY"
