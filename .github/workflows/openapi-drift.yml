name: OpenAPI Drift Check (DOC-OPENAPI-CI-001)

# Läuft nach jedem Push auf main/develop, wenn App-Code geändert wurde.
# Drift schlägt fehl. Die Spec wird mit der verursachenden API-Änderung
# im normalen Review- und Merge-Weg eingecheckt.

on:
  push:
    branches: [main, develop]
    paths:
      - "app/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-drift-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  openapi-check:
    name: OpenAPI Spec prüfen
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: valeo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d valeo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/valeo_test
      API_DEV_TOKEN: ci-token
      VALEO_API_VERSION: "3.0.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Backend-Dependencies installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DB-Schema migrieren
        run: python scripts/init_db.py

      - name: OpenAPI-Spec prüfen
        run: python scripts/generate_openapi.py --check
