name: Compliance Checks

on:
  schedule:
    # Weekly on Monday at 6:00 AM
    - cron: '0 6 * * 1'
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]
    paths:
      - 'tests/compliance/**'
      - 'tests/test_gdpr*.py'
      - 'tests/test_journal*integrity.py'
      - 'app/services/finance_transaction_service.py'
      - 'scripts/compliance_report.py'
      - '.github/workflows/compliance-check.yml'
      - 'app/api/v1/endpoints/gdpr.py'
      - 'docs/compliance/**'

jobs:
  gdpr-compliance:
    name: GDPR Compliance Tests
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: postgresql://valeo_dev:REDACTED_PASSWORD@localhost:5432/valeo_neuro_erp
      TEST_DATABASE_URL: postgresql://valeo_dev:REDACTED_PASSWORD@localhost:5432/valeo_neuro_erp
      PYTEST_REQUIRE_DB_STRICT: "1"
      PYTHONPATH: .:tests
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: valeo_neuro_erp
          POSTGRES_USER: valeo_dev
          POSTGRES_PASSWORD: REDACTED_PASSWORD
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valeo_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Initialize database
        run: |
          python scripts/init_db.py
      
      - name: Run GDPR Tests
        run: |
          pytest tests/compliance/test_gdpr.py tests/test_gdpr_api.py -v --tb=short -o addopts= --cov=app.api.v1.endpoints.gdpr --cov-report=xml:coverage-gdpr.xml --cov-report=term-missing --cov-fail-under=80 --junitxml=pytest-report.xml
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdpr-test-results
          if-no-files-found: error
          path: pytest-report.xml

  gobd-compliance:
    name: GoBD Compliance Tests
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: postgresql://valeo_dev:REDACTED_PASSWORD@localhost:5432/valeo_neuro_erp
      TEST_DATABASE_URL: postgresql://valeo_dev:REDACTED_PASSWORD@localhost:5432/valeo_neuro_erp
      PYTEST_REQUIRE_DB_STRICT: "1"
      PYTHONPATH: .:tests
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: valeo_neuro_erp
          POSTGRES_USER: valeo_dev
          POSTGRES_PASSWORD: REDACTED_PASSWORD
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valeo_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Initialize database
        run: |
          python scripts/init_db.py
      
      - name: Run GoBD Tests
        run: |
          pytest tests/compliance/test_gobd.py tests/test_journal_amount_integrity.py tests/test_journal_lifecycle_integrity.py -v --tb=short -o addopts= --no-cov --junitxml=pytest-report.xml
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gobd-test-results
          if-no-files-found: error
          path: pytest-report.xml

  compliance-report:
    name: Generate Compliance Report
    runs-on: ubuntu-latest
    needs: [gdpr-compliance, gobd-compliance]
    if: always()
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          path: test-results
      
      - name: Generate Report
        env:
          GDPR_RESULT: ${{ needs.gdpr-compliance.result }}
          GOBD_RESULT: ${{ needs.gobd-compliance.result }}
        run: python scripts/compliance_report.py test-results compliance-report.md

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance-report.md
          if-no-files-found: error
      
