name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://valeo_dev:REDACTED_PASSWORD@localhost:5432/valeo_neuro_erp
      API_DEV_TOKEN: dev-token
      PYTEST_REQUIRE_DB_STRICT: "1"
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: valeo_neuro_erp
          POSTGRES_USER: valeo_dev
          POSTGRES_PASSWORD: REDACTED_PASSWORD
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valeo_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit safety

      - name: Validate L3 mapping definitions
        run: |
          if [ -f config/l3_mapping.yaml ]; then
            python scripts/validate_mapping.py \
              --mapping config/l3_mapping.yaml \
              --raw docs/data/l3/raw_tables.json \
              --fail-on-warn \
              --report-unmapped
          else
            echo "::warning::config/l3_mapping.yaml not found; validating template instead"
            python scripts/validate_mapping.py \
              --mapping config/l3_mapping.template.yaml \
              --raw docs/data/l3/raw_tables.json \
              --fail-on-warn \
              --report-unmapped
          fi || true

      - name: Initialize database schema & seed data
        run: |
          python scripts/init_db.py
          python -m app.seeds.inventory_seed
      
      # Vollsuite deckt u.a. Compliance/PCN (test_flow_spines_api), Kernel-Actions (wave17), Broker ab.
      - name: Run tests
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
      
      - name: Bandit security scan
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
      
      - name: Safety dependency check
        run: |
          safety check --json || true

  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      # `actions/setup-node`'s pnpm caching requires `pnpm` to already be available on PATH.
      - name: Setup Node.js (pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: TypeScript type check
        run: pnpm --filter @valero-neuroerp/frontend-web typecheck
      
      - name: ESLint
        run: pnpm --filter @valero-neuroerp/frontend-web lint || true
      
      - name: Build Storybook
        run: pnpm --filter @valero-neuroerp/frontend-web build-storybook
      
      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/frontend-web/storybook-static
          retention-days: 7
      
      - name: Install Playwright browsers
        run: pnpm --filter @valero-neuroerp/frontend-web exec playwright install --with-deps chromium
      
      - name: Run Playwright tests
        run: pnpm --filter @valero-neuroerp/frontend-web test:e2e || true
        env:
          CI: true
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/frontend-web/playwright-report
          retention-days: 7

  workflow-service:
    name: Workflow Service Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: services/workflow
        run: |
          pip install -r requirements.txt

      - name: Static analysis
        working-directory: services/workflow
        run: python -m compileall app main.py

      - name: Run workflow service tests
        working-directory: services/workflow
        run: |
          if [ -d "tests" ]; then \
            pytest; \
          else \
            echo "Keine Tests gefunden, übersprungen."; \
          fi

  infrastat-compliance:
    name: InfraStat Service Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: services/compliance/infrastat
        run: |
          pip install -r requirements.txt

      - name: Run InfraStat tests
        env:
          PYTHONPATH: services/compliance/infrastat
        run: |
          pytest services/compliance/infrastat/tests || true

  zoll-compliance:
    name: Zoll Service Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: services/compliance/zoll
        run: |
          pip install -r requirements.txt

      - name: Run Zoll tests
        env:
          PYTHONPATH: services/compliance/zoll
        run: |
          pytest services/compliance/zoll/tests || true

  rag-sync:
    name: RAG Sync Dry Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: tools/rag-sync
        run: pip install -r requirements.txt

      - name: Execute RAG sync (dry run)
        run: |
          python tools/rag-sync/rag_sync.py \
            --source knowledge-base \
            --output /tmp/rag-sync-output.json \
            --dry-run \
            --embedding-provider auto \
            --verbose
          ls -lah /tmp/rag-sync-output.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Set up Python (for ZAP target)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies (for ZAP target)
        run: pip install -r requirements.txt

      - name: Start application (for ZAP target)
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: Wait for app to be ready (for ZAP target)
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:8000/healthz; do sleep 2; done'
      
      - name: OWASP ZAP Baseline Scan
        id: zap_baseline
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false

      - name: Enforce ZAP medium/high gate
        run: |
          test -f report_json.json || {
            echo "::error::ZAP did not produce report_json.json"
            exit 1
          }
          count=$(jq '[.site[]?.alerts[]? | select((.riskcode | tonumber) >= 2)] | length' report_json.json)
          echo "ZAP medium/high findings: $count"
          test "$count" -eq 0

  infrastat-integration:
    name: InfraStat Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r services/compliance/infrastat/requirements.txt

      - name: Start integration stack
        env:
          # compose.yml wertet alle Services aus (inkl. profile superglue); Pflichtvariablen setzen
          SUPERGLUE_DB_PASSWORD: ci-superglue-db-password
          SUPERGLUE_MINIO_ROOT_PASSWORD: ci-superglue-minio-password
          SUPERGLUE_AUTH_TOKEN: ci-superglue-auth-token
          SUPERGLUE_OPENAI_API_KEY: ci-superglue-openai-placeholder
          SUPERGLUE_MASTER_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: docker compose -f docker-compose.integration.yml up -d --build

      - name: Run InfraStat integration tests
        env:
          PYTHONPATH: services/compliance/infrastat
        run: |
          pytest services/compliance/infrastat/tests/integration || true

      - name: Stop integration stack
        if: always()
        env:
          SUPERGLUE_DB_PASSWORD: ci-superglue-db-password
          SUPERGLUE_MINIO_ROOT_PASSWORD: ci-superglue-minio-password
          SUPERGLUE_AUTH_TOKEN: ci-superglue-auth-token
          SUPERGLUE_OPENAI_API_KEY: ci-superglue-openai-placeholder
          SUPERGLUE_MASTER_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: docker compose -f docker-compose.integration.yml down --remove-orphans

  finance-gobd-tests:
    name: Finance GoBD Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (finance + shared)
        working-directory: services/finance
        run: |
          pip install -r requirements.txt
      - name: Run GoBD tests
        env:
          PYTHONPATH: packages/finance-shared/src
        run: |
          pytest services/finance/tests/compliance/test_gobd.py -q || true

  inventory-epcis-tests:
    name: Inventory EPCIS Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: valeo_neuro_erp
          POSTGRES_USER: valeo_dev
          POSTGRES_PASSWORD: REDACTED_PASSWORD
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valeo_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (inventory)
        working-directory: services/inventory
        run: |
          pip install -r requirements.txt

      - name: Run EPCIS API tests
        env:
          PYTHONPATH: services/inventory
          INVENTORY_DATABASE_URL: postgresql+asyncpg://valeo_dev:REDACTED_PASSWORD@localhost:5432/valeo_neuro_erp
        run: |
          pytest services/inventory/tests/test_epcis.py -q || true

      - name: Run EPCIS NATS integration test
        env:
          PYTHONPATH: services/inventory
          INVENTORY_DATABASE_URL: postgresql+asyncpg://valeo_dev:REDACTED_PASSWORD@localhost:5432/valeo_neuro_erp
        run: |
          pytest services/inventory/tests/test_nats_integration.py -q || true

  staging-dry-run:
    name: Staging Dry-Run (Helm Lint & Template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.3
      - name: Helm Dependency Build
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build k8s/helm/valeo-erp
      - name: Helm Lint
        run: |
          helm lint k8s/helm/valeo-erp
      - name: Helm Template (Inventory)
        run: |
          helm template valeo-erp k8s/helm/valeo-erp \
            -f docs/deployment/helm/infra/values-inventory.yaml \
            --set image.tag=dryrun-$(git rev-parse --short HEAD) \
            --debug > /dev/null
      - name: Helm Template (Zoll)
        run: |
          if [ -f docs/deployment/helm/infra/values-zoll.yaml ]; then
            helm template valeo-erp k8s/helm/valeo-erp \
              -f docs/deployment/helm/infra/values-zoll.yaml \
              --set image.tag=dryrun-$(git rev-parse --short HEAD) \
              --debug > /dev/null
          fi
      - name: Helm Template (InfraStat)
        run: |
          if [ -f docs/deployment/helm/infra/values-infrastat.yaml ]; then
            helm template valeo-erp k8s/helm/valeo-erp \
              -f docs/deployment/helm/infra/values-infrastat.yaml \
              --set image.tag=dryrun-$(git rev-parse --short HEAD) \
              --debug > /dev/null
          fi

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, frontend-test, workflow-service, infrastat-compliance, zoll-compliance, infrastat-integration, rag-sync, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write
      security-events: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
      
      - name: Upload Trivy image results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'
      
      - name: Deploy to staging
        run: |
          helm upgrade --install valeo-erp-staging ./k8s/helm/valeo-erp \
            --namespace staging \
            --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set ingress.hosts[0].host=staging.erp.valeo.example.com \
            --wait
      
      - name: Run smoke tests
        run: |
          curl -f https://staging.erp.valeo.example.com/healthz || exit 1
          curl -f https://staging.erp.valeo.example.com/readyz || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'
      
      - name: Deploy to production (Blue-Green)
        run: |
          helm upgrade --install valeo-erp-production ./k8s/helm/valeo-erp \
            --namespace production \
            --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set replicaCount=3 \
            --set resources.limits.cpu=2000m \
            --set resources.limits.memory=2Gi \
            --wait
      
      - name: Run health checks
        run: |
          curl -f https://erp.valeo.example.com/healthz || exit 1
          curl -f https://erp.valeo.example.com/readyz || exit 1
      
      - name: Notify deployment
        run: |
          echo "Deployment successful: ${{ github.sha }}"

