name: AI Engineering Metrics (Nightly)

on:
  schedule:
    - cron: "0 4 * * *"   # täglich 04:00 UTC
  workflow_dispatch:        # manueller Trigger

permissions:
  contents: write           # für Auto-Commit der generierten Seite

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # vollständige Git-History für Cycle-Time

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run AI Engineering Metrics
        run: |
          python scripts/ai_engineering_metrics.py \
            --since $(date -d '90 days ago' +%Y-%m-%d) \
            --json --out /tmp/metrics.json

      - name: Generate MkDocs page from metrics
        run: |
          python scripts/generate_metrics_page.py \
            --input /tmp/metrics.json \
            --output docs/agent-ops/engineering-metrics.md

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-engineering-metrics-${{ github.run_id }}
          path: /tmp/metrics.json
          retention-days: 90

      - name: Commit updated metrics page
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/agent-ops/engineering-metrics.md
          git diff --cached --quiet || \
            git commit -m "chore(metrics): Nightly AI Engineering Metrics Update $(date +%Y-%m-%d)"
          git push
