name: AI Engineering Metrics (Nightly)

on:
  schedule:
    - cron: "0 4 * * *"   # täglich 04:00 UTC
  workflow_dispatch:        # manueller Trigger

permissions:
  contents: read

concurrency:
  group: ai-engineering-metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # vollständige Git-History für Cycle-Time

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install PyYAML==6.0.3

      - name: Run AI Engineering Metrics
        run: |
          python scripts/ai_engineering_metrics.py \
            --since $(date -d '90 days ago' +%Y-%m-%d) \
            --json --out /tmp/metrics.json

      - name: Generate MkDocs page from metrics
        run: |
          python scripts/generate_metrics_page.py \
            --input /tmp/metrics.json \
            --output docs/agent-ops/engineering-metrics.md

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-engineering-metrics-${{ github.run_id }}
          path: |
            /tmp/metrics.json
            docs/agent-ops/engineering-metrics.md
          if-no-files-found: error
          retention-days: 90

      - name: Read-only improvement inventory
        run: python scripts/run_improvement_pipelines.py --jobs 2 --timeout 120

      - name: Upload improvement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-code-improvement
          path: artifacts/code-improvement.json
          if-no-files-found: error
          retention-days: 30
