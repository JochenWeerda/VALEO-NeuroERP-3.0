name: Security Agent (Full Pipeline)

on:
  schedule:
    - cron: '0 3 * * 1'   # Montag 03:00 UTC
  workflow_dispatch:
    inputs:
      scan_image:
        description: 'Docker-Image scannen?'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-agent.yml'
      - 'app/**'
      - 'modules/**'
      - 'tests/**'
      - 'scripts/security/**'
      - 'packages/frontend-web/**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'requirements*.txt'
      - 'package*.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  security-events: write

env:
  REPORT_DIR: security-reports

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Stufe 1: Secrets
  # ═══════════════════════════════════════════════════════════════════════════
  gitleaks:
    name: "Secrets (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Gitleaks JSON report
        if: always()
        run: |
          gitleaks detect --source=. --report-format=json \
            --report-path=gitleaks.json --no-banner --exit-code 0 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # Stufe 2: SAST (Semgrep + Bandit)
  # ═══════════════════════════════════════════════════════════════════════════
  semgrep:
    name: "SAST (Semgrep)"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep Scan
        run: |
          semgrep scan \
            --json --output semgrep.json \
            --config "p/python" \
            --config "p/javascript" \
            --config "p/typescript" \
            --config "p/owasp-top-ten" \
            --config "p/security-audit" \
            --config scripts/security/semgrep-rules.yml \
            --max-target-bytes 1000000 \
            --timeout 300 \
            . || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.json
          retention-days: 30

  bandit:
    name: "Python SAST (Bandit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install & Run Bandit
        run: |
          pip install bandit[toml]
          bandit -r app/ modules/ -f json -o bandit.json --exit-zero || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit.json
          retention-days: 30

  security-regression:
    name: "Security Regression Lane"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend security regression suite
        run: |
          pytest \
            tests/test_security_*.py \
            tests/test_secrets_vault.py \
            tests/test_neuro_tool_execution.py \
            -q --no-cov

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend security regression suite
        run: |
          pnpm --dir packages/frontend-web exec vitest run \
            src/__tests__/lib/export-utils.test.ts \
            src/__tests__/security/print-html-sinks.test.ts

      - name: Security docs governance
        run: node scripts/docs-governance-check.cjs

  # ═══════════════════════════════════════════════════════════════════════════
  # Stufe 3: Trivy (Filesystem + Config + Image)
  # ═══════════════════════════════════════════════════════════════════════════
  trivy-fs:
    name: "Dependencies + Secrets (Trivy fs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-fs.json'
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln,secret'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-report
          path: trivy-fs.json
          retention-days: 30

  trivy-config:
    name: "Dockerfile/IaC (Trivy config)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy Config Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-config.json'
          severity: 'HIGH,CRITICAL'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-config-report
          path: trivy-config.json
          retention-days: 30

  trivy-image:
    name: "Container Image (Trivy)"
    runs-on: ubuntu-latest
    if: inputs.scan_image == true || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Build Image
        run: docker build -t valeo-erp:scan .

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'valeo-erp:scan'
          format: 'json'
          output: 'trivy-image.json'
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln,misconfig,secret'

      - name: Upload SARIF to GitHub Security
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'valeo-erp:scan'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'HIGH,CRITICAL'

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-report
          path: trivy-image.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # Stufe 4: Triage + Unified Report
  # ═══════════════════════════════════════════════════════════════════════════
  triage:
    name: "Triage & Unified Report"
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, bandit, trivy-fs, trivy-config, trivy-image]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all scan reports
        uses: actions/download-artifact@v4
        with:
          path: scan-reports/

      - name: Consolidate reports
        run: |
          mkdir -p report
          # Flatten — jeder Scanner hat sein eigenes Verzeichnis
          cp scan-reports/gitleaks-report/gitleaks.json   report/ 2>/dev/null || echo '[]' > report/gitleaks.json
          cp scan-reports/semgrep-report/semgrep.json     report/ 2>/dev/null || echo '{"results":[]}' > report/semgrep.json
          cp scan-reports/bandit-report/bandit.json       report/ 2>/dev/null || echo '{"results":[]}' > report/bandit.json
          cp scan-reports/trivy-fs-report/trivy-fs.json   report/ 2>/dev/null || echo '{"Results":[]}' > report/trivy-fs.json
          cp scan-reports/trivy-config-report/trivy-config.json report/ 2>/dev/null || echo '{"Results":[]}' > report/trivy-config.json
          cp scan-reports/trivy-image-report/trivy-image.json   report/ 2>/dev/null || echo '{"Results":[]}' > report/trivy-image.json
          ls -la report/

      - name: Run Triage
        run: python3 scripts/security/triage_findings.py report/

      - name: Generate GitHub Summary
        if: always()
        run: |
          cat report/summary.md >> $GITHUB_STEP_SUMMARY

      - name: Check for Critical findings
        run: |
          CRIT=$(python3 -c "
          import json
          data = json.load(open('report/unified_findings.json'))
          print(data['meta']['by_severity']['CRITICAL'])
          ")
          echo "Critical findings: $CRIT"
          if [ "$CRIT" -gt 0 ]; then
            echo "::error::$CRIT CRITICAL security findings detected!"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-agent-unified
          path: |
            report/unified_findings.json
            report/summary.md
            scripts/security/llm_triage_prompt.txt
          retention-days: 90
