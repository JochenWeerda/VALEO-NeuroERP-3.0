name: SonarCloud Analysis

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Scan (reuse verified coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download backend evidence from this run
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-xml
          path: .

      - name: Download frontend evidence from this run
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-lcov
          path: packages/frontend-web/coverage

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify commit and coverage content
        run: >-
          python scripts/verify_quality_evidence.py
          coverage.xml packages/frontend-web/coverage/lcov.info

      - name: Require Sonar configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::SONAR_TOKEN fehlt; Analyse ist nicht nachgewiesen.'
            exit 1
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: -Dsonar.qualitygate.wait=true
