name: Universal Mask Platform CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/core/screen_definitions.py'
      - 'app/api/v1/endpoints/mask_rollout*.py'
      - 'app/api/v1/endpoints/crm_360.py'
      - 'app/api/v1/endpoints/open_items.py'
      - 'app/api/v1/endpoints/einkauf_kpis.py'
      - 'packages/frontend-web/src/components/mask-builder/**'
      - 'tests/test_mask_*.py'
      - 'tests/test_uix04*.py'
  pull_request:
    branches: [main]
    paths:
      - 'app/core/screen_definitions.py'
      - 'app/api/v1/endpoints/mask_rollout*.py'
      - 'packages/frontend-web/src/components/mask-builder/**'
      - 'tests/test_mask_*.py'
      - 'tests/test_uix04*.py'

jobs:
  backend-mask-tests:
    name: Backend Mask Tests (Python)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://valeo_dev:valeo_dev_2024@localhost:5432/valeo_neuro_erp
      API_DEV_TOKEN: dev-token

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run ScreenDefinition unit tests
        run: |
          pytest \
            tests/test_mask_screen_definition.py \
            tests/test_uix046_048_command_endpoints_safety.py \
            -v --tb=short -m unit

      - name: Run Mask Rollout batch tests (if present)
        run: |
          pytest \
            tests/test_mask_rollout_batch_w42_51.py \
            -v --tb=short -m unit
        continue-on-error: true

      - name: Run FilterPlan contract tests
        run: |
          pytest \
            tests/test_uix044_filter_plan_contract.py \
            -v --tb=short -m unit

  frontend-mask-checks:
    name: Frontend Mask Checks (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/frontend-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: packages/frontend-web
        run: npm ci

      - name: TypeScript type-check
        working-directory: packages/frontend-web
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: packages/frontend-web
        run: npm run build

      - name: Run Vitest unit tests
        working-directory: packages/frontend-web
        run: npx vitest run
        continue-on-error: true

  e2e-smoke:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-mask-tests, frontend-mask-checks]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/frontend-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: packages/frontend-web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: packages/frontend-web
        run: npx playwright install chromium --with-deps

      - name: Run Playwright smoke tests
        working-directory: packages/frontend-web
        run: npx playwright test tests/e2e/universal-mask-filter-plan.spec.ts --project=chromium
        continue-on-error: true
        env:
          CI: true
