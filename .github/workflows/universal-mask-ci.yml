name: Universal Mask Platform CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/core/screen_definitions.py'
      - 'app/api/v1/endpoints/mask_rollout*.py'
      - 'app/api/v1/endpoints/mask_actions.py'
      - 'app/api/v1/endpoints/crm_360.py'
      - 'app/api/v1/endpoints/open_items.py'
      - 'app/api/v1/endpoints/einkauf_kpis.py'
      - 'packages/frontend-web/src/components/mask-builder/**'
      - 'packages/bff/bff-web/src/**'
      - 'tests/test_mask_*.py'
      - 'tests/test_uix04*.py'
      - 'tests/test_uix05*.py'
      - 'packages/frontend-web/src/app/route-aliases.json'
      - 'packages/frontend-web/src/app/routing/route-inventory.gen.json'
      - 'packages/frontend-web/src/app/routing/route-tree.gen.tsx'
      - 'packages/frontend-web/scripts/generate-tanstack-routes.mjs'
      - 'packages/frontend-web/src/pages/**/*-native.tsx'
      - 'packages/frontend-web/tests/e2e/uix-056-native-route-smoke.spec.ts'
      - '.github/workflows/universal-mask-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/core/screen_definitions.py'
      - 'app/api/v1/endpoints/mask_rollout*.py'
      - 'app/api/v1/endpoints/mask_actions.py'
      - 'packages/frontend-web/src/components/mask-builder/**'
      - 'packages/bff/bff-web/src/**'
      - 'tests/test_mask_*.py'
      - 'tests/test_uix04*.py'
      - 'tests/test_uix05*.py'
      - 'packages/frontend-web/src/app/route-aliases.json'
      - 'packages/frontend-web/src/app/routing/route-inventory.gen.json'
      - 'packages/frontend-web/scripts/generate-tanstack-routes.mjs'
      - 'packages/frontend-web/src/pages/**/*-native.tsx'
      - 'packages/frontend-web/tests/e2e/uix-056-native-route-smoke.spec.ts'
  workflow_dispatch:

jobs:
  backend-mask-tests:
    name: Backend Mask Tests (Python)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://valeo_dev:valeo_dev_2024@localhost:5432/valeo_neuro_erp
      API_DEV_TOKEN: dev-token

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run ScreenDefinition unit tests
        run: |
          pytest \
            tests/test_mask_screen_definition.py \
            -v --tb=short --no-cov -m unit

      - name: Run UIX-046/048 CommandEndpoints + Agent Safety (alle 26 SDs)
        run: |
          pytest \
            tests/test_uix046_048_command_endpoints_safety.py \
            -v --tb=short --no-cov -m unit

      - name: Run UIX-050/051/052/053 Advanced Actions tests
        run: |
          pytest \
            tests/test_uix050_053_advanced_actions.py \
            -v --tb=short --no-cov -m unit

      - name: Run UIX-051 Route Migration tests
        run: |
          pytest \
            tests/test_uix051_legacy_route_migration.py \
            -v --tb=short --no-cov -m unit

      - name: Run UIX-054 Route Inventory verification
        run: |
          pytest \
            tests/test_uix054_route_inventory_verification.py \
            -v --tb=short --no-cov -m unit

      - name: Run FilterPlan contract tests (UIX-044)
        run: |
          pytest \
            tests/test_uix044_filter_plan_contract.py \
            -v --tb=short --no-cov -m unit

      - name: Run Mask Rollout batch tests
        run: |
          pytest \
            tests/test_mask_rollout_batch_w42_51.py \
            -v --tb=short --no-cov -m unit
        continue-on-error: true

  frontend-mask-checks:
    name: Frontend Mask Checks (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: packages/frontend-web
        run: npm install --no-audit

      - name: Route inventory drift check (generate-tanstack-routes)
        working-directory: packages/frontend-web
        run: |
          npm run routes:generate
          git diff --exit-code src/app/routing/route-inventory.gen.json src/app/routing/route-tree.gen.tsx

      - name: TypeScript type-check
        working-directory: packages/frontend-web
        run: npx tsc --noEmit --skipLibCheck

      - name: Build frontend
        working-directory: packages/frontend-web
        run: npm run build

      - name: Run Vitest unit tests
        working-directory: packages/frontend-web
        run: npx vitest run
        continue-on-error: true

  bff-build:
    name: BFF Build (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install BFF dependencies
        working-directory: packages/bff/bff-web
        run: npm install --no-audit

      - name: Build BFF
        working-directory: packages/bff/bff-web
        run: npm run build

      - name: ESLint BFF
        working-directory: packages/bff/bff-web
        run: npx eslint src --max-warnings 0
        continue-on-error: true

  e2e-smoke:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-mask-tests, frontend-mask-checks, bff-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: packages/frontend-web
        run: npm install --no-audit

      - name: Install Playwright browsers
        working-directory: packages/frontend-web
        run: npx playwright install chromium --with-deps

      - name: Run Playwright smoke tests
        working-directory: packages/frontend-web
        run: |
          npx playwright test \
            tests/e2e/universal-mask-filter-plan.spec.ts \
            tests/e2e/uix-056-native-route-smoke.spec.ts \
            --project=chromium
        continue-on-error: true
        env:
          CI: true
