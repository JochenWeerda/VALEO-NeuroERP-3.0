name: E2E @critical — Semantische Kern-Pfade (SEMANTIC-E2E-STRICT-001)

# Läuft bei jedem PR und push auf main.
# Nur @critical-Tests — stricter als @smoke (kein 503-Fallback als Erfolg).
# Blockiert bei Fehlern.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-critical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-critical:
    name: "E2E @critical Kern-Pfade"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: valeo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d valeo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/valeo_test
      # Echte Anmeldung (seit 12.10.2026 kein Dev-Token): Wegwerf-Keycloak aus scripts/ci/e2e_keycloak.sh,
      # Sitzungen in Redis. Kennungen und Kennwoerter setzt dieser Schritt je Lauf ueber $GITHUB_ENV.
      REDIS_URL: redis://localhost:6379/0
      IDENTITY_SESSION_IDLE_SECONDS: "3600"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
      EVENT_BUS_ENABLED: "false"
      OUTBOX_WORKER_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Start Test-Keycloak und Testkennungen
        run: bash scripts/ci/e2e_keycloak.sh

      - name: Migrate test database
        run: python scripts/init_db.py

      - name: Start backend
        run: |
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
          timeout 120 bash -c 'until curl -fsS http://127.0.0.1:8000/healthz; do sleep 2; done'

      - name: Run @critical E2E tests
        run: pnpm run test:e2e:critical

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-critical-results
          path: playwright-tests/artifacts/
          retention-days: 14
