name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: jochenweerda/valeo-neuroerp-3.0/backend
  FRONTEND_IMAGE_NAME: jochenweerda/valeo-neuroerp-3.0/frontend
  NAMESPACE: valeo-staging
  RELEASE_NAME: valeo-staging

jobs:
  verify:
    name: Hard release gates
    uses: ./.github/workflows/release-gates.yml

  build:
    name: Build immutable images
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      backend_image: ${{ steps.image.outputs.backend_ref }}
      frontend_image: ${{ steps.image.outputs.frontend_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define image reference
        id: image
        run: |
          echo "backend_ref=${REGISTRY}/${BACKEND_IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_ref=${REGISTRY}/${FRONTEND_IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ steps.image.outputs.backend_ref }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.image.outputs.frontend_ref }}

  deploy:
    name: Deploy and smoke staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4

      - name: Resolve Helm dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build k8s/helm/valeo-erp

      - name: Configure cluster
        shell: bash
        run: |
          test -n "${{ secrets.KUBE_CONFIG }}" || { echo "KUBE_CONFIG fehlt"; exit 1; }
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Validate target secrets
        run: |
          kubectl get namespace "$NAMESPACE"
          kubectl get secret valeo-erp-runtime -n "$NAMESPACE"
          kubectl get secret valeo-erp-database -n "$NAMESPACE"

      - name: Run database migration
        env:
          IMAGE: ${{ needs.build.outputs.backend_image }}
        run: |
          JOB="valeo-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: ${NAMESPACE}
          spec:
            backoffLimit: 1
            ttlSecondsAfterFinished: 3600
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${IMAGE}
                    command: ["python", "scripts/init_db.py"]
                    envFrom:
                      - secretRef:
                          name: valeo-erp-runtime
          EOF
          kubectl wait --for=condition=complete "job/${JOB}" -n "$NAMESPACE" --timeout=10m

      - name: Helm upgrade
        env:
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
        run: |
          BACKEND_TAG="${BACKEND_IMAGE##*:}"
          FRONTEND_TAG="${FRONTEND_IMAGE##*:}"
          helm upgrade --install "$RELEASE_NAME" k8s/helm/valeo-erp \
            --namespace "$NAMESPACE" \
            --values k8s/helm/valeo-erp/values-production.yaml \
            --set image.tag="$BACKEND_TAG" \
            --set frontend.image.tag="$FRONTEND_TAG" \
            --set ingress.hosts[0].host="${{ secrets.STAGING_HOST }}" \
            --set ingress.tls[0].hosts[0]="${{ secrets.STAGING_HOST }}" \
            --atomic --wait --timeout 15m

      - name: Smoke target
        run: |
          test -n "${{ secrets.STAGING_URL }}" || { echo "STAGING_URL fehlt"; exit 1; }
          curl --fail --show-error --silent --retry 12 --retry-all-errors \
            --retry-delay 5 "${{ secrets.STAGING_URL }}/healthz"
          curl --fail --show-error --silent --retry 12 --retry-all-errors \
            --retry-delay 5 "${{ secrets.STAGING_URL }}/readyz"

      - name: Roll back failed deployment
        if: failure()
        run: helm rollback "$RELEASE_NAME" -n "$NAMESPACE" --wait
