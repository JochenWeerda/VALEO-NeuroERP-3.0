name: E2E Full UAT Tests

on:
  schedule:
    - cron: '0 2 * * *'  # Täglich um 2 Uhr nachts
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  full-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: valeo_uat
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d valeo_uat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/valeo_uat
      API_DEV_TOKEN: ci-uat-token
      EVENT_BUS_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      # `actions/setup-node`'s pnpm caching requires `pnpm` to already be on PATH.
      - name: Setup Node.js (pnpm cache)
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Setup Test Environment
        run: |
          if [ -f .env.uat ]; then
            cp .env.uat .env
          elif [ -f .env.example ]; then
            cp .env.example .env
            echo "::notice::.env.uat fehlt; verwende .env.example als CI-Basis."
          else
            touch .env
            echo "::notice::Keine Env-Vorlage gefunden; erzeuge minimale CI-Konfiguration."
          fi
          echo "VALEO_TENANT=QA-UAT-01" >> .env
          echo "VALEO_BASE_URL=http://localhost:3000" >> .env
          echo "DATABASE_URL=$DATABASE_URL" >> .env
          echo "API_DEV_TOKEN=$API_DEV_TOKEN" >> .env
          echo "EVENT_BUS_ENABLED=false" >> .env

      - name: Initialize database
        run: python scripts/init_db.py
      
      - name: Build Application
        run: pnpm --filter @valero-neuroerp/frontend-web build
      
      - name: Start Backend (Background)
        run: |
          nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 2
          done
          cat backend.log
          exit 1
      
      - name: Start Frontend (Background)
        run: |
          cd packages/frontend-web
          nohup pnpm preview --host 127.0.0.1 --port 3000 > ../../frontend.log 2>&1 &
          cd ../..
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 2
          done
          cat frontend.log
          exit 1
      
      - name: Run Full UAT Tests
        run: pnpm exec playwright test --project=full
        env:
          PLAYWRIGHT_RUN_ID: ${{ github.run_id }}-full
          BUILD_ID: ${{ github.sha }}
      
      - name: Run Fallback Verification
        run: pnpm exec playwright test --project=fallback-verification
        env:
          PLAYWRIGHT_RUN_ID: ${{ github.run_id }}-fallback
          BUILD_ID: ${{ github.sha }}
      
      - name: Upload Full Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-uat-artifacts-${{ github.run_id }}
          path: |
            playwright-tests/artifacts/
            playwright-report/
            backend.log
            frontend.log
          retention-days: 30
      
      - name: Upload Coverage Matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-matrix-full
          path: docs/uat/COVERAGE-MATRIX.csv
          retention-days: 90
      
      - name: Upload Bug List
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-list
          path: docs/uat/BUGLIST.json
          retention-days: 90
      
      - name: Generate UAT Summary
        if: always()
        run: |
          echo "# Full UAT Summary" > docs/uat/UAT-SUMMARY.md
          echo "" >> docs/uat/UAT-SUMMARY.md
          echo "**Run ID:** ${{ github.run_id }}" >> docs/uat/UAT-SUMMARY.md
          echo "**Build:** ${{ github.sha }}" >> docs/uat/UAT-SUMMARY.md
          echo "**Datum:** $(date -u)" >> docs/uat/UAT-SUMMARY.md
          echo "" >> docs/uat/UAT-SUMMARY.md
          echo "## KPIs" >> docs/uat/UAT-SUMMARY.md
          echo "- Tests gesamt: TBD" >> docs/uat/UAT-SUMMARY.md
          echo "- Bestanden: TBD" >> docs/uat/UAT-SUMMARY.md
          echo "- Fehlgeschlagen: TBD" >> docs/uat/UAT-SUMMARY.md
          echo "- Übersprungen: TBD" >> docs/uat/UAT-SUMMARY.md
          echo "" >> docs/uat/UAT-SUMMARY.md
          cat docs/uat/UAT-SUMMARY.md >> $GITHUB_STEP_SUMMARY
      
      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-summary
          path: docs/uat/UAT-SUMMARY.md
          retention-days: 90

