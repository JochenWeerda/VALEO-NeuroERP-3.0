name: Security Scan

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  owasp-zap-full-scan:
    name: OWASP ZAP Full Scan
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/valeo_security
      APP_ENV: test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: valeo_security
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d valeo_security"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Migrate security-scan database
        run: python scripts/init_db.py
      
      - name: Start application
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 10
      
      - name: Wait for app to be ready
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:8000/healthz; do sleep 2; done'
      
      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          allow_issue_writing: false
          fail_action: true
          issue_title: 'OWASP ZAP Full Scan Report'
      
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
  
  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend Docker image
        run: |
          docker build -f Dockerfile.backend -t valeo-backend:${{ github.sha }} .
          docker build -f Dockerfile.frontend -t valeo-frontend:${{ github.sha }} .
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'valeo-backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Run Trivy frontend vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'valeo-frontend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'

      - name: Upload Trivy frontend results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
  
  grype-scan:
    name: Grype Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend Docker image
        run: |
          docker build -f Dockerfile.backend -t valeo-backend:${{ github.sha }} .
          docker build -f Dockerfile.frontend -t valeo-frontend:${{ github.sha }} .
      
      - name: Run Grype scan
        id: grype_scan
        uses: anchore/scan-action@v3
        with:
          image: 'valeo-backend:${{ github.sha }}'
          fail-build: true
          severity-cutoff: high

      - name: Run Grype frontend scan
        id: grype_frontend_scan
        uses: anchore/scan-action@v3
        with:
          image: 'valeo-frontend:${{ github.sha }}'
          fail-build: true
          severity-cutoff: high
      
      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.grype_scan.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype_scan.outputs.sarif }}

      - name: Upload Grype frontend results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.grype_frontend_scan.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype_frontend_scan.outputs.sarif }}
  
  bandit-scan:
    name: Bandit Python Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Bandit
        run: pip install bandit[toml]
      
      - name: Run Bandit scan
        run: |
          set +e
          bandit -r app/ -lll -iii -f json -o bandit-report.json
          scan_exit=$?
          set -e
          HIGH_COUNT=$(jq '[.results[] | select(.issue_severity == "HIGH" or .issue_severity == "CRITICAL")] | length' bandit-report.json)
          echo "High/Critical issues found: $HIGH_COUNT"
          if [ "$scan_exit" -ne 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
            cat bandit-report.json
            exit 1
          fi
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
  
  dependency-audit:
    name: Python and Node Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install pip-audit
        run: pip install pip-audit
      
      - name: Run Python dependency audit
        run: pip-audit -r requirements.txt --format json --output pip-audit-report.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Run Node dependency audit
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-report
          path: pip-audit-report.json
  
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
  
  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [owasp-zap-full-scan, trivy-scan, grype-scan, bandit-scan, dependency-audit]
    if: always()
    
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
      
      - name: Generate summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.owasp-zap-full-scan.result }}" == "success" ]; then
            echo "✅ OWASP ZAP Full Scan: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ OWASP ZAP Full Scan: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.trivy-scan.result }}" == "success" ]; then
            echo "✅ Trivy Container Scan: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Trivy Container Scan: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.grype-scan.result }}" == "success" ]; then
            echo "✅ Grype Vulnerability Scan: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Grype Vulnerability Scan: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.bandit-scan.result }}" == "success" ]; then
            echo "✅ Bandit Python Security: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Bandit Python Security: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.dependency-audit.result }}" == "success" ]; then
            echo "Dependency Audit: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "Dependency Audit: FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Detailed reports available in artifacts." >> $GITHUB_STEP_SUMMARY
