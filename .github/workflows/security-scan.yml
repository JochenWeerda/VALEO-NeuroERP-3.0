name: Security Scan

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  owasp-zap-full-scan:
    name: OWASP ZAP Full Scan
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/valeo_security
      APP_ENV: test
      BACKEND_CORS_ORIGINS: '["http://localhost:8000"]'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: valeo_security
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d valeo_security"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Migrate security-scan database
        run: python scripts/init_db.py
      
      - name: Start application
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 10
      
      - name: Wait for app to be ready
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:8000/healthz; do sleep 2; done'
      
      - name: OWASP ZAP Full Scan
        id: zap_full
        continue-on-error: true
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -I'
          allow_issue_writing: false
          fail_action: false
          issue_title: 'OWASP ZAP Full Scan Report'

      - name: Enforce ZAP medium/high gate
        run: |
          test -f report_json.json || {
            echo "::error::ZAP did not produce report_json.json"
            exit 1
          }
          count=$(jq '[.site[]?.alerts[]? | select((.riskcode | tonumber) >= 2)] | length' report_json.json)
          echo "ZAP medium/high findings: $count"
          test "$count" -eq 0
      
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
  
  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend Docker image
        run: |
          docker build -f Dockerfile.backend -t valeo-backend:${{ github.sha }} .
          docker build -f Dockerfile.frontend -t valeo-frontend:${{ github.sha }} .
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'valeo-backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Run Trivy frontend vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'valeo-frontend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: trivy-backend

      - name: Upload Trivy frontend results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: trivy-frontend

      - name: Enforce Trivy High/Critical gate
        run: |
          # SARIF above and the release gate both report actionable
          # High/Critical findings for which a vendor fix exists.
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "valeo-backend:${{ github.sha }}"
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "valeo-frontend:${{ github.sha }}"
  
  grype-scan:
    name: Grype Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend Docker image
        run: |
          docker build -f Dockerfile.backend -t valeo-backend:${{ github.sha }} .
          docker build -f Dockerfile.frontend -t valeo-frontend:${{ github.sha }} .
      
      - name: Run Grype scan
        id: grype_scan
        uses: anchore/scan-action@v7
        with:
          image: 'valeo-backend:${{ github.sha }}'
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high
          only-fixed: true

      - name: Run Grype frontend scan
        id: grype_frontend_scan
        uses: anchore/scan-action@v7
        with:
          image: 'valeo-frontend:${{ github.sha }}'
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high
          only-fixed: true
      
      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.grype_scan.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype_scan.outputs.sarif }}
          category: grype-backend

      - name: Upload Grype frontend results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.grype_frontend_scan.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype_frontend_scan.outputs.sarif }}
          category: grype-frontend
  
  bandit-scan:
    name: Bandit Python Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Bandit
        run: pip install bandit[toml]
      
      - name: Run Bandit scan
        run: |
          set +e
          bandit -r app/ -lll -iii -f json -o bandit-report.json
          scan_exit=$?
          set -e
          HIGH_COUNT=$(jq '[.results[] | select(.issue_severity == "HIGH" or .issue_severity == "CRITICAL")] | length' bandit-report.json)
          echo "High/Critical issues found: $HIGH_COUNT"
          if [ "$scan_exit" -ne 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
            cat bandit-report.json
            exit 1
          fi
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
  
  dependency-audit:
    name: Python and Node Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install pip-audit
        run: pip install pip-audit
      
      - name: Run Python dependency audit
        run: pip-audit -r requirements.txt --format json --output pip-audit-report.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4

      - name: Run Node dependency audit
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-report
          path: pip-audit-report.json
  
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
  
  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [owasp-zap-full-scan, trivy-scan, grype-scan, bandit-scan, dependency-audit]
    if: always()
    
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
      
      - name: Generate summary
        env:
          ZAP_RESULT: ${{ needs.owasp-zap-full-scan.result }}
          TRIVY_RESULT: ${{ needs.trivy-scan.result }}
          GRYPE_RESULT: ${{ needs.grype-scan.result }}
          BANDIT_RESULT: ${{ needs.bandit-scan.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          # shellcheck disable=SC2086,SC2129
          echo "# Security Scan Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          if [ "$ZAP_RESULT" = "success" ]; then
            echo "✅ OWASP ZAP Full Scan: PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ OWASP ZAP Full Scan: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          if [ "$TRIVY_RESULT" = "success" ]; then
            echo "✅ Trivy Container Scan: PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Trivy Container Scan: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          if [ "$GRYPE_RESULT" = "success" ]; then
            echo "✅ Grype Vulnerability Scan: PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Grype Vulnerability Scan: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          if [ "$BANDIT_RESULT" = "success" ]; then
            echo "✅ Bandit Python Security: PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Bandit Python Security: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          if [ "$AUDIT_RESULT" = "success" ]; then
            echo "Dependency Audit: PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dependency Audit: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi

          for result in "$ZAP_RESULT" "$TRIVY_RESULT" "$GRYPE_RESULT" "$BANDIT_RESULT" "$AUDIT_RESULT"; do
            test "$result" = "success"
          done
          
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Detailed reports available in artifacts." >> "$GITHUB_STEP_SUMMARY"
