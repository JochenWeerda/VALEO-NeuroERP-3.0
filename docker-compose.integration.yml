version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: valeo_compliance
      POSTGRES_USER: valeo_compliance
      POSTGRES_PASSWORD: REDACTED_PASSWORD
    ports:
      - "5435:5432"

  workflow-mock:
    build:
      context: services/workflow-mock
    ports:
      - "5206:5100"

  infrastat:
    build:
      context: services/compliance/infrastat
    environment:
      INFRASTAT_DATABASE_URL: postgresql+asyncpg://valeo_compliance:REDACTED_PASSWORD@postgres:5432/valeo_compliance
      INFRASTAT_EVENT_BUS_ENABLED: "false"
      INFRASTAT_WORKFLOW_SERVICE_URL: http://workflow-mock:5100
      INFRASTAT_SUBMISSION_ENABLED: "false"
    depends_on:
      - postgres
      - workflow-mock
    ports:
      - "5205:5200"

  superglue-db:
    image: postgres:15
    environment:
      POSTGRES_DB: superglue
      POSTGRES_USER: superglue
      POSTGRES_PASSWORD: REDACTED_PASSWORD
    ports:
      - "5436:5432"

  superglue:
    image: superglueai/superglue:latest
    depends_on:
      - superglue-db
    environment:
      SUPERGLUE_AUTH_TOKEN: ${SUPERGLUE_AUTH_TOKEN:-change-me}
      DATABASE_URL: postgresql://superglue:REDACTED_PASSWORD@superglue-db:5432/superglue
      SUPERGLUE_PORT: "3011"
    ports:
      - "3010:3000"
      - "3011:3011"
      - "3012:3012"
