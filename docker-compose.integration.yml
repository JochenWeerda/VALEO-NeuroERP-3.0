services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: valeo_compliance
      POSTGRES_USER: valeo_compliance
      POSTGRES_PASSWORD: ${COMPLIANCE_POSTGRES_PASSWORD:-REDACTED_PASSWORD}
    ports:
      - "5435:5432"

  workflow-mock:
    build:
      context: services/workflow-mock
    ports:
      - "5206:5100"

  infrastat:
    build:
      context: services/compliance/infrastat
    environment:
      INFRASTAT_DATABASE_URL: postgresql+asyncpg://valeo_compliance:${COMPLIANCE_POSTGRES_PASSWORD:-REDACTED_PASSWORD}@postgres:5432/valeo_compliance
      INFRASTAT_EVENT_BUS_ENABLED: "false"
      INFRASTAT_WORKFLOW_SERVICE_URL: http://workflow-mock:5100
      INFRASTAT_SUBMISSION_ENABLED: "false"
    depends_on:
      - postgres
      - workflow-mock
    ports:
      - "5205:5200"

  superglue-db:
    profiles: ["superglue"]
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SUPERGLUE_DB_NAME:-superglue}
      POSTGRES_USER: ${SUPERGLUE_DB_USER:-superglue}
      POSTGRES_PASSWORD: ${SUPERGLUE_DB_PASSWORD:?SUPERGLUE_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPERGLUE_DB_USER:-superglue} -d ${SUPERGLUE_DB_NAME:-superglue}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5436:5432"
    volumes:
      - superglue_db_data:/var/lib/postgresql/data
    networks:
      - superglue_net

  superglue-minio:
    profiles: ["superglue"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SUPERGLUE_MINIO_ROOT_USER:-superglue}
      MINIO_ROOT_PASSWORD: ${SUPERGLUE_MINIO_ROOT_PASSWORD:?SUPERGLUE_MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - superglue_minio_data:/data
    networks:
      - superglue_net

  superglue-minio-init:
    profiles: ["superglue"]
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      superglue-minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://superglue-minio:9000 ${SUPERGLUE_MINIO_ROOT_USER:-superglue} ${SUPERGLUE_MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/${SUPERGLUE_MINIO_BUCKET:-superglue-artifacts} &&
        mc anonymous set private local/${SUPERGLUE_MINIO_BUCKET:-superglue-artifacts}
    networks:
      - superglue_net

  superglue:
    profiles: ["superglue"]
    image: superglueai/superglue:latest
    restart: unless-stopped
    depends_on:
      superglue-db:
        condition: service_healthy
      superglue-minio:
        condition: service_healthy
      superglue-minio-init:
        condition: service_completed_successfully
    environment:
      API_PORT: "3002"
      API_ENDPOINT: ${SUPERGLUE_API_ENDPOINT:-http://localhost:3011}
      WEB_PORT: "3001"
      SUPERGLUE_APP_URL: ${SUPERGLUE_PUBLIC_BASE_URL:-http://localhost:3010}
      AUTH_TOKEN: ${SUPERGLUE_AUTH_TOKEN:?SUPERGLUE_AUTH_TOKEN is required}
      NEXT_PUBLIC_SUPERGLUE_API_KEY: ${SUPERGLUE_AUTH_TOKEN:?SUPERGLUE_AUTH_TOKEN is required}
      OPENAI_API_KEY: ${SUPERGLUE_OPENAI_API_KEY:?SUPERGLUE_OPENAI_API_KEY is required}
      START_SCHEDULER_SERVER: ${SUPERGLUE_START_SCHEDULER_SERVER:-false}
      DATASTORE_TYPE: "postgres"
      POSTGRES_HOST: superglue-db
      POSTGRES_PORT: "5432"
      POSTGRES_SSL: "false"
      POSTGRES_USERNAME: ${SUPERGLUE_DB_USER:-superglue}
      POSTGRES_PASSWORD: ${SUPERGLUE_DB_PASSWORD}
      POSTGRES_DB: ${SUPERGLUE_DB_NAME:-superglue}
      FILE_STORAGE_PROVIDER: "minio"
      S3_ENDPOINT: http://superglue-minio:9000
      S3_PUBLIC_ENDPOINT: ${SUPERGLUE_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ROOT_USER: ${SUPERGLUE_MINIO_ROOT_USER:-superglue}
      MINIO_ROOT_PASSWORD: ${SUPERGLUE_MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${SUPERGLUE_MINIO_BUCKET:-superglue-artifacts}
      MINIO_BUCKET_PREFIX: ${SUPERGLUE_MINIO_BUCKET_PREFIX:-raw}
      MINIO_WEBHOOK_ENDPOINT: http://superglue:3002/v1/file-references/process
      MINIO_WEBHOOK_AUTH_TOKEN: ${SUPERGLUE_AUTH_TOKEN:?SUPERGLUE_AUTH_TOKEN is required}
      MASTER_ENCRYPTION_KEY: ${SUPERGLUE_MASTER_ENCRYPTION_KEY:?SUPERGLUE_MASTER_ENCRYPTION_KEY is required}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3002/v1/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "3010:3001"
      - "3011:3002"
    volumes:
      - superglue_runtime_data:/var/lib/superglue
    networks:
      - superglue_net

networks:
  superglue_net:
    driver: bridge

volumes:
  superglue_db_data:
  superglue_minio_data:
  superglue_runtime_data:
