<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Compliance-Report PDF Vorschau</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 1rem; max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.25rem; }
    .pdf-container { border: 1px solid #ccc; margin-top: 1rem; height: 85vh; }
    embed { width: 100%; height: 100%; }
    p { color: #666; }
  </style>
</head>
<body>
  <h1>Compliance-Report – PDF-Vorschau</h1>
  <p>Unten die generierte <strong>compliance-report-preview.pdf</strong> (eine Seite mit Titel, Stand, Cross-Compliance-Summen, Tabelle Bereich/Anforderung/Status/Frist und Summe gesamt).</p>
  <div class="pdf-container">
    <embed src="compliance-report-preview.pdf" type="application/pdf" />
  </div>
</body>
</html>
