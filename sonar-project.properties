# ══════════════════════════════════════════════════════════════════════════════
# SonarQube / SonarCloud — VALEO NeuroERP 3.0
# ══════════════════════════════════════════════════════════════════════════════

sonar.projectKey=JochenWeerda_VALEO-NeuroERP-3.0
sonar.organization=jochenweerda
sonar.projectName=VALEO-NeuroERP-3.0

# ── Quellverzeichnisse ───────────────────────────────────────────────────────
sonar.sources=app,modules,packages/frontend-web/src,services
sonar.tests=tests,packages/frontend-web/src/__tests__

# ── Sprachen ─────────────────────────────────────────────────────────────────
# Python Backend
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# TypeScript/JavaScript Frontend
sonar.typescript.lcov.reportPaths=packages/frontend-web/coverage/lcov.info
sonar.javascript.lcov.reportPaths=packages/frontend-web/coverage/lcov.info

# ── Ausschlüsse ──────────────────────────────────────────────────────────────
# Generierte Dateien, Build-Artefakte, Third-Party, Migrationen
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/__pycache__/**,\
  **/storybook-static/**,\
  **/playwright-report/**,\
  **/coverage/**,\
  **/htmlcov/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/alembic/versions/*.py,\
  **/migrations/**,\
  packages/frontend-web/src/components/ui/*.tsx,\
  **/vendor/**,\
  **/.next/**,\
  **/test-results/**

# Testdateien nicht als Source zaehlen
sonar.test.exclusions=\
  **/tests/**,\
  **/__tests__/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/test_*.py,\
  **/*_test.py,\
  **/conftest.py

# Coverage-Ausschlüsse (nicht-testbarer Code)
sonar.coverage.exclusions=\
  **/alembic/**,\
  **/migrations/**,\
  **/seeds/**,\
  **/scripts/**,\
  **/tools/**,\
  app/main.py,\
  **/conftest.py

# Duplikat-Ausschlüsse (Models/Schemas haben strukturelle Ähnlichkeit)
sonar.cpd.exclusions=\
  **/models/**,\
  **/schemas/**,\
  **/infrastructure/models/**,\
  **/alembic/versions/**

# Service-Dockerfiles werden separat durch Trivy/Grype und Dependency-Gates
# geprueft. Sonar docker:S8541/S8544 erzeugt hier breit gestreute Alerts auf
# legitimen Runtime-Images; die Ausnahme ist auf Service-Dockerfiles begrenzt.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.e1.resourceKey=services/**/Dockerfile*
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.e2.resourceKey=services/**/Dockerfile*

# ── Encoding ─────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Quality Gate ─────────────────────────────────────────────────────────────
# Empfehlung: "Sonar way" Quality Gate verwenden (Default in SonarCloud)
# Neue Issues auf neuem Code: 0 Bugs, 0 Vulnerabilities, 0 Security Hotspots
# Coverage auf neuem Code: >= 60%
# Duplicated Lines auf neuem Code: <= 3%

# ── Links ────────────────────────────────────────────────────────────────────
sonar.links.homepage=https://github.com/JochenWeerda/VALEO-NeuroERP-3.0
sonar.links.ci=https://github.com/JochenWeerda/VALEO-NeuroERP-3.0/actions
sonar.links.scm=https://github.com/JochenWeerda/VALEO-NeuroERP-3.0
sonar.links.issue=https://github.com/JochenWeerda/VALEO-NeuroERP-3.0/issues
