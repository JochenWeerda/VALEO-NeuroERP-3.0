# ══════════════════════════════════════════════════════════════════════════════
# SonarQube / SonarCloud — VALEO NeuroERP 3.0
# ══════════════════════════════════════════════════════════════════════════════

sonar.projectKey=JochenWeerda_VALEO-NeuroERP-3.0
sonar.organization=jochenweerda
sonar.projectName=VALEO-NeuroERP-3.0

# ── Quellverzeichnisse ───────────────────────────────────────────────────────
sonar.sources=app,modules,packages/frontend-web/src,services
sonar.tests=tests,packages/frontend-web/src/__tests__

# ── Sprachen ─────────────────────────────────────────────────────────────────
# Python Backend
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# TypeScript/JavaScript Frontend
sonar.typescript.lcov.reportPaths=packages/frontend-web/coverage/lcov.info
sonar.javascript.lcov.reportPaths=packages/frontend-web/coverage/lcov.info

# ── Ausschlüsse ──────────────────────────────────────────────────────────────
# Generierte Dateien, Build-Artefakte, Third-Party, Migrationen
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/__pycache__/**,\
  **/storybook-static/**,\
  **/playwright-report/**,\
  **/coverage/**,\
  **/htmlcov/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/alembic/versions/*.py,\
  **/migrations/**,\
  services/**/Dockerfile*,\
  packages/frontend-web/src/components/ui/*.tsx,\
  **/vendor/**,\
  **/.next/**,\
  **/test-results/**

# Testdateien nicht als Source zaehlen
sonar.test.exclusions=\
  **/tests/**,\
  **/__tests__/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/test_*.py,\
  **/*_test.py,\
  **/conftest.py

# Coverage-Ausschlüsse (nicht-testbarer Code)
sonar.coverage.exclusions=\
  **/alembic/**,\
  **/migrations/**,\
  **/seeds/**,\
  **/scripts/**,\
  **/tools/**,\
  app/main.py,\
  **/conftest.py

# Duplikat-Ausschlüsse (Models/Schemas haben strukturelle Ähnlichkeit)
sonar.cpd.exclusions=\
  **/models/**,\
  **/schemas/**,\
  **/infrastructure/models/**,\
  **/alembic/versions/**

# Service-Dockerfiles werden separat durch Trivy/Grype und Dependency-Gates
# geprueft. Die weiteren Kriterien sind dateischarfe False Positives fuer
# bereits validierte Pfade, signierte JWT-Pruefung, feste Loop-Bounds und
# Log-Redaction-Patterns.
# e11-e19: Taint-FPs an bereits gehaerteten Sinks (Commit 3442fce96) - die
# Sonar-Taint-Analyse erkennt AnyHttpUrl-Validierung, Regex-Allowlists,
# _validated_relative_path/_validated_redirect_url/_resolve_backup_file und
# laengenbasiertes Logging nicht als Sanitizer; NOSONAR greift bei
# pythonsecurity:*-Regeln nicht zuverlaessig auf mehrzeiligen Calls.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile*
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.e2.resourceKey=**/Dockerfile*
