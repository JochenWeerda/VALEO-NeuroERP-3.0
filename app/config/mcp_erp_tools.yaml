# MCP-ERP-TOOLS-001 — Rollenbasierter ERP-Tool-Katalog fuer Agent-Zugriff
# Felder je Tool (alle Pflicht):
#   tool_id, domain, name, scope, idempotent, risk_class, audit, data_classification
# Erlaubte Werte:
#   risk_class: low | medium | high | critical
#   audit: read | write | none
#   data_classification: PUBLIC | EU_ONLY | LOCAL_ONLY | SYNTHETIC_ALLOWED | NEVER

tools:
  # ── Agrar ──────────────────────────────────────────────────────────────────
  - tool_id: erp.agrar.contracts.list
    domain: agrar
    name: "Agrarkontakte auflisten"
    scope: read
    idempotent: true
    risk_class: low
    audit: read
    data_classification: LOCAL_ONLY

  - tool_id: erp.agrar.harvest.list
    domain: agrar
    name: "Ernteannahmen auflisten"
    scope: read
    idempotent: true
    risk_class: low
    audit: read
    data_classification: LOCAL_ONLY

  - tool_id: erp.agrar.settlement.trigger
    domain: agrar
    name: "Abrechnung ausloesen"
    scope: write
    idempotent: false
    risk_class: high
    audit: write
    data_classification: LOCAL_ONLY

  # ── Verkauf ────────────────────────────────────────────────────────────────
  - tool_id: erp.sales.orders.list
    domain: verkauf
    name: "Auftraege auflisten"
    scope: read
    idempotent: true
    risk_class: low
    audit: read
    data_classification: LOCAL_ONLY

  - tool_id: erp.sales.orders.create
    domain: verkauf
    name: "Auftrag anlegen"
    scope: write
    idempotent: false
    risk_class: medium
    audit: write
    data_classification: LOCAL_ONLY

  - tool_id: erp.sales.invoices.list
    domain: verkauf
    name: "Rechnungen auflisten"
    scope: read
    idempotent: true
    risk_class: low
    audit: read
    data_classification: LOCAL_ONLY

  # ── Einkauf ────────────────────────────────────────────────────────────────
