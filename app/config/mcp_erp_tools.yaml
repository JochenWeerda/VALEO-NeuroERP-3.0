    domain: einkauf
    name: "Bestellungen auflisten"
    scope: read
    idempotent: true
    risk_class: low
    audit: read
    data_classification: LOCAL_ONLY

  - tool_id: erp.einkauf.three_way_match.run
    domain: einkauf
    name: "3-Wege-Match ausfuehren"
    scope: write
    idempotent: false
    risk_class: high
