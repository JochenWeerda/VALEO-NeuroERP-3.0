global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    company: 'VALEO'
    app: 'NeuroERP-v3'
    version: '3.0'

***REMOVED*** Prometheus scraping configuration for VALEO NeuroERP
scrape_configs:
  ***REMOVED*** Backend API monitoring
  - job_name: 'valeo-backend'
    static_configs:
      - targets: ['localhost:3000']
    metrics_path: '/metrics'
    scrape_interval: 5s
    honor_labels: true

  ***REMOVED*** Frontend application monitoring  
  - job_name: 'valeo-frontend'
    static_configs:
      - targets: ['localhost:3001']
    metrics_path: '/metrics'

  ***REMOVED*** Database performance monitoring
  - job_name: 'valeo-database'
    static_configs:
      - targets: ['localhost:5432']
    metrics_path: '/metrics'

  ***REMOVED*** Domain services monitoring
  - job_name: 'valeo-domains'
    static_configs:
      - targets: 
          - 'localhost:3010'  ***REMOVED*** CRM domain
          - 'localhost:3011'  ***REMOVED*** Finance domain
          - 'localhost:3012'  ***REMOVED*** Inventory domain
          - 'localhost:3013'  ***REMOVED*** Analytics domain
    scrape_interval: 10s

  ***REMOVED*** Clean Architecture infrastructure
  - job_name: 'valeo-infrastructure'
    static_configs:
      - targets:
          - 'localhost:3020'  ***REMOVED*** Application services
          - 'localhost:3021'  ***REMOVED*** Domain repositories
