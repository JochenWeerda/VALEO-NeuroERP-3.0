# Local ERP development/presentation runtime; combine with docker-compose.yml.
# One worker avoids four simultaneous full-registry imports on developer laptops.
services:
  backend:
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--timeout-keep-alive", "5"]
  frontend-web:
    ports:
      - "127.0.0.1:3001:8080"
