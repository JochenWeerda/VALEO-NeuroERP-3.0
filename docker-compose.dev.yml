services:
  # PostgreSQL Database (einfach & sauber)
  db:
    image: postgres:16
    container_name: valeo_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: valeo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d valeo"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - valeo-network

  nats:
    image: nats:2.10-alpine
    container_name: valeo_nats
    restart: always
    command:
      - "--jetstream"
      - "--http_port=8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - valeo-network

  # Backend (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.dev
    container_name: valeo_backend
    command: /app/entrypoint.sh
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/valeo
      PYTHONUNBUFFERED: "1"
      EVENT_BUS_ENABLED: "true"
      EVENT_BUS_PROVIDER: nats
      EVENT_BUS_NATS_URL: nats://nats:4222
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app:cached
    networks:
      - valeo-network

volumes:
  pgdata:

networks:
  valeo-network:
    driver: bridge


