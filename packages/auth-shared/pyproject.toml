[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-shared"
version = "1.0.0"
description = "Shared authentication & authorization for VALEO-NeuroERP Python services"
requires-python = ">=3.11"
dependencies = [
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
    "httpx>=0.25.0",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

